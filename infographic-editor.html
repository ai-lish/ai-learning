<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密碼組合 - infographic 座標編輯器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', 'PingFang TC', sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    background: #16213e;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 15px;
    border-bottom: 1px solid #0f3460;
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; color: #e94560; }
  header button {
    background: #0f3460;
    color: #e0e0e0;
    border: 1px solid #e94560;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  header button:hover { background: #e94560; }
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }
  .sidebar {
    width: 260px;
    background: #16213e;
    border-right: 1px solid #0f3460;
    overflow-y: auto;
    padding: 12px;
    flex-shrink: 0;
  }
  .sidebar h3 { font-size: 12px; color: #e94560; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .sidebar .element-item {
    background: #1a1a2e;
    border: 1px solid #0f3460;
    border-radius: 4px;
    padding: 8px 10px;
    margin-bottom: 6px;
    cursor: pointer;
    font-size: 12px;
    transition: border-color 0.2s;
  }
  .sidebar .element-item:hover { border-color: #e94560; }
  .sidebar .element-item.selected { border-color: #e94560; background: #0f3460; }
  .sidebar .element-item .el-label { color: #e94560; font-weight: bold; }
  .sidebar .element-item .el-type { color: #888; font-size: 11px; margin-top: 2px; }
  .sidebar .coords {
    margin-top: 12px;
    background: #0f3460;
    border-radius: 4px;
    padding: 10px;
    font-size: 11px;
    line-height: 1.8;
  }
  .sidebar .coords .coord-row { display: flex; justify-content: space-between; }
  .sidebar .coords span { color: #aaa; }
  .sidebar .coords .val { color: #e94560; font-family: monospace; }
  .sidebar textarea {
    width: 100%;
    background: #1a1a2e;
    border: 1px solid #0f3460;
    color: #e0e0e0;
    border-radius: 4px;
    padding: 6px;
    font-size: 12px;
    resize: vertical;
    min-height: 60px;
    margin-top: 6px;
    font-family: inherit;
  }
  .sidebar textarea:focus { outline: none; border-color: #e94560; }
  .sidebar .prop-row {
    display: flex;
    gap: 6px;
    margin-top: 6px;
  }
  .sidebar .prop-row label { font-size: 11px; color: #aaa; align-self: center; }
  .sidebar .prop-row input {
    flex: 1;
    background: #1a1a2e;
    border: 1px solid #0f3460;
    color: #e0e0e0;
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 11px;
    width: 60px;
  }
  .sidebar .prop-row input:focus { outline: none; border-color: #e94560; }
  .canvas-wrap {
    flex: 1;
    overflow: auto;
    background: #0d0d1a;
    position: relative;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 20px;
  }
  .canvas-container {
    position: relative;
    width: 1024px;
    height: 559px;
    background: #fff;
    background-image: none;
    background-size: cover;
    background-position: center;
    border: 2px solid #0f3460;
    flex-shrink: 0;
  }
  .canvas-container.has-bg {
    background-image: var(--bg-url);
  }
  .eel {
    position: absolute;
    cursor: move;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #333;
    border: 1px dashed #ccc;
    transition: box-shadow 0.1s;
    min-width: 40px;
    min-height: 30px;
    overflow: hidden;
  }
  .eel.selected {
    border: 2px solid #e94560;
    box-shadow: 0 0 8px rgba(233,69,96,0.5);
    z-index: 100;
  }
  .eel .resize-handle {
    position: absolute;
    width: 10px;
    height: 10px;
    background: #e94560;
    border-radius: 2px;
    bottom: -5px;
    right: -5px;
    cursor: se-resize;
    z-index: 101;
  }
  .eel .coord-badge {
    position: absolute;
    top: -18px;
    left: 0;
    background: #e94560;
    color: white;
    font-size: 9px;
    padding: 1px 4px;
    border-radius: 2px 2px 0 0;
    white-space: nowrap;
    pointer-events: none;
  }
  .eel.title { background: #e94560; color: white; font-size: 22px; font-weight: bold; border: none; border-radius: 8px; }
  .eel.col-header { background: #16213e; color: white; font-size: 15px; font-weight: bold; border-radius: 6px; }
  .eel.case-card { background: #f5f5f5; border: 1px solid #ddd; border-radius: 6px; flex-direction: column; padding: 6px; font-size: 11px; line-height: 1.4; }
  .eel.case-card .case-title { font-weight: bold; font-size: 13px; color: #e94560; }
  .eel.answer { background: #d4edda; border: 1px solid #28a745; border-radius: 6px; font-size: 11px; color: #155724; }
  .eel.method { background: #fff3cd; border: 1px solid #ffc107; border-radius: 6px; font-size: 11px; color: #856404; padding: 6px 8px; text-align: center; }
  .eel.description { background: #e8f4fd; border: 1px solid #17a2b8; border-radius: 6px; font-size: 11px; color: #0c5460; padding: 6px 8px; }
  .eel.divider { background: transparent; border: none; border-top: 2px solid #e94560; pointer-events: none; }
  .eel.math-area { background: #f0f0ff; border: 1px solid #7b68ee; border-radius: 6px; font-size: 13px; color: #2c2c8a; font-family: 'Courier New', monospace; padding: 4px 8px; justify-content: center; }
  .import-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 300;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .import-modal.visible { display: flex; }
  .import-modal .modal-box {
    background: #16213e;
    border: 2px solid #e94560;
    border-radius: 8px;
    padding: 20px;
    width: min(560px, 92vw);
    max-height: 80vh;
    overflow-y: auto;
  }
  .import-modal h3 { color: #e94560; margin-bottom: 10px; font-size: 14px; }
  .import-modal textarea {
    width: 100%;
    height: 200px;
    background: #0d0d1a;
    border: 1px solid #0f3460;
    color: #a0e0a0;
    border-radius: 4px;
    padding: 8px;
    font-size: 12px;
    font-family: monospace;
    resize: vertical;
  }
  .import-modal .modal-btns { display: flex; gap: 8px; margin-top: 10px; }
  .import-modal button {
    background: #0f3460;
    color: #e0e0e0;
    border: 1px solid #e94560;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  .import-modal button.primary { background: #e94560; }
  .import-modal button:hover { opacity: 0.85; }
  .export-panel {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #16213e;
    border-top: 2px solid #e94560;
    padding: 10px 20px;
    display: none;
    z-index: 200;
    max-height: 40vh;
    overflow-y: auto;
  }
  .export-panel.visible { display: block; }
  .export-panel pre {
    color: #a0e0a0;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .export-panel .close-btn {
    position: absolute;
    top: 8px;
    right: 12px;
    background: #e94560;
    border: none;
    color: white;
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
    font-size: 12px;
  }
  #bgInput { display: none; }
</style>
</head>
<body>
<header>
  <h1>📐 密碼組合 - infographic 座標編輯器</h1>
  <button onclick="loadBg()">🖼️ 載入背景圖</button>
  <button onclick="addElement()">➕ 添加元素</button>
  <button onclick="deleteSelected()">🗑️ 刪除</button>
  <button onclick="exportJSON()">📄 匯出 JSON</button>
  <button onclick="toggleExport()">📋 查看/隱藏 JSON</button>
  <button onclick="openImport()">📂 載入 JSON</button>
  <button onclick="undo()">↩️ Undo</button>
  <button onclick="redo()">↪️ Redo</button>
  <button onclick="bringToFront()">⬆️ 上移</button>
  <button onclick="sendToBack()">⬇️ 下移</button>
  <span style="margin-left:auto; font-size:12px; color:#888;">點擊元素拖動 · 右下角調整大小 · 雙擊編輯文字</span>
</header>
<input type="file" id="bgInput" accept="image/*" onchange="onBgLoaded(event)">

<div class="main">
  <div class="sidebar">
    <h3>📐 畫布尺寸</h3>
    <div class="prop-row">
      <label style="font-size:11px;color:#aaa;">W</label><input type="number" id="propCanvasW" value="1024" onchange="updateCanvasSize()" style="flex:1;background:#1a1a2e;border:1px solid #0f3460;color:#e0e0e0;border-radius:4px;padding:4px 6px;font-size:11px;">
      <label style="font-size:11px;color:#aaa;">H</label><input type="number" id="propCanvasH" value="559" onchange="updateCanvasSize()" style="flex:1;background:#1a1a2e;border:1px solid #0f3460;color:#e0e0e0;border-radius:4px;padding:4px 6px;font-size:11px;">
    </div>
    <h3>元素列表</h3>
    <div id="elementList"></div>

    <div id="selectedInfo" style="display:none;">
      <h3 style="margin-top:16px;">📍 已選元素</h3>
      <div class="coords" id="coordDisplay"></div>
      <textarea id="textEditor" placeholder="元素文字..." oninput="updateText()"></textarea>
      <div class="prop-row">
        <label>X</label><input type="number" id="propX" onchange="applyProps()">
        <label>Y</label><input type="number" id="propY" onchange="applyProps()">
      </div>
      <div class="prop-row">
        <label>W</label><input type="number" id="propW" onchange="applyProps()">
        <label>H</label><input type="number" id="propH" onchange="applyProps()">
      </div>
      <div class="prop-row">
        <label>Class</label>
        <select id="propClass" onchange="applyProps()" style="flex:1;background:#1a1a2e;border:1px solid #0f3460;color:#e0e0e0;border-radius:4px;padding:4px 6px;font-size:11px;">
          <option value="title">Title Bar</option>
          <option value="col-header">Column Header</option>
          <option value="case-card">Case Card</option>
          <option value="math-area">Math Area</option>
          <option value="answer">Answer Button</option>
          <option value="method">Method Desc</option>
          <option value="description">Description</option>
          <option value="divider">Divider</option>
        </select>
      </div>
    </div>
  </div>

  <div class="canvas-wrap">
    <div class="canvas-container" id="canvas"></div>
  </div>
</div>

<div class="import-modal" id="importModal">
  <div class="modal-box">
    <h3>📂 載入 JSON</h3>
    <p style="font-size:12px;color:#aaa;margin-bottom:8px;">貼上之前匯出的 JSON（支援完整格式或元素陣列）</p>
    <textarea id="importText" placeholder='{"canvas":{...},"elements":[...]}'></textarea>
    <div class="modal-btns">
      <button class="primary" onclick="doImport()">✅ 確認載入</button>
      <button onclick="closeImport()">✕ 取消</button>
    </div>
    <p id="importError" style="color:#e94560;font-size:12px;margin-top:6px;"></p>
  </div>
</div>

<div class="export-panel" id="exportPanel">
  <button class="close-btn" onclick="toggleExport()">✕ 關閉</button>
  <pre id="jsonOutput"></pre>
</div>

<script>
// ---- Type ↔ CSS class mapping ----
const TYPE_TO_CSS = {
  title_bar: 'title', column_header: 'col-header', case_card: 'case-card',
  math_area: 'math-area', answer_btn: 'answer', divider: 'divider',
  method_desc: 'method', description: 'description'
};
const CSS_TO_TYPE = Object.fromEntries(Object.entries(TYPE_TO_CSS).map(([t,c]) => [c,t]));

// ---- Initial elements data ----
const defaultElements = [
  { id: 'el1', type: 'title', text: '密碼組合', x: 280, y: 10, w: 464, h: 60, cssClass: 'title' },
  { id: 'el2', type: 'col-header', text: '加法原理', x: 40, y: 90, w: 420, h: 40, cssClass: 'col-header' },
  { id: 'el3', type: 'col-header', text: '減法原理', x: 564, y: 90, w: 420, h: 40, cssClass: 'col-header' },
  { id: 'el4', type: 'case-card', text: 'A: 2+3+4=9種', x: 40, y: 145, w: 130, h: 90, cssClass: 'case-card' },
  { id: 'el5', type: 'case-card', text: 'B: 1+2+5=8種', x: 185, y: 145, w: 130, h: 90, cssClass: 'case-card' },
  { id: 'el6', type: 'case-card', text: 'C: 6+0+4=10種', x: 330, y: 145, w: 130, h: 90, cssClass: 'case-card' },
  { id: 'el7', type: 'method', text: '将符合條件的情況相加', x: 40, y: 250, w: 420, h: 35, cssClass: 'method' },
  { id: 'el8', type: 'answer', text: '答案: 9+8+10 = 27種', x: 40, y: 295, w: 420, h: 40, cssClass: 'answer' },
  { id: 'el9', type: 'case-card', text: 'D: 總數扣除不符合 = 40-13=27種', x: 564, y: 145, w: 420, h: 90, cssClass: 'case-card' },
  { id: 'el10', type: 'method', text: '從總數扣除不符合條件的組合', x: 564, y: 250, w: 420, h: 35, cssClass: 'method' },
  { id: 'el11', type: 'answer', text: '答案: 27種', x: 564, y: 295, w: 420, h: 40, cssClass: 'answer' },
  { id: 'el12', type: 'divider', text: '', x: 512, y: 80, w: 2, h: 260, cssClass: 'divider' },
  { id: 'el13', type: 'description', text: '(加法) A+B+C', x: 40, y: 345, w: 420, h: 30, cssClass: 'description' },
  { id: 'el14', type: 'description', text: '(減法) 總數 - 不符合', x: 564, y: 345, w: 420, h: 30, cssClass: 'description' },
];

let elements = (() => {
  try {
    const saved = localStorage.getItem('infographic-editor-data');
    if (saved) return JSON.parse(saved);
  } catch (e) {}
  return JSON.parse(JSON.stringify(defaultElements));
})();

let canvasW = 1024, canvasH = 559;
let selectedId = null;
let dragState = null;
let resizeState = null;

const canvas = document.getElementById('canvas');

function autoSave() {
  try { localStorage.setItem('infographic-editor-data', JSON.stringify(elements)); } catch(e) {}
}

// ---- Undo/Redo ----
let history = [];
let historyIndex = -1;
const MAX_HISTORY = 50;

function saveHistory() {
  history = history.slice(0, historyIndex + 1);
  history.push(JSON.parse(JSON.stringify(elements)));
  historyIndex = history.length - 1;
  if (history.length > MAX_HISTORY) { history.shift(); historyIndex--; }
}

function undo() {
  if (historyIndex > 0) { historyIndex--; elements = JSON.parse(JSON.stringify(history[historyIndex])); selectedId = null; autoSave(); renderElements(); }
}

function redo() {
  if (historyIndex < history.length - 1) { historyIndex++; elements = JSON.parse(JSON.stringify(history[historyIndex])); selectedId = null; autoSave(); renderElements(); }
}

// Init history
saveHistory();

function renderElements() {
  // Remove old eels
  canvas.querySelectorAll('.eel').forEach(el => el.remove());
  elements.forEach(data => {
    const div = document.createElement('div');
    div.className = 'eel ' + data.cssClass + (data.id === selectedId ? ' selected' : '');
    div.id = data.id;
    div.style.left = data.x + 'px';
    div.style.top = data.y + 'px';
    div.style.width = data.w + 'px';
    div.style.height = data.h + 'px';
    div.innerHTML = `<span>${data.text.replace(/</g,'&lt;')}</span>`;
    if (data.id === selectedId) {
      const badge = document.createElement('div');
      badge.className = 'coord-badge';
      badge.textContent = `x:${data.x} y:${data.y} w:${data.w} h:${data.h}`;
      div.appendChild(badge);
      const handle = document.createElement('div');
      handle.className = 'resize-handle';
      div.appendChild(handle);
    }
    canvas.appendChild(div);
  });
  renderElementList();
  updateSelectedInfo();
}

function renderElementList() {
  const list = document.getElementById('elementList');
  list.innerHTML = '';
  elements.forEach(data => {
    const div = document.createElement('div');
    div.className = 'element-item' + (data.id === selectedId ? ' selected' : '');
    div.innerHTML = `<div class="el-label">${data.text.substring(0,20)}${data.text.length>20?'...':''}</div><div class="el-type">${data.cssClass} · id:${data.id}</div>`;
    div.onclick = () => selectElement(data.id);
    list.appendChild(div);
  });
}

function updateSelectedInfo() {
  const info = document.getElementById('selectedInfo');
  const cd = document.getElementById('coordDisplay');
  if (!selectedId) { info.style.display = 'none'; return; }
  const data = elements.find(e => e.id === selectedId);
  if (!data) return;
  info.style.display = 'block';
  cd.innerHTML = `<div class="coord-row"><span>X</span><span class="val">${data.x}px</span></div>
    <div class="coord-row"><span>Y</span><span class="val">${data.y}px</span></div>
    <div class="coord-row"><span>W</span><span class="val">${data.w}px</span></div>
    <div class="coord-row"><span>H</span><span class="val">${data.h}px</span></div>`;
  document.getElementById('textEditor').value = data.text;
  document.getElementById('propX').value = data.x;
  document.getElementById('propY').value = data.y;
  document.getElementById('propW').value = data.w;
  document.getElementById('propH').value = data.h;
  document.getElementById('propClass').value = data.cssClass;
}

function selectElement(id) {
  selectedId = id;
  renderElements();
}

function updateText() {
  if (!selectedId) return;
  const data = elements.find(e => e.id === selectedId);
  data.text = document.getElementById('textEditor').value;
  autoSave();
  renderElements();
}

function applyProps() {
  if (!selectedId) return;
  const data = elements.find(e => e.id === selectedId);
  data.x = parseInt(document.getElementById('propX').value) || 0;
  data.y = parseInt(document.getElementById('propY').value) || 0;
  data.w = parseInt(document.getElementById('propW').value) || 40;
  data.h = parseInt(document.getElementById('propH').value) || 30;
  data.cssClass = document.getElementById('propClass').value;
  autoSave();
  renderElements();
}

function addElement() {
  const id = 'el' + Date.now();
  elements.push({ id, type: 'description', text: '新元素', x: 100, y: 100, w: 150, h: 50, cssClass: 'description' });
  saveHistory(); autoSave();
  selectElement(id);
}

function deleteSelected() {
  if (!selectedId) return;
  elements = elements.filter(e => e.id !== selectedId);
  selectedId = null;
  saveHistory(); autoSave();
  renderElements();
}

function updateCanvasSize() {
  const newW = parseInt(document.getElementById('propCanvasW').value) || 1024;
  const newH = parseInt(document.getElementById('propCanvasH').value) || 559;
  canvasW = newW;
  canvasH = newH;
  canvas.style.width = canvasW + 'px';
  canvas.style.height = canvasH + 'px';
  saveHistory(); autoSave();
}

function bringToFront() {
  if (!selectedId) return;
  const el = elements.find(e => e.id === selectedId);
  elements = elements.filter(e => e.id !== selectedId);
  elements.push(el);
  saveHistory(); autoSave();
  renderElements();
}

function sendToBack() {
  if (!selectedId) return;
  const el = elements.find(e => e.id === selectedId);
  elements = elements.filter(e => e.id !== selectedId);
  elements.unshift(el);
  saveHistory(); autoSave();
  renderElements();
}

function exportJSON() {
  const data = {
    canvas: { width: canvasW, height: canvasH },
    elements: elements.map(e => ({
      id: e.id,
      type: CSS_TO_TYPE[e.cssClass] || e.cssClass,
      x: e.x, y: e.y,
      width: e.w,
      height: e.h,
      content: e.text,
      style: {
        backgroundColor: e.style?.backgroundColor ?? '',
        color: e.style?.color ?? '',
        fontSize: e.style?.fontSize ?? 14
      }
    }))
  };
  document.getElementById('jsonOutput').textContent = JSON.stringify(data, null, 2);
  document.getElementById('exportPanel').classList.add('visible');
}

function toggleExport() {
  document.getElementById('exportPanel').classList.toggle('visible');
}

function loadBg() {
  document.getElementById('bgInput').click();
}

function onBgLoaded(event) {
  const file = event.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  canvas.style.setProperty('--bg-url', `url(${url})`);
  canvas.classList.add('has-bg');
}

// ---- Drag ----
canvas.addEventListener('mousedown', function(e) {
  const elDiv = e.target.closest('.eel');
  if (!elDiv) return;
  selectElement(elDiv.id);
  if (e.target.classList.contains('resize-handle')) {
    const data = elements.find(el => el.id === elDiv.id);
    resizeState = { id: elDiv.id, startX: e.clientX, startY: e.clientY, startW: data.w, startH: data.h };
    e.preventDefault();
    return;
  }
  const data = elements.find(el => el.id === elDiv.id);
  dragState = { id: elDiv.id, offsetX: e.clientX - data.x, offsetY: e.clientY - data.y };
  e.preventDefault();
});

document.addEventListener('mousemove', function(e) {
  if (dragState) {
    const data = elements.find(el => el.id === dragState.id);
    data.x = e.clientX - dragState.offsetX;
    data.y = e.clientY - dragState.offsetY;
    renderElements();
  }
  if (resizeState) {
    const dx = e.clientX - resizeState.startX;
    const dy = e.clientY - resizeState.startY;
    const data = elements.find(el => el.id === resizeState.id);
    data.w = Math.max(30, resizeState.startW + dx);
    data.h = Math.max(20, resizeState.startH + dy);
    renderElements();
  }
});

document.addEventListener('mouseup', function() {
  if (dragState || resizeState) { saveHistory(); autoSave(); }
  dragState = null;
  resizeState = null;
});

// Double-click to edit text inline
canvas.addEventListener('dblclick', function(e) {
  const elDiv = e.target.closest('.eel');
  if (!elDiv) return;
  selectElement(elDiv.id);
  const data = elements.find(el => el.id === elDiv.id);
  const span = elDiv.querySelector('span');
  const input = document.createElement('input');
  input.value = data.text;
  input.style.cssText = 'width:90%;height:90%;background:transparent;border:none;text-align:center;font-size:inherit;color:inherit;outline:1px dashed #e94560;';
  span.replaceWith(input);
  input.focus();
  input.select();
  input.onblur = () => {
    data.text = input.value;
    autoSave();
    renderElements();
  };
  input.onkeydown = (ev) => { if (ev.key === 'Enter') input.blur(); };
});

// ---- Import JSON modal ----
function openImport() {
  document.getElementById('importText').value = '';
  document.getElementById('importError').textContent = '';
  document.getElementById('importModal').classList.add('visible');
}

function closeImport() {
  document.getElementById('importModal').classList.remove('visible');
}

function doImport() {
  const raw = document.getElementById('importText').value.trim();
  document.getElementById('importError').textContent = '';
  try {
    const parsed = JSON.parse(raw);
    let newElems;
    if (Array.isArray(parsed)) {
      newElems = parsed;
    } else if (parsed.elements && Array.isArray(parsed.elements)) {
      if (parsed.canvas) {
        canvasW = parsed.canvas.width || 1024;
        canvasH = parsed.canvas.height || 559;
        canvas.style.width = canvasW + 'px';
        canvas.style.height = canvasH + 'px';
        if (parsed.canvas.background) {
          const bg = parsed.canvas.background;
          // Only allow safe data URIs to prevent CSS injection
          if (/^data:image\/(png|jpeg|gif|webp|svg\+xml);base64,/.test(bg)) {
            canvas.style.setProperty('--bg-url', `url(${bg})`);
            canvas.classList.add('has-bg');
          }
        }
      }
      newElems = parsed.elements;
    } else {
      throw new Error('格式不正確');
    }
    elements = newElems.map(e => ({
      id: e.id || ('el' + Date.now() + '_' + Math.floor(Math.random() * 1000000)),
      type: e.type || 'description',
      text: e.content !== undefined ? e.content : (e.text || ''),
      x: e.x || 0,
      y: e.y || 0,
      w: e.width !== undefined ? e.width : (e.w || 100),
      h: e.height !== undefined ? e.height : (e.h || 50),
      cssClass: TYPE_TO_CSS[e.type] || e.cssClass || 'description',
      style: e.style || {}
    }));
    selectedId = null;
    autoSave();
    renderElements();
    closeImport();
  } catch (err) {
    document.getElementById('importError').textContent = '❌ JSON 解析錯誤：' + err.message;
  }
}

// ---- Touch support ----
canvas.addEventListener('touchstart', function(e) {
  const elDiv = e.target.closest('.eel');
  if (!elDiv) return;
  selectElement(elDiv.id);
  const touch = e.touches[0];
  if (e.target.classList.contains('resize-handle')) {
    const data = elements.find(el => el.id === elDiv.id);
    resizeState = { id: elDiv.id, startX: touch.clientX, startY: touch.clientY, startW: data.w, startH: data.h };
    e.preventDefault();
    return;
  }
  const data = elements.find(el => el.id === elDiv.id);
  dragState = { id: elDiv.id, offsetX: touch.clientX - data.x, offsetY: touch.clientY - data.y };
  e.preventDefault();
}, { passive: false });

document.addEventListener('touchmove', function(e) {
  if (!dragState && !resizeState) return;
  const touch = e.touches[0];
  if (dragState) {
    const data = elements.find(el => el.id === dragState.id);
    data.x = touch.clientX - dragState.offsetX;
    data.y = touch.clientY - dragState.offsetY;
    renderElements();
  }
  if (resizeState) {
    const dx = touch.clientX - resizeState.startX;
    const dy = touch.clientY - resizeState.startY;
    const data = elements.find(el => el.id === resizeState.id);
    data.w = Math.max(30, resizeState.startW + dx);
    data.h = Math.max(20, resizeState.startH + dy);
    renderElements();
  }
  e.preventDefault();
}, { passive: false });

document.addEventListener('touchend', function() {
  if (dragState || resizeState) { saveHistory(); autoSave(); }
  dragState = null;
  resizeState = null;
});

renderElements();
</script>
