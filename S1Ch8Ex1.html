<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="中一第八章近似值互動練習：捨入至指定位值、小數位或有效數字，可剔選題目類型，對應例題 8.1–8.5。">
  <title>S1 Ch8 Ex1｜近似值：上捨入、下捨入及四捨五入</title>
  <link rel="stylesheet" href="css/site-layout.css">
  <link rel="stylesheet" href="css/practice-ui.css">
  <link rel="stylesheet" href="s1/ch8-practice.css">
  <script src="s1/ch8-rounding.js" defer></script>
  <script src="s1/ch8-practice.js" defer></script>
</head>
<body class="responsive-layout practice-ui-page ch8-page">
  <div class="ch8-app">
    <header class="ch8-header">
      <div class="ch8-topbar">
        <a class="ch8-back" href="S1Ch8.html#practice">← 返回 S1 Ch8 練習</a>
        <div class="ch8-badges">
          <span class="ch8-unit">S1 · CH8 · EX1</span>
          <span class="ch8-score" id="score" aria-live="polite" aria-label="分數：答對 0 題，已答 0 題">分數 0 / 0</span>
        </div>
      </div>
      <h1>S1 Ch8 Ex1｜近似值：上捨入、下捨入及四捨五入</h1>
      <p class="ch8-subtitle">捨入至指定位值、小數位或有效數字（例題 8.1–8.5 同類題）</p>
      <div class="ch8-ways" role="group" aria-label="作答方式">
        <button type="button" data-way="steps" aria-pressed="true">互動步驟</button>
        <button type="button" data-way="direct" aria-pressed="false">直接作答</button>
      </div>
      <section class="ch8-filters" aria-labelledby="filter-title">
        <h2 id="filter-title">題目類型（混合出題，剔選要包括的類型）</h2>
        <fieldset>
          <legend>捨入方法</legend>
          <div class="ch8-filter-options">
            <label><input type="checkbox" name="methods" value="up" checked>上捨入</label>
            <label><input type="checkbox" name="methods" value="down" checked>下捨入</label>
            <label><input type="checkbox" name="methods" value="round" checked>四捨五入</label>
          </div>
        </fieldset>
        <fieldset>
          <legend>捨入至</legend>
          <div class="ch8-filter-options">
            <label><input type="checkbox" name="targets" value="place" checked>指定位值</label>
            <label><input type="checkbox" name="targets" value="decimal" checked>小數位</label>
            <label><input type="checkbox" name="targets" value="significant" checked>有效數字</label>
          </div>
          <p class="ch8-filter-help">十位至十萬位 · 一至三位小數 · 1–4 個有效數字</p>
        </fieldset>
        <p class="ch8-filter-note" id="filter-note" role="status"></p>
      </section>
      <details id="type-stats" class="ch8-type-stats">
        <summary>按題型查看</summary>
        <div class="ch8-type-stats__content">
          <table class="ch8-type-stats__table">
            <caption>各題型答對／已答題數</caption>
            <thead>
              <tr>
                <th scope="col">題型</th>
                <th scope="col">指定位值</th>
                <th scope="col">小數位</th>
                <th scope="col">有效數字</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th scope="row">上捨入</th>
                <td data-mode="up" data-target="place">—</td>
                <td data-mode="up" data-target="decimal">—</td>
                <td data-mode="up" data-target="significant">—</td>
              </tr>
              <tr>
                <th scope="row">下捨入</th>
                <td data-mode="down" data-target="place">—</td>
                <td data-mode="down" data-target="decimal">—</td>
                <td data-mode="down" data-target="significant">—</td>
              </tr>
              <tr>
                <th scope="row">四捨五入</th>
                <td data-mode="round" data-target="place">—</td>
                <td data-mode="round" data-target="decimal">—</td>
                <td data-mode="round" data-target="significant">—</td>
              </tr>
            </tbody>
          </table>
        </div>
      </details>
    </header>
    <main id="exercise"></main>
    <noscript><p>請啟用 JavaScript 以進行互動練習。</p></noscript>
  </div>
</body>
</html>
