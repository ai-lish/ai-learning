    <script>
        // Configuration & State
        const TYPES = ["discrim", "combined", "relations"];
        const TYPE_LABELS = {
            discrim: "判別式",
            combined: "判別式、求根及根的性質",
            relations: "兩根之和及兩根之積"
        };
        const POINTS_PER_TYPE = { discrim: 1, combined: 2, relations: 2 };
        let currentType = "discrim";
        let currentQ = null;
        let questionState = {};
        let selectedNature = null;
        let selectedComparison = null;
        let rootNoRealSelected = false;
        let activeInput = null;
        let isPrinting = false;
        let printTimeout = null;

        const stats = {
            score: 0,
            correct: 0,
            wrong: 0,
            total: 0,
            startTime: Date.now()
        };

        const elQDisplay = document.getElementById("question-display");
        const elInputArea = document.getElementById("input-area");
        const elBtnCheck = document.getElementById("btn-check");
        const elBtnNext = document.getElementById("btn-next");
        const elVirtualKeyboard = document.getElementById("virtual-keyboard");
        const printModal = document.getElementById("print-modal");

        function newPartState() {
            return { attempts: 0, completed: false, correct: null };
        }

        function gcd(a, b) {
            a = Math.abs(a);
            b = Math.abs(b);
            while (b) {
                const t = b;
                b = a % b;
                a = t;
            }
            return a;
        }

        function simplifyFraction(num, den) {
            if (den === 0) return { n: NaN, d: NaN };
            if (num === 0) return { n: 0, d: 1 };
            const g = gcd(num, den);
            let n = num / g;
            let d = den / g;
            if (d < 0) {
                n = -n;
                d = -d;
            }
            return { n: n, d: d };
        }

        function fractionToString(fraction) {
            return fraction.d === 1 ? String(fraction.n) : fraction.n + "/" + fraction.d;
        }

        function fractionToTex(fraction) {
            if (fraction.d === 1) return String(fraction.n);
            const sign = fraction.n < 0 ? "-" : "";
            return sign + "\\frac{" + Math.abs(fraction.n) + "}{" + fraction.d + "}";
        }

        function formatEq(a, b, c) {
            let res = "";
            if (a === 1) res += "x^2";
            else if (a === -1) res += "-x^2";
            else res += a + "x^2";

            if (b > 0) res += (b === 1 ? "+x" : "+" + b + "x");
            else if (b < 0) res += (b === -1 ? "-x" : b + "x");

            if (c > 0) res += "+" + c;
            else if (c < 0) res += String(c);
            return res + "=0";
        }

        function randInt(min, max, excludeZero) {
            let val = Math.floor(Math.random() * (max - min + 1)) + min;
            if (excludeZero && val === 0) return randInt(min, max, excludeZero);
            return val;
        }

        function coefficientsAreValid(a, b, c) {
            return Number.isInteger(a) && a !== 0 && Math.abs(a) <= 6 &&
                Number.isInteger(b) && b >= -12 && b <= 12 &&
                Number.isInteger(c) && c >= -12 && c <= 12;
        }

        function natureMatches(delta, nature) {
            if (nature === ">0") return delta > 0;
            if (nature === "=0") return delta === 0;
            if (nature === "<0") return delta < 0;
            return false;
        }

        function buildRootCoefficientCandidates(repeated) {
            const candidates = new Map();
            for (let p = -12; p <= 12; p++) {
                for (let q = 1; q <= 6; q++) {
                    if (gcd(p, q) !== 1) continue;
                    for (let r = -12; r <= 12; r++) {
                        for (let s = 1; s <= 6; s++) {
                            if (gcd(r, s) !== 1) continue;
                            const sameRoot = p * s === r * q;
                            if (sameRoot !== repeated) continue;
                            const aBase = q * s;
                            const bBase = -(p * s + r * q);
                            const cBase = p * r;
                            for (const sign of [1, -1]) {
                                const a = sign * aBase;
                                const b = sign * bBase;
                                const c = sign * cBase;
                                if (!coefficientsAreValid(a, b, c)) continue;
                                const delta = b * b - 4 * a * c;
                                if (repeated ? delta !== 0 : delta <= 0) continue;
                                candidates.set(a + "," + b + "," + c, { a: a, b: b, c: c, delta: delta });
                            }
                        }
                    }
                }
            }
            return Array.from(candidates.values());
        }

        const DISTINCT_ROOT_COEFFICIENTS = buildRootCoefficientCandidates(false);
        const REPEATED_ROOT_COEFFICIENTS = buildRootCoefficientCandidates(true);

        function coefficientsFromComplexConjugateRoots() {
            const candidates = [];
            for (let a = -6; a <= 6; a++) {
                if (a === 0) continue;
                for (let realPart = -6; realPart <= 6; realPart++) {
                    for (let imaginaryPart = 1; imaginaryPart <= 6; imaginaryPart++) {
                        const b = -2 * a * realPart;
                        const c = a * (realPart * realPart + imaginaryPart * imaginaryPart);
                        if (!coefficientsAreValid(a, b, c)) continue;
                        const delta = b * b - 4 * a * c;
                        if (delta < 0) candidates.push({ a: a, b: b, c: c, delta: delta });
                    }
                }
            }
            if (!candidates.length) throw new Error("找不到符合範圍的無實根方程");
            return candidates[Math.floor(Math.random() * candidates.length)];
        }

        function randomCoefficientsForNature(nature) {
            let a, b, c, delta;
            let attemptsGen = 0;
            do {
                a = randInt(-6, 6, true);
                b = randInt(-12, 12, false);
                c = randInt(-12, 12, false);
                delta = b * b - 4 * a * c;
                attemptsGen++;
            } while (((nature === ">0" && delta <= 0) ||
                      (nature === "=0" && delta !== 0) ||
                      (nature === "<0" && delta >= 0)) && attemptsGen < 100);

            if (!natureMatches(delta, nature)) {
                if (nature === ">0") {
                    return DISTINCT_ROOT_COEFFICIENTS[Math.floor(Math.random() * DISTINCT_ROOT_COEFFICIENTS.length)];
                }
                if (nature === "=0") {
                    return REPEATED_ROOT_COEFFICIENTS[Math.floor(Math.random() * REPEATED_ROOT_COEFFICIENTS.length)];
                }
                return coefficientsFromComplexConjugateRoots();
            }
            return { a: a, b: b, c: c, delta: delta };
        }

        function natureKey(delta) {
            return delta > 0 ? ">0" : (delta === 0 ? "=0" : "<0");
        }

        function natureLabel(delta) {
            if (delta > 0) return "兩個不相等的實根";
            if (delta === 0) return "兩個相等的實根";
            return "沒有實根";
        }

        function discriminantCalculationText(a, b, c, delta) {
            const product = 4 * a * c;
            const subtrahend = product < 0 ? "(" + product + ")" : String(product);
            return "= " + (b * b) + " - " + subtrahend + " = " + delta;
        }

        function discriminantFormulaLine(q) {
            return "\\Delta = (" + q.b + ")^2 - 4(" + q.a + ")(" + q.c + ")";
        }

        function natureConclusionText(delta) {
            if (delta < 0) return "所以方程沒有實根。";
            return "所以方程有" + natureLabel(delta) + "。";
        }

        function makeDiscriminantSteps(q) {
            return discriminantFormulaLine(q) + "\\\\" +
                discriminantCalculationText(q.a, q.b, q.c, q.delta);
        }

        function makeNatureSteps(q) {
            const lines = [
                discriminantFormulaLine(q),
                discriminantCalculationText(q.a, q.b, q.c, q.delta)
            ];
            if (q.delta !== 0) lines.push(q.delta + " " + (q.delta > 0 ? ">" : "<") + " 0");
            lines.push("\\text{" + natureConclusionText(q.delta) + "}");
            return lines.join("\\\\");
        }

        function makeRootsSteps(q) {
            const lines = [
                discriminantFormulaLine(q),
                discriminantCalculationText(q.a, q.b, q.c, q.delta)
            ];
            if (q.delta < 0) {
                lines.push("\\text{因為 }\\Delta < 0\\text{，所以方程沒有實根。}");
                return lines.join("\\\\");
            }

            lines.push("x = \\frac{-(" + q.b + ") \\pm \\sqrt{(" + q.b + ")^2 - 4(" + q.a + ")(" + q.c + ")}}{2(" + q.a + ")}");
            lines.push("= \\frac{" + (-q.b) + " \\pm \\sqrt{" + q.delta + "}}{" + (2 * q.a) + "}");
            if (q.ansRoots && q.delta === 0) {
                lines.push("x = " + fractionToTex(q.rootFractions[0]) + " \\text{（二重根）}");
            } else if (q.ansRoots) {
                lines.push("x = " + fractionToTex(q.rootFractions[0]) + " \\text{ 或 } x = " + fractionToTex(q.rootFractions[1]));
            }
            return lines.join("\\\\");
        }

        function makeSumSteps(q) {
            return "\\alpha + \\beta = -\\frac{b}{a} = -\\frac{" + q.b + "}{" + q.a + "} = " +
                fractionToTex(q.sumFraction);
        }

        function makeProductSteps(q) {
            return "\\alpha\\beta = \\frac{c}{a} = \\frac{" + q.c + "}{" + q.a + "} = " +
                fractionToTex(q.productFraction);
        }

        function generateQuestion(type, targetNature, answerMode) {
            let natureRoll;
            let coefficients;

            if (type === "combined") {
                const roll = Math.random();
                natureRoll = targetNature || (roll < 0.2 ? "<0" : (roll < 0.4 ? "=0" : ">0"));
                if (natureRoll === "<0") {
                    coefficients = coefficientsFromComplexConjugateRoots();
                } else {
                    const pool = natureRoll === "=0" ? REPEATED_ROOT_COEFFICIENTS : DISTINCT_ROOT_COEFFICIENTS;
                    coefficients = pool[Math.floor(Math.random() * pool.length)];
                }
            } else {
                natureRoll = targetNature || [">0", "=0", "<0"][Math.floor(Math.random() * 3)];
                coefficients = randomCoefficientsForNature(natureRoll);
            }

            const a = coefficients.a;
            const b = coefficients.b;
            const c = coefficients.c;
            const delta = b * b - 4 * a * c;
            if (!coefficientsAreValid(a, b, c) || coefficients.delta !== delta || !natureMatches(delta, natureRoll)) {
                throw new Error("無法產生符合規格的題目係數：" + a + ", " + b + ", " + c + " (" + natureRoll + ")");
            }

            const q = {
                type: type,
                a: a,
                b: b,
                c: c,
                delta: delta,
                natureKey: natureKey(delta),
                natureStr: natureLabel(delta),
                eqStr: formatEq(a, b, c)
            };
            const sumFraction = simplifyFraction(-b, a);
            const productFraction = simplifyFraction(c, a);
            q.sumFraction = sumFraction;
            q.productFraction = productFraction;
            q.ansDelta = String(delta);
            q.ansNature = q.natureStr;
            q.ansSum = fractionToString(sumFraction);
            q.ansProduct = fractionToString(productFraction);
            q.realRoots = delta < 0 ? [] : [
                (-b + Math.sqrt(delta)) / (2 * a),
                (-b - Math.sqrt(delta)) / (2 * a)
            ];

            if (delta < 0) {
                q.ansRoots = ["no_real"];
                q.rootFractions = [];
            } else if (Number.isInteger(Math.sqrt(delta))) {
                const root1 = simplifyFraction(-b + Math.sqrt(delta), 2 * a);
                const root2 = simplifyFraction(-b - Math.sqrt(delta), 2 * a);
                q.rootFractions = [root1, root2];
                q.ansRoots = [fractionToString(root1), fractionToString(root2)];
            } else {
                q.rootFractions = null;
                q.ansRoots = null;
            }

            if (type === "combined") {
                q.answerMode = answerMode || (Math.random() < 0.5 ? "discrim" : "roots");
                if (delta >= 0 && !q.ansRoots) {
                    throw new Error("求根變體必須生成有理根");
                }
            }

            q.steps = {
                discrim: makeDiscriminantSteps(q),
                nature: makeNatureSteps(q),
                roots: makeRootsSteps(q),
                sum: makeSumSteps(q),
                product: makeProductSteps(q)
            };
            return q;
        }

        function splitMathStepRows(steps) {
            const lines = [];
            let current = "";
            let braceDepth = 0;
            const source = String(steps);
            for (let i = 0; i < source.length; i++) {
                const character = source[i];
                if (character === "\\") {
                    if (source[i + 1] === "\\" && braceDepth === 0) {
                        lines.push(current);
                        current = "";
                        i++;
                        continue;
                    }
                    current += character;
                    if (i + 1 < source.length) current += source[++i];
                    continue;
                }
                if (character === "{") braceDepth++;
                else if (character === "}") braceDepth--;
                current += character;
            }
            lines.push(current);
            return lines.map(function(line) { return line.trim(); }).filter(Boolean);
        }

        function stepsToMarkup(steps) {
            const lines = splitMathStepRows(steps);
            const alignedLines = lines.map(function(line) { return "&" + line; }).join("\\\\");
            return '<div class="worked-steps">\\[\\begin{aligned}' + alignedLines + "\\end{aligned}\\]</div>";
        }

        function answerAsTex(answer) {
            if (answer === "no_real") return "沒有實根";
            const parsed = parseFraction(String(answer));
            if (!parsed || parsed.val === "no_real") return "";
            if (parsed.d === undefined || parsed.d === 1) return String(parsed.n === undefined ? parsed.val : parsed.n);
            const sign = parsed.n < 0 ? "-" : "";
            return sign + "\\frac{" + Math.abs(parsed.n) + "}{" + parsed.d + "}";
        }

        function parseFraction(str) {
            str = String(str).replace(/\s+/g, "").replace(/−/g, "-");
            if (str === "沒有實根") return { val: "no_real", isSimple: true };
            if (!/^-?\d+(\/-?\d+)?$/.test(str)) return null;

            const parts = str.split("/");
            const n = parseInt(parts[0], 10);
            if (parts.length === 1) return { val: n, isSimple: true };
            const d = parseInt(parts[1], 10);
            if (d === 0) return null;
            const simplified = simplifyFraction(n, d);
            let isSimple = false;
            if (d !== 1 && Math.abs(n) === Math.abs(simplified.n) && Math.abs(d) === Math.abs(simplified.d)) {
                isSimple = d > 0;
            }
            return {
                val: n / d,
                n: n,
                d: d,
                simN: simplified.n,
                simD: simplified.d,
                isSimple: isSimple
            };
        }

        function fractionFormatMessage(parsed) {
            if (!parsed) return "輸入格式錯誤，請輸入整數或最簡分數 (例如 -3/2)。";
            if (parsed.isSimple) return "";
            if (parsed.d === 1) return "請寫成整數，勿寫 n/1。";
            if (parsed.d < 0) return "請將負號放在分子。";
            return "請化至最簡分數。";
        }

        function showFeedback(part, message, type) {
            const el = document.getElementById("feedback-" + part);
            if (!el) return;
            el.textContent = message;
            el.className = "subquestion-feedback" + (type ? " " + type : "");
        }

        function showPartSteps(part, steps) {
            const el = document.getElementById("steps-" + part);
            if (!el) return;
            el.innerHTML = stepsToMarkup(steps);
            el.className = "subquestion-steps visible";
            MathJax.typesetPromise([el]).catch(function(error) {
                console.error("MathJax steps rendering failed:", error);
            });
        }

        function updateStats() {
            document.getElementById("score").innerText = String(Number(stats.score.toFixed(2)));
            document.getElementById("correct-count").innerText = stats.correct;
            document.getElementById("wrong-count").innerText = stats.wrong;
            document.getElementById("total-count").innerText = stats.total;
        }

        function completePart(part, correct, answerText, deferSteps) {
            const item = questionState[part];
            if (!item || item.completed) return false;
            item.completed = true;
            item.correct = correct;
            stats.total++;
            if (correct) {
                stats.correct++;
                stats.score += item.attempts === 1 ? 1 : 0.5;
                showFeedback(part, item.attempts === 1 ? "答對了！(得 1 分)" : "答對了！(得 0.5 分)", "correct");
            } else {
                stats.wrong++;
                showFeedback(part, "答錯了。正確答案是：" + answerText, "wrong");
            }

            const card = document.querySelector('[data-part-card="' + part + '"]');
            if (card) {
                card.classList.add("is-complete");
                card.querySelectorAll(".math-input").forEach(function(input) {
                    input.readOnly = true;
                });
                card.querySelectorAll("button").forEach(function(button) {
                    button.disabled = true;
                });
                if (activeInput && card.contains(activeInput)) {
                    activeInput.blur();
                    activeInput = null;
                    elVirtualKeyboard.style.display = "none";
                }
            }
            if (!deferSteps) showPartSteps(part, stepsForPart(part));
            updateStats();
            return true;
        }

        function stepsForPart(part) {
            if (part === "discrim") return currentQ.steps.discrim;
            if (part === "a") return currentQ.answerMode === "discrim" ? currentQ.steps.discrim : currentQ.steps.roots;
            if (part === "b") return currentQ.steps.nature;
            if (part === "sum") return currentQ.steps.sum;
            if (part === "product") return currentQ.steps.product;
            return "";
        }

        function showAttemptFeedback(part, correct, answerText, deferSteps) {
            const item = questionState[part];
            if (!item || item.completed) return;
            item.attempts++;
            if (correct) {
                completePart(part, true, answerText, deferSteps);
            } else if (item.attempts >= 2) {
                completePart(part, false, answerText, deferSteps);
            } else {
                showFeedback(part, "答錯了，請再試一次！", "wrong");
            }
        }

        function currentNatureSymbol() {
            return currentQ.delta > 0 ? ">" : (currentQ.delta === 0 ? "=" : "<");
        }

        function updateNoRealChoice() {
            const button = document.getElementById("btn-no-real");
            if (!button) return;
            button.classList.toggle("selected", rootNoRealSelected);
            button.setAttribute("aria-pressed", rootNoRealSelected ? "true" : "false");
        }

        function buildInput(id, part, label, placeholder, submitKind) {
            return '<input type="text" id="' + id + '" class="math-input" inputmode="none" autocomplete="off"' +
                (placeholder ? ' placeholder="' + placeholder + '"' : "") +
                ' aria-label="' + label + '" data-part="' + part + '" data-submit-kind="' + submitKind + '">';
        }

        function buildCard(part, heading, body) {
            return '<section class="subquestion" data-part-card="' + part + '">' +
                '<div class="subquestion-heading">' + heading + '</div>' + body +
                '<div id="feedback-' + part + '" class="subquestion-feedback"></div>' +
                '<div id="steps-' + part + '" class="subquestion-steps"></div></section>';
        }

        function renderUI() {
            currentQ = generateQuestion(currentType);
            questionState = {
                discrim: newPartState(),
                a: newPartState(),
                b: newPartState(),
                sum: newPartState(),
                product: newPartState()
            };
            selectedNature = null;
            selectedComparison = null;
            rootNoRealSelected = false;
            activeInput = null;
            elVirtualKeyboard.style.display = "none";

            let instruction = "";
            let cards = "";
            if (currentType === "discrim") {
                instruction = "求以下方程的判別式 \\(\\Delta\\)：";
                cards = buildCard("discrim", "(a) 求判別式", '<div class="input-group">' +
                    '<span>\\(\\Delta = \\)</span>' + buildInput("ans-discrim", "discrim", "判別式", "", "check") +
                    "</div>");
            } else if (currentType === "combined") {
                instruction = "完成同一方程的 (a) 及 (b)，兩部分都作答後按「核對」。";
                let aBody = "";
                if (currentQ.answerMode === "discrim") {
                    aBody = '<div class="subquestion-prompt">求判別式：</div><div class="input-group">' +
                        '<span>\\(\\Delta = \\)</span>' + buildInput("ans-combined-discrim", "a", "判別式", "", "check") +
                        "</div>";
                } else {
                    aBody = '<div class="subquestion-prompt">求根 (答案如為分數，請用最簡形式)：</div>' +
                        '<div class="input-group"><span>\\(x = \\)</span>' +
                        buildInput("ans-root-1", "a", "第一個根", "根 1", "check") +
                        '<span>或 \\(x = \\)</span>' +
                        buildInput("ans-root-2", "a", "第二個根", "根 2", "check") +
                        "</div><div class=\"subquestion-actions\"><button class=\"btn btn-outline\" type=\"button\" id=\"btn-no-real\">沒有實根</button></div>";
                }
                cards += buildCard("a", "(a) " + (currentQ.answerMode === "discrim" ? "求 Δ" : "求根"), aBody);

                let bBody = "";
                if (currentQ.answerMode === "discrim") {
                    bBody += '<div class="subquestion-prompt">先選擇判別式與 0 的比較符號：</div>' +
                        '<div class="choice-row comparison-choices">' +
                        '<button class="nature-btn comparison-btn" type="button" data-comparison=">">Δ &gt; 0</button>' +
                        '<button class="nature-btn comparison-btn" type="button" data-comparison="=">Δ = 0</button>' +
                        '<button class="nature-btn comparison-btn" type="button" data-comparison="<">Δ &lt; 0</button></div>';
                }
                bBody += '<div class="subquestion-prompt">判斷根的性質：</div><div class="nature-btn-group">' +
                    '<button class="nature-btn nature-choice" type="button" data-nature="兩個不相等的實根">兩個不相等的實根</button>' +
                    '<button class="nature-btn nature-choice" type="button" data-nature="兩個相等的實根">兩個相等的實根</button>' +
                    '<button class="nature-btn nature-choice" type="button" data-nature="沒有實根">沒有實根</button></div>';
                cards += buildCard("b", "(b) 根的性質", bBody);
            } else {
                instruction = "設 \\(\\alpha, \\beta\\) 為以下方程的根，分別求兩根之和及兩根之積。";
                const sumBody = '<div class="subquestion-prompt">求 \\(\\alpha + \\beta\\)：</div><div class="input-group">' +
                    '<span>\\(\\alpha + \\beta = \\)</span>' + buildInput("ans-sum", "sum", "兩根之和", "", "single") +
                    '</div><div class="subquestion-actions"><button class="btn" type="button" data-submit-part="sum">提交 (a)</button></div>';
                const productBody = '<div class="subquestion-prompt">求 \\(\\alpha\\beta\\)：</div><div class="input-group">' +
                    '<span>\\(\\alpha\\beta = \\)</span>' + buildInput("ans-product", "product", "兩根之積", "", "single") +
                    '</div><div class="subquestion-actions"><button class="btn" type="button" data-submit-part="product">提交 (b)</button></div>';
                cards = buildCard("sum", "(a) 兩根之和", sumBody) + buildCard("product", "(b) 兩根之積", productBody);
            }

            document.getElementById("instruction").innerHTML = instruction;
            elQDisplay.innerHTML = '<span class="question-equation">\\( ' + currentQ.eqStr + ' \\)</span>';
            elInputArea.innerHTML = cards;
            elBtnCheck.textContent = currentType === "combined" ? "核對" : "提交答案";

            MathJax.typesetPromise([
                document.getElementById("instruction"),
                elQDisplay,
                elInputArea
            ]).catch(function(error) {
                console.error("MathJax question rendering failed:", error);
            });

            bindQuestionControls();
            setupInputs();
            updateControls();
        }

        function bindQuestionControls() {
            const noReal = document.getElementById("btn-no-real");
            if (noReal) {
                noReal.addEventListener("click", function() {
                    if (questionState.a.completed) return;
                    rootNoRealSelected = !rootNoRealSelected;
                    updateNoRealChoice();
                    updateControls();
                });
            }

            elInputArea.querySelectorAll("[data-comparison]").forEach(function(button) {
                button.addEventListener("click", function() {
                    if (questionState.b.completed) return;
                    selectedComparison = button.dataset.comparison;
                    elInputArea.querySelectorAll("[data-comparison]").forEach(function(choice) {
                        choice.classList.toggle("selected", choice.dataset.comparison === selectedComparison);
                        choice.setAttribute("aria-pressed", choice.dataset.comparison === selectedComparison ? "true" : "false");
                    });
                    updateControls();
                });
            });

            elInputArea.querySelectorAll("[data-nature]").forEach(function(button) {
                button.addEventListener("click", function() {
                    if (questionState.b.completed) return;
                    selectedNature = button.dataset.nature;
                    elInputArea.querySelectorAll("[data-nature]").forEach(function(choice) {
                        choice.classList.toggle("selected", choice.dataset.nature === selectedNature);
                        choice.setAttribute("aria-pressed", choice.dataset.nature === selectedNature ? "true" : "false");
                    });
                    updateControls();
                });
            });

            elInputArea.querySelectorAll("[data-submit-part]").forEach(function(button) {
                button.addEventListener("click", function() {
                    submitRelation(button.dataset.submitPart);
                });
            });
        }

        function setupInputs() {
            elInputArea.querySelectorAll(".math-input").forEach(function(input) {
                input.addEventListener("focus", function() {
                    activeInput = input;
                    elVirtualKeyboard.style.display = "flex";
                    if (window.matchMedia("(min-width: 900px) and (orientation: landscape)").matches) {
                        elVirtualKeyboard.scrollIntoView({ block: "nearest", behavior: "smooth" });
                    } else {
                        window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
                    }
                });
                input.addEventListener("input", function() {
                    if (input.id === "ans-root-1" || input.id === "ans-root-2") {
                        rootNoRealSelected = false;
                        updateNoRealChoice();
                    }
                    updateControls();
                });
                input.addEventListener("keydown", function(event) {
                    if (event.key !== "Enter") return;
                    event.preventDefault();
                    if (input.dataset.submitKind === "single") submitRelation(input.dataset.part);
                    else if (currentType === "combined") submitCombinedCheck();
                    else submitStandaloneDiscriminant();
                });
            });
            if (currentType === "discrim" || currentType === "combined") {
                const firstInput = elInputArea.querySelector(".math-input");
                if (firstInput) firstInput.focus();
            }
        }

        function inputIsReady(input) {
            return Boolean(input && input.value.trim());
        }

        function isCombinedAReady() {
            if (questionState.a.completed) return true;
            if (currentQ.answerMode === "discrim") {
                return inputIsReady(document.getElementById("ans-combined-discrim"));
            }
            if (rootNoRealSelected) return true;
            const root1 = inputIsReady(document.getElementById("ans-root-1"));
            const root2 = inputIsReady(document.getElementById("ans-root-2"));
            if (currentQ.delta < 0) return root1 || root2;
            return root1 && root2;
        }

        function isCombinedBReady() {
            if (questionState.b.completed) return true;
            return Boolean(selectedNature) &&
                (currentQ.answerMode !== "discrim" || Boolean(selectedComparison));
        }

        function allCurrentPartsComplete() {
            if (currentType === "discrim") return questionState.discrim.completed;
            if (currentType === "combined") return questionState.a.completed && questionState.b.completed;
            return questionState.sum.completed && questionState.product.completed;
        }

        function updateControls() {
            const complete = allCurrentPartsComplete();
            elBtnNext.classList.toggle("hidden", !complete);
            if (currentType === "relations") {
                elBtnCheck.classList.add("hidden");
                elBtnCheck.disabled = true;
                return;
            }

            elBtnCheck.classList.remove("hidden");
            elBtnCheck.disabled = complete || (currentType === "combined" ?
                !(isCombinedAReady() && isCombinedBReady()) :
                !inputIsReady(document.getElementById("ans-discrim")));
            if (questionState.discrim && questionState.discrim.completed && currentType === "discrim") {
                elBtnCheck.classList.add("hidden");
            }
            if (currentType === "combined" && complete) elBtnCheck.classList.add("hidden");
        }

        function valueResult(raw, expected) {
            const parsed = parseFraction(raw);
            if (!parsed) return { valid: false, message: fractionFormatMessage(parsed) };
            if (parsed.val === "no_real") return { valid: false, message: "請輸入數字或最簡分數。" };
            const formatMessage = fractionFormatMessage(parsed);
            if (formatMessage) return { valid: false, message: formatMessage };
            const expectedParsed = parseFraction(String(expected));
            return {
                valid: true,
                correct: Boolean(expectedParsed) && Math.abs(parsed.val - expectedParsed.val) < 1e-9
            };
        }

        function submitStandaloneDiscriminant() {
            if (currentType !== "discrim" || questionState.discrim.completed) return;
            const input = document.getElementById("ans-discrim");
            const result = valueResult(input.value, currentQ.ansDelta);
            if (!result.valid) {
                showFeedback("discrim", result.message, "warning");
                return;
            }
            showAttemptFeedback("discrim", result.correct, currentQ.ansDelta, false);
            updateControls();
        }

        function rootAnswerResult() {
            if (rootNoRealSelected) {
                return { valid: true, correct: currentQ.delta < 0, answer: "沒有實根" };
            }

            const input1 = document.getElementById("ans-root-1");
            const input2 = document.getElementById("ans-root-2");
            const raw1 = input1 ? input1.value.trim() : "";
            const raw2 = input2 ? input2.value.trim() : "";
            if (currentQ.delta >= 0 && (!raw1 || !raw2)) {
                return { valid: false, message: "請輸入兩個根，或選擇「沒有實根」。" };
            }
            if (currentQ.delta < 0 && !raw1 && !raw2) {
                return { valid: false, message: "請輸入數字，或選擇「沒有實根」。" };
            }

            const parsedValues = [];
            for (const pair of [[raw1, "根 1"], [raw2, "根 2"]]) {
                if (!pair[0]) continue;
                const parsed = parseFraction(pair[0]);
                if (!parsed || parsed.val === "no_real") {
                    return { valid: false, message: pair[1] + "：" + fractionFormatMessage(parsed) };
                }
                const formatMessage = fractionFormatMessage(parsed);
                if (formatMessage) return { valid: false, message: pair[1] + "：" + formatMessage };
                parsedValues.push(parsed.val);
            }
            if (currentQ.delta < 0) return { valid: true, correct: false, answer: "沒有實根" };

            const expected1 = parseFraction(currentQ.ansRoots[0]).val;
            const expected2 = parseFraction(currentQ.ansRoots[1]).val;
            const matchesInOrder = Math.abs(parsedValues[0] - expected1) < 1e-9 &&
                Math.abs(parsedValues[1] - expected2) < 1e-9;
            const matchesReversed = Math.abs(parsedValues[0] - expected2) < 1e-9 &&
                Math.abs(parsedValues[1] - expected1) < 1e-9;
            return {
                valid: true,
                correct: matchesInOrder || matchesReversed,
                answer: currentQ.ansRoots.join(" 或 ")
            };
        }

        function submitCombinedA() {
            if (currentQ.answerMode === "discrim") {
                const input = document.getElementById("ans-combined-discrim");
                const result = valueResult(input.value, currentQ.ansDelta);
                if (!result.valid) {
                    showFeedback("a", result.message, "warning");
                    return;
                }
                showAttemptFeedback("a", result.correct, currentQ.ansDelta, true);
                return;
            }

            const result = rootAnswerResult();
            if (!result.valid) {
                showFeedback("a", result.message, "warning");
                return;
            }
            showAttemptFeedback("a", result.correct, result.answer, true);
            if (!result.correct && !questionState.a.completed && rootNoRealSelected) {
                rootNoRealSelected = false;
                updateNoRealChoice();
            }
        }

        function submitCombinedB() {
            const natureCorrect = selectedNature === currentQ.ansNature;
            const comparisonCorrect = currentQ.answerMode !== "discrim" ||
                selectedComparison === currentNatureSymbol();
            const correct = natureCorrect && comparisonCorrect;
            let answer = currentQ.ansNature;
            if (currentQ.answerMode === "discrim") {
                answer = "Δ " + currentNatureSymbol() + " 0；" + currentQ.ansNature;
            }
            questionState.b.attempts++;
            completePart("b", correct, answer, true);
        }

        function revealCombinedStepsIfDone() {
            if (!questionState.a.completed || !questionState.b.completed) return;
            showPartSteps("a", stepsForPart("a"));
            showPartSteps("b", stepsForPart("b"));
        }

        function submitCombinedCheck() {
            if (currentType !== "combined") return;
            if (questionState.a.completed && questionState.b.completed) return;
            if (!isCombinedAReady() || !isCombinedBReady()) return;

            if (!questionState.a.completed) submitCombinedA();
            if (!questionState.b.completed) submitCombinedB();
            revealCombinedStepsIfDone();
            updateControls();
        }

        function submitRelation(part) {
            if (currentType !== "relations" || (part !== "sum" && part !== "product")) return;
            const item = questionState[part];
            if (!item || item.completed) return;
            const input = document.getElementById(part === "sum" ? "ans-sum" : "ans-product");
            const expected = part === "sum" ? currentQ.ansSum : currentQ.ansProduct;
            const result = valueResult(input.value, expected);
            if (!result.valid) {
                showFeedback(part, result.message, "warning");
                return;
            }
            showAttemptFeedback(part, result.correct, expected, false);
            updateControls();
        }

        function submitFromKeyboard() {
            if (!activeInput || activeInput.readOnly || activeInput.disabled) return;
            if (currentType === "combined") submitCombinedCheck();
            else if (currentType === "discrim") submitStandaloneDiscriminant();
            else submitRelation(activeInput.dataset.part);
        }

        document.querySelectorAll(".key").forEach(function(button) {
            button.addEventListener("click", function(event) {
                const keyButton = event.target.closest(".key");
                if (!keyButton) return;
                if (keyButton.id === "kb-submit") {
                    submitFromKeyboard();
                    return;
                }
                if (keyButton.id === "kb-close") {
                    elVirtualKeyboard.style.display = "none";
                    return;
                }
                if (!activeInput || activeInput.readOnly || activeInput.disabled) return;
                const value = keyButton.dataset.val;
                if (!value) return;
                if (value === "clear") activeInput.value = "";
                else if (value === "backspace") activeInput.value = activeInput.value.slice(0, -1);
                else activeInput.value += value;
                activeInput.dispatchEvent(new Event("input", { bubbles: true }));
                activeInput.focus();
            });
        });

        elBtnCheck.addEventListener("click", function() {
            if (elBtnCheck.disabled) return;
            if (currentType === "combined") submitCombinedCheck();
            else submitStandaloneDiscriminant();
        });

        elBtnNext.addEventListener("click", function() {
            if (!allCurrentPartsComplete()) return;
            renderUI();
        });

        document.querySelectorAll(".tab-btn").forEach(function(button) {
            button.addEventListener("click", function() {
                document.querySelectorAll(".tab-btn").forEach(function(tab) {
                    tab.classList.remove("active");
                });
                button.classList.add("active");
                currentType = button.dataset.type;
                renderUI();
            });
        });

        function formatStartTime(timestamp) {
            const date = new Date(timestamp);
            const twoDigits = function(value) { return String(value).padStart(2, "0"); };
            return twoDigits(date.getMonth() + 1) + "-" + twoDigits(date.getDate()) + " " +
                twoDigits(date.getHours()) + ":" + twoDigits(date.getMinutes());
        }
        document.getElementById("start-time").innerText = formatStartTime(stats.startTime);

        setInterval(function() {
            let seconds = Math.floor((Date.now() - stats.startTime) / 1000);
            const minutes = Math.floor(seconds / 60);
            seconds = seconds % 60;
            document.getElementById("time-elapsed").innerText =
                (minutes < 10 ? "0" : "") + minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
        }, 1000);

        function printAnswerMarkup(type, question) {
            if (type === "discrim") {
                return "(a) \\(\\Delta = " + question.ansDelta + "\\)";
            }
            if (type === "combined") {
                let aAnswer;
                if (question.answerMode === "discrim") {
                    aAnswer = "(a) \\(\\Delta = " + question.ansDelta + "\\)";
                } else if (question.delta < 0) {
                    aAnswer = "(a) 沒有實根";
                } else if (question.delta === 0) {
                    aAnswer = "(a) \\(x = " + answerAsTex(question.ansRoots[0]) + "\\)（二重根）";
                } else {
                    aAnswer = "(a) \\(x = " + answerAsTex(question.ansRoots[0]) + "\\) 或 \\(x = " +
                        answerAsTex(question.ansRoots[1]) + "\\)";
                }
                const bAnswer = question.answerMode === "discrim" ?
                    "(b) Δ " + (question.delta > 0 ? "&gt;" : (question.delta < 0 ? "&lt;" : "=")) +
                    " 0；" + question.ansNature :
                    "(b) " + question.ansNature;
                return aAnswer + "<br>" + bAnswer;
            }
            return "(a) \\(" + answerAsTex(question.ansSum) + "\\)<br>(b) \\(" +
                answerAsTex(question.ansProduct) + "\\)";
        }

        function printAnswerStepsMarkup(type, question) {
            if (type === "discrim") {
                return '<div class="print-ans-steps">' + stepsToMarkup(question.steps.discrim) + "</div>";
            }
            if (type === "combined") {
                const aSteps = question.answerMode === "discrim" ? question.steps.discrim : question.steps.roots;
                return '<div class="print-ans-steps">(a) ' + stepsToMarkup(aSteps) +
                    "</div><div class=\"print-ans-steps\">(b) " + stepsToMarkup(question.steps.nature) + "</div>";
            }
            return '<div class="print-ans-steps">(a) ' + stepsToMarkup(question.steps.sum) +
                "</div><div class=\"print-ans-steps\">(b) " + stepsToMarkup(question.steps.product) + "</div>";
        }

        function printQuestionPrompt(type, question, number) {
            let prompts = "";
            if (type === "discrim") {
                prompts = '(a) 求判別式：\\(\\Delta = \\underline{\\qquad\\qquad}\\)';
            } else if (type === "combined" && question.answerMode === "discrim") {
                prompts = '(a) 求判別式：\\(\\Delta = \\underline{\\qquad}\\)<br>' +
                    '(b) 選擇比較符號：Δ [ &gt; ／ = ／ &lt; ] 0<br>' +
                    "根的性質：□ 兩個不相等的實根　□ 兩個相等的實根　□ 沒有實根";
            } else if (type === "combined") {
                prompts = '(a) 求根：\\(x = \\underline{\\qquad}\\) 或 \\(x = \\underline{\\qquad}\\)；□ 沒有實根<br>' +
                    " (b) 根的性質：□ 兩個不相等的實根　□ 兩個相等的實根　□ 沒有實根";
            } else {
                prompts = '(a) 求 \\(\\alpha + \\beta\\)：\\(\\underline{\\qquad}\\)<br>' +
                    '(b) 求 \\(\\alpha\\beta\\)：\\(\\underline{\\qquad}\\)';
            }
            return '<div class="print-q-item"><strong>' + number + '.</strong> \\(' + question.eqStr +
                '\\)<div class="print-q-prompts">' + prompts + '</div><div class="print-space"></div></div>';
        }

        function printExampleStepsMarkup(type, question) {
            let content = "";
            if (type === "discrim") {
                content = '<div class="print-example-step">(a) 求判別式</div>' +
                    stepsToMarkup(question.steps.discrim);
            } else if (type === "combined") {
                const aLabel = question.answerMode === "discrim" ? "(a) 求判別式" : "(a) 求根";
                const aSteps = question.answerMode === "discrim" ? question.steps.discrim : question.steps.roots;
                content = '<div class="print-example-step">' + aLabel + "</div>" + stepsToMarkup(aSteps) +
                    '<div class="print-example-step">(b) 根的性質' +
                    (question.answerMode === "discrim" ? "（先比較判別式）" : "") + "</div>" +
                    stepsToMarkup(question.steps.nature);
            } else {
                content = '<div class="print-example-step">(a) 兩根之和</div>' + stepsToMarkup(question.steps.sum) +
                    '<div class="print-example-step">(b) 兩根之積</div>' + stepsToMarkup(question.steps.product);
            }
            return '<div class="print-example-steps">' + content + "</div>";
        }

        function printCurrentQuestionPage(type, firstNumber, questions) {
            const questionTitle = TYPE_LABELS[type];
            const pageScoreTotal = 4 * POINTS_PER_TYPE[type];
            const example = type === "combined" ?
                generateQuestion(type, ">0", "roots") :
                generateQuestion(type, null, type === "combined" ? "discrim" : null);
            let page = '<div class="print-page"><div class="print-header"><div>' +
                '<div class="print-title">S4 Ch2 Ex1 根的性質及根與係數的關係 工作紙</div>' +
                '<div class="print-info">姓名：______________ 班別：______ 學號：___ 日期：________ 得分：____/' +
                pageScoreTotal + '</div></div><div class="qrcode-container page-qr"></div></div>' +
                '<h3 style="margin-bottom:15px;font-size:14pt;">' + questionTitle + '</h3>' +
                '<div class="print-content"><div class="print-questions">';

            for (let i = 0; i < questions.length; i++) {
                page += printQuestionPrompt(type, questions[i], firstNumber + i);
            }

            page += '</div><div class="print-example"><strong class="print-example-title">例題示範</strong>' +
                '<div class="print-example-question">方程：\\(' + example.eqStr + '\\)</div>' +
                printExampleStepsMarkup(type, example) + "</div></div></div>";
            return page;
        }

        function printAnswerPage(type, questions, firstNumber, scoreTotal) {
            const lastNumber = firstNumber + questions.length - 1;
            let html = '<div class="print-page print-ans-page"><div class="print-header">' +
                '<div><div class="print-title">工作紙答案：' + TYPE_LABELS[type] + '</div>' +
                '<div class="print-info">題號 ' + firstNumber + '–' + lastNumber +
                '　總分：' + scoreTotal + ' 分</div></div>' +
                '<div class="qrcode-container ans-qr"></div></div>';
            questions.forEach(function(question, index) {
                const number = firstNumber + index;
                html += '<div class="print-ans-item"><strong>' + number + '.</strong> \\(' +
                    question.eqStr + '\\)<br>' + printAnswerMarkup(type, question) +
                    printAnswerStepsMarkup(type, question) + "</div>";
            });
            html += "</div>";
            return html;
        }

        function generatePrintsheet(printAll) {
            if (isPrinting) return;
            isPrinting = true;
            const printLoading = document.getElementById("print-loading");
            printLoading.textContent = "正在生成工作紙，請稍候...";
            printLoading.classList.remove("hidden");
            const printArea = document.getElementById("print-area");
            printArea.innerHTML = "";

            const typesToPrint = printAll ? TYPES.slice() : [currentType];
            const groups = [];
            let questionNumber = 1;

            typesToPrint.forEach(function(type) {
                const questions = [];
                for (let i = 0; i < 4; i++) {
                    const target = i === 0 ? ">0" : (i === 1 ? "=0" : (i === 2 ? "<0" : null));
                    if (type === "combined") {
                        questions.push(generateQuestion(type, target, i % 2 === 0 ? "discrim" : "roots"));
                    } else {
                        questions.push(generateQuestion(type, target));
                    }
                }
                printArea.insertAdjacentHTML("beforeend",
                    printCurrentQuestionPage(type, questionNumber, questions));
                groups.push({ type: type, questions: questions, firstNumber: questionNumber });
                questionNumber += questions.length;
            });

            groups.forEach(function(group) {
                const chunkSize = group.type === "discrim" ? 4 : 2;
                const scoreTotal = 4 * POINTS_PER_TYPE[group.type];
                for (let offset = 0; offset < group.questions.length; offset += chunkSize) {
                    const chunk = group.questions.slice(offset, offset + chunkSize);
                    printArea.insertAdjacentHTML("beforeend", printAnswerPage(
                        group.type,
                        chunk,
                        group.firstNumber + offset,
                        scoreTotal
                    ));
                }
            });

            MathJax.typesetPromise([printArea]).then(function() {
                const currentUrl = window.location.href;
                const qrContainers = Array.from(printArea.querySelectorAll(".qrcode-container"));
                try {
                    if (!window.QRCode || qrContainers.length === 0) {
                        throw new Error("QRCode library or containers are missing");
                    }
                    qrContainers.forEach(function(container) {
                        new QRCode(container, {
                            text: currentUrl,
                            width: 90,
                            height: 90,
                            correctLevel: QRCode.CorrectLevel.L
                        });
                    });
                } catch (error) {
                    console.error("QR code generation failed; printing was cancelled.", error);
                    printLoading.textContent = "QR code 未完成，未啟動列印。請重新嘗試。";
                    printArea.innerHTML = "";
                    isPrinting = false;
                    return;
                }

                setTimeout(function() {
                    const allQrsReady = qrContainers.length > 0 &&
                        qrContainers.every(function(container) { return Boolean(container.querySelector("canvas, img")); });
                    if (!allQrsReady) {
                        console.error("QR code output is missing; printing was cancelled.");
                        printLoading.textContent = "QR code 未完成，未啟動列印。請重新嘗試。";
                        printArea.innerHTML = "";
                        isPrinting = false;
                        return;
                    }
                    printLoading.classList.add("hidden");
                    printModal.style.display = "none";
                    window.print();
                }, 500);
            }).catch(function(error) {
                console.error("MathJax Error during print prep:", error);
                printLoading.textContent = "數式未完成，未啟動列印。請重新嘗試。";
                isPrinting = false;
            });
        }

        document.getElementById("btn-print-dialog").addEventListener("click", function() {
            document.getElementById("print-type-label").innerText = TYPE_LABELS[currentType];
            printModal.style.display = "flex";
        });
        document.getElementById("close-print-modal").addEventListener("click", function() {
            printModal.style.display = "none";
        });
        document.getElementById("print-current-btn").addEventListener("click", function() {
            generatePrintsheet(false);
        });
        document.getElementById("print-all-btn").addEventListener("click", function() {
            generatePrintsheet(true);
        });

        window.addEventListener("afterprint", function() {
            clearTimeout(printTimeout);
            document.getElementById("print-area").innerHTML = "";
            isPrinting = false;
        });

        window.addEventListener("beforeprint", function() {
            clearTimeout(printTimeout);
            printTimeout = setTimeout(function() {
                document.getElementById("print-area").innerHTML = "";
                isPrinting = false;
            }, 60000);
        });

        window.onload = function() {
            renderUI();
        };
        </script>
</body>
</html>
