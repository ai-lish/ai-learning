<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>直線方程 — 隨機練習</title>
    <script src="https://cdn.tailwindcss.com" defer></script>
    <script>
        MathJax = { 
            tex: { inlineMath: [['$$', '$$']] }, 
            startup: { typeset: false },
            options: { skipHtmlTags: ['script','noscript','style','textarea','pre'] }
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; color: #1e293b; touch-action: manipulation; }
        .fraction { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 0.2em; font-family: monospace; }
        .fraction > span { display: block; padding: 0.1em 0.3em; text-align: center; }
        .fraction span.fdn { border-top: 2px solid #1e293b; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .vk-input {
            text-align: center; font-family: monospace; border: 2px solid #cbd5e1; border-radius: 0.25rem;
            padding: 0.25rem; transition: all 0.2s; outline: none; background: white; font-size: 1.1rem;
        }
        .vk-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3); }
        .vk-input[disabled] { background-color: #f1f5f9; cursor: not-allowed; color: #64748b; }
        
        .vk-key {
            border: 1px solid; border-radius: 0.375rem; padding: 0.4rem 0; text-align: center;
            font-size: 1.1rem; font-weight: bold; cursor: pointer; user-select: none; transition: all 0.1s;
            display: flex; justify-content: center; align-items: center;
            -webkit-tap-highlight-color: transparent;
        }
        @media (min-width: 768px) { .vk-key { font-size: 1.25rem; border-radius: 0.5rem; padding: 0.6rem 0; } }
        .vk-key:active { transform: translateY(2px); box-shadow: none !important; }
    </style>
</head>
<body class="min-h-screen p-2 md:p-6 flex flex-col items-center pb-32">

    <div class="w-full max-w-6xl mb-4">
        <h1 class="text-2xl md:text-4xl font-bold text-center mb-4 md:mb-8 text-blue-900">直線方程隨機練習</h1>
    </div>

    <!-- Content -->
    <div class="w-full max-w-4xl flex-col gap-4 mx-auto">
        
        <!-- Toolbar & Scores -->
        <div class="bg-white p-3 rounded-lg shadow border border-gray-200 flex flex-col gap-3 relative z-10 mb-2">
            <div class="flex items-center justify-between gap-2 w-full">
                <div class="flex items-center gap-2 flex-grow">
                    <select id="questionType" class="border p-2 rounded bg-gray-50 w-full md:w-auto text-sm md:text-base font-bold text-gray-700">
                        <option value="A">A. 點 + 斜率</option>
                        <option value="B">B. 點 + 點</option>
                        <option value="C">C. 截距 + 截距</option>
                        <option value="MIX">🎲 混合 (隨機)</option>
                    </select>
                </div>
                <button onclick="generateQuestion()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded shadow font-bold text-sm md:text-base transition whitespace-nowrap">
                    🔄 生成
                </button>
            </div>
            
            <div class="flex items-center justify-between text-xs md:text-sm font-bold text-gray-600 bg-gray-50 border rounded-lg px-3 py-2 w-full">
                <span>列式: <span id="scoreS1" class="text-indigo-600">0</span></span>
                <span class="text-gray-300">|</span>
                <span>斜率: <span id="scoreS2" class="text-blue-600">0</span></span>
                <span class="text-gray-300">|</span>
                <span>答案: <span id="scoreS3" class="text-purple-600">0</span></span>
                <span class="text-gray-300">|</span>
                <span class="text-green-700 text-sm md:text-base">總分: <span id="scoreTotal" class="font-extrabold">0</span></span>
            </div>
        </div>

        <div class="bg-white p-4 md:p-6 rounded-lg shadow border border-gray-200 relative">
            <div class="min-h-[60px] md:min-h-[80px] w-full flex items-center bg-blue-50/50 rounded-lg p-4 border border-blue-100 mb-4 relative">
                <p id="questionText" class="text-lg md:text-xl font-medium text-gray-800 pr-8">請點擊上方按鈕生成題目。</p>
                <button onclick="toggleHint()" class="absolute top-2 right-2 bg-white border shadow rounded text-xs px-2 py-1 z-10 hover:bg-gray-100 text-gray-500">👁️ 圖示</button>
            </div>

            <div class="w-full flex justify-center mb-4">
                <canvas id="hintCanvas" width="300" height="200" class="border rounded bg-gray-50 hidden max-w-full h-auto"></canvas>
            </div>

            <!-- Answer Area -->
            <div id="answerArea" class="hidden flex-col gap-4">
                <div id="revealArea" class="hidden bg-green-50 border border-green-200 p-4 rounded-lg text-sm md:text-base fade-in mb-2">
                    <p class="font-bold border-b border-green-200 pb-1 mb-2 text-green-800">📝 完整答案</p>
                    <p>直線方程：<span id="reveal_eq" class="font-mono ml-1 text-blue-800"></span></p>
                    <p class="mt-1">交叉展開：<span id="reveal_expand" class="font-mono ml-1"></span></p>
                    <p class="mt-1">一般式：<span id="reveal_gen" class="font-mono ml-4 font-bold text-lg text-blue-900"></span></p>
                </div>

                <div class="flex flex-col md:flex-row gap-3 items-start md:items-center bg-gray-50 p-4 rounded-lg border">
                    <div class="flex items-center gap-2 flex-wrap">
                        <span class="font-bold text-blue-800 text-sm">列式：</span>
                        <div class="fraction font-mono text-base border rounded bg-white p-1 shadow-sm">
                            <span class="flex items-center gap-1 px-1">
                                <span>$$y -$$</span>
                                <input type="text" id="ans_y1" class="vk-input w-12" placeholder="y₁" autocomplete="off" inputmode="none">
                            </span>
                            <span class="fdn flex items-center gap-1 px-1">
                                <span>$$x -$$</span>
                                <input type="text" id="ans_x1" class="vk-input w-12" placeholder="x₁" autocomplete="off" inputmode="none">
                            </span>
                        </div>
                        <span class="font-mono text-base">$$=$$</span>
                        <input type="text" id="ans_m" class="vk-input w-20" placeholder="斜率 m" autocomplete="off" inputmode="none">
                    </div>
                    <div class="hidden md:block w-px h-10 bg-gray-300"></div>
                    <div class="flex gap-3 text-sm font-bold">
                        <span class="text-indigo-600">列式: <span id="fb_eq" class="text-gray-400">--</span></span>
                        <span class="text-blue-600">斜率: <span id="fb_slope" class="text-gray-400">--</span></span>
                    </div>
                </div>

                <div class="flex items-center gap-3 flex-wrap bg-gray-50 p-4 rounded-lg border">
                    <span class="font-bold text-blue-800 text-sm">一般式：</span>
                    <input type="text" id="ans_gen" 
                        class="vk-input flex-grow min-w-[180px] max-w-[280px] text-left px-2" 
                        placeholder="例: 3x-4y+12=0" 
                        autocomplete="off" inputmode="none">
                    <span class="text-xs text-gray-400">（$$x$$ 係數須為正數，須包含 =0）</span>
                    <span class="font-bold text-purple-600 text-sm">答案: <span id="fb_gen" class="text-gray-400">--</span></span>
                </div>

                <div class="flex justify-center">
                    <button onclick="checkAllAnswers()" id="btnCheckAll" class="bg-green-600 hover:bg-green-700 text-white px-8 py-2.5 rounded-full shadow-md font-bold text-lg transition">
                        ✔ 核對全部
                    </button>
                </div>
            </div>
            <div class="h-[100px] w-full"></div>
        </div>
    </div>

    <!-- Virtual Keyboard -->
    <div id="virtualKeyboard" class="fixed bottom-0 left-0 right-0 bg-[#f1f5f9] border-t border-gray-300 shadow-[0_-4px_10px_rgba(0,0,0,0.1)] p-2 z-50">
        <div class="max-w-2xl mx-auto flex flex-col gap-1.5 md:gap-2">
            <div class="grid grid-cols-9 gap-1 md:gap-2">
                <button class="vk-key bg-white text-slate-800 border-slate-300 shadow-[0_2px_0_#cbd5e1]" onclick="vkPress('1')">1</button>
                <button class="vk-key bg-white text-slate-800 border-slate-300 shadow-[0_2px_0_#cbd5e1]" onclick="vkPress('2')">2</button>
                <button class="vk-key bg-white text-slate-800 border-slate-300 shadow-[0_2px_0_#cbd5e1]" onclick="vkPress('3')">3</button>
                <button class="vk-key bg-white text-slate-800 border-slate-300 shadow-[0_2px_0_#cbd5e1]" onclick="vkPress('4')">4</button>
                <button class="vk-key bg-white text-slate-800 border-slate-300 shadow-[0_2px_0_#cbd5e1]" onclick="vkPress('5')">5</button>
                <button class="vk-key bg-white text-slate-800 border-slate-300 shadow-[0_2px_0_#cbd5e1]" onclick="vkPress('6')">6</button>
                <button class="vk-key bg-white text-slate-800 border-slate-300 shadow-[0_2px_0_#cbd5e1]" onclick="vkPress('7')">7</button>
                <button class="vk-key bg-white text-slate-800 border-slate-300 shadow-[0_2px_0_#cbd5e1]" onclick="vkPress('8')">8</button>
                <button class="vk-key bg-white text-slate-800 border-slate-300 shadow-[0_2px_0_#cbd5e1]" onclick="vkPress('9')">9</button>
            </div>
            <div class="grid grid-cols-9 gap-1 md:gap-2">
                <button class="vk-key bg-blue-100 text-blue-800 border-blue-200 shadow-[0_2px_0_#bae6fd]" onclick="vkPress('x')"><span class="italic font-serif">x</span></button>
                <button class="vk-key bg-blue-100 text-blue-800 border-blue-200 shadow-[0_2px_0_#bae6fd]" onclick="vkPress('y')"><span class="italic font-serif">y</span></button>
                <button class="vk-key bg-blue-100 text-blue-800 border-blue-200 shadow-[0_2px_0_#bae6fd]" onclick="vkPress('-')">−</button>
                <button class="vk-key bg-blue-100 text-blue-800 border-blue-200 shadow-[0_2px_0_#bae6fd]" onclick="vkPress('+')">+</button>
                <button class="vk-key bg-blue-100 text-blue-800 border-blue-200 shadow-[0_2px_0_#bae6fd]" onclick="vkPress('=')">=</button>
                <button class="vk-key bg-white text-slate-800 border-slate-300 shadow-[0_2px_0_#cbd5e1]" onclick="vkPress('0')">0</button>
                <button class="vk-key bg-blue-100 text-blue-800 border-blue-200 shadow-[0_2px_0_#bae6fd]" onclick="vkPress('/')">/</button>
                <button class="vk-key bg-blue-100 text-blue-800 border-blue-200 shadow-[0_2px_0_#bae6fd]" onclick="vkPress('()')">( )</button>
                <button class="vk-key bg-red-100 text-red-700 border-red-200 shadow-[0_2px_0_#fecaca]" onclick="vkPress('DEL')">⌫</button>
            </div>
        </div>
    </div>

    <!-- JS LOGIC -->
    <script>
        let currentQuestion = null;
        let scoreS1 = 0, scoreS2 = 0, scoreS3 = 0, scoreTotal = 0;

        function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while(b) { let t = b; b = a % b; a = t; } return a; }
        function formatFraction(num, den) {
            if (den === 0) return '∞'; if (num === 0) return '0';
            let g = gcd(num, den); num /= g; den /= g;
            if (den < 0) { num = -num; den = -den; }
            if (den === 1) return num.toString(); return `${num}/${den}`;
        }
        function fmtC(n) { return n < 0 ? `(-${Math.abs(n)})` : n.toString(); }

        function parseGeneralForm(str) {
            str = str.replace(/\s+/g, '');
            let eqIdx = str.indexOf('=');
            if (eqIdx !== -1) {
                let rhs = str.slice(eqIdx + 1).trim();
                if (rhs !== '0') return { A: NaN, B: NaN, C: NaN };
                str = str.slice(0, eqIdx);
            } else {
                return { A: NaN, B: NaN, C: NaN };
            }
            
            let A = 0, B = 0, C = 0;
            let termRegex = /([+-]?\d*)([xy]?)/gi;
            let match;
            while ((match = termRegex.exec(str)) !== null) {
                if (match[0] === '') break;
                let coefStr = match[1];
                let varName = match[2].toLowerCase();
                let coef = 1;
                if (coefStr === '-' || coefStr === '+-') coef = -1;
                else if (coefStr === '+' || coefStr === '') coef = 1;
                else coef = parseInt(coefStr);
                if (varName === 'x') A += coef;
                else if (varName === 'y') B += coef;
                else C += coef;
            }
            return {A, B, C};
        }

        function toggleHint() { document.getElementById('hintCanvas').classList.toggle('hidden'); }
        function updateScoreDisplay() {
            document.getElementById('scoreS1').innerText = scoreS1; document.getElementById('scoreS2').innerText = scoreS2;
            document.getElementById('scoreS3').innerText = scoreS3; document.getElementById('scoreTotal').innerText = scoreTotal;
        }

        function generateQuestion() {
            let typeRaw = document.getElementById('questionType').value;
            const type = typeRaw === 'MIX' ? ['A','B','C'][Math.floor(Math.random()*3)] : typeRaw;
            
            const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
            const randNonZero = (min, max) => { let r = 0; while(r===0) r = randInt(min, max); return r; };

            let text = ""; let mNum, mDen, cNum, cDen; let pts = [];

            if (type === 'A') {
                mNum = randNonZero(-4, 4); mDen = randInt(1, 3);
                if (mNum % mDen === 0) { mNum /= mDen; mDen = 1; }
                let x1 = randInt(-6, 6); let y1 = randInt(-6, 6); pts.push({x: x1, y: y1});
                let mStr = formatFraction(mNum, mDen);
                text = `已知直線斜率為 $$m = ${mStr}$$，通過點 $$(${x1}, ${y1})$$，求直線方程。`;
            } else if (type === 'B') {
                mNum = randNonZero(-4, 4); mDen = randInt(1, 4);
                if (mNum % mDen === 0) { mNum /= mDen; mDen = 1; }
                let x1 = randInt(-5, 5); let y1 = randInt(-5, 5);
                let k = randNonZero(-2, 2); let x2 = x1 + k * mDen; let y2 = y1 + k * mNum;
                pts.push({x: x1, y: y1}, {x: x2, y: y2});
                text = `求通過 $$A(${x1}, ${y1})$$ 及 $$B(${x2}, ${y2})$$ 的直線方程。`;
            } else if (type === 'C') {
                let a = randNonZero(-6, 6); let b = randNonZero(-6, 6); 
                pts.push({x: a, y: 0}, {x: 0, y: b});
                mNum = b - 0; mDen = 0 - a;
                let g = gcd(mNum, mDen); mNum /= g; mDen /= g;
                if(mDen < 0) { mNum = -mNum; mDen = -mDen; }
                text = `已知 $$x$$ 截距為 $${a}$，$$y$$ 截距為 $${b}$，求直線方程。`;
            }

            document.getElementById('questionText').innerHTML = text;

            let pt = pts[0]; let CNum = pt.y * mDen - mNum * pt.x; 
            let A = mNum, B = -mDen, C = CNum;
            if (A < 0 || (A === 0 && B < 0)) { A = -A; B = -B; C = -C; }
            let gAll = gcd(A, gcd(B, C)); A /= gAll; B /= gAll; C /= gAll;

            let expLHS = mDen === 1 ? `y - ${fmtC(pt.y)}` : `${mDen}(y - ${fmtC(pt.y)})`;
            let expRHS = mNum === 1 ? `x - ${fmtC(pt.x)}` : `${mNum}(x - ${fmtC(pt.x)})`;
            let expansionStr = `$${expLHS} = ${expRHS}$`;
            
            let genStr = `$`;
            if(A !== 0) genStr += (A===1 ? "" : A===-1 ? "-" : A) + "x";
            if(B !== 0) {
                if(B > 0 && genStr !== "$") genStr += "+";
                else if(B < 0) { genStr += "-"; B = -B; }
                genStr += (B===1 ? "" : B) + "y";
                if(B !== 0) B = -B; 
            }
            if(C > 0) genStr += "+" + C;
            else if(C < 0) genStr += "-" + Math.abs(C);
            genStr += " = 0$";

            currentQuestion = {
                type: type, mStr: formatFraction(mNum, mDen), validPoints: pts,
                genA: A, genB: B, genC: C, expansionStr: expansionStr, generalStr: genStr,
                scored: false
            };

            document.getElementById('answerArea').classList.remove('hidden');
            document.getElementById('answerArea').classList.add('flex');
            
            let inputs = ['ans_y1', 'ans_x1', 'ans_m', 'ans_gen'];
            inputs.forEach(id => {
                let el = document.getElementById(id);
                el.value = '';
                el.disabled = false;
            });
            
            document.getElementById('fb_eq').innerText = '--'; document.getElementById('fb_eq').className = 'text-gray-400';
            document.getElementById('fb_slope').innerText = '--'; document.getElementById('fb_slope').className = 'text-gray-400';
            document.getElementById('fb_gen').innerText = '--'; document.getElementById('fb_gen').className = 'text-gray-400';
            
            document.getElementById('revealArea').classList.add('hidden');
            document.getElementById('btnCheckAll').disabled = false;
            
            drawHintCanvas(); 
            MathJax.typesetPromise();
        }

        function checkAllAnswers() {
            if (!currentQuestion) return;
            let pts = currentQuestion.validPoints;
            
            let x1 = document.getElementById('ans_x1').value.trim();
            let y1 = document.getElementById('ans_y1').value.trim();
            let eqOk = pts.some(p => p.x.toString() === x1 && p.y.toString() === y1);
            
            let mVal = document.getElementById('ans_m').value.trim().replace(/\s/g,'');
            let slopeOk = (mVal === currentQuestion.mStr);
            
            let genVal = document.getElementById('ans_gen').value;
            let parsed = parseGeneralForm(genVal);
            let genOk = false;
            
            if (!isNaN(parsed.A) && !isNaN(parsed.B) && !isNaN(parsed.C)) {
                if (parsed.A === currentQuestion.genA && 
                    parsed.B === currentQuestion.genB && 
                    parsed.C === currentQuestion.genC) {
                    genOk = true;
                }
                if (parsed.A < 0) genOk = false;
            }
            
            let fbEq = document.getElementById('fb_eq');
            let fbSlope = document.getElementById('fb_slope');
            let fbGen = document.getElementById('fb_gen');
            
            fbEq.innerText = eqOk ? '✅' : '❌'; fbEq.className = eqOk ? 'text-green-600' : 'text-red-500';
            fbSlope.innerText = slopeOk ? '✅' : '❌'; fbSlope.className = slopeOk ? 'text-green-600' : 'text-red-500';
            fbGen.innerText = genOk ? '✅' : '❌'; fbGen.className = genOk ? 'text-green-600' : 'text-red-500';
            
            if (!currentQuestion.scored) {
                currentQuestion.scored = true;
                if (eqOk) { scoreS1++; scoreTotal++; }
                if (slopeOk) { scoreS2++; scoreTotal++; }
                if (genOk) { scoreS3++; scoreTotal++; }
                updateScoreDisplay();
            }
            
            let pt = pts[0];
            document.getElementById('reveal_eq').innerHTML = `$\\frac{y - ${fmtC(pt.y)}}{x - ${fmtC(pt.x)}} = ${currentQuestion.mStr}$`;
            document.getElementById('reveal_expand').innerHTML = currentQuestion.expansionStr;
            document.getElementById('reveal_gen').innerHTML = currentQuestion.generalStr;
            document.getElementById('revealArea').classList.remove('hidden');
            document.getElementById('btnCheckAll').disabled = true;

            ['ans_y1', 'ans_x1', 'ans_m', 'ans_gen'].forEach(id => document.getElementById(id).disabled = true);
            
            document.getElementById('revealArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
            MathJax.typesetPromise();
        }

        let activeInput = null;
        
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('vk-input') && !e.target.disabled && !e.target.readOnly) {
                if (activeInput) activeInput.classList.remove('ring-2', 'ring-blue-500', 'bg-blue-50');
                activeInput = e.target;
                activeInput.classList.add('ring-2', 'ring-blue-500', 'bg-blue-50');
            } else if (!e.target.closest('#virtualKeyboard') && !e.target.classList.contains('vk-input')) {
                if (activeInput) { activeInput.classList.remove('ring-2', 'ring-blue-500', 'bg-blue-50'); activeInput = null; }
            }
        });

        function vkPress(key) {
            if (!activeInput) return;
            if (key === 'DEL') {
                activeInput.value = activeInput.value.slice(0, -1);
            } else if (key === '()') {
                activeInput.value += '()';
            } else if (key === '-') {
                activeInput.value += '-';
            } else {
                activeInput.value += key;
            }
            activeInput.dispatchEvent(new Event('input'));
        }

        function drawHintCanvas() {
            if(!currentQuestion) return;
            const hc = document.getElementById('hintCanvas'); const hx = hc.getContext('2d');
            hx.clearRect(0, 0, hc.width, hc.height);
            const cx = hc.width / 2; const cy = hc.height / 2; const scale = 10; 

            hx.strokeStyle = '#cbd5e1'; hx.lineWidth = 1;
            hx.beginPath(); hx.moveTo(0, cy); hx.lineTo(hc.width, cy); hx.stroke();
            hx.beginPath(); hx.moveTo(cx, 0); hx.lineTo(cx, hc.height); hx.stroke();
            hx.fillStyle = '#94a3b8'; hx.font = '12px sans-serif';
            hx.fillText('x', hc.width - 15, cy - 8); hx.fillText('y', cx + 8, 15);

            let pts = currentQuestion.validPoints; let A = currentQuestion.genA, B = currentQuestion.genB, C = currentQuestion.genC;
            hx.strokeStyle = '#3b82f6'; hx.lineWidth = 2; hx.beginPath();
            if (B === 0) {
                let x = -C/A; hx.moveTo(cx + x*scale, 0); hx.lineTo(cx + x*scale, hc.height);
            } else {
                let yAtLeft = (-A * (-cx/scale) - C) / B; let yAtRight = (-A * (cx/scale) - C) / B;
                hx.moveTo(0, cy - yAtLeft*scale); hx.lineTo(hc.width, cy - yAtRight*scale);
            }
            hx.stroke();

            hx.fillStyle = '#ef4444';
            pts.forEach(pt => {
                hx.beginPath(); hx.arc(cx + pt.x*scale, cy - pt.y*scale, 4, 0, Math.PI*2); hx.fill();
                hx.fillText(`(${pt.x}, ${pt.y})`, cx + pt.x*scale + 6, cy - pt.y*scale - 6);
            });
        }
        
        document.addEventListener('DOMContentLoaded', () => { generateQuestion(); });
    </script>
</body>
</html>
