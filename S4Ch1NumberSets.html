<!DOCTYPE html>
<html lang="zh-HK" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>代數運算與數系核心技能綜合練習</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  <style>
    :root { --app-height: 100dvh; }
    body { height: 100dvh; max-height: 100dvh; overflow: hidden; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; }
    .key-btn { touch-action: manipulation; user-select: none; -webkit-user-select: none; transition: background-color .06s ease, transform .06s ease; }
    .key-btn:active { transform: scale(.96); filter: brightness(.92); }
    .option-card { transition: all .12s ease-in-out; user-select: none; -webkit-user-select: none; }
    .option-card.selected { border-color: #4f46e5; background-color: #eef2ff; color: #312e81; box-shadow: 0 0 0 1.5px #6366f1; }
    .print-target { display: none; }
    @media print {
      body { background: white !important; color: black !important; height: auto !important; max-height: none !important; overflow: visible !important; }
      .no-print { display: none !important; }
      .print-target { display: none !important; }
      .print-target.print-active { display: block !important; }
      .page-break { page-break-after: always; break-after: page; }
      .avoid-break { page-break-inside: avoid; break-inside: avoid; }
    }

    @page { size: A4 portrait; margin: 10mm; }
    .fixed-worksheet-print { width: 190mm; box-sizing: border-box; padding: 0; color: #111; background: #fff; font-family: "Noto Sans TC", Arial, sans-serif; }
    .fixed-worksheet-page { width: 190mm; height: 265mm; box-sizing: border-box; display: flex; min-height: 0; flex-direction: column; overflow: hidden; break-after: page; break-inside: avoid; }
    .fixed-worksheet-page:last-of-type { break-after: auto; }
    .fixed-worksheet-page > .print-page-head { flex: 0 0 22mm; height: 22mm; min-height: 22mm; box-sizing: border-box; }
    .print-page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; border-bottom: 2px solid #111; padding-bottom: 8px; margin-bottom: 0; box-sizing: border-box; }
    .print-page-head > div:first-child { min-width: 0; flex: 1; }
    .print-page-head h1 { margin: 0 0 4px; font-size: 20px; line-height: 1.15; }
    .print-meta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; border-bottom: 0; padding-bottom: 0; font-size: 11px; line-height: 1.2; }
    .print-qr { display: block; flex: 0 0 58px; width: 58px; color: #111; text-align: center; }
    .print-qr-svg { display: block; width: 54px; height: 54px; shape-rendering: crispEdges; }
    .print-qr small { display: block; font-size: 7px; line-height: 1.05; white-space: nowrap; }
    .fixed-worksheet-page > h2 { flex: 0 0 7mm; height: 7mm; margin: 0; line-height: 7mm; font-size: 16px; }
    .fixed-worksheet-questions { display: grid; grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 2mm; min-height: 0; flex: 0 0 229mm; height: 229mm; }
    .fixed-worksheet-question { display: grid; grid-template-columns: minmax(0, 1fr) minmax(33%, 40%); gap: 9px; min-height: 0; margin: 0; padding: 7px; border: 1px solid #9da9b8; border-radius: 6px; overflow: hidden; box-sizing: border-box; font-size: 10px; }
    .fixed-worksheet-page.no-examples .fixed-worksheet-question { grid-template-columns: minmax(0, 1fr); }
    .fixed-worksheet-response { display: flex; min-width: 0; min-height: 0; flex-direction: column; }
    .fixed-worksheet-question .print-expression { margin: 3px 0 4px; font-size: 15px; line-height: 1.1; overflow: hidden; }
    .fixed-worksheet-instruction { min-height: 0; font-size: 10px; line-height: 1.2; }
    .fixed-worksheet-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5mm; margin: 2mm 0; font-size: 10px; line-height: 1.2; }
    .fixed-worksheet-writing { display: flex; min-height: 18mm; flex: 1 1 auto; flex-direction: column; border: 1px solid #c7d0dc; border-radius: 4px; padding: 4px; color: #7b8797; font-size: 8px; line-height: 1.2; background: repeating-linear-gradient(to bottom, #fff 0, #fff 6.8mm, #e4e9ef 6.8mm, #e4e9ef 7mm); }
    .fixed-worksheet-writing.long { min-height: 25mm; }
    .fixed-worksheet-writing.extra-long { min-height: 34mm; }
    .fixed-worksheet-example { min-width: 0; border-left: 1px solid #b8c2cf; padding-left: 8px; color: #39475c; font-size: 11px; line-height: 1.12; overflow: hidden; overflow-wrap: anywhere; }
    .fixed-worksheet-example-prompt { font-weight: 900; line-height: 1.12; overflow-wrap: anywhere; }
    .fixed-worksheet-example-gap { height: 3mm; }
    .fixed-worksheet-example-answer-label { margin-bottom: 1.5mm; font-weight: 900; }
    .fixed-worksheet-example-sequence { display: grid; gap: 1.2mm; }
    .fixed-worksheet-example-line { margin: 0; font-size: 11px; line-height: 1.12; overflow-wrap: anywhere; }
    .fixed-worksheet-example .print-math { white-space: normal; }
    .fixed-worksheet-short-answers { display: flex; flex: 0 0 7mm; height: 7mm; box-sizing: border-box; flex-direction: column; gap: .2mm; overflow: visible; border-top: 1px solid #6b7280; padding: .5mm 2mm; transform: rotate(180deg); transform-origin: center; font-size: 9px; line-height: 2.6mm; }
    .fixed-worksheet-short-answer-label { font-size: 9px; line-height: 2.2mm; font-weight: 900; }
    .fixed-worksheet-short-answer-lines { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; gap: 3mm; min-height: 0; }
    .fixed-worksheet-short-answer-line { min-width: 0; overflow: visible; font-size: 9px; line-height: 2.6mm; text-align: center; white-space: nowrap; }
    .fixed-worksheet-short-answer-line.compact { font-size: 8px; }
    .fixed-worksheet-overflow-warning { flex: 0 0 5mm; height: 5mm; box-sizing: border-box; padding: 1mm 0 0; color: #8a4b13; font-size: 7px; line-height: 3mm; text-align: center; white-space: nowrap; overflow: hidden; }
    .fixed-worksheet-page.has-overflow-warning .fixed-worksheet-questions { flex-basis: 226mm; height: 226mm; }
    .fixed-worksheet-page.has-overflow-warning .fixed-worksheet-short-answers { flex-basis: 5mm; height: 5mm; padding-top: .25mm; padding-bottom: .25mm; font-size: 7px; line-height: 1.8mm; }

    .fixed-worksheet-page.has-overflow-warning .fixed-worksheet-short-answer-line { font-size: 7px; line-height: 1.8mm; }

    .fixed-worksheet-answer-page .fixed-worksheet-example { border-left: 0; padding-left: 0; }

    /* The measurement class reproduces the print geometry while the target is off-screen. */
    .print-measure-mode { display: block !important; box-sizing: border-box !important; width: 190mm !important; padding: 0 !important; font-family: "Noto Sans TC", Arial, sans-serif !important; }

  <script>
    const state = { mode: 'polynomials', score: 0, correctCount: 0, wrongCount: 0, totalCount: 0, currentQuestion: null, inputValue: '', selectedMcOption: null, attemptCount: 1, isResolved: false };
    let mathjaxPromiseChain = Promise.resolve();
    let latexDebounceTimer = null;
    const byId = function(id) { return document.getElementById(id); };
    const latexDisplayEl = byId('latex-display');
    const rawEchoEl = byId('raw-echo');
    const questionEl = byId('math-question');
    const feedbackEl = byId('feedback-box');
    const badgeEl = byId('question-badge');
    const subhintEl = byId('question-subhint');
    const attemptPill = byId('attempt-pill');
    const specialKeyRow = byId('special-key-row');
    const textInputSec = byId('text-input-section');
    const mcSection = byId('mc-options-section');
    const mcGrid = byId('mc-options-grid');
    const choiceHint = byId('selected-choice-hint');
    const keypadFooter = byId('bottom-keypad-container');
    const mainActionBtn = byId('main-action-btn');
    const mainActionLabel = byId('main-action-label');

    const CAT = Object.freeze({
      POS_INT: '正整數 (Positive Integer)', NEG_INT: '負整數 (Negative Integer)', NON_NEG_INT: '非負整數 (Non-negative Integer)',
      INT: '整數 (Integer)', RATIONAL: '有理數 (Rational Number)', IRRATIONAL: '無理數 (Irrational Number)',
      REAL: '實數 (Real Number)', NON_REAL: '非實數 (Non-real Number)'
    });
    function isCategoryTrue(category, facts) {
      if (!facts) return false;
      if (category === CAT.POS_INT) return !!(facts.isInteger && facts.sign === 'pos');
      if (category === CAT.NEG_INT) return !!(facts.isInteger && facts.sign === 'neg');
      if (category === CAT.NON_NEG_INT) return !!(facts.isInteger && facts.sign !== 'neg');
      if (category === CAT.INT) return !!facts.isInteger;
      if (category === CAT.RATIONAL) return !!facts.isRational;
      if (category === CAT.IRRATIONAL) return !!(facts.isReal && !facts.isRational);
      if (category === CAT.REAL) return !!facts.isReal;
      if (category === CAT.NON_REAL) return !facts.isReal;
      return false;
    }
    function validateOptions(correctLabel, distractorLabels, facts) {
      if (!isCategoryTrue(correctLabel, facts)) return false;
      for (let i = 0; i < distractorLabels.length; i++) if (isCategoryTrue(distractorLabels[i], facts)) return false;
      return new Set([correctLabel].concat(distractorLabels)).size === 4;
    }
    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function nonZeroRandInt(min, max) { let value = 0; while (value === 0) value = randInt(min, max); return value; }
    function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = b; b = a % b; a = t; } return a || 1; }
    function simplifySquareRoot(n) {
      if (n <= 0) return { outside: 0, inside: 0 };
      let outside = 1; let inside = n;
      for (let d = 2; d * d <= inside; d++) while (inside % (d * d) === 0) { outside *= d; inside /= d * d; }
      return { outside: outside, inside: inside };
    }
    function shuffleArray(array) {
      const copy = array.slice();
      for (let i = copy.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const temp = copy[i]; copy[i] = copy[j]; copy[j] = temp; }
      return copy;
    }
    function polynomialText(a, b, c) {
      let text = (a === 1 ? '' : a === -1 ? '-' : String(a)) + 'x^2';
      if (b > 0) text += ' + ' + (b === 1 ? '' : b) + 'x'; else text += ' - ' + (Math.abs(b) === 1 ? '' : Math.abs(b)) + 'x';
      if (c > 0) text += ' + ' + c; else text += ' - ' + Math.abs(c);
      return text;
    }
    function algebraTermBody(coefficient, suffix) {
      const absolute = Math.abs(coefficient);
      if (suffix && absolute === 1) return suffix;
      return String(absolute) + suffix;
    }
    function joinAlgebraTerms(terms) {
      const nonZeroTerms = terms.filter(function(term) { return term.coefficient !== 0; });
      if (!nonZeroTerms.length) return '0';
      return nonZeroTerms.map(function(term, index) {
        const body = algebraTermBody(term.coefficient, term.suffix || '');
        if (index === 0) return term.coefficient < 0 ? '-' + body : body;
        return term.coefficient < 0 ? ' - ' + body : ' + ' + body;
      }).join('');
    }
    function appendEquationLine(lines, formula) {
      const normalized = String(formula).replace(/^=\s*/, '').trim(), previous = String(lines[lines.length - 1] || '').replace(/^=\s*/, '').trim();
      if (normalized !== previous) lines.push('= ' + normalized);
    }
    function polynomialFormula(a, b, c) {
      return joinAlgebraTerms([{ coefficient: a, suffix: 'x^2' }, { coefficient: b, suffix: 'x' }, { coefficient: c, suffix: '' }]);
    }
    function radicalTerm(coefficient, base) {
      if (coefficient === 0) return '0';
      const root = '\\sqrt{' + base + '}', body = Math.abs(coefficient) === 1 ? root : Math.abs(coefficient) + root;
      return coefficient < 0 ? '-' + body : body;
    }
    function radicalAnswerFormula(outside, inside, denominator) {
      const root = '\\sqrt{' + inside + '}', numerator = outside === 1 ? root : outside + root;
      return denominator === 1 ? numerator : '\\frac{' + numerator + '}{' + denominator + '}';
    }
    function complexPowerRemainder(remainder) {
      return remainder === 1 ? 'i' : remainder === 2 ? '(-1)' : '(-i)';
    }
    function generatePolynomialProblem(requestedSubtype) {
      const subtypeNumber = requestedSubtype === 'simplify' ? 1 : requestedSubtype === 'product' ? 2 : requestedSubtype === 'square' ? 3 : null;
      const type = subtypeNumber || randInt(1, 3);
      if (type === 1) {
        const a1 = randInt(1, 4), b1 = nonZeroRandInt(-4, 4), c1 = nonZeroRandInt(-5, 5);

    function fixedWorksheetPageOverflowState(page) {
