  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  <style>
    :root { --app-height: 100dvh; }
    body { height: 100dvh; max-height: 100dvh; overflow: hidden; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; }
    .key-btn { touch-action: manipulation; user-select: none; -webkit-user-select: none; transition: background-color .06s ease, transform .06s ease; }
    .key-btn:active { transform: scale(.96); filter: brightness(.92); }

    .option-card.selected { border-color: #4f46e5; background-color: #eef2ff; color: #312e81; box-shadow: 0 0 0 1.5px #6366f1; }

    @media print {
      body { background: white !important; color: black !important; height: auto !important; max-height: none !important; overflow: visible !important; }
      .no-print { display: none !important; }
      .print-target { display: block !important; }

      .avoid-break { page-break-inside: avoid; break-inside: avoid; }
    }

  </div>

  <script>
    const state = { mode: 'polynomials', score: 0, correctCount: 0, wrongCount: 0, totalCount: 0, currentQuestion: null, inputValue: '', selectedMcOption: null, attemptCount: 1, isResolved: false };
    let mathjaxPromiseChain = Promise.resolve();
    let latexDebounceTimer = null;
    const byId = function(id) { return document.getElementById(id); };
    const latexDisplayEl = byId('latex-display');
    const rawEchoEl = byId('raw-echo');
    const questionEl = byId('math-question');
    const feedbackEl = byId('feedback-box');
    const badgeEl = byId('question-badge');
    const subhintEl = byId('question-subhint');
    const attemptPill = byId('attempt-pill');
    const specialKeyRow = byId('special-key-row');
    const textInputSec = byId('text-input-section');
    const mcSection = byId('mc-options-section');
    const mcGrid = byId('mc-options-grid');
    const choiceHint = byId('selected-choice-hint');
    const keypadFooter = byId('bottom-keypad-container');
    const mainActionBtn = byId('main-action-btn');
    const mainActionLabel = byId('main-action-label');

    const CAT = Object.freeze({
      POS_INT: '正整數 (Positive Integer)', NEG_INT: '負整數 (Negative Integer)', NON_NEG_INT: '非負整數 (Non-negative Integer)',
      INT: '整數 (Integer)', RATIONAL: '有理數 (Rational Number)', IRRATIONAL: '無理數 (Irrational Number)',
      REAL: '實數 (Real Number)', NON_REAL: '非實數 (Non-real Number)'
    });
    function isCategoryTrue(category, facts) {
      if (!facts) return false;
      if (category === CAT.POS_INT) return !!(facts.isInteger && facts.sign === 'pos');
      if (category === CAT.NEG_INT) return !!(facts.isInteger && facts.sign === 'neg');
      if (category === CAT.NON_NEG_INT) return !!(facts.isInteger && facts.sign !== 'neg');
      if (category === CAT.INT) return !!facts.isInteger;
      if (category === CAT.RATIONAL) return !!facts.isRational;
      if (category === CAT.IRRATIONAL) return !!(facts.isReal && !facts.isRational);
      if (category === CAT.REAL) return !!facts.isReal;
      if (category === CAT.NON_REAL) return !facts.isReal;
      return false;
    }
    function validateOptions(correctLabel, distractorLabels, facts) {
      if (!isCategoryTrue(correctLabel, facts)) return false;
      for (let i = 0; i < distractorLabels.length; i++) if (isCategoryTrue(distractorLabels[i], facts)) return false;
      return new Set([correctLabel].concat(distractorLabels)).size === 4;
    }
    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function nonZeroRandInt(min, max) { let value = 0; while (value === 0) value = randInt(min, max); return value; }
    function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = b; b = a % b; a = t; } return a || 1; }
    function simplifySquareRoot(n) {
      if (n <= 0) return { outside: 0, inside: 0 };
      let outside = 1; let inside = n;
      for (let d = 2; d * d <= inside; d++) while (inside % (d * d) === 0) { outside *= d; inside /= d * d; }
      return { outside: outside, inside: inside };
    }
    function shuffleArray(array) {
      const copy = array.slice();
      for (let i = copy.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const temp = copy[i]; copy[i] = copy[j]; copy[j] = temp; }
      return copy;
    }
    function polynomialText(a, b, c) {
      let text = (a === 1 ? '' : a === -1 ? '-' : String(a)) + 'x^2';
      if (b > 0) text += ' + ' + (b === 1 ? '' : b) + 'x'; else text += ' - ' + (Math.abs(b) === 1 ? '' : Math.abs(b)) + 'x';
      if (c > 0) text += ' + ' + c; else text += ' - ' + Math.abs(c);
      return text;
    }
    function generatePolynomialProblem() {
      const type = randInt(1, 3);
      if (type === 1) {
        const a1 = randInt(1, 4), b1 = nonZeroRandInt(-4, 4), c1 = nonZeroRandInt(-5, 5);
        const a2 = nonZeroRandInt(-3, 3), b2 = nonZeroRandInt(-4, 4), c2 = nonZeroRandInt(-5, 5);
        const sign = Math.random() < 0.5 ? '+' : '-';
        const fa2 = sign === '+' ? a2 : -a2, fb2 = sign === '+' ? b2 : -b2, fc2 = sign === '+' ? c2 : -c2;
        const resA = a1 + fa2, resB = b1 + fb2, resC = c1 + fc2;
        let target = [];
        if (resA) target.push(resA === 1 ? 'x^2' : resA === -1 ? '-x^2' : String(resA) + 'x^2');
        if (resB) target.push((resB > 0 ? (target.length ? '+' : '') : '-') + (Math.abs(resB) === 1 ? 'x' : String(Math.abs(resB)) + 'x'));
        if (resC || !target.length) target.push((resC > 0 ? (target.length ? '+' : '') : '-') + Math.abs(resC));
        return { latex: '$$ (' + polynomialText(a1, b1, c1) + ') ' + sign + ' (' + polynomialText(a2, b2, c2) + ') $$', rawFormula: '(' + polynomialText(a1, b1, c1) + ') ' + sign + ' (' + polynomialText(a2, b2, c2) + ')', target: target.join(''), hint: '先展開括號，再按降冪合併 x^2、x 及常數項。' };
      }
      if (type === 2) {
        const a = nonZeroRandInt(-5, 5); let b = nonZeroRandInt(-5, 5); while (b === -a) b = nonZeroRandInt(-5, 5);
        const B = a + b, C = a * b; let target = 'x^2';
        if (B > 0) target += '+' + (B === 1 ? '' : B) + 'x'; else if (B < 0) target += '-' + (Math.abs(B) === 1 ? '' : Math.abs(B)) + 'x';
        if (C > 0) target += '+' + C; else if (C < 0) target += '-' + Math.abs(C);
        const pA = '(x ' + (a > 0 ? '+' : '-') + ' ' + Math.abs(a) + ')', pB = '(x ' + (b > 0 ? '+' : '-') + ' ' + Math.abs(b) + ')';
        return { latex: '$$ ' + pA + pB + ' $$', rawFormula: pA + pB, target: target, hint: '使用 (x+a)(x+b)=x^2+(a+b)x+ab 展開。' };
      }
      const a = randInt(1, 3), b = nonZeroRandInt(-4, 4), A = a * a, B = 2 * a * b, C = b * b;
      const base = (a === 1 ? 'x' : a + 'x') + ' ' + (b > 0 ? '+' : '-') + ' ' + Math.abs(b);
      return { latex: '$$ (' + base + ')^2 $$', rawFormula: '(' + base + ')^2', target: (A === 1 ? 'x^2' : A + 'x^2') + (B > 0 ? '+' + B : '-' + Math.abs(B)) + '+' + C, hint: '套用 (p+q)^2=p^2+2pq+q^2。' };
    }
    function generateRadicalProblem() {
      const type = randInt(1, 3), bases = [2, 3, 5], base = bases[randInt(0, bases.length - 1)];
      if (type === 1) {
        const c1 = randInt(1, 3), c2 = randInt(1, 4), n1 = c1 * c1 * base, n2 = c2 * c2 * base, sign = Math.random() < 0.5 ? '+' : '-', coefficient = sign === '+' ? c1 + c2 : c1 - c2;
        const target = coefficient === 0 ? '0' : coefficient === 1 ? 'sqrt(' + base + ')' : coefficient === -1 ? '-sqrt(' + base + ')' : coefficient + 'sqrt(' + base + ')';
        return { latex: '$$ \\sqrt{' + n1 + '} ' + sign + ' \\sqrt{' + n2 + '} $$', rawFormula: '\\sqrt{' + n1 + '} ' + sign + ' \\sqrt{' + n2 + '}', target: target, hint: '先把兩個根式化為同類根式，再合併係數。' };
      }
      if (type === 2) {
        const p1 = randInt(2, 6), p2 = randInt(2, 6), product = p1 * p2, root = simplifySquareRoot(product);
        const target = root.inside === 1 ? String(root.outside) : root.outside === 1 ? 'sqrt(' + root.inside + ')' : root.outside + 'sqrt(' + root.inside + ')';
        return { latex: '$$ \\sqrt{' + p1 + '} \\times \\sqrt{' + p2 + '} $$', rawFormula: '\\sqrt{' + p1 + '} \\times \\sqrt{' + p2 + '}', target: target, hint: '先合併為 √' + product + '，再化成最簡根式。' };
      }
      const a = randInt(2, 8), b = [2, 3, 5][randInt(0, 2)], divisor = gcd(a, b), top = a / divisor, bottom = b / divisor;
      const target = bottom === 1 ? (top === 1 ? 'sqrt(' + b + ')' : top + 'sqrt(' + b + ')') : (top === 1 ? 'sqrt(' + b + ')/' + bottom : top + 'sqrt(' + b + ')/' + bottom);
      return { latex: '$$ \\frac{' + a + '}{\\sqrt{' + b + '}} $$', rawFormula: '\\frac{' + a + '}{\\sqrt{' + b + '}}', target: target, hint: '分子分母同乘 √' + b + '，再有理化分母。' };
    }
    function complexTarget(real, imaginary) {
      if (real && imaginary) return String(real) + (imaginary > 0 ? '+' : '') + (imaginary === 1 ? '' : imaginary === -1 ? '-' : imaginary) + 'i';
      if (real) return String(real);
      if (imaginary === 1) return 'i';
      if (imaginary === -1) return '-i';
      return String(imaginary) + 'i';
    }
    function complexText(real, imaginary) { return '(' + real + (imaginary > 0 ? '+' : '-') + Math.abs(imaginary) + 'i)'; }
    function generateComplexProblem() {
      const type = randInt(1, 3);
      if (type === 3) {
        const power = randInt(15, 99), remainder = power % 4, target = remainder === 0 ? '1' : remainder === 1 ? 'i' : remainder === 2 ? '-1' : '-i';
        return { latex: '$$ \\text{化簡 } i^{' + power + '} $$', rawFormula: '\\text{化簡 } i^{' + power + '}', target: target, hint: '利用 i^4=1 的週期，指數除以 4 取餘數。' };
      }
      const a = nonZeroRandInt(-6, 6), b = nonZeroRandInt(-6, 6), c = nonZeroRandInt(-6, 6), d = nonZeroRandInt(-6, 6);
      if (type === 1) {
        const sign = Math.random() < 0.5 ? '+' : '-', real = sign === '+' ? a + c : a - c, imaginary = sign === '+' ? b + d : b - d;
        return { latex: '$$ ' + complexText(a, b) + ' ' + sign + ' ' + complexText(c, d) + ' $$', rawFormula: complexText(a, b) + ' ' + sign + ' ' + complexText(c, d), target: complexTarget(real, imaginary), hint: '實部與虛部分別相加或相減。' };
      }
      const real = a * c - b * d, imaginary = a * d + b * c;
      return { latex: '$$ ' + complexText(a, b) + complexText(c, d) + ' $$', rawFormula: complexText(a, b) + complexText(c, d), target: complexTarget(real, imaginary), hint: '展開後使用 i^2=-1，再整理實部及虛部。' };
    }
    function generateRawNumberSystemCandidate() {
      const subtype = randInt(1, 6), candidate = { numLatex: '', correctCategory: '', distractors: [], hintText: '', facts: { isReal: false, isRational: false, isInteger: false, sign: null } };
      if (subtype === 1) {
        const kind = randInt(1, 4);
