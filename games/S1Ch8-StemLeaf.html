<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌿 幹葉圖工具 - Ch8 統計</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: linear-gradient(135deg, #48bb78, #38a169); min-height: 100vh; padding: 20px; }
        .game-container { max-width: 800px; margin: 0 auto; background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .game-header { text-align: center; margin-bottom: 25px; }
        .game-header h1 { color: #276749; font-size: 1.8rem; margin-bottom: 8px; }
        .game-header p { color: #666; }
        .input-section { background: #f0fff4; border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 2px solid #9ae6b4; }
        .input-section h3 { color: #276749; margin-bottom: 12px; }
        .input-row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
        .data-input { flex: 1; min-width: 200px; padding: 12px 16px; border: 2px solid #9ae6b4; border-radius: 10px; font-size: 1rem; font-family: inherit; }
        .data-input:focus { outline: none; border-color: #48bb78; }
        .config-row { display: flex; gap: 15px; margin-bottom: 12px; flex-wrap: wrap; }
        .config-item { display: flex; align-items: center; gap: 8px; }
        .config-item label { font-weight: 600; color: #276749; font-size: 0.9rem; }
        .config-item select, .config-item input { padding: 8px 12px; border: 2px solid #9ae6b4; border-radius: 8px; font-size: 0.95rem; }
        .game-btn { background: linear-gradient(135deg, #48bb78, #38a169); color: white; border: none; padding: 12px 28px; border-radius: 25px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: transform 0.2s; font-family: inherit; }
        .game-btn:hover { transform: scale(1.05); }
        .game-btn.secondary { background: #e0e0e0; color: #555; }
        .output-section { background: #f8f9fa; border-radius: 16px; padding: 25px; border: 2px solid #e0e0e0; }
        .output-title { color: #276749; font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; text-align: center; }
        .stem-leaf-display { font-family: 'Courier New', monospace; font-size: 1.4rem; background: white; padding: 20px 30px; border-radius: 12px; border: 3px solid #48bb78; display: inline-block; min-width: 300px; line-height: 2; }
        .stem-leaf-display .stem { font-weight: bold; color: #276749; min-width: 40px; display: inline-block; text-align: right; padding-right: 10px; }
        .stem-leaf-display .leaf { color: #333; padding-left: 5px; }
        .stem-leaf-display .leaf-group { display: flex; gap: 0; }
        .legend { display: flex; justify-content: center; gap: 20px; margin: 15px 0; font-size: 0.9rem; color: #555; }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-stem { background: #276749; color: white; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        .legend-leaf { background: #48bb78; color: white; padding: 2px 8px; border-radius: 4px; }
        .back-section { margin-top: 20px; text-align: center; }
        .back-section a { color: #276749; text-decoration: none; font-weight: 600; }
        .back-section a:hover { text-decoration: underline; }
        .error-msg { background: #fed7d7; color: #c53030; padding: 12px; border-radius: 8px; margin-top: 10px; display: none; }
        .sample-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .sample-btn { padding: 6px 14px; background: #e8f5e9; color: #276749; border: 1px solid #9ae6b4; border-radius: 15px; cursor: pointer; font-size: 0.85rem; font-family: inherit; }
        .sample-btn:hover { background: #c8e6c9; }
        .stats-row { display: flex; justify-content: center; gap: 30px; margin-top: 15px; }
        .stat-item { text-align: center; }
        .stat-item .val { font-size: 1.5rem; font-weight: bold; color: #276749; }
        .stat-item .label { font-size: 0.8rem; color: #666; }
        .freq-table-simple { width: 100%; border-collapse: collapse; margin: 15px 0; }
        .freq-table-simple th, .freq-table-simple td { border: 1px solid #ddd; padding: 8px 12px; text-align: center; }
        .freq-table-simple th { background: #48bb78; color: white; }
        .freq-table-simple tr:nth-child(even) { background: #f0fff4; }
        .output-center { text-align: center; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>🌿 幹葉圖工具</h1>
            <p>輸入數據，自動生成幹葉圖和背靠背幹葉圖</p>
        </div>

        <div class="input-section">
            <h3>📝 輸入數據</h3>
            <div class="input-row">
                <input type="text" class="data-input" id="data-input" placeholder="例如：8, 12, 7, 15, 9, 11, 6, 14, 10, 13, 7, 11">
            </div>
            <div class="sample-btns">
                <button class="sample-btn" onclick="loadSample('basic')">📌 基礎示例（12人引體上升）</button>
                <button class="sample-btn" onclick="loadSample('test')">📝 測驗分數示例</button>
                <button class="sample-btn" onclick="loadSample('compare')">🔄 背靠背示例（兩組比較）</button>
                <button class="sample-btn" onclick="loadSample('height')">📏 身高示例（cm）</button>
            </div>

            <div class="config-row" style="margin-top: 15px;">
                <div class="config-item">
                    <label>🌿 幹位於：</label>
                    <select id="stem-pos">
                        <option value="auto">自動</option>
                        <option value="1">個位（葉=個位）</option>
                        <option value="2">十位（葉=個位）</option>
                        <option value="3">百位（葉=十+個位）</option>
                    </select>
                </div>
                <div class="config-item">
                    <label>🔢 小數位：</label>
                    <select id="decimal">
                        <option value="0">整數</option>
                        <option value="1">1位小數</option>
                        <option value="2">2位小數</option>
                    </select>
                </div>
            </div>

            <div id="compare-section" style="display: none; margin-top: 15px;">
                <h3 style="color: #805ad5;">🔄 第二組數據（背靠背）</h3>
                <input type="text" class="data-input" id="data2-input" placeholder="例如：4, 5, 6, 7, 8, 9, 10, 12">
            </div>

            <div style="display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap;">
                <button class="game-btn" onclick="generate()">🌿 生成幹葉圖</button>
                <button class="game-btn secondary" onclick="toggleCompare()">🔄 背靠背模式</button>
                <button class="game-btn secondary" onclick="clearAll()">🗑️ 清除</button>
            </div>
            <div class="error-msg" id="error-msg"></div>
        </div>

        <div class="output-section" id="output-section" style="display: none;">
            <div class="output-center">
                <div class="output-title" id="output-title">🌿 幹葉圖</div>
                <div class="stem-leaf-display" id="stem-leaf-display"></div>
                <div class="legend">
                    <div class="legend-item"><span class="legend-stem">🌿</span> = 莖（莖位）</div>
                    <div class="legend-item"><span class="legend-leaf">🍃</span> = 葉（葉位）</div>
                </div>
                <div class="stats-row" id="stats-row"></div>
                <div style="margin-top: 20px;">
                    <table class="freq-table-simple" id="freq-table" style="display: none;">
                        <thead><tr><th>莖值</th><th>葉（按大小排列）</th><th>頻數</th></tr></thead>
                        <tbody id="freq-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="back-section">
            <a href="../index.html">← 返回 Ch8 主頁</a>
        </div>
    </div>

    <script>
        let compareMode = false;

        function toggleCompare() {
            compareMode = !compareMode;
            document.getElementById('compare-section').style.display = compareMode ? 'block' : 'none';
            document.getElementById('output-section').style.display = 'none';
        }

        function loadSample(type) {
            const samples = {
                basic: { data: '8, 12, 7, 15, 9, 11, 6, 14, 10, 13, 7, 11', stem: 1, decimal: 0 },
                test: { data: '45, 52, 38, 67, 73, 41, 55, 48, 62, 79, 36, 58, 44, 71, 65, 39, 53, 47, 68, 74', stem: 2, decimal: 0 },
                compare: { data: '7, 8, 9, 11, 12, 13, 15', data2: '4, 5, 6, 7, 8, 9, 10, 12', stem: 1, decimal: 0 },
                height: { data: '162, 158, 165, 171, 155, 168, 160, 172, 157, 163, 166, 159, 164, 170, 156', stem: 2, decimal: 0 }
            };
            const s = samples[type];
            document.getElementById('data-input').value = s.data;
            document.getElementById('stem-pos').value = s.stem;
            document.getElementById('decimal').value = s.decimal;
            if (s.data2) {
                compareMode = true;
                document.getElementById('compare-section').style.display = 'block';
                document.getElementById('data2-input').value = s.data2;
            } else {
                compareMode = false;
                document.getElementById('compare-section').style.display = 'none';
            }
            document.getElementById('output-section').style.display = 'none';
        }

        function parseData(str, decimal) {
            const parts = str.split(/[,，、\s]+/).map(s => s.trim()).filter(s => s !== '');
            const nums = [];
            for (const p of parts) {
                const n = parseFloat(p);
                if (isNaN(n)) {
                    showError(`無法解析：「${p}」`);
                    return null;
                }
                nums.push(n);
            }
            if (nums.length === 0) {
                showError('請輸入數據');
                return null;
            }
            return nums;
        }

        function getStemLeaf(data, decimal, stemPos) {
            const multiplier = Math.pow(10, decimal);
            const scaled = data.map(n => Math.round(n * multiplier));
            
            let divisor;
            if (stemPos === 'auto') {
                const max = Math.max(...scaled);
                const min = Math.min(...scaled);
                if (max <= 99 && min >= 0) divisor = 10;
                else if (max <= 999 && min >= 0) divisor = 100;
                else divisor = 1000;
            } else {
                divisor = Math.pow(10, parseInt(stemPos) + decimal);
            }

            const leaves = {};
            for (const n of scaled) {
                const stem = Math.floor(n / divisor);
                const leaf = n % divisor;
                if (!leaves[stem]) leaves[stem] = [];
                leaves[stem].push(leaf);
            }

            const stems = Object.keys(leaves).map(Number).sort((a, b) => a - b);
            const result = [];
            for (const s of stems) {
                leaves[s].sort((a, b) => a - b);
                const leavesStr = leaves[s].map(l => String(l).padStart(decimal, '0')).join(' ');
                result.push({ stem: s, leaves: leaves[s], leavesStr, freq: leaves[s].length });
            }

            return { result, divisor, decimal };
        }

        function formatStem(stem, divisor, decimal) {
            if (decimal > 0) {
                return stem.toFixed(decimal);
            }
            return String(stem);
        }

        function generate() {
            document.getElementById('error-msg').style.display = 'none';
            document.getElementById('output-section').style.display = 'block';

            const data = parseData(document.getElementById('data-input').value, parseInt(document.getElementById('decimal').value));
            if (!data) return;

            const stemPos = document.getElementById('stem-pos').value;
            const decimal = parseInt(document.getElementById('decimal').value);

            if (compareMode) {
                const data2 = parseData(document.getElementById('data2-input').value, decimal);
                if (!data2) return;
                generateBackToBack(data, data2, stemPos, decimal);
            } else {
                generateSingle(data, stemPos, decimal);
            }
        }

        function generateSingle(data, stemPos, decimal) {
            const { result, divisor } = getStemLeaf(data, decimal, stemPos);

            let html = '';
            for (const row of result) {
                html += `<div><span class="stem">${formatStem(row.stem, divisor, decimal)} |</span> <span class="leaf">${row.leavesStr}</span></div>`;
            }

            document.getElementById('output-title').textContent = '🌿 幹葉圖';
            document.getElementById('stem-leaf-display').innerHTML = html;

            // Stats
            const sorted = [...data].sort((a, b) => a - b);
            const min = sorted[0];
            const max = sorted[sorted.length - 1];
            const mean = (data.reduce((a, b) => a + b, 0) / data.length).toFixed(1);

            document.getElementById('stats-row').innerHTML = `
                <div class="stat-item"><div class="val">${min}</div><div class="label">最小值</div></div>
                <div class="stat-item"><div class="val">${max}</div><div class="label">最大值</div></div>
                <div class="stat-item"><div class="val">${data.length}</div><div class="label">數據數量</div></div>
                <div class="stat-item"><div class="val">${mean}</div><div class="label">平均值</div></div>
            `;

            // Freq table
            const tbody = document.getElementById('freq-tbody');
            tbody.innerHTML = '';
            for (const row of result) {
                tbody.innerHTML += `<tr><td>${formatStem(row.stem, divisor, decimal)}</td><td>${row.leavesStr}</td><td>${row.freq}</td></tr>`;
            }
            document.getElementById('freq-table').style.display = 'table';
        }

        function generateBackToBack(data1, data2, stemPos, decimal) {
            const { result: r1 } = getStemLeaf(data1, decimal, stemPos);
            const { result: r2, divisor } = getStemLeaf(data2, decimal, stemPos);

            const allStems = [...new Set([...r1.map(x => x.stem), ...r2.map(x => x.stem)])].sort((a, b) => a - b);

            let html = '';
            for (const s of allStems) {
                const row1 = r1.find(r => r.stem === s) || { leavesStr: '' };
                const row2 = r2.find(r => r.stem === s) || { leavesStr: '' };
                const leaves2 = row2.leaves ? row2.leaves.map(l => String(l).padStart(decimal, '0')).reverse().join(' ') : '';
                const leaves1 = row1.leaves ? row1.leaves.map(l => String(l).padStart(decimal, '0')).join(' ') : '';
                html += `<div><span class="leaf">${leaves2}</span> <span class="stem">| ${formatStem(s, divisor, decimal)} |</span> <span class="leaf">${leaves1}</span></div>`;
            }

            document.getElementById('output-title').textContent = '🔄 背靠背幹葉圖';
            document.getElementById('stem-leaf-display').innerHTML = html;
            document.getElementById('stats-row').innerHTML = `
                <div class="stat-item"><div class="val">${data1.length}</div><div class="label">A組數量</div></div>
                <div class="stat-item"><div class="val">${data2.length}</div><div class="label">B組數量</div></div>
                <div class="stat-item"><div class="val">${Math.min(...data1)}-${Math.max(...data1)}</div><div class="label">A組範圍</div></div>
                <div class="stat-item"><div class="val">${Math.min(...data2)}-${Math.max(...data2)}</div><div class="label">B組範圍</div></div>
            `;
            document.getElementById('freq-table').style.display = 'none';
        }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = '❌ ' + msg;
            el.style.display = 'block';
        }

        function clearAll() {
            document.getElementById('data-input').value = '';
            document.getElementById('data2-input').value = '';
            document.getElementById('output-section').style.display = 'none';
            document.getElementById('error-msg').style.display = 'none';
        }
    </script>
</body>
</html>
