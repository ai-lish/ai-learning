<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 棒形圖與圓形圖工具 - Ch8 統計</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: linear-gradient(135deg, #ed8936, #dd6b20); min-height: 100vh; padding: 20px; }
        .game-container { max-width: 900px; margin: 0 auto; background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .game-header { text-align: center; margin-bottom: 25px; }
        .game-header h1 { color: #c05621; font-size: 1.7rem; margin-bottom: 8px; }
        .game-header p { color: #666; }
        .input-section { background: #fffaf0; border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 2px solid #febd33; }
        .input-section h3 { color: #c05621; margin-bottom: 12px; }
        .data-format { background: #fff3cd; border-radius: 8px; padding: 10px 14px; margin-bottom: 15px; font-size: 0.88rem; color: #856404; }
        .data-format strong { color: #c05621; }
        .input-row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
        .data-input { flex: 1; min-width: 220px; padding: 12px 16px; border: 2px solid #febd33; border-radius: 10px; font-size: 1rem; font-family: inherit; }
        .data-input:focus { outline: none; border-color: #ed8936; }
        .labels-input { width: 100%; padding: 12px 16px; border: 2px solid #febd33; border-radius: 10px; font-size: 1rem; font-family: inherit; margin-bottom: 12px; }
        .labels-input:focus { outline: none; border-color: #ed8936; }
        .sample-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .sample-btn { padding: 6px 14px; background: #fff3cd; color: #c05621; border: 1px solid #febd33; border-radius: 15px; cursor: pointer; font-size: 0.85rem; font-family: inherit; }
        .sample-btn:hover { background: #febd33; }
        .chart-type-row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .chart-type-btn { flex: 1; min-width: 120px; padding: 12px; border: 2px solid #febd33; border-radius: 12px; background: white; color: #c05621; cursor: pointer; font-weight: 600; font-size: 1rem; font-family: inherit; text-align: center; transition: all 0.2s; }
        .chart-type-btn:hover { background: #fff3cd; }
        .chart-type-btn.active { background: linear-gradient(135deg, #ed8936, #dd6b20); color: white; border-color: #ed8936; }
        .game-btn { background: linear-gradient(135deg, #ed8936, #dd6b20); color: white; border: none; padding: 12px 28px; border-radius: 25px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: transform 0.2s; font-family: inherit; }
        .game-btn:hover { transform: scale(1.05); }
        .game-btn.secondary { background: #e0e0e0; color: #555; }
        .output-section { background: #f8f9fa; border-radius: 16px; padding: 25px; border: 2px solid #e0e0e0; }
        .output-title { color: #c05621; font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; text-align: center; }
        .chart-container { background: white; border-radius: 12px; padding: 20px; border: 2px solid #fea500; }
        .bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 220px; padding: 10px 10px 40px 10px; border-bottom: 2px solid #333; position: relative; min-height: 220px; }
        .bar-wrapper { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; position: relative; }
        .bar { width: 100%; max-width: 60px; background: linear-gradient(to top, #ed8936, #f6ad55); border-radius: 6px 6px 0 0; transition: height 0.5s; position: absolute; bottom: 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 5px; color: white; font-weight: bold; font-size: 0.85rem; min-height: 20px; }
        .bar-label { position: absolute; bottom: -28px; font-size: 0.78rem; color: #555; text-align: center; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bar-value { position: absolute; top: -22px; font-size: 0.8rem; color: #c05621; font-weight: bold; }
        .y-axis { position: absolute; left: -30px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: space-between; font-size: 0.75rem; color: #666; }
        .pie-chart-container { display: flex; gap: 30px; align-items: center; justify-content: center; flex-wrap: wrap; }
        .pie-chart { width: 220px; height: 220px; border-radius: 50%; position: relative; transition: all 0.5s; flex-shrink: 0; }
        .pie-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70px; height: 70px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #c05621; font-size: 1rem; }
        .pie-legend { display: flex; flex-direction: column; gap: 8px; }
        .pie-legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; }
        .pie-legend-color { width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0; }
        .pie-legend-pct { color: #888; font-size: 0.8rem; margin-left: auto; padding-left: 10px; }
        .freq-info { background: #fff3cd; border-radius: 8px; padding: 12px 16px; margin-top: 15px; font-size: 0.88rem; color: #856404; line-height: 1.8; }
        .back-section { text-align: center; margin-top: 20px; }
        .back-section a { color: #c05621; text-decoration: none; font-weight: 600; }
        .back-section a:hover { text-decoration: underline; }
        .error-msg { background: #fed7d7; color: #c53030; padding: 12px; border-radius: 8px; margin-top: 10px; display: none; }
        .stats-row { display: flex; justify-content: center; gap: 25px; margin-top: 15px; flex-wrap: wrap; }
        .stat-item { text-align: center; }
        .stat-item .val { font-size: 1.3rem; font-weight: bold; color: #c05621; }
        .stat-item .label { font-size: 0.78rem; color: #666; }
        @media (max-width: 600px) {
            .bar-chart { height: 180px; }
            .pie-chart-container { flex-direction: column; }
            .pie-chart { width: 180px; height: 180px; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>📊 棒形圖與圓形圖工具</h1>
            <p>輸入數據，自動生成棒形圖和圓形圖</p>
        </div>

        <div class="input-section">
            <h3>📝 輸入數據</h3>
            <div class="data-format">
                <strong>📌 格式：</strong>輸入數值，用逗號或空格分開<br>
                例如：<code>18, 12, 15, 9, 6</code>（籃球18人、足球12人、游泳15人、田徑9人、羽毛球6人）
            </div>
            <div class="input-row">
                <input type="text" class="data-input" id="data-input" placeholder="例如：18, 12, 15, 9, 6">
            </div>
            <input type="text" class="labels-input" id="labels-input" placeholder="標籤（可選，留空則用 A/B/C/D...）：例如：籃球, 足球, 游泳, 田徑, 羽毛球">
            <div class="sample-btns">
                <button class="sample-btn" onclick="loadSample('food')">🍜 最喜愛小食</button>
                <button class="sample-btn" onclick="loadSample('travel')">✈️ 最喜愛旅遊城市</button>
                <button class="sample-btn" onclick="loadSample('blood')">🩸 血型分佈</button>
                <button class="sample-btn" onclick="loadSample('books')">📚 圖書館書架</button>
            </div>

            <div class="chart-type-row">
                <button class="chart-type-btn active" id="btn-bar" onclick="setChartType('bar')">📊 棒形圖</button>
                <button class="chart-type-btn" id="btn-pie" onclick="setChartType('pie')">🥧 圓形圖</button>
                <button class="chart-type-btn" id="btn-both" onclick="setChartType('both')">📈 兩者皆顯示</button>
            </div>

            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button class="game-btn" onclick="generate()">📈 生成圖表</button>
                <button class="game-btn secondary" onclick="clearAll()">🗑️ 清除</button>
            </div>
            <div class="error-msg" id="error-msg"></div>
        </div>

        <div class="output-section" id="output-section" style="display: none;">
            <div class="output-title" id="output-title">📊 統計圖表</div>
            <div class="chart-container">
                <div id="bar-container" style="display: none;">
                    <div style="font-size: 0.85rem; color: #888; margin-bottom: 8px; text-align: center;">Y軸（頻數）→</div>
                    <div class="bar-chart" id="bar-chart"></div>
                    <div style="font-size: 0.85rem; color: #888; text-align: center;">類別 →</div>
                </div>
                <div id="pie-container" style="display: none;">
                    <div class="pie-chart-container">
                        <div class="pie-chart" id="pie-chart"></div>
                        <div class="pie-legend" id="pie-legend"></div>
                    </div>
                </div>
            </div>

            <div class="stats-row" id="stats-row"></div>

            <div class="freq-info" id="freq-info"></div>
        </div>

        <div class="back-section">
            <a href="../index.html">← 返回 Ch8 主頁</a>
        </div>
    </div>

    <script>
        let chartType = 'bar';
        const COLORS = ['#ed8936', '#48bb78', '#667eea', '#f56565', '#9f7aea', '#38b2ac', '#ecc94b', '#fc8181', '#4fd1c5'];

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function setChartType(type) {
            chartType = type;
            document.querySelectorAll('.chart-type-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + type).classList.add('active');
        }

        function loadSample(type) {
            const samples = {
                food: { data: '25, 16, 11, 20, 8', labels: '咖喱魚蛋, 雞蛋仔, 碗仔翅, 燒賣, 格仔餅' },
                travel: { data: '20, 15, 12, 10, 3', labels: '東京, 台北, 首爾, 曼谷, 大阪' },
                blood: { data: '80, 60, 40, 20', labels: 'O型, A型, B型, AB型' },
                books: { data: '35, 28, 42, 18, 30, 22, 15, 25, 20', labels: '000總類, 100哲學, 200宗教, 300自然科學, 400應用科學, 500社會科學, 600史地, 800語文, 900美術' }
            };
            const s = samples[type];
            document.getElementById('data-input').value = s.data;
            document.getElementById('labels-input').value = s.labels;
            document.getElementById('output-section').style.display = 'none';
        }

        function parseData(str) {
            const parts = str.split(/[,，、\s]+/).map(s => s.trim()).filter(s => s !== '');
            const nums = [];
            for (const p of parts) {
                const n = parseFloat(p);
                if (isNaN(n) || n < 0) {
                    showError(`無法解析：「${p}」`);
                    return null;
                }
                nums.push(n);
            }
            if (nums.length === 0) { showError('請輸入數據'); return null; }
            if (nums.length > 9) { showError('最多9個類別'); return null; }
            return nums;
        }

        function parseLabels(str, count) {
            if (!str.trim()) {
                return Array.from({ length: count }, (_, i) => String.fromCharCode(65 + i));
            }
            const parts = str.split(/[,，、]/).map(s => s.trim()).filter(s => s !== '');
            if (parts.length < count) {
                while (parts.length < count) parts.push(String.fromCharCode(64 + parts.length + 1));
            }
            return parts.slice(0, count);
        }

        function generate() {
            document.getElementById('error-msg').style.display = 'none';
            document.getElementById('output-section').style.display = 'block';

            const data = parseData(document.getElementById('data-input').value);
            if (!data) return;

            const labels = parseLabels(document.getElementById('labels-input').value, data.length);
            const total = data.reduce((a, b) => a + b, 0);

            const barContainer = document.getElementById('bar-container');
            const pieContainer = document.getElementById('pie-container');

            barContainer.style.display = (chartType === 'bar' || chartType === 'both') ? 'block' : 'none';
            pieContainer.style.display = (chartType === 'pie' || chartType === 'both') ? 'flex' : 'none';

            if (chartType === 'bar' || chartType === 'both') drawBarChart(data, labels);
            if (chartType === 'pie' || chartType === 'both') drawPieChart(data, labels, total);

            // Stats
            const max = Math.max(...data);
            const min = Math.min(...data);
            const mean = (total / data.length).toFixed(1);
            document.getElementById('stats-row').innerHTML = `
                <div class="stat-item"><div class="val">${total}</div><div class="label">總計</div></div>
                <div class="stat-item"><div class="val">${data.length}</div><div class="label">類別數</div></div>
                <div class="stat-item"><div class="val">${max}</div><div class="label">最大值</div></div>
                <div class="stat-item"><div class="val">${min}</div><div class="label">最小值</div></div>
                <div class="stat-item"><div class="val">${mean}</div><div class="label">平均</div></div>
            `;

            // Freq info
            let freqHtml = '<strong>📋 頻數分佈：</strong><br>';
            data.forEach((v, i) => {
                const pct = ((v / total) * 100).toFixed(1);
                const angle = ((v / total) * 360).toFixed(1);
                freqHtml += `${escapeHtml(labels[i])}：頻數 ${v}，佔比 ${pct}%，圓心角 ${angle}°<br>`;
            });
            freqHtml += '<br>💡 圓心角公式：（頻數 ÷ 總數）× 360°';
            document.getElementById('freq-info').innerHTML = freqHtml;
        }

        function drawBarChart(data, labels) {
            const max = Math.max(...data);
            const container = document.getElementById('bar-chart');
            container.innerHTML = '';

            data.forEach((v, i) => {
                const pct = max > 0 ? (v / max) * 100 : 0;
                const wrapper = document.createElement('div');
                wrapper.className = 'bar-wrapper';

                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = Math.max(pct, 5) + '%';
                bar.style.background = `linear-gradient(to top, ${COLORS[i % COLORS.length]}, ${COLORS[i % COLORS.length]}cc)`;
                bar.innerHTML = `<span class="bar-value">${v}</span>`;

                const label = document.createElement('div');
                label.className = 'bar-label';
                label.textContent = labels[i];
                label.title = labels[i];

                wrapper.appendChild(bar);
                wrapper.appendChild(label);
                container.appendChild(wrapper);
            });
        }

        function drawPieChart(data, labels, total) {
            const pie = document.getElementById('pie-chart');
            const legend = document.getElementById('pie-legend');
            pie.innerHTML = '';
            legend.innerHTML = '';

            const conic = [];
            const angles = [];
            data.forEach((v, i) => {
                const angle = (v / total) * 360;
                angles.push(angle);
                conic.push(`${COLORS[i % COLORS.length]} 0deg ${angles.reduce((a, b) => a + b, 0)}deg`);
            });

            pie.style.background = `conic-gradient(${conic.join(', ')})`;

            const center = document.createElement('div');
            center.className = 'pie-center';
            center.textContent = total;
            pie.appendChild(center);

            data.forEach((v, i) => {
                const pct = ((v / total) * 100).toFixed(1);
                const item = document.createElement('div');
                item.className = 'pie-legend-item';
                item.innerHTML = `
                    <div class="pie-legend-color" style="background: ${COLORS[i % COLORS.length]};"></div>
                    <span>${escapeHtml(labels[i])}</span>
                    <span class="pie-legend-pct">${pct}%</span>
                `;
                legend.appendChild(item);
            });
        }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = '❌ ' + msg;
            el.style.display = 'block';
        }

        function clearAll() {
            document.getElementById('data-input').value = '';
            document.getElementById('labels-input').value = '';
            document.getElementById('output-section').style.display = 'none';
            document.getElementById('error-msg').style.display = 'none';
        }
    </script>
</body>
</html>
