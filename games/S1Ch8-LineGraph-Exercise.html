<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科學折線圖互動工作紙</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
        }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen text-slate-800 p-3 md:p-6 flex justify-center items-start">

    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-xl border border-slate-100">
        <!-- Header -->
        <header class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-5 text-center">
            <h1 class="text-2xl font-bold flex items-center justify-center gap-2">
                <svg class="w-7 h-7 text-yellow-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                </svg>
                科學折線圖互動工作紙
            </h1>
            <p class="text-blue-100 text-xs mt-1">中一綜合科學科 (IS) 折線圖繪圖專用練習</p>
            <div class="flex justify-center gap-2 mt-3 flex-wrap">
                <button id="btn-retry" class="px-3 py-1 bg-white/20 hover:bg-white/30 text-white text-xs font-medium rounded transition duration-200 flex items-center gap-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 15H19M9 5h14v14H9z"></path>
                    </svg>
                    重試此題
                </button>
                <button id="btn-new-question" class="px-3 py-1 bg-yellow-400 hover:bg-yellow-500 text-slate-950 text-xs font-bold rounded transition duration-200 flex items-center gap-1 shadow-sm">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    下一題 (隨機情境)
                </button>
                <button id="btn-export-pdf" class="px-3 py-1 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold rounded transition duration-200 flex items-center gap-1 shadow-sm">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                    </svg>
                    匯出 PDF 工作紙
                </button>
            </div>
        </header>

        <div class="p-4 md:p-6 space-y-6">

            <!-- SECTION 1: Scenario & Data Table -->
            <div class="bg-blue-50/70 border border-blue-100 rounded-xl p-3 md:p-4 space-y-3 md:space-y-4 sticky top-0 z-20 shadow-sm md:shadow-md">
                <div class="flex items-center gap-2">
                    <span class="px-2.5 py-0.5 bg-blue-600 text-white text-xs font-bold rounded">題目情境</span>
                    <h2 id="scenario-title" class="text-base font-bold text-blue-900">載入中...</h2>
                </div>
                <p id="scenario-desc" class="text-slate-600 text-xs md:text-sm leading-relaxed">正在產生實驗數據，請稍候...</p>
                <div class="bg-white rounded-lg border border-slate-200 overflow-hidden shadow-sm">
                    <div class="overflow-x-auto custom-scrollbar">
                        <table class="w-full text-center border-collapse text-xs md:text-sm">
                            <tbody id="data-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 軸標籤與比例尺設定列 -->
            <div class="bg-white border border-slate-200 rounded-xl shadow-sm px-3 py-3">

                <!-- 圖表標題設定 -->
                <div class="flex items-center gap-1.5 flex-wrap mb-2 pb-2 border-b border-slate-100">
                    <span class="text-[11px] font-bold text-slate-600 shrink-0">圖表標題</span>
                    <select id="select-chart-title" class="text-xs bg-white border border-slate-300 rounded px-1.5 py-1 focus:ring-2 focus:ring-blue-500 focus:outline-none flex-1 min-w-[160px]"></select>
                </div>

                <div class="flex flex-wrap items-center gap-x-4 gap-y-2">

                    <!-- X 軸設定 -->
                    <div class="flex items-center gap-1.5 flex-wrap">
                        <span class="text-[11px] font-bold text-blue-600 shrink-0">X軸</span>
                        <select id="select-x-label" class="text-xs bg-white border border-slate-300 rounded px-1.5 py-1 focus:ring-2 focus:ring-blue-500 focus:outline-none max-w-[80px]"></select>
                        <select id="select-x-unit" class="text-xs bg-white border border-slate-300 rounded px-1.5 py-1 focus:ring-2 focus:ring-blue-500 focus:outline-none max-w-[72px]"></select>
                        <span class="text-[11px] text-slate-400 shrink-0">每格</span>
                        <span id="display-scale-x" class="text-xs font-bold text-blue-700 bg-blue-50 border border-blue-200 rounded px-2 py-1">--</span>
                        <span class="text-[10px] text-slate-400 shrink-0">(已給定) 小格=<span id="input-scale-x-sub" class="font-medium text-slate-600">--</span></span>
                    </div>

                    <div class="hidden sm:block w-px h-6 bg-slate-200 shrink-0"></div>

                    <!-- Y 軸設定 -->
                    <div class="flex items-center gap-1.5 flex-wrap">
                        <span class="text-[11px] font-bold text-indigo-600 shrink-0">Y軸</span>
                        <select id="select-y-label" class="text-xs bg-white border border-slate-300 rounded px-1.5 py-1 focus:ring-2 focus:ring-indigo-500 focus:outline-none max-w-[80px]"></select>
                        <select id="select-y-unit" class="text-xs bg-white border border-slate-300 rounded px-1.5 py-1 focus:ring-2 focus:ring-indigo-500 focus:outline-none max-w-[72px]"></select>
                        <span class="text-[11px] text-slate-400 shrink-0">每格</span>
                        <select id="select-scale-y" class="text-xs bg-white border border-slate-300 rounded px-1.5 py-1 focus:ring-2 focus:ring-indigo-500 focus:outline-none w-20 text-center"></select>
                        <span class="text-[10px] text-slate-400 shrink-0">小格=<span id="input-scale-y-sub" class="font-medium text-slate-600">--</span></span>
                    </div>

                    <button id="btn-apply-scale" class="ml-auto shrink-0 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg text-xs transition duration-150 shadow-sm whitespace-nowrap">
                        ✅ 套用至方格紙
                    </button>
                </div>
            </div>

            <!-- SECTION 2: Canvas -->
            <div class="space-y-4">
                <div class="relative bg-white border border-slate-300 rounded-xl shadow-md p-2 flex flex-col justify-center items-center" style="touch-action: none;">
                    <div class="w-full flex justify-between items-center px-2 mb-1 text-[10px] text-slate-400">
                        <span>[科學標準繪圖網格紙 6 × 6]</span>
                        <span id="coords-display">坐標: -- , --</span>
                    </div>
                    <canvas id="graph-canvas" width="600" height="640" class="w-full max-w-[560px] block cursor-crosshair border border-slate-100 bg-white" style="aspect-ratio: 600/640;"></canvas>
                </div>
            </div>

            <!-- SECTION 3: Drawing Tools -->
            <div class="grid grid-cols-3 gap-3">
                <button id="btn-toggle-plot" class="h-11 md:h-12 bg-blue-600 text-white font-bold rounded-xl text-sm transition duration-150 flex items-center justify-center gap-1.5 shadow-sm w-full">
                    <span id="plot-indicator" class="w-2.5 h-2.5 rounded-full bg-green-400 animate-pulse"></span>
                    ✕ 描點
                </button>
                <button id="btn-toggle-connect" class="h-11 md:h-12 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl border border-slate-300 text-sm transition duration-150 flex items-center justify-center gap-1.5">
                    📈 連線
                </button>
                <button id="btn-clear-points" class="h-11 md:h-12 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-xl border border-red-200 text-sm transition duration-150 flex items-center justify-center gap-1.5">
                    🗑 清除
                </button>
            </div>

            <!-- SECTION 3b: 手機描點輔助面板 -->
            <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 md:p-4 space-y-2">
                <div class="flex items-start gap-2 flex-wrap">
                    <span class="px-2 py-0.5 bg-amber-500 text-white text-xs font-bold rounded shrink-0">📱 描點輔助</span>
                    <span class="text-[11px] md:text-xs text-slate-600 leading-relaxed flex-1 min-w-[160px]">手機用家建議：直接為每個 X 選擇對應的 Y 數值，系統會自動在方格紙描點，免去手指篤位的困難。</span>
                    <button id="btn-toggle-plot-panel" class="shrink-0 px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold rounded-lg transition duration-150 shadow-sm whitespace-nowrap">
                        顯示描點輔助
                    </button>
                </div>
                <div id="plot-panel-body" class="hidden grid grid-cols-2 sm:grid-cols-3 gap-2"></div>
            </div>

            <!-- SECTION 4: Grade Button -->
            <div>
                <button id="btn-submit" class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold rounded-xl text-base transition duration-200 shadow-md flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    批改我的折線圖工作紙
                </button>
            </div>

            <!-- SECTION 5: Feedback -->
            <div id="feedback-panel" class="hidden bg-slate-50 border border-slate-200 rounded-xl p-5 shadow-inner space-y-4">
                <div class="flex items-center justify-between border-b border-slate-200 pb-3">
                    <h3 class="text-base md:text-lg font-bold text-slate-800 flex items-center gap-1.5">📊 批改評分報告</h3>
                    <div class="text-right">
                        <span class="text-2xl font-black text-indigo-600" id="total-score-display">0</span>
                        <span class="text-slate-400 text-sm font-bold"> / 5 分</span>
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="scores-container"></div>
                <div class="bg-white p-4 rounded-lg border border-slate-100 shadow-sm">
                    <h4 class="text-xs md:text-sm font-bold text-slate-700 mb-2 flex items-center gap-1">
                        <span class="text-yellow-500">💡</span> 老師的指導建議：
                    </h4>
                    <ul id="feedback-comments-list" class="space-y-2 text-xs md:text-sm text-slate-600 list-disc list-inside"></ul>
                </div>
            </div>
        </div>

        <footer class="bg-slate-100 border-t border-slate-200 p-4 text-center text-[10px] text-slate-400">
            香港中一學生折線圖互動繪圖工作紙 • 科學科自主溫習工具
        </footer>
    </div>

    <!-- HTML 工作紙預覽 Modal -->
    <div id="html-preview-modal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-2 md:p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[92vh] flex flex-col overflow-hidden">
            <div class="flex items-center justify-between px-4 py-3 border-b border-slate-200 bg-slate-50 shrink-0">
                <h3 class="text-sm font-bold text-slate-800">📄 工作紙預覽</h3>
                <div class="flex items-center gap-2">
                    <button id="btn-html-download-pdf" class="px-3 py-1.5 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold rounded-lg transition flex items-center gap-1">
                        ⬇ 下載 PDF
                    </button>
                    <button id="btn-html-preview-close" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold rounded-lg transition">
                        關閉
                    </button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto bg-slate-100 p-3" id="html-preview-body">
                <!-- 動態生成預覽內容 -->
            </div>
        </div>
    </div>

    <script>
        // --- 1. Scenario Definitions ---
        const SCENARIOS = [
            {
                id: "heating-water",
                title: "水的加熱實驗",
                description: "小敏在科學課上使用本生燈為 100 mL 的水加熱。她每隔 1 分鐘記錄一次水溫，所得數據如下。請在下方方格紙上完成一幅標準折線圖。",
                xLabel: "時間", xUnit: "分鐘", yLabel: "溫度", yUnit: "°C",
                xData: [0, 1, 2, 3, 4, 5],
                generateY: () => {
                    const startUnits = 10 + Math.floor(Math.random() * 5);
                    const maxUnits = 26 + Math.floor(Math.random() * 5);
                    return genMonotonic(startUnits, maxUnits, 6, 2, 0);
                },
                correctScaleX: 1, correctScaleY: 10,
            },
            {
                id: "saltwater-density",
                title: "鹽水體積與質量實驗",
                description: "小強使用量筒和電子天平量度不同體積鹽水的質量。以下是他的實驗記錄，請在下方方格紙上繪畫一幅標準折線圖。",
                xLabel: "體積", xUnit: "cm³", yLabel: "質量", yUnit: "g",
                xData: [0, 10, 20, 30, 40, 50],
                generateY: () => {
                    const maxUnits = 26 + Math.floor(Math.random() * 5);
                    return genMonotonic(0, maxUnits, 6, 2, 0);
                },
                correctScaleX: 10, correctScaleY: 10,
            },
            {
                id: "toy-car-distance",
                title: "玩具小車行駛距離",
                description: "志偉利用智能計時器每隔 2 秒記錄一次玩具小車的行駛總距離。請在下方繪畫折線圖顯示結果。",
                xLabel: "時間", xUnit: "秒", yLabel: "距離", yUnit: "m",
                xData: [0, 2, 4, 6, 8, 10],
                generateY: () => {
                    const maxUnits = 26 + Math.floor(Math.random() * 5);
                    return genMonotonic(0, maxUnits, 6, 0.4, 1);
                },
                correctScaleX: 2, correctScaleY: 2,
            },
            {
                id: "plant-growth",
                title: "豆芽高度生長記錄",
                description: "佩佩記錄了一株綠豆芽在十天內的高度生長情況。請為這些生長數據在下方繪畫標準折線圖。",
                xLabel: "時間", xUnit: "天", yLabel: "高度", yUnit: "cm",
                xData: [0, 2, 4, 6, 8, 10],
                generateY: () => {
                    const startUnits = 1 + Math.floor(Math.random() * 2);
                    const maxUnits = 26 + Math.floor(Math.random() * 5);
                    return genMonotonic(startUnits, maxUnits, 6, 0.4, 1);
                },
                correctScaleX: 2, correctScaleY: 2,
            }
        ];

        const ALLOWED_SCALES_BASE = [0.1, 0.2, 0.25, 0.5, 1, 2, 2.5, 5, 10, 20, 50, 100];

        function genMonotonic(startUnits, maxUnits, numPoints, unitSize, decimals) {
            const steps = numPoints - 1;
            const totalUnits = maxUnits - startUnits;
            const stepUnits = new Array(steps).fill(1);
            let rem = totalUnits - steps;
            while (rem > 0) {
                stepUnits[Math.floor(Math.random() * steps)]++;
                rem--;
            }
            const arr = [startUnits];
            for (let i = 0; i < steps; i++) arr.push(arr[i] + stepUnits[i]);
            return arr.map(u => parseFloat((u * unitSize).toFixed(decimals)));
        }

        function isNiceScale(val) {
            if (val <= 0) return false;
            let testVal = val;
            while (testVal > 5) testVal /= 10;
            while (testVal < 0.1) testVal *= 10;
            testVal = parseFloat(testVal.toFixed(4));
            return ALLOWED_SCALES_BASE.some(base => Math.abs(base - testVal) < 1e-5);
        }

        function isValidYScale(scale) {
            if (!isNiceScale(scale)) return false;
            const maxY = Math.max(...activeYData);
            if (maxY > scale * NUM_MAJOR_DIVS + 1e-9) return false;
            const sub = scale / NUM_SUB_DIVS;
            return activeYData.every(v => {
                const r = v / sub;
                return Math.abs(r - Math.round(r)) < 1e-6;
            });
        }

        // --- 2. State ---
        let currentScenario = null;
        let activeYData = [];
        let studentPlottedPoints = [];
        let tempErrorMarks = [];
        let isPlotMode = true;
        let isLineConnected = false;
        let hasGraded = false;
        let labelAttempts = 0;
        let scaleApplied = false;
        let gradeAttempts = 0;
        let chosenScaleX = null;
        let chosenScaleY = null;
        let plotPanelVisible = false;

        const canvas = document.getElementById('graph-canvas');
        const ctx = canvas.getContext('2d');
        const CANVAS_WIDTH = 600;
        const CANVAS_HEIGHT = 640;
        const OFFSET_X = 70;
        const OFFSET_Y = 530;
        const GRID_WIDTH = 500;
        const GRID_HEIGHT = 500;
        const NUM_MAJOR_DIVS = 6;
        const NUM_SUB_DIVS = 5;

        // --- 3. DOM ---
        const scenarioTitle = document.getElementById('scenario-title');
        const scenarioDesc = document.getElementById('scenario-desc');
        const dataTableBody = document.getElementById('data-table-body');
        const selectChartTitle = document.getElementById('select-chart-title');
        const selectXLabel = document.getElementById('select-x-label');
        const selectXUnit = document.getElementById('select-x-unit');
        const selectYLabel = document.getElementById('select-y-label');
        const selectYUnit = document.getElementById('select-y-unit');
        const displayScaleX = document.getElementById('display-scale-x');
        const selectScaleY = document.getElementById('select-scale-y');
        const inputScaleXSub = document.getElementById('input-scale-x-sub');
        const inputScaleYSub = document.getElementById('input-scale-y-sub');
        const btnApplyScale = document.getElementById('btn-apply-scale');
        const btnTogglePlot = document.getElementById('btn-toggle-plot');
        const btnToggleConnect = document.getElementById('btn-toggle-connect');
        const btnClearPoints = document.getElementById('btn-clear-points');
        const btnSubmit = document.getElementById('btn-submit');
        const btnRetry = document.getElementById('btn-retry');
        const btnNewQuestion = document.getElementById('btn-new-question');
        const btnExportPdf = document.getElementById('btn-export-pdf');
        const plotIndicator = document.getElementById('plot-indicator');
        const coordsDisplay = document.getElementById('coords-display');
        const feedbackPanel = document.getElementById('feedback-panel');
        const totalScoreDisplay = document.getElementById('total-score-display');
        const scoresContainer = document.getElementById('scores-container');
        const feedbackCommentsList = document.getElementById('feedback-comments-list');
        const plotPanelBody = document.getElementById('plot-panel-body');
        const btnTogglePlotPanel = document.getElementById('btn-toggle-plot-panel');
        const htmlPreviewModal = document.getElementById('html-preview-modal');
        const htmlPreviewBody = document.getElementById('html-preview-body');
        const btnHtmlDownloadPdf = document.getElementById('btn-html-download-pdf');
        const btnHtmlPreviewClose = document.getElementById('btn-html-preview-close');

        function updateSubScaleDisplay() {
            inputScaleXSub.textContent = (chosenScaleX && chosenScaleX > 0) ? parseFloat((chosenScaleX / NUM_SUB_DIVS).toFixed(4)) : '--';
            const vY = parseFloat(selectScaleY.value);
            inputScaleYSub.textContent = (!isNaN(vY) && vY > 0) ? parseFloat((vY / NUM_SUB_DIVS).toFixed(4)) : '--';
        }

        // --- 4. Init ---
        window.addEventListener('load', () => {
            loadNewQuestion();
            setupCanvasInteraction();

            [selectXLabel, selectXUnit, selectYLabel, selectYUnit].forEach(el => {
                el.addEventListener('change', drawAll);
            });

            selectChartTitle.addEventListener('change', drawAll);

            selectScaleY.addEventListener('change', () => {
                scaleApplied = false;
                chosenScaleY = parseFloat(selectScaleY.value) || null;
                updateSubScaleDisplay();
                renderPlotPanel();
                drawAll();
            });

            btnTogglePlotPanel.addEventListener('click', () => {
                plotPanelVisible = !plotPanelVisible;
                applyPlotPanelVisibility();
            });

            btnExportPdf.addEventListener('click', exportPDF);
            btnHtmlPreviewClose.addEventListener('click', () => htmlPreviewModal.classList.add('hidden'));
        });

        function applyPlotPanelVisibility() {
            if (plotPanelVisible) {
                plotPanelBody.classList.remove('hidden');
                btnTogglePlotPanel.textContent = '隱藏描點輔助';
            } else {
                plotPanelBody.classList.add('hidden');
                btnTogglePlotPanel.textContent = '顯示描點輔助';
            }
        }

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function populateDynamicDropdowns() {
            const correctXLabel = currentScenario.xLabel;
            const correctYLabel = currentScenario.yLabel;
            const correctXUnit = currentScenario.xUnit;
            const correctYUnit = currentScenario.yUnit;

            const xLabelOptions = [correctXLabel, correctYLabel];
            shuffle(xLabelOptions);
            selectXLabel.innerHTML = `<option value="">-- 變量 --</option>`;
            xLabelOptions.forEach(opt => {
                const el = document.createElement('option');
                el.value = opt; el.textContent = opt;
                selectXLabel.appendChild(el);
            });

            const yLabelOptions = [correctYLabel, correctXLabel];
            shuffle(yLabelOptions);
            selectYLabel.innerHTML = `<option value="">-- 變量 --</option>`;
            yLabelOptions.forEach(opt => {
                const el = document.createElement('option');
                el.value = opt; el.textContent = opt;
                selectYLabel.appendChild(el);
            });

            const allUnits = ["分鐘", "秒", "天", "°C", "cm³", "g", "m", "cm", "mL", "kg"];

            const otherUnitsX = allUnits.filter(u => u !== correctXUnit);
            shuffle(otherUnitsX);
            const xUnits = [correctXUnit, otherUnitsX[0]];
            shuffle(xUnits);
            selectXUnit.innerHTML = `<option value="">-- 單位 --</option>`;
            xUnits.forEach(u => {
                const el = document.createElement('option');
                el.value = u; el.textContent = `(${u})`;
                selectXUnit.appendChild(el);
            });

            const otherUnitsY = allUnits.filter(u => u !== correctYUnit);
            shuffle(otherUnitsY);
            const yUnits = [correctYUnit, otherUnitsY[0]];
            shuffle(yUnits);
            selectYUnit.innerHTML = `<option value="">-- 單位 --</option>`;
            yUnits.forEach(u => {
                const el = document.createElement('option');
                el.value = u; el.textContent = `(${u})`;
                selectYUnit.appendChild(el);
            });

            // 圖表標題選項（正確：因變量隨自變量的變化 / 干擾：次序顛倒）
            const titleOptions = [
                `${currentScenario.yLabel}隨${currentScenario.xLabel}的變化`,
                `${currentScenario.xLabel}隨${currentScenario.yLabel}的變化`
            ];
            shuffle(titleOptions);
            selectChartTitle.innerHTML = `<option value="">-- 選擇標題 --</option>`;
            titleOptions.forEach(opt => {
                const el = document.createElement('option');
                el.value = opt; el.textContent = opt;
                selectChartTitle.appendChild(el);
            });
        }

        function populateScaleYDropdown() {
            const correct = currentScenario.correctScaleY;
            const maxY = Math.max(...activeYData);
            const capacity = maxY / NUM_MAJOR_DIVS;
            let opts = [correct];

            const small = [...ALLOWED_SCALES_BASE].reverse().find(b => b < capacity);
            if (small) opts.push(small);

            const bigger = ALLOWED_SCALES_BASE.find(b => b > correct);
            if (bigger) opts.push(bigger);

            for (const b of ALLOWED_SCALES_BASE) {
                if (opts.length >= 4) break;
                if (!opts.includes(b) && b >= capacity && b <= correct * 5) opts.push(b);
            }

            opts = [...new Set(opts)].sort((a, b) => a - b);
            selectScaleY.innerHTML = `<option value="">-- 選擇 --</option>` +
                opts.map(v => `<option value="${v}">${v}</option>`).join('');
        }

        function renderTable() {

        function renderPlotPanel() {
            if (!scaleApplied || !chosenScaleY || chosenScaleY <= 0) {
                plotPanelBody.innerHTML = '<p class="col-span-full text-xs text-slate-500 text-center py-2">請先設定並按「✅ 套用至方格紙」，即可在此為每個 X 選擇 Y 值。</p>';
                return;
            }
            const sub = chosenScaleY / NUM_SUB_DIVS;
            const maxVal = chosenScaleY * NUM_MAJOR_DIVS;
            let vals = [];
            for (let v = 0; v <= maxVal + 1e-9; v += sub) vals.push(parseFloat(v.toFixed(4)));

            plotPanelBody.innerHTML = '';
            currentScenario.xData.forEach(xv => {
                const existing = studentPlottedPoints.find(p => Math.abs(p.xVal - xv) < 1e-9);
                const wrap = document.createElement('div');
                wrap.className = 'bg-white border border-amber-200 rounded-lg p-2 flex flex-col gap-1';

                const lbl = document.createElement('div');
                lbl.className = 'text-[11px] font-bold text-slate-600';
                lbl.textContent = `X = ${xv} ${currentScenario.xUnit}`;

                const sel = document.createElement('select');
                sel.className = 'text-xs bg-white border border-slate-300 rounded px-1 py-1 focus:ring-2 focus:ring-amber-500 focus:outline-none';
                let optHtml = '<option value="">未描點</option>';
                vals.forEach(v => { optHtml += `<option value="${v}">Y = ${v}</option>`; });
                sel.innerHTML = optHtml;

                if (existing) {
                    const match = vals.find(v => Math.abs(v - existing.yVal) < 1e-6);
                    if (match !== undefined) sel.value = String(match);
                }

                sel.addEventListener('change', () => {
                    const val = sel.value;
                    const i = studentPlottedPoints.findIndex(p => Math.abs(p.xVal - xv) < 1e-9);
                    if (val === '') {
                        if (i !== -1) studentPlottedPoints.splice(i, 1);
                    } else {
                        const yv = parseFloat(val);
                        if (i !== -1) studentPlottedPoints[i].yVal = yv;
                        else studentPlottedPoints.push({ xVal: xv, yVal: yv });
                    }
                    drawAll();
                });

                wrap.appendChild(lbl);
                wrap.appendChild(sel);
                plotPanelBody.appendChild(wrap);
            });
        }

        // --- Canvas Rendering (主畫布) ---
        function drawAll() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            drawGridPaper();
            drawAxes();
            drawLabelsAndScaleNumbers();
            drawStudentGraph();
            if (hasGraded) drawCorrectAnswerOverlay();
            drawTempErrorMarks();
        }

        function drawGridPaper() {
            ctx.lineWidth = 0.5;
            ctx.strokeStyle = '#e2e8f0';
            const totalSubdivisions = NUM_MAJOR_DIVS * NUM_SUB_DIVS;
            const subSizeX = GRID_WIDTH / totalSubdivisions;
            const subSizeY = GRID_HEIGHT / totalSubdivisions;
            ctx.beginPath();
            for (let i = 0; i <= totalSubdivisions; i++) {
                const y = OFFSET_Y - i * subSizeY;
                ctx.moveTo(OFFSET_X, y); ctx.lineTo(OFFSET_X + GRID_WIDTH, y);
                const x = OFFSET_X + i * subSizeX;
                ctx.moveTo(x, OFFSET_Y); ctx.lineTo(x, OFFSET_Y - GRID_HEIGHT);
            }
            ctx.stroke();
            ctx.lineWidth = 1.0;
            ctx.strokeStyle = '#94a3b8';
            ctx.beginPath();
            for (let i = 0; i <= NUM_MAJOR_DIVS; i++) {
                const y = OFFSET_Y - i * (GRID_HEIGHT / NUM_MAJOR_DIVS);
                ctx.moveTo(OFFSET_X, y); ctx.lineTo(OFFSET_X + GRID_WIDTH, y);
                const x = OFFSET_X + i * (GRID_WIDTH / NUM_MAJOR_DIVS);
                ctx.moveTo(x, OFFSET_Y); ctx.lineTo(x, OFFSET_Y - GRID_HEIGHT);
            }
            ctx.stroke();
        }

        function drawAxes() {
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#1e293b';
            ctx.fillStyle = '#1e293b';
            ctx.beginPath(); ctx.moveTo(OFFSET_X, OFFSET_Y); ctx.lineTo(OFFSET_X + GRID_WIDTH + 15, OFFSET_Y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(OFFSET_X + GRID_WIDTH + 15, OFFSET_Y); ctx.lineTo(OFFSET_X + GRID_WIDTH + 5, OFFSET_Y - 5); ctx.lineTo(OFFSET_X + GRID_WIDTH + 5, OFFSET_Y + 5); ctx.fill();
            ctx.beginPath(); ctx.moveTo(OFFSET_X, OFFSET_Y); ctx.lineTo(OFFSET_X, OFFSET_Y - GRID_HEIGHT - 15); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(OFFSET_X, OFFSET_Y - GRID_HEIGHT - 15); ctx.lineTo(OFFSET_X - 5, OFFSET_Y - GRID_HEIGHT - 5); ctx.lineTo(OFFSET_X + 5, OFFSET_Y - GRID_HEIGHT - 5); ctx.fill();
            ctx.font = "bold 12px 'Noto Sans TC'";
            ctx.fillStyle = "#475569";
            ctx.fillText("0", OFFSET_X - 15, OFFSET_Y + 15);
        }

        function drawLabelsAndScaleNumbers() {
            const scaleX = chosenScaleX;
            const scaleY = chosenScaleY;

            ctx.font = "11px sans-serif";
            ctx.fillStyle = "#334155";

            if (scaleX && scaleX > 0) {
                for (let i = 1; i <= NUM_MAJOR_DIVS; i++) {
                    const x = OFFSET_X + i * (GRID_WIDTH / NUM_MAJOR_DIVS);
                    const labelVal = parseFloat((i * scaleX).toFixed(2));
                    ctx.beginPath(); ctx.moveTo(x, OFFSET_Y); ctx.lineTo(x, OFFSET_Y + 4); ctx.stroke();
                    const tw = ctx.measureText(labelVal).width;
                    ctx.fillText(labelVal, x - tw / 2, OFFSET_Y + 15);
                }
            }

            if (scaleApplied && scaleY && scaleY > 0) {
                for (let i = 1; i <= NUM_MAJOR_DIVS; i++) {
                    const y = OFFSET_Y - i * (GRID_HEIGHT / NUM_MAJOR_DIVS);
                    const labelVal = parseFloat((i * scaleY).toFixed(2));
                    ctx.beginPath(); ctx.moveTo(OFFSET_X, y); ctx.lineTo(OFFSET_X - 4, y); ctx.stroke();
                    const tw = ctx.measureText(labelVal).width;
                    ctx.fillText(labelVal, OFFSET_X - tw - 6, y + 4);
                }
            }

            const sXName = selectXLabel.value, sXUnit = selectXUnit.value;
            const sYName = selectYLabel.value, sYUnit = selectYUnit.value;

            ctx.save();
            ctx.font = "bold 13px 'Noto Sans TC'";
            ctx.textAlign = "center";
            if (sXName && sXUnit) { ctx.fillStyle = "#1e293b"; ctx.fillText(`${sXName} (${sXUnit})`, OFFSET_X + GRID_WIDTH / 2, OFFSET_Y + 50); }
            else { ctx.fillStyle = "#94a3b8"; ctx.fillText("← 請選擇 X 軸標籤", OFFSET_X + GRID_WIDTH / 2, OFFSET_Y + 50); }
            ctx.restore();

            ctx.save();
            ctx.font = "bold 13px 'Noto Sans TC'";
            ctx.translate(OFFSET_X - 52, OFFSET_Y - GRID_HEIGHT / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.textAlign = "center";
            if (sYName && sYUnit) { ctx.fillStyle = "#1e293b"; ctx.fillText(`${sYName} (${sYUnit})`, 0, 0); }
            else { ctx.fillStyle = "#94a3b8"; ctx.fillText("↑ 請選擇 Y 軸標籤", 0, 0); }
            ctx.restore();

            // 圖表標題（頂部中央）
            const chartTitle = selectChartTitle.value;
            ctx.save();
            ctx.font = "bold 14px 'Noto Sans TC'";
            ctx.textAlign = "center";
            if (chartTitle) {
                ctx.fillStyle = "#1e293b";
                ctx.fillText(chartTitle, OFFSET_X + GRID_WIDTH / 2, OFFSET_Y - GRID_HEIGHT - 25);
            } else {
                ctx.fillStyle = "#94a3b8";
                ctx.fillText("← 請選擇圖表標題", OFFSET_X + GRID_WIDTH / 2, OFFSET_Y - GRID_HEIGHT - 25);
            }
            ctx.restore();
        }

        function drawStudentGraph() {
            const scaleX = chosenScaleX;
            const scaleY = chosenScaleY;

            if (!scaleApplied || !scaleX || scaleX <= 0 || !scaleY || scaleY <= 0) {
                if (studentPlottedPoints.length > 0) {
                    ctx.save();
                    ctx.fillStyle = "rgba(239, 68, 68, 0.85)";
                    ctx.fillRect(OFFSET_X + 20, OFFSET_Y - 50, 460, 35);
                    ctx.fillStyle = "#ffffff";
                    ctx.font = "bold 11px sans-serif";
                    ctx.fillText("請先選擇 Y 軸比例尺並按「套用」，否則描點將無法正確顯示！", OFFSET_X + 30, OFFSET_Y - 28);
                    ctx.restore();
                }
                return;
            }

            if (isLineConnected && studentPlottedPoints.length >= 2) {
                ctx.save();
                ctx.strokeStyle = "#3b82f6";
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                const sortedPoints = [...studentPlottedPoints].sort((a, b) => a.xVal - b.xVal);
                sortedPoints.forEach((pt, idx) => {
                    const px = OFFSET_X + (pt.xVal / scaleX) * (GRID_WIDTH / NUM_MAJOR_DIVS);
                    const py = OFFSET_Y - (pt.yVal / scaleY) * (GRID_HEIGHT / NUM_MAJOR_DIVS);
                    if (idx === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                });
                ctx.stroke();
                ctx.restore();
            }

            studentPlottedPoints.forEach(pt => {
                const px = OFFSET_X + (pt.xVal / scaleX) * (GRID_WIDTH / NUM_MAJOR_DIVS);
                const py = OFFSET_Y - (pt.yVal / scaleY) * (GRID_HEIGHT / NUM_MAJOR_DIVS);
                drawXMark(px, py, "#1e3a8a", 6, 2.5);
            });
        }

        function drawXMark(px, py, strokeColor, size = 6, lineWidth = 2) {
            ctx.save();
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = lineWidth;
            ctx.beginPath();
            ctx.moveTo(px - size, py - size); ctx.lineTo(px + size, py + size);
            ctx.moveTo(px + size, py - size); ctx.lineTo(px - size, py + size);
            ctx.stroke();
            ctx.restore();
        }

        function drawTempErrorMarks() {
            const now = Date.now();
            tempErrorMarks = tempErrorMarks.filter(mark => mark.expireTime > now);
            tempErrorMarks.forEach(mark => drawXMark(mark.px, mark.py, "rgba(239, 68, 68, 0.85)", 8, 3));
        }

        function drawCorrectAnswerOverlay() {
            let drawScaleX = chosenScaleX || currentScenario.correctScaleX;
            let drawScaleY = (scaleApplied && chosenScaleY) ? chosenScaleY : currentScenario.correctScaleY;

            ctx.save();
            ctx.fillStyle = "rgba(240, 253, 250, 0.95)";
            ctx.strokeStyle = "#0d9488";
            ctx.lineWidth = 1;
            ctx.fillRect(OFFSET_X + 15, 35, 230, 75);
            ctx.strokeRect(OFFSET_X + 15, 35, 230, 75);
            ctx.fillStyle = "#115e59";
            ctx.font = "bold 11px 'Noto Sans TC'";
            ctx.fillText("🟢 綠色 × 標記：參考解答", OFFSET_X + 25, 55);
            ctx.font = "10px 'Noto Sans TC'";
            ctx.fillText(`X 軸每格: ${drawScaleX} ${currentScenario.xUnit} (已給定)`, OFFSET_X + 25, 75);
            ctx.fillText(`Y 軸每格: ${drawScaleY} ${currentScenario.yUnit}`, OFFSET_X + 25, 93);
            ctx.restore();

            ctx.save();
            ctx.strokeStyle = "rgba(16, 185, 129, 0.65)";
            ctx.lineWidth = 3.5;
            ctx.setLineDash([5, 3]);
            ctx.beginPath();
            currentScenario.xData.forEach((x, idx) => {
                const y = activeYData[idx];
                const px = OFFSET_X + (x / drawScaleX) * (GRID_WIDTH / NUM_MAJOR_DIVS);
                const py = OFFSET_Y - (y / drawScaleY) * (GRID_HEIGHT / NUM_MAJOR_DIVS);
                if (idx === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            });
            ctx.stroke();
            ctx.restore();

            ctx.save();
            currentScenario.xData.forEach((x, idx) => {
                const y = activeYData[idx];
                const px = OFFSET_X + (x / drawScaleX) * (GRID_WIDTH / NUM_MAJOR_DIVS);
                const py = OFFSET_Y - (y / drawScaleY) * (GRID_HEIGHT / NUM_MAJOR_DIVS);
                ctx.beginPath(); ctx.arc(px, py, 10, 0, 2 * Math.PI); ctx.fillStyle = "rgba(16, 185, 129, 0.15)"; ctx.fill();
                drawXMark(px, py, "#10b981", 6, 2.5);
            });
            ctx.restore();
        }

        // --- Interaction ---
        function setupCanvasInteraction() {
            canvas.addEventListener('mousemove', handlePointerMove);
            canvas.addEventListener('mousedown', handlePointerDown);
            canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handlePointerMove(e.touches[0]); }, { passive: false });
            canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handlePointerDown(e.touches[0]); }, { passive: false });
        }

        function getCanvasCoords(eventTarget) {
            const rect = canvas.getBoundingClientRect();
            const scaleFactorX = CANVAS_WIDTH / rect.width;
            const scaleFactorY = CANVAS_HEIGHT / rect.height;
            return { x: (eventTarget.clientX - rect.left) * scaleFactorX, y: (eventTarget.clientY - rect.top) * scaleFactorY };
        }

        function handlePointerMove(e) {
            const coords = getCanvasCoords(e);
            const scaleX = chosenScaleX, scaleY = chosenScaleY;
            if (!scaleApplied || !scaleX || scaleX <= 0 || !scaleY || scaleY <= 0) {
                coordsDisplay.textContent = "請先套用 Y 軸比例尺";
                return;
            }
            const valX = ((coords.x - OFFSET_X) / (GRID_WIDTH / NUM_MAJOR_DIVS)) * scaleX;
            const valY = ((OFFSET_Y - coords.y) / (GRID_HEIGHT / NUM_MAJOR_DIVS)) * scaleY;
            if (valX >= 0 && valX <= scaleX * NUM_MAJOR_DIVS && valY >= 0 && valY <= scaleY * NUM_MAJOR_DIVS) {
                coordsDisplay.textContent = `坐標: X = ${valX.toFixed(1)}, Y = ${valY.toFixed(1)}`;
            } else {
                coordsDisplay.textContent = "超出網格";
            }
        }

        function handlePointerDown(e) {
            if (!isPlotMode) return;
            const scaleX = chosenScaleX, scaleY = chosenScaleY;
            if (!scaleApplied || !scaleX || scaleX <= 0 || !scaleY || scaleY <= 0) {
                showToast("您必須先選擇並成功「套用」Y 軸比例尺，才能開始描點！");
                return;
            }
            const coords = getCanvasCoords(e);
            const rawValX = ((coords.x - OFFSET_X) / (GRID_WIDTH / NUM_MAJOR_DIVS)) * scaleX;
            const rawValY = ((OFFSET_Y - coords.y) / (GRID_HEIGHT / NUM_MAJOR_DIVS)) * scaleY;

            if (rawValX < -0.1 || rawValX > scaleX * NUM_MAJOR_DIVS + 0.1 || rawValY < -0.1 || rawValY > scaleY * NUM_MAJOR_DIVS + 0.1) return;

            let snappedX = currentScenario.xData[0];
            let minDistanceX = Math.abs(rawValX - snappedX);
            currentScenario.xData.forEach(x => { const dist = Math.abs(rawValX - x); if (dist < minDistanceX) { minDistanceX = dist; snappedX = x; } });

            if (minDistanceX > (scaleX * 1.2)) {
                tempErrorMarks.push({ px: coords.x, py: coords.y, expireTime: Date.now() + 800 });
                drawAll();
                setTimeout(drawAll, 850);
                return;
            }

            const subGridValueY = scaleY / NUM_SUB_DIVS;
            const snappedY = Math.round(rawValY / subGridValueY) * subGridValueY;

            const existingIndex = studentPlottedPoints.findIndex(pt => pt.xVal === snappedX);
            if (existingIndex !== -1) {
                if (Math.abs(studentPlottedPoints[existingIndex].yVal - snappedY) < (subGridValueY * 0.5)) {
                    studentPlottedPoints.splice(existingIndex, 1);
                    showToast(`移除了 X = ${snappedX} 的描點。`);
                } else {
                    studentPlottedPoints[existingIndex].yVal = parseFloat(snappedY.toFixed(2));
                }
            } else {
                studentPlottedPoints.push({ xVal: snappedX, yVal: parseFloat(snappedY.toFixed(2)) });
            }
            renderPlotPanel();
            drawAll();
        }

        // --- Grading ---
        function gradeStudentWork() {
            gradeAttempts++;

            let score = 0;
            const feedbackItems = [];
            const comments = [];

            const sXName = selectXLabel.value, sXUnit = selectXUnit.value;
            const sYName = selectYLabel.value, sYUnit = selectYUnit.value;
            const studentScaleY = chosenScaleY;

            const expectedXName = currentScenario.xLabel, expectedYName = currentScenario.yLabel;
            const expectedXUnit = currentScenario.xUnit, expectedYUnit = currentScenario.yUnit;

            // 步驟 1：圖表標題批改
            const selectedTitle = selectChartTitle.value;
            const correctTitle = `${currentScenario.yLabel}隨${currentScenario.xLabel}的變化`;
            let titleScore = 0.0, titleFeedback = "";
            if (!selectedTitle) {
                titleFeedback = "✗ 未選擇圖表標題。";
                comments.push("折線圖必須有標題，格式為「因變量隨自變量的變化」。");
            } else if (selectedTitle === correctTitle) {
                titleScore = 1.0;
                titleFeedback = "✓ 圖表標題正確！";
            } else {
                titleFeedback = `✗ 標題次序錯誤。正確格式為「因變量隨自變量的變化」，即「${correctTitle}」。`;
                comments.push("標題格式：先寫因變量（Y軸，測量結果），再寫自變量（X軸，人為改變的量）。");
            }
            score += titleScore;
            feedbackItems.push({ step: 1, title: "圖表標題", passed: titleScore === 1.0, desc: titleFeedback });

            // 步驟 2：坐標軸標籤批改
            let labelScore = 0.0, labelFeedback = "";
            if (!sXName || !sXUnit || !sYName || !sYUnit) {
                labelFeedback = "✗ 尚未完成橫軸或縱軸的名稱及單位選定。";
                comments.push("在繪製科學圖表前，必須於橫軸（X軸）及縱軸（Y軸）填寫正確的變量名稱及物理單位。");
            } else {
                const ok = sXName === expectedXName && sYName === expectedYName && sXUnit === expectedXUnit && sYUnit === expectedYUnit;
                if (ok) { labelScore = 1.0; labelFeedback = "✓ 完美正確！X 軸與 Y 軸的名稱和物理單位均完全正確。"; }
                else {
                    labelFeedback = `✗ 軸標籤設定錯誤。正確為：X軸→「${expectedXName} (${expectedXUnit})」，Y軸→「${expectedYName} (${expectedYUnit})」。`;
                    comments.push("注意：橫軸應代表自變量（時間/體積，人為操控的變量）；縱軸代表因變量（溫度/質量，測量得出的結果）。");
                }
            }
            score += labelScore;
            feedbackItems.push({ step: 2, title: "坐標軸標籤 (名稱與單位)", passed: labelScore === 1.0, desc: labelFeedback });

            // 步驟 3：Y 軸比例尺批改
            let scaleScore = 0.0, scaleFeedback = "";
            if (!scaleApplied || !studentScaleY || studentScaleY <= 0) {
                scaleFeedback = "✗ 未成功選擇並套用 Y 軸比例尺。";
                comments.push("X 軸比例尺已給定，你只需為 Y 軸從下拉選單選擇合適比例，再點擊「套用至方格紙」。");
            } else if (isValidYScale(studentScaleY)) {
                scaleScore = 1.0;
                scaleFeedback = `✓ Y 軸比例尺設定合理！(每大格 = ${studentScaleY} ${currentScenario.yUnit})，能容納所有數據且數據點落在格線上。`;
            } else {
                const maxY = Math.max(...activeYData);
                let errors = [];
                if (maxY > studentScaleY * NUM_MAJOR_DIVS + 1e-9) errors.push(`範圍太小，無法容納最大值 ${maxY}`);
                else errors.push("部分數據點無法準確落在格線上");
                scaleFeedback = `✗ Y 軸比例尺不合適：${errors.join('；')}。`;
                comments.push("選擇 Y 軸比例尺時：(1) 必須能容納最大數據值；(2) 數值要讓每個數據都剛好落在格線上，方便準確讀數。");
            }
            score += scaleScore;
            feedbackItems.push({ step: 3, title: "Y 軸比例尺 (X軸已給定)", passed: scaleScore === 1.0, desc: scaleFeedback });

            // 步驟 4：精確描點批改
            let plotScore = 0.0, plotFeedback = "";
            const targetCount = currentScenario.xData.length;
            const plottedCount = studentPlottedPoints.length;
            if (plottedCount === 0) {
                plotFeedback = "✗ 網格上沒有任何描點！可使用「📱 描點輔助」面板，或在畫布上點擊繪製。";
                comments.push("點描法：根據數據表中的每對 X 和 Y 數值，在方格紙交叉點上標記「×」。");
            } else if (plottedCount < targetCount) {
                plotFeedback = `✗ 數據共有 ${targetCount} 個點，但你只完成了 ${plottedCount} 個點。`;
                comments.push("請小心不要遺漏表格中的任何一對實驗數據！");
            } else if (!scaleApplied || !chosenScaleY || chosenScaleY <= 0) {
                plotFeedback = "✗ 因 Y 軸比例尺未正確套用，系統無法比對描點精準度。";
            } else {
                let incorrectCount = 0;
                let errorDetails = [];
                const maxAllowedToleranceX = (currentScenario.correctScaleX / NUM_SUB_DIVS) * 0.6;
                const maxAllowedToleranceY = (currentScenario.correctScaleY / NUM_SUB_DIVS) * 0.6;
                currentScenario.xData.forEach((trueX, idx) => {
                    const trueY = activeYData[idx];
                    const studentPt = studentPlottedPoints.find(pt => Math.abs(pt.xVal - trueX) <= maxAllowedToleranceX);
                    if (!studentPt) { incorrectCount++; errorDetails.push(`遺漏了 X = ${trueX} 的數據點`); }
                    else {
                        const devY = Math.abs(studentPt.yVal - trueY);
                        if (devY > maxAllowedToleranceY) { incorrectCount++; errorDetails.push(`X=${trueX} 的 Y 值偏差過大 (你的: ${studentPt.yVal}，答案: ${trueY})`); }
                    }
                });
                if (incorrectCount === 0) { plotScore = 1.0; plotFeedback = "✓ 非常優秀！所有數據點都精準定位！"; }
                else {
                    const correctCount = targetCount - incorrectCount;
                    plotScore = parseFloat((correctCount / targetCount).toFixed(1));
                    if (plotScore < 0) plotScore = 0;
                    plotFeedback = `✗ 描點精確度不足 (正確: ${correctCount}/${targetCount})。${errorDetails.slice(0, 2).join('；')}${errorDetails.length > 2 ? '...等' : ''}。`;
                    comments.push("注意：點點時請看清座標網格，將每個數據精準投影在格線上。");
                }
            }
            score += plotScore;
            feedbackItems.push({ step: 4, title: "精確描點 (Plotting Points)", passed: plotScore === 1.0, desc: plotFeedback });

            // 步驟 5：折線連線批改
            let connectScore = 0.0, connectFeedback = "";
            if (studentPlottedPoints.length < 2) connectFeedback = "✗ 描點不足，無法繪製折線。";
            else if (!isLineConnected) {
                connectFeedback = "✗ 各點尚未連線！請點選「📈 連線」按鈕。";
                comments.push("在科學折線圖中，需要用直線依序將每個相鄰點連接起來。");
            } else {
                if (plotScore >= 0.8) { connectScore = 1.0; connectFeedback = "✓ 折線連接完成，線條工整標準！"; }
                else { connectScore = 0.5; connectFeedback = "⚠ 已連線，但部分點坐標偏差較多，請修正後重新連線。"; }
            }
            score += connectScore;
            feedbackItems.push({ step: 5, title: "折線連線 (Line Graph)", passed: connectScore === 1.0, desc: connectFeedback });

            const finalScore = Math.min(5, Math.round(score * 10) / 10);

            if (gradeAttempts === 1) {
                totalScoreDisplay.textContent = '?';
                scoresContainer.innerHTML = "";
                feedbackItems.forEach(item => {
                    const block = document.createElement('div');
                    block.className = `p-3 rounded-lg border flex items-center justify-between ${item.passed ? 'bg-emerald-50/50 border-emerald-200' : 'bg-red-50/50 border-red-200'}`;
                    block.innerHTML = `
                        <span class="font-bold text-sm ${item.passed ? 'text-emerald-700' : 'text-red-600'}">步驟 ${item.step}: ${item.title}</span>
                        <span class="text-xl">${item.passed ? '✅' : '❌'}</span>`;
                    scoresContainer.appendChild(block);
                });
                feedbackCommentsList.innerHTML = "";
                const li = document.createElement('li');
                li.className = "text-amber-700 font-bold";
                li.textContent = "請修正標示為 ❌ 的步驟，然後再按一次批改按鈕！";
                feedbackCommentsList.appendChild(li);
                btnSubmit.innerHTML = `
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    再次批改（最後一次機會）`;
                feedbackPanel.classList.remove('hidden');
                feedbackPanel.scrollIntoView({ behavior: 'smooth' });
            } else {
                hasGraded = true;
                totalScoreDisplay.textContent = finalScore;
                scoresContainer.innerHTML = "";
                feedbackItems.forEach(item => {
                    const block = document.createElement('div');
                    block.className = `p-3 rounded-lg border flex flex-col justify-between ${item.passed ? 'bg-emerald-50/50 border-emerald-200' : 'bg-red-50/50 border-red-200'}`;
                    block.innerHTML = `
                        <div class="flex items-center justify-between font-bold text-xs text-slate-500 mb-1">
                            <span>步驟 ${item.step}: ${item.title}</span>
                            <span class="${item.passed ? 'text-emerald-600' : 'text-red-500'}">${item.passed ? '✓ 通過' : '✗ 需修正'}</span>
                        </div>
                        <p class="text-xs md:text-sm text-slate-700 leading-relaxed font-medium">${item.desc}</p>`;
                    scoresContainer.appendChild(block);
                });
                feedbackCommentsList.innerHTML = "";
                if (comments.length === 0) {
                    const li = document.createElement('li');
                    li.className = "text-emerald-700 font-bold";
                    li.textContent = "做得很好！你的折線圖完全符合中學考試標準！";
                    feedbackCommentsList.appendChild(li);
                } else {
                    comments.forEach(comment => { const li = document.createElement('li'); li.textContent = comment; feedbackCommentsList.appendChild(li); });
                }
                btnSubmit.innerHTML = `
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 15H19M9 5h14v14H9z"></path>
                    </svg>
                    已完成批改——如需重試請按頂部「重試此題」`;
                btnSubmit.disabled = true;
                btnSubmit.className = btnSubmit.className.replace('from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700', 'from-slate-400 to-slate-500 cursor-not-allowed');
                feedbackPanel.classList.remove('hidden');
                drawAll();
                feedbackPanel.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function roundRectPath(g, rx, ry, w, h, r) {
            g.beginPath();
            g.moveTo(rx + r, ry);
            g.arcTo(rx + w, ry, rx + w, ry + h, r);
            g.arcTo(rx + w, ry + h, rx, ry + h, r);
            g.arcTo(rx, ry + h, rx, ry, r);
            g.arcTo(rx, ry, rx + w, ry, r);
            g.closePath();
        }

        function wrapTextLines(g, text, tx, ty, maxW, lh) {
            let line = '';
            let curY = ty;
            for (let i = 0; i < text.length; i++) {
                const test = line + text[i];
                if (g.measureText(test).width > maxW && line !== '') {
                    g.fillText(line, tx, curY);
                    line = text[i];
                    curY += lh;
                } else {
                    line = test;
                }
            }
            if (line) g.fillText(line, tx, curY);
            return curY;
        }

        function drawTableOnCtx(g, tx, ty, tw) {
            const rows = 2;
            const labelW = 175;
            const n = currentScenario.xData.length;
            const cellW = (tw - labelW) / n;
            const rh = 36;

            g.fillStyle = '#f1f5f9';
            g.fillRect(tx, ty, labelW, rh);
            g.fillRect(tx, ty + rh, labelW, rh);

            g.textAlign = 'center';
            g.textBaseline = 'middle';

            g.font = "bold 14px 'Noto Sans TC', sans-serif";
            g.fillStyle = '#475569';
            g.fillText(`${currentScenario.xLabel} (${currentScenario.xUnit})`, tx + labelW / 2, ty + rh / 2);
            g.fillStyle = '#334155';
            g.font = "15px 'Noto Sans TC', sans-serif";
            currentScenario.xData.forEach((v, i) => {
                g.fillText(String(v), tx + labelW + cellW * i + cellW / 2, ty + rh / 2);
            });

            g.font = "bold 14px 'Noto Sans TC', sans-serif";
            g.fillStyle = '#4338ca';
            g.fillText(`${currentScenario.yLabel} (${currentScenario.yUnit})`, tx + labelW / 2, ty + rh + rh / 2);
            g.fillStyle = '#4f46e5';
            g.font = "bold 15px 'Noto Sans TC', sans-serif";
            activeYData.forEach((v, i) => {
                g.fillText(String(v), tx + labelW + cellW * i + cellW / 2, ty + rh + rh / 2);
            });

            g.strokeStyle = '#cbd5e1';
            g.lineWidth = 1;
            g.beginPath();
            for (let r = 0; r <= rows; r++) { g.moveTo(tx, ty + r * rh); g.lineTo(tx + tw, ty + r * rh); }
            g.moveTo(tx, ty); g.lineTo(tx, ty + rows * rh);
            g.moveTo(tx + labelW, ty); g.lineTo(tx + labelW, ty + rows * rh);
            for (let ci = 1; ci <= n; ci++) { const cx = tx + labelW + cellW * ci; g.moveTo(cx, ty); g.lineTo(cx, ty + rows * rh); }
            g.moveTo(tx + tw, ty); g.lineTo(tx + tw, ty + rows * rh);
            g.stroke();

            g.textBaseline = 'alphabetic';
            return ty + rows * rh;
        }

        function drawGraphOnCtx(g, isAnswerPage) {
            g.fillStyle = '#ffffff';
            g.fillRect(0, 0, 600, 640);

            g.lineWidth = 0.5; g.strokeStyle = '#e2e8f0';
            const total = NUM_MAJOR_DIVS * NUM_SUB_DIVS;
            const ssx = GRID_WIDTH / total, ssy = GRID_HEIGHT / total;
            g.beginPath();
            for (let i = 0; i <= total; i++) {
                const yy = OFFSET_Y - i * ssy; g.moveTo(OFFSET_X, yy); g.lineTo(OFFSET_X + GRID_WIDTH, yy);
                const xx = OFFSET_X + i * ssx; g.moveTo(xx, OFFSET_Y); g.lineTo(xx, OFFSET_Y - GRID_HEIGHT);
            }
            g.stroke();
            g.lineWidth = 1; g.strokeStyle = '#94a3b8'; g.beginPath();
            for (let i = 0; i <= NUM_MAJOR_DIVS; i++) {
                const yy = OFFSET_Y - i * (GRID_HEIGHT / NUM_MAJOR_DIVS); g.moveTo(OFFSET_X, yy); g.lineTo(OFFSET_X + GRID_WIDTH, yy);
                const xx = OFFSET_X + i * (GRID_WIDTH / NUM_MAJOR_DIVS); g.moveTo(xx, OFFSET_Y); g.lineTo(xx, OFFSET_Y - GRID_HEIGHT);
            }
            g.stroke();

            g.lineWidth = 2.5; g.strokeStyle = '#1e293b'; g.fillStyle = '#1e293b';
            g.beginPath(); g.moveTo(OFFSET_X, OFFSET_Y); g.lineTo(OFFSET_X + GRID_WIDTH + 15, OFFSET_Y); g.stroke();
            g.beginPath(); g.moveTo(OFFSET_X + GRID_WIDTH + 15, OFFSET_Y); g.lineTo(OFFSET_X + GRID_WIDTH + 5, OFFSET_Y - 5); g.lineTo(OFFSET_X + GRID_WIDTH + 5, OFFSET_Y + 5); g.fill();
            g.beginPath(); g.moveTo(OFFSET_X, OFFSET_Y); g.lineTo(OFFSET_X, OFFSET_Y - GRID_HEIGHT - 15); g.stroke();
            g.beginPath(); g.moveTo(OFFSET_X, OFFSET_Y - GRID_HEIGHT - 15); g.lineTo(OFFSET_X - 5, OFFSET_Y - GRID_HEIGHT - 5); g.lineTo(OFFSET_X + 5, OFFSET_Y - GRID_HEIGHT - 5); g.fill();
            g.font = "bold 12px 'Noto Sans TC', sans-serif"; g.fillStyle = "#475569"; g.textAlign = 'left';
            g.fillText("0", OFFSET_X - 15, OFFSET_Y + 15);

            const sX = currentScenario.correctScaleX;
            g.font = "11px sans-serif"; g.fillStyle = "#334155";
            for (let i = 1; i <= NUM_MAJOR_DIVS; i++) {
                const xx = OFFSET_X + i * (GRID_WIDTH / NUM_MAJOR_DIVS);
                g.beginPath(); g.moveTo(xx, OFFSET_Y); g.lineTo(xx, OFFSET_Y + 4); g.stroke();
                const lab = parseFloat((i * sX).toFixed(2));
                const tw = g.measureText(lab).width;
                g.fillText(lab, xx - tw / 2, OFFSET_Y + 15);
            }
            g.save();
            g.font = "bold 13px 'Noto Sans TC', sans-serif"; g.textAlign = "center"; g.fillStyle = "#1e293b";
            g.fillText(`${currentScenario.xLabel} (${currentScenario.xUnit})`, OFFSET_X + GRID_WIDTH / 2, OFFSET_Y + 50);
            g.restore();

            if (isAnswerPage) {
                const sY = currentScenario.correctScaleY;
                g.font = "11px sans-serif"; g.fillStyle = "#334155"; g.textAlign = 'left';
                for (let i = 1; i <= NUM_MAJOR_DIVS; i++) {
                    const yy = OFFSET_Y - i * (GRID_HEIGHT / NUM_MAJOR_DIVS);
                    g.beginPath(); g.moveTo(OFFSET_X, yy); g.lineTo(OFFSET_X - 4, yy); g.stroke();
                    const lab = parseFloat((i * sY).toFixed(2));
                    const tw = g.measureText(lab).width;
                    g.fillText(lab, OFFSET_X - tw - 6, yy + 4);
                }
                g.save();
                g.font = "bold 13px 'Noto Sans TC', sans-serif"; g.textAlign = "center"; g.fillStyle = "#1e293b";
                g.translate(OFFSET_X - 52, OFFSET_Y - GRID_HEIGHT / 2); g.rotate(-Math.PI / 2);
                g.fillText(`${currentScenario.yLabel} (${currentScenario.yUnit})`, 0, 0);
                g.restore();

                // 答案頁圖表標題
                g.save();
                g.font = "bold 14px 'Noto Sans TC', sans-serif";
                g.textAlign = "center";
                g.fillStyle = "#1e293b";
                g.fillText(`${currentScenario.yLabel}隨${currentScenario.xLabel}的變化`, OFFSET_X + GRID_WIDTH / 2, OFFSET_Y - GRID_HEIGHT - 25);
                g.restore();

                g.save(); g.strokeStyle = "rgba(16,185,129,0.85)"; g.lineWidth = 3; g.beginPath();
                currentScenario.xData.forEach((xv, idx) => {
                    const yv = activeYData[idx];
                    const px = OFFSET_X + (xv / sX) * (GRID_WIDTH / NUM_MAJOR_DIVS);
                    const py = OFFSET_Y - (yv / sY) * (GRID_HEIGHT / NUM_MAJOR_DIVS);
                    if (idx === 0) g.moveTo(px, py); else g.lineTo(px, py);
                });
                g.stroke(); g.restore();

                g.save(); g.strokeStyle = "#10b981"; g.lineWidth = 2.5;
                currentScenario.xData.forEach((xv, idx) => {
                    const yv = activeYData[idx];
                    const px = OFFSET_X + (xv / sX) * (GRID_WIDTH / NUM_MAJOR_DIVS);
                    const py = OFFSET_Y - (yv / sY) * (GRID_HEIGHT / NUM_MAJOR_DIVS);
                    g.beginPath();
                    g.moveTo(px - 6, py - 6); g.lineTo(px + 6, py + 6);
                    g.moveTo(px + 6, py - 6); g.lineTo(px - 6, py + 6);
                    g.stroke();
                });
                g.restore();

                g.save();
                g.fillStyle = "rgba(240,253,250,0.95)"; g.strokeStyle = "#0d9488"; g.lineWidth = 1;
                g.fillRect(OFFSET_X + 15, 35, 215, 64); g.strokeRect(OFFSET_X + 15, 35, 215, 64);
                g.fillStyle = "#115e59"; g.textAlign = 'left'; g.font = "bold 12px 'Noto Sans TC', sans-serif";
                g.fillText("✅ 參考解答（綠色 × 標記）", OFFSET_X + 25, 55);
                g.font = "11px 'Noto Sans TC', sans-serif";
                g.fillText(`X 軸每格: ${sX} ${currentScenario.xUnit}（已給定）`, OFFSET_X + 25, 74);
                g.fillText(`Y 軸每格: ${sY} ${currentScenario.yUnit}`, OFFSET_X + 25, 90);
                g.restore();
            }
        }

        function buildWorksheetCanvas(isAnswerPage) {
            const W = 794, H = 1123, dpr = 2;
            const c = document.createElement('canvas');
            c.width = W * dpr;
            c.height = H * dpr;
            const x = c.getContext('2d');
            x.scale(dpr, dpr);

            x.fillStyle = '#ffffff';
            x.fillRect(0, 0, W, H);

            const margin = 48;
            let y = 60;

            x.textAlign = 'center';
            x.fillStyle = '#1e40af';
            x.font = "bold 26px 'Noto Sans TC', sans-serif";
            x.fillText('科學折線圖工作紙' + (isAnswerPage ? '（參考答案）' : ''), W / 2, y);
            y += 42;

            x.textAlign = 'left';
            x.fillStyle = '#2563eb';
            roundRectPath(x, margin, y - 17, 74, 23, 5);
            x.fill();
            x.fillStyle = '#ffffff';
            x.font = "bold 13px 'Noto Sans TC', sans-serif";
            x.textAlign = 'center';
            x.fillText('題目情境', margin + 37, y - 1);
            x.textAlign = 'left';
            x.fillStyle = '#1e3a8a';
            x.font = "bold 19px 'Noto Sans TC', sans-serif";
            x.fillText(currentScenario.title, margin + 86, y);
            y += 32;

            x.fillStyle = '#475569';
            x.font = "15px 'Noto Sans TC', sans-serif";
            y = wrapTextLines(x, currentScenario.description, margin, y, W - 2 * margin, 23) + 10;

            x.fillStyle = '#1e40af';
            x.font = "bold 14px 'Noto Sans TC', sans-serif";
            y = wrapTextLines(x, `提示：方格紙為 6 × 6 大格；X 軸比例尺已給定為「每格 = ${currentScenario.correctScaleX} ${currentScenario.xUnit}」。`, margin, y, W - 2 * margin, 22) + 18;

            y = drawTableOnCtx(x, margin, y, W - 2 * margin);
            y += 26;

            const gCanvas = document.createElement('canvas');
            gCanvas.width = 600;
            gCanvas.height = 640;
            const g = gCanvas.getContext('2d');
            drawGraphOnCtx(g, isAnswerPage);

            const gW = 560;
            const gH = gW * 640 / 600;
            x.drawImage(gCanvas, (W - gW) / 2, y, gW, gH);

            x.textAlign = 'center';
            x.fillStyle = '#94a3b8';
            x.font = "11px 'Noto Sans TC', sans-serif";
            x.fillText('香港中一學生折線圖互動繪圖工作紙 • 科學科自主溫習工具', W / 2, H - 30);

            return c;
        }

        // 建立 HTML 預覽內容（題目頁 + 答案頁）
        function buildHtmlPreview() {
            function tableHtml() {
                let header = `<tr class="bg-slate-50"><td class="px-2 py-1.5 border border-slate-300 font-bold bg-slate-100 text-slate-600">${currentScenario.xLabel} (${currentScenario.xUnit})</td>`;
                currentScenario.xData.forEach(v => header += `<td class="px-2 py-1.5 border border-slate-300 text-slate-700">${v}</td>`);
                header += `</tr>`;
                let valRow = `<tr><td class="px-2 py-1.5 border border-slate-300 font-bold bg-slate-100 text-indigo-700">${currentScenario.yLabel} (${currentScenario.yUnit})</td>`;
                activeYData.forEach(v => valRow += `<td class="px-2 py-1.5 border border-slate-300 text-indigo-600 font-bold">${v}</td>`);
                valRow += `</tr>`;
                return `<div class="overflow-x-auto"><table class="w-full text-center text-xs border-collapse">${header}${valRow}</table></div>`;
            }

            // 題目頁：用離屏 canvas 經 drawGraphOnCtx 繪製後截圖
            const qCanvas = document.createElement('canvas');
            qCanvas.width = 600;
            qCanvas.height = 640;
            const qg = qCanvas.getContext('2d');
            drawGraphOnCtx(qg, false);
            const questionImg = qCanvas.toDataURL('image/png');

            // 答案頁：用離屏 canvas 經 drawGraphOnCtx 繪製後截圖
            const ansCanvas = document.createElement('canvas');
            ansCanvas.width = 600;
            ansCanvas.height = 640;
            const ag = ansCanvas.getContext('2d');
            drawGraphOnCtx(ag, true);
            const answerImg = ansCanvas.toDataURL('image/png');

            const correctTitle = `${currentScenario.yLabel}隨${currentScenario.xLabel}的變化`;

            htmlPreviewBody.innerHTML = `
                <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-4 mb-4">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="px-2 py-0.5 bg-blue-600 text-white text-xs font-bold rounded">題目</span>
                        <h4 class="text-sm font-bold text-blue-900">${currentScenario.title}</h4>
                    </div>
                    <p class="text-xs text-slate-600 leading-relaxed mb-3">${currentScenario.description}</p>
                    ${tableHtml()}
                    <img src="${questionImg}" class="w-full mt-3 border border-slate-100 rounded" alt="工作紙方格紙" />
                </div>
                <div class="bg-white rounded-lg shadow-sm border border-emerald-200 p-4">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="px-2 py-0.5 bg-emerald-600 text-white text-xs font-bold rounded">參考答案</span>
                        <h4 class="text-sm font-bold text-emerald-900">${correctTitle}</h4>
                    </div>
                    <p class="text-xs text-slate-600 leading-relaxed mb-3">${currentScenario.description}</p>
                    ${tableHtml()}
                    <img src="${answerImg}" class="w-full mt-3 border border-slate-100 rounded" alt="參考答案方格紙" />
                </div>
            `;
        }

        async function exportPDF() {
            const btn = btnExportPdf;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="animate-pulse">⏳ 處理中...</span>';
            btn.disabled = true;

            try {
                if (document.fonts) {
                    try {
                        await Promise.all([
                            document.fonts.load("400 15px 'Noto Sans TC'"),
                            document.fonts.load("500 15px 'Noto Sans TC'"),
                            document.fonts.load("700 26px 'Noto Sans TC'")
                        ]);
                    } catch (e) { /* 忽略字體載入個別失敗 */ }
                    if (document.fonts.ready) await document.fonts.ready;
                }

                if (!window.jspdf || !window.jspdf.jsPDF) {
                    throw new Error('PDF 函式庫尚未載入，請檢查網絡後重試');
                }

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('p', 'mm', 'a4');
                const pageW = 210, pageH = 297;

                const c1 = buildWorksheetCanvas(false);
                doc.addImage(c1.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, pageW, pageH);

                doc.addPage();
                const c2 = buildWorksheetCanvas(true);
                doc.addImage(c2.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, pageW, pageH);

                const fileName = `科學折線圖工作紙_${currentScenario.id}.pdf`;

                // 生成 HTML 預覽內容並顯示 Modal
                buildHtmlPreview();
                htmlPreviewModal.classList.remove('hidden');

                // 下載 PDF 按鈕
                btnHtmlDownloadPdf.onclick = () => {
                    doc.save(fileName);
                    showToast("✅ PDF 已下載！");
                };

                showToast("✅ 工作紙已生成，可於預覽視窗檢視或下載 PDF。");
            } catch (error) {
                console.error('PDF Export Error:', error);
                showToast("❌ 匯出 PDF 失敗：" + (error && error.message ? error.message : '未知錯誤'));
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
