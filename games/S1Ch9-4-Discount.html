<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>折扣 — 練習</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#2c3e50 0%,#34495e 100%);min-height:100vh;padding:18px;color:#222}
.container{max-width:880px;margin:0 auto;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.2);padding:18px}
.header{background:#34495e;color:#fff;padding:14px;border-radius:8px;text-align:center;margin-bottom:12px}
.type-tag{display:inline-block;background:#fff;color:#34495e;border-radius:20px;padding:3px 14px;font-size:0.85rem;font-weight:700}
.level-tag{display:inline-block;background:#e67e22;color:#fff;border-radius:20px;padding:2px 10px;font-size:0.78rem;margin-left:6px}
.question-box{background:#f8f9fa;padding:18px;border-radius:10px;margin-bottom:12px}
.question-text{font-size:1.08rem;line-height:1.75;font-weight:500;margin-bottom:10px}
.given-info{background:#e8f4fd;padding:10px 14px;border-radius:8px;border-left:4px solid #3498db;font-size:0.95rem;margin-bottom:8px}
.formula-box{background:#fef9e7;padding:10px 14px;border-radius:8px;border-left:4px solid #f1c40f;font-size:0.95rem;margin-bottom:8px;color:#7d6608}
.input-area{margin-top:14px;text-align:center}
.input-display{font-size:1.6rem;padding:12px 18px;border-radius:8px;border:3px solid #eee;display:inline-block;min-width:220px;color:#34495e;letter-spacing:1px}
.keyboard{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:520px;margin:14px auto}
.key{padding:12px 0;background:#fff;border:2px solid #ddd;border-radius:8px;cursor:pointer;font-weight:700;font-size:1rem}
.key-action{background:#c0392b;color:#fff;border-color:#a93226}
.key-submit{grid-column:span 6;background:#34495e;color:#fff;border-color:#2c3e50;padding:14px 0;font-size:1.05rem}
.result-row{display:none;margin-top:14px;align-items:center;gap:12px}
.result-msg{font-weight:700;font-size:1.1rem}
.score-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#f8f9fa;border-radius:8px;margin-bottom:10px;font-size:0.88rem;flex-wrap:wrap;gap:6px}
.score{color:#27ae60;font-weight:700}
.score-l2{color:#2980b9;font-weight:700}
.score-l3{color:#8e44ad;font-weight:700}
.streak{color:#e67e22;font-weight:700}
.small{font-size:0.88rem;color:#666;margin-top:6px;text-align:center}
.correct-answer-box{display:none;margin-top:8px;background:#d4edda;border:1px solid #c3e6cb;color:#155724;padding:10px;border-radius:8px;font-size:0.95rem}
.feedback-panel{margin-top:14px;display:none}
.feedback-title{font-weight:700;font-size:1rem;margin-bottom:8px;color:#34495e}
.step{margin:6px 0;padding:6px 10px;background:#f8f9fa;border-radius:6px;font-size:0.92rem;display:flex;gap:8px;align-items:flex-start}
.step-num{background:#34495e;color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:0.75rem;flex-shrink:0;margin-top:1px}
.step-text{flex:1;line-height:1.5}
.bar-chart{background:#f8f9fa;padding:14px;border-radius:10px;margin:10px 0}
.bar-row{display:flex;align-items:center;margin:6px 0;gap:8px}
.bar-label{min-width:52px;font-size:0.88rem;text-align:right}
.bar-outer{flex:1;background:#eee;border-radius:6px;height:26px;position:relative}
.bar-inner{position:absolute;left:0;top:0;height:100%;border-radius:6px;display:flex;align-items:center;padding-left:8px;font-size:0.8rem;color:#fff;font-weight:700;overflow:hidden;white-space:nowrap}
.bar-value{font-size:0.88rem;font-weight:700;min-width:70px;color:#333}
.diff-row{margin:4px 0 4px 60px;padding:4px 8px;background:#fff3cd;border-radius:6px;font-size:0.88rem;font-weight:700;color:#e67e22;display:flex;gap:8px;align-items:center}
.diff-label{min-width:52px;text-align:right;color:#e67e22}
.result-detail{margin-top:6px;font-size:0.9rem;color:#555}
.mode-badge{display:inline-block;background:#2ecc71;color:#fff;border-radius:20px;padding:2px 10px;font-size:0.78rem}
.mode-badge-l2{background:#2980b9}
.mode-badge-l3{background:#8e44ad}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🏷️ 折扣</h1>
    <div class="small">❶ 求折扣百分率　❷ 求折扣金額　❸ 求售價/標價　❹ 混合應用　｜　程度一優先</div>
  </div>
  <div class="score-bar">
    <span id="scoreL1Bar">✅ 程度一正確：<span class="score" id="scoreL1">0</span>　❌ 錯誤：<span id="wrongL1">0</span>　　🔥 <span class="streak" id="streakL1">0</span></span>
    <span id="scoreL2Bar" style="display:none">✅ 程度二正確：<span class="score-l2" id="scoreL2">0</span>　❌ 錯誤：<span id="wrongL2">0</span>　　🔥 <span class="streak" id="streakL2">0</span></span>
    <span id="scoreL3Bar" style="display:none">✅ 程度三正確：<span class="score-l3" id="scoreL3">0</span>　❌ 錯誤：<span id="wrongL3">0</span>　　🔥 <span class="streak" id="streakL3">0</span></span>
    <span id="modeIndicator">📗 程度一</span>
  </div>
  <div class="question-box">
    <div class="type-tag" id="typeTag">❶ 求折扣百分率</div>
    <div id="levelTag" class="level-tag" style="display:inline-block"></div>
    <div id="qtext" class="question-text">按「下一題」開始</div>
    <div id="givenInfo" class="given-info" style="display:none"></div>
    <div id="formulaBox" class="formula-box" style="display:none"></div>
    <div class="input-area">
      <div id="inputDisplay" class="input-display">_</div>
      <div id="formatHint" class="small"></div>
    </div>
    <div class="keyboard" id="kb">
      <button class="key" onclick="typeKey('1')">1</button>
      <button class="key" onclick="typeKey('2')">2</button>
      <button class="key" onclick="typeKey('3')">3</button>
      <button class="key" onclick="typeKey('4')">4</button>
      <button class="key" onclick="typeKey('5')">5</button>
      <button class="key" onclick="typeKey('6')">6</button>
      <button class="key" onclick="typeKey('7')">7</button>
      <button class="key" onclick="typeKey('8')">8</button>
      <button class="key" onclick="typeKey('9')">9</button>
      <button class="key" onclick="typeKey('0')">0</button>
      <button class="key" onclick="typeKey('.')">.</button>
      <button class="key key-action" onclick="typeKey('del')">⌫</button>
      <button class="key key-action" onclick="typeKey('clear')">清除</button>
      <button class="key" onclick="typeKey('%')">%</button>
      <button class="key" onclick="typeKey('$')">$</button>
      <button class="key" onclick="typeKey('(')">(</button>
      <button class="key key-submit" onclick="submitAns()">✓ 檢查答案</button>
    </div>
    <div id="result" class="result-row">
      <div id="msg" class="result-msg"></div>
      <div id="resultDetail" class="result-detail"></div>
      <div style="margin-left:auto"><button class="key" onclick="nextQ()">下一題</button></div>
    </div>
    <div id="correctAnswerBox" class="correct-answer-box"></div>
    <div id="feedbackPanel" class="feedback-panel">
      <div class="feedback-title">📝 視覺化解題</div>
      <div id="barChart"></div>
      <div id="stepsContainer"></div>
    </div>
  </div>
</div>
<script>
// ===== STATS =====
let scoreL1=0,wrongL1=0,streakL1=0;
let scoreL2=0,wrongL2=0,streakL2=0;
let scoreL3=0,wrongL3=0,streakL3=0;
let currentPart=0;

const UNLOCK_L2_ACCURACY=0.80;
const UNLOCK_L2_MIN=5;
const UNLOCK_L3_ACCURACY=0.80;
const UNLOCK_L3_MIN=5;
let l1Attempts=0,l2Attempts=0;
let l2Unlocked=false;
let l3Unlocked=false;

function l1Accuracy(){return l1Attempts>0?scoreL1/l1Attempts:0;}
function l2Accuracy(){return l2Attempts>0?scoreL2/l2Attempts:0;}

function updateStats(){
  document.getElementById('scoreL1').innerText=scoreL1;
  document.getElementById('wrongL1').innerText=wrongL1;
  document.getElementById('streakL1').innerText=streakL1;
  document.getElementById('scoreL2').innerText=scoreL2;
  document.getElementById('wrongL2').innerText=wrongL2;
  document.getElementById('streakL2').innerText=streakL2;
  document.getElementById('scoreL3').innerText=scoreL3;
  document.getElementById('wrongL3').innerText=wrongL3;
  document.getElementById('streakL3').innerText=streakL3;

  const mi=document.getElementById('modeIndicator');
  const l2bar=document.getElementById('scoreL2Bar');
  const l3bar=document.getElementById('scoreL3Bar');

  if(l3Unlocked){
    mi.innerHTML='🔮 程度一 + 二 + 三混合';
    mi.className='mode-badge mode-badge-l3';
    l2bar.style.display='inline';
    l3bar.style.display='inline';
  } else if(l2Unlocked){
    mi.innerHTML='📙 程度一 + 程度二混合';
    mi.className='mode-badge mode-badge-l2';
    l2bar.style.display='inline';
    l3bar.style.display='none';
  } else {
    const acc=l1Attempts>0?Math.round(l1Accuracy()*100):0;
    mi.innerHTML=`📗 程度一　(${acc}% 準確率，已答 ${l1Attempts}/${UNLOCK_L2_MIN})`;
    mi.className='mode-badge';
    l2bar.style.display='none';
    l3bar.style.display='none';
  }
}

function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function toSig3(n){
  if(!isFinite(n)||n===0) return '0';
  const neg=n<0; n=Math.abs(n);
  const order=Math.floor(Math.log10(n));
  const factor=Math.pow(10,order-3+1);
  const rounded=Math.round(n/factor)*factor;
  const dec=Math.max(0,-(Math.floor(Math.log10(factor))));
  let s=parseFloat(rounded.toFixed(dec)).toString();
  if(s.indexOf('.')!==-1) s=s.replace(/(?:\.0+|(?<=\.[0-9]*?)0+)$/,'');
  return neg?'-'+s:s;
}
function fmt(n){return toSig3(n);}
function normalize(s){return s.trim().replace(/,/g,'');}

// ===== TEMPLATES =====
// ===== 程度一：求折扣百分率 + 折扣金額 + 售價 =====
// T1_L1: 求折扣百分率（修復：discPct 必能除盡100）
const DC_T1_L1=[
  function(){
    const mp=rnd(200,2000), discount=rnd(20,Math.floor(mp*0.4));
    const sp=mp-discount;
    const discPct=discount/mp*100;
    return {q:`一副眼鏡的標價是 $${mp}，現以 $${sp} 售出。求折扣百分率。`,given:`標價 $${mp}，售價 $${sp}`,val:discPct,mode:'percent',level:'程度一',formula:'折扣百分率 = (標價 - 售價) / 標價 × 100%',mp,sp,discount};
  },
  function(){
    // Fix: discPct must divide 100 evenly so discount=mp*discPct/100 is always integer
    const mp=rnd(5,100)*100; // mp = 500,600,...,10000 - multiple of 100
    const discPct=rnd(1,4)*10; // discPct = 10,20,30,40 - always divides 100
    const discount=mp*discPct/100; // guaranteed integer
    const sp=mp-discount;
    return {q:`一個衣櫃的標價為 $${mp}，現以 $${sp} 售出。求折扣百分率。`,given:`標價 $${mp}，售價 $${sp}`,val:discPct,mode:'percent',level:'程度一',formula:'折扣百分率 = (標價 - 售價) / 標價 × 100%',mp,sp,discount};
  },
  function(){
    // Fix: discPct must divide 100 evenly
    const mp=rnd(5,80)*100; // mp = 500,600,...,8000
    const discPct=rnd(1,3)*10; // discPct = 10,20,30
    const discount=mp*discPct/100; // guaranteed integer
    const sp=mp-discount;
    return {q:`一部計算機的標價是 $${mp}，現以 $${sp} 售出。求折扣百分率。`,given:`標價 $${mp}，售價 $${sp}`,val:discPct,mode:'percent',level:'程度一',formula:'折扣百分率 = (標價 - 售價) / 標價 × 100%',mp,sp,discount};
  },
  function(){
    // Fix: discPct must divide 100 evenly
    const mp=rnd(5,60)*100; // mp = 500,600,...,6000
    const discPct=rnd(1,4)*10; // discPct = 10,20,30,40
    const discount=mp*discPct/100; // guaranteed integer
    const sp=mp-discount;
    return {q:`一把雨傘的標價為 $${mp}，現以 $${sp} 售出。求折扣百分率。`,given:`標價 $${mp}，售價 $${sp}`,val:discPct,mode:'percent',level:'程度一',formula:'折扣百分率 = (標價 - 售價) / 標價 × 100%',mp,sp,discount};
  },
];

// T2_L1: 求折扣金額（修復：確保 discount 為整數）
const DC_T2_L1=[
  function(){
    // discPct rnd(10,40) generates 10,20,30,40 - all divide 100 ✓
    const mp=rnd(300,3000), discPct=rnd(1,4)*10;
    const discount=mp*discPct/100; // guaranteed integer
    return {q:`一套小說的標價是 $${mp}，以 ${discPct}% 的折扣百分率購買。求節省了多少金額。`,given:`標價 $${mp}，折扣 ${discPct}%`,val:discount,mode:'amount',level:'程度一',formula:'折扣 = 標價 × 折扣%',mp,discount,discPct};
  },
  function(){
    // Fix: discPct must divide 100 evenly
    const mp=rnd(5,100)*10; // mp = 50,60,...,1000 - multiple of 10
    const discPct=rnd(1,2)*5; // discPct = 5,10 - both divide 100
    const discount=mp*discPct/100; // guaranteed integer
    return {q:`一瓶香水的標價是 $${mp}，現以 ${discPct}% 的折扣售出。求折扣金額。`,given:`標價 $${mp}，折扣 ${discPct}%`,val:discount,mode:'amount',level:'程度一',formula:'折扣 = 標價 × 折扣%',mp,discount,discPct};
  },
  function(){
    // Fix: discPct must divide 100 evenly
    const mp=rnd(5,40)*50; // mp = 250,300,...,2000
    const discPct=rnd(1,3)*10; // discPct = 10,20,30
    const discount=mp*discPct/100; // guaranteed integer
    return {q:`一束葡萄的標價為 $${mp}，現以 ${discPct}% 的折扣百分率售出。求折扣金額。`,given:`標價 $${mp}，折扣 ${discPct}%`,val:discount,mode:'amount',level:'程度一',formula:'折扣 = 標價 × 折扣%',mp,discount,discPct};
  },
];

// T3_L1: 求售價（修復：確保 discount/sp 為整數）
const DC_T3_L1=[
  function(){
    const mp=rnd(3,30)*100, discPct=rnd(1,4)*10;
    const discount=mp*discPct/100;
    const sp=mp-discount;
    return {q:`一套旅行套票的標價是 $${mp}，以 ${discPct}% 的折扣百分率售出。求該套旅行套票的售價。`,given:`標價 $${mp}，折扣 ${discPct}%`,val:sp,mode:'value',level:'程度一',formula:'售價 = 標價 × (1 - 折扣%)',mp,sp,discount,discPct};
  },
  function(){
    const mp=rnd(5,50)*100, discPct=rnd(1,2)*5;
    const discount=mp*discPct/100;
    const sp=mp-discount;
    return {q:`一個净水器的標價為 $${mp}。購買時獲 ${discPct}% 折扣優惠。颖兒購買該净水器的價格是多少？`,given:`標價 $${mp}，折扣 ${discPct}%`,val:sp,mode:'value',level:'程度一',formula:'售價 = 標價 × (1 - 折扣%)',mp,sp,discount,discPct};
  },
  function(){
    // Fix: discPct must divide 100 evenly
    const mp=rnd(8,50)*100, discPct=rnd(1,4)*10;
    const discount=mp*discPct/100;
    const sp=mp-discount;
    return {q:`一張書桌上的標價是 $${mp}，現以 ${discPct}% 的折扣出售。求該書桌的售價。`,given:`標價 $${mp}，折扣 ${discPct}%`,val:sp,mode:'value',level:'程度一',formula:'售價 = 標價 × (1 - 折扣%)',mp,sp,discount,discPct};
  },
];

// ===== 程度二：用除求標價 =====
// T4_L2: 求標價（用除法）（修復：確保 discount/sp 為整數）
const DC_T4_L2=[
  function(){
    // Fix: discPct must divide 100 evenly so discount is always integer
    const mp=rnd(3,20)*100, discPct=rnd(1,4)*5; // discPct = 5,10,15,20
    const discount=mp*discPct/100; // guaranteed integer
    const sp=mp-discount;
    return {q:`芷澄以 $${sp} 購買了一份午餐，節省了 $${discount}。求午餐的原標價。`,given:`售價 $${sp}，節省 $${discount}`,val:mp,mode:'mp',level:'程度二',formula:'標價 = 售價 + 折扣',mp,sp,discount,discPct};
  },
  function(){
    // Fix: discPct must divide 100 evenly so discount is always integer
    const mp=rnd(3,20)*100, discPct=rnd(1,4)*5; // discPct = 5,10,15,20
    const discount=mp*discPct/100; // guaranteed integer
    const sp=mp-discount;
    return {q:`美芬以 ${discPct}% 的折扣購買了一輛汽車，節省了 $${discount}。求該汽車的標價。`,given:`折扣 ${discPct}%，節省 $${discount}`,val:mp,mode:'mp',level:'程度二',formula:'標價 = 折扣金額 / 折扣% × 100%',mp,sp,discount,discPct};
  },
  function(){
    const mp=rnd(500,3000), discPctFixed=20;
    const sp=Math.round(mp*(1-discPctFixed/100));
    return {q:`淑清以八折優惠，用 $${sp} 購買了一副眼鏡。求該副眼鏡的標價。`,given:`售價 $${sp}，八折（即折扣20%）`,val:mp,mode:'mp',level:'程度二',formula:'標價 = 售價 / (1 - 折扣%)',mp,sp,discount:mp-sp,discPctFixed:20};
  },
  function(){
    // Fix: discPct must divide 100 evenly so discount is always integer
    const mp=rnd(10,50)*100, discPct=rnd(1,3)*5; // discPct = 5,10,15
    const discount=mp*discPct/100; // guaranteed integer
    const sp=mp-discount;
    return {q:`可瞳以 ${discPct}% 的折扣購買了一個生日蛋糕，節省了 $${discount}。求該生日蛋糕的售價。`,given:`折扣 ${discPct}%，節省 $${discount}`,val:sp,mode:'sp',level:'程度二',formula:'標價 = 折扣金額 / 折扣%；售價 = 標價 - 折扣',mp,sp,discount,discPct};
  },
];

// ===== 程度三：混合應用 =====
// 成本→標價→折扣→售價，多步驟
const DC_MIX_L3=[
  function(){
    const cost=rnd(1000,5000), markUp=rnd(20,50);
    const mp=Math.round(cost*(1+markUp/100));
    const discPct=rnd(10,30);
    const sp=Math.round(mp*(1-discPct/100));
    const profit=sp-cost;
    return {q:`智允以 $${cost} 購買了一部遊戲機。他先把該遊戲機的標價定為較成本高 ${markUp}%，然後以 ${discPct}% 的折扣把它售出。\n(a）求該遊戲機的標價。\n(b）求該遊戲機的售價。\n(c）求盈利或虧蝕。`,given:`成本 $${cost}，標價高於成本 ${markUp}%，折扣 ${discPct}%`,val:[mp,sp,profit],mode:'multi3',level:'程度三',formula:'標價=成本×(1+markUp%)；售價=標價×(1-折扣%)；盈利=售價-成本',parts:[`(a) 標價`,`(b) 售價`,`(c) 盈虧`],cost,mp,sp,discPct,markUp,profit,isProfit:profit>0};
  },
  function(){
    const cost=rnd(2000,10000), markUp=rnd(30,70);
    const mp=Math.round(cost*(1+markUp/100));
    const discAmt=rnd(500,Math.floor(mp*0.3));
    const sp=mp-discAmt;
    const profit=sp-cost;
    return {q:`樂瑤以 $${cost} 購買了一部電子焗爐。她先把該焗爐的標價定為較成本高 ${markUp}%，然後以 $${discAmt} 的折扣把它售予子浩。\n(a）求該電子焗爐的標價。\n(b）求子浩購買該電子焗爐的價格。\n(c）求樂瑤的盈利或虧蝕。`,given:`成本 $${cost}，標價高於成本 ${markUp}%，折扣 $${discAmt}`,val:[mp,sp,profit],mode:'multi3',level:'程度三',formula:'標價=成本×(1+markUp%)；售價=標價-折扣；盈利=售價-成本',parts:[`(a) 標價`,`(b) 售價`,`(c) 盈虧`],cost,mp,sp,discAmt,markUp,profit,isProfit:profit>0};
  },
  function(){
    const mp=rnd(3000,10000), discPct=rnd(10,40);
    const discount=Math.round(mp*discPct/100);
    const sp=mp-discount;
    const cost=rnd(Math.round(sp*0.7),Math.round(sp*0.9));
    const profit=sp-cost;
    return {q:`一間時裝店的老闆以 $${cost} 購入一批衣服，將標價定為 $${mp}，最後以 ${discPct}% 的折扣出售。\n(a）求該批衣服的售價。\n(b）求該店該次交易的盈利或虧蝕。`,given:`成本 $${cost}，標價 $${mp}，折扣 ${discPct}%`,val:[sp,profit],mode:'multi2',level:'程度三',formula:'售價=標價×(1-折扣%)；盈利=售價-成本',parts:[`(a) 售價`,`(b) 盈虧`],cost,mp,sp,discPct,profit,isProfit:profit>0};
  },
  function(){
    const mp=rnd(2000,8000), discPct1=rnd(10,30), discPct2=rnd(5,20);
    const sp1=Math.round(mp*(1-discPct1/100));
    const sp2=Math.round(sp1*(1-discPct2/100));
    const totalDiscount=(mp-sp2)/mp*100;
    return {q:`一件大衣的標價是 $${mp}。聖誕節期間先以 ${discPct1}% 的折扣出售，其後在未售出的情況下再以 ${discPct2}% 的額外折扣降價。\n(a）求最終售價。\n(b）求相對於標價的總折扣百分率。`,given:`標價 $${mp}，第一次折扣 ${discPct1}%，第二次折扣 ${discPct2}%`,val:[sp2,totalDiscount],mode:'multi2',level:'程度三',formula:'最終售價=標價×(1-第一折扣%)×(1-第二折扣%)',parts:[`(a) 最終售價`,`(b) 總折扣%`],mp,sp1,sp2,discPct1,discPct2};
  },
];

// ===== POOLS =====
const L1_POOL=[...DC_T1_L1,...DC_T2_L1,...DC_T3_L1];   // 程度一：10 templates
const L2_POOL=[...DC_T4_L2];                            // 程度二：4 templates
const L3_POOL=[...DC_MIX_L3];                             // 程度三：4 templates

const TYPE_LABELS={
  'percent':'❶ 求折扣百分率',
  'amount':'❷ 求折扣金額',
  'value':'❸ 求售價',
  'mp':'❸ 求標價',
  'sp':'❸ 求售價',
  'multi2':'❹ 混合應用（兩步折扣）',
  'multi3':'❹ 混合應用（標價→折扣→售價→盈虧）',
};

let cur=null;

function pickT(){
  for(let i=0;i<80;i++){
    let t;
    const r=Math.random();
    if(l3Unlocked){
      if(r<0.50) t=L1_POOL[rnd(0,L1_POOL.length-1)]();
      else if(r<0.80) t=L2_POOL[rnd(0,L2_POOL.length-1)]();
      else t=L3_POOL[rnd(0,L3_POOL.length-1)]();
    } else if(l2Unlocked){
      if(r<0.60) t=L1_POOL[rnd(0,L1_POOL.length-1)]();
      else t=L2_POOL[rnd(0,L2_POOL.length-1)]();
    } else {
      t=L1_POOL[rnd(0,L1_POOL.length-1)]();
    }
    if(Array.isArray(t.val)?t.val.every(isFinite):isFinite(t.val)) return t;
  }
  return L1_POOL[0]();
}

function renderBarChartDC(mp,sp,discount){
  const maxV=Math.max(mp,sp)*1.1;
  const mpW=(mp/maxV*100).toFixed(1);
  const spW=(sp/maxV*100).toFixed(1);
  return `<div class="bar-chart">
    <div class="bar-row"><div class="bar-label">標價</div><div class="bar-outer"><div class="bar-inner" style="width:${mpW}%;background:#3498db">$${mp}</div></div></div>
    <div class="diff-row"><div class="diff-label">折扣</div><div style="flex:1">$${discount}（${(discount/mp*100).toFixed(1)}%）</div></div>
    <div class="bar-row"><div class="bar-label">售價</div><div class="bar-outer"><div class="bar-inner" style="width:${spW}%;background:#27ae60">$${sp}</div></div></div>
  </div>`;
}

function renderBarChartDCMulti3(cost,mp,sp,markUp,discPct,profit){
  const maxV=Math.max(cost,mp,sp)*1.1;
  const costW=(cost/maxV*100).toFixed(1);
  const mpW=(mp/maxV*100).toFixed(1);
  const spW=(sp/maxV*100).toFixed(1);
  const profitColor=profit>=0?'#27ae60':'#e74c3c';
  return `<div class="bar-chart">
    <div class="bar-row"><div class="bar-label">成本</div><div class="bar-outer"><div class="bar-inner" style="width:${costW}%;background:#7f8c8d">$${cost}</div></div></div>
    <div class="diff-row"><div class="diff-label">標價↑</div><div style="flex:1">+${markUp}% → $${mp}</div></div>
    <div class="bar-row"><div class="bar-label">標價</div><div class="bar-outer"><div class="bar-inner" style="width:${mpW}%;background:#e67e22">$${mp}</div></div></div>
    <div class="diff-row"><div class="diff-label">折扣↓</div><div style="flex:1">-${discPct}% → 售價 $${sp}</div></div>
    <div class="diff-row"><div class="diff-label" style="color:${profitColor}">${profit>=0?'盈利':'虧蝕'}</div><div style="flex:1;color:${profitColor};font-weight:700">$${Math.abs(profit)}</div></div>
    <div class="bar-row"><div class="bar-label">售價</div><div class="bar-outer"><div class="bar-inner" style="width:${spW}%;background:${profitColor}">$${sp}</div></div></div>
  </div>`;
}

function buildStepsDC(mode,mp,sp,discount,discPct){
  if(mode==='percent'){
    return [
      {s:`寫出公式：<span class="formula-highlight">折扣百分率 = (標價 - 售價) / 標價 × 100%</span>`},
      {s:`計算折扣：$${mp} - $${sp} = $${discount}`},
      {s:`代入：$${discount} / $${mp} × 100%`},
      {s:`= <strong>${fmt(discPct)}%</strong>`},
    ];
  } else if(mode==='amount'){
    return [
      {s:`寫出公式：<span class="formula-highlight">折扣 = 標價 × 折扣%</span>`},
      {s:`代入：$${mp} × ${discPct}%`},
      {s:`= $${mp} × ${(discPct/100).toFixed(4)}`},
      {s:`= <strong>$${discount}</strong>`},
    ];
  } else if(mode==='value'){
    return [
      {s:`寫出公式：<span class="formula-highlight">售價 = 標價 × (1 - 折扣%)</span>`},
      {s:`計算：(1 - ${discPct}%) = ${(1-discPct/100).toFixed(4)}`},
      {s:`代入：$${mp} × ${(1-discPct/100).toFixed(4)}`},
      {s:`= <strong>$${sp}</strong>`},
    ];
  } else if(mode==='mp'){
    return [
      {s:`寫出公式：<span class="formula-highlight">標價 = 折扣金額 / 折扣% × 100%</span>`},
      {s:`代入：$${discount} / ${discPct}% × 100%`},
      {s:`= $${discount} / ${(discPct/100).toFixed(4)}`},
      {s:`= <strong>$${mp}</strong>`},
    ];
  } else if(mode==='sp'){
    const theDiscPct=discPct;
    const theMp=Math.round(discount/theDiscPct*100);
    return [
      {s:`先求標價：<span class="formula-highlight">標價 = 折扣金額 / 折扣% × 100%</span>`},
      {s:`= $${discount} / ${theDiscPct}% × 100% = $${theMp}`},
      {s:`再求售價：<span class="formula-highlight">售價 = 標價 - 折扣</span>`},
      {s:`= $${theMp} - $${discount} = <strong>$${sp}</strong>`},
    ];
  }
}

function buildStepsDCMulti3(cost,mp,sp,markUp,discPct,profit){
  const profitColor=profit>=0?'#27ae60':'#e74c3c';
  return [
    {s:`Step 1：求標價<br><span class="formula-highlight">標價 = 成本 × (1 + markUp%)</span>`},
    {s:`= $${cost} × (1 + ${markUp}%) = $${cost} × ${(1+markUp/100).toFixed(2)} = <strong>$${mp}</strong>`},
    {s:`Step 2：求售價<br><span class="formula-highlight">售價 = 標價 × (1 - 折扣%)</span>`},
    {s:`= $${mp} × (1 - ${discPct}%) = $${mp} × ${(1-discPct/100).toFixed(2)} = <strong>$${sp}</strong>`},
    {s:`Step 3：求盈虧<br><span class="formula-highlight">盈利/虧蝕 = 售價 - 成本</span>`},
    {s:`= $${sp} - $${cost} = <strong style="color:${profitColor}">${profit>=0?'盈利':'虧蝕'} $${Math.abs(profit)}</strong>`},
  ];
}

function nextQ(){
  cur=pickT();
  currentPart=0;
  document.getElementById('typeTag').innerHTML=TYPE_LABELS[cur.mode]||'❶❷❸❹';
  document.getElementById('levelTag').style.display='inline-block';
  document.getElementById('levelTag').innerText=cur.level;
  document.getElementById('qtext').innerHTML=cur.q.indexOf('\n')!==-1?cur.q.replace(/\n/g,'<br>'):cur.q;
  const gi=document.getElementById('givenInfo');
  gi.style.display='block';
  gi.innerText=cur.given;
  const fb=document.getElementById('formulaBox');
  fb.style.display='block';
  fb.innerHTML=`📐 公式：<strong>${cur.formula}</strong>`;
  document.getElementById('inputDisplay').innerText='_';
  document.getElementById('result').style.display='none';
  document.getElementById('feedbackPanel').style.display='none';
  document.getElementById('correctAnswerBox').style.display='none';
  document.getElementById('resultDetail').innerText='';
  const ft=document.getElementById('formatHint');
  if(cur.mode==='percent'){ft.innerText='請以%格式作答（如 20%）';}
  else if(cur.mode==='amount'){ft.innerText='請輸入金額（如 150）';}
  else{ft.innerText='請輸入金額（如 2400）';}
}

function typeKey(k){
  if(k==='del'){const e=document.getElementById('inputDisplay');e.innerText=e.innerText.length>1?e.innerText.slice(0,-1):'_';return;}
  if(k==='clear'){document.getElementById('inputDisplay').innerText='_';return;}
  const e=document.getElementById('inputDisplay');
  if(e.innerText==='_')e.innerText=k;else e.innerText+=k;
}

function handleCorrect(msg){
  const isL1=cur.level==='程度一',isL2=cur.level==='程度二',isL3=cur.level==='程度三';
  if(isL1){scoreL1++;streakL1++;l1Attempts++;}
  else if(isL2){scoreL2++;streakL2++;l2Attempts++;}
  else{scoreL3++;streakL3++;}
  document.getElementById('msg').innerHTML=msg;
  document.getElementById('result').style.display='flex';
  updateStats();
}

function handleWrong(msg,cabox){
  const isL1=cur.level==='程度一',isL2=cur.level==='程度二',isL3=cur.level==='程度三';
  if(isL1){wrongL1++;streakL1=0;l1Attempts++;}
  else if(isL2){wrongL2++;streakL2=0;l2Attempts++;}
  else{wrongL3++;streakL3=0;}
  document.getElementById('msg').innerHTML=msg;
  cabox.style.display='block';
  document.getElementById('result').style.display='flex';
  updateStats();
}

function submitAns(){
  let raw=document.getElementById('inputDisplay').innerText;
  if(raw==='_'||!raw.trim()) return;
  const u=normalize(raw);
  const cabox=document.getElementById('correctAnswerBox');
  const fbPanel=document.getElementById('feedbackPanel');
  const stepsEl=document.getElementById('stepsContainer');
  const barEl=document.getElementById('barChart');
  const isL1=cur.level==='程度一',isL2=cur.level==='程度二',isL3=cur.level==='程度三';

  // ===== multi2: [sp, totalPct] =====
  if(cur.mode==='multi2'){
    const vals=Array.isArray(cur.val)?cur.val:[cur.val];
    const userVal=parseFloat(u.replace('$','').replace('%',''));
    if(!isFinite(userVal)){document.getElementById('msg').innerHTML='<span style="color:#e67e22">請輸入數字</span>';document.getElementById('result').style.display='flex';return;}
    const exp=vals[currentPart];
    const expStr=currentPart===1?fmt(Math.abs(exp))+'%':'$'+fmt(Math.abs(exp));
    const userStr=currentPart===1?fmt(Math.abs(userVal)):fmt(Math.abs(userVal));
    const correct=userStr===fmt(Math.abs(exp));
    if(correct){
      const msgs=['✓ (a) 正確！繼續 (b)','✓ (b) 正確！'];
      handleCorrect(`<span style="color:#27ae60">${msgs[currentPart]}</span>`);
      currentPart++;
      if(currentPart>=2) currentPart=0;
    } else {
      const partLabels=[`售價 = $${fmt(Math.abs(vals[0]))}`,`總折扣% = ${fmt(Math.abs(vals[1]))}%`];
      handleWrong(`<span style="color:#e74c3c">✗ ${['(a)','(b)'][currentPart]} 不正確，正確答案：${partLabels[currentPart]}</span>`,cabox);
      currentPart=0;
    }
    // bar chart
    if(cur.mp&&cur.sp2){
      const maxV=Math.max(cur.mp,cur.sp2)*1.1;
      const mpW=(cur.mp/maxV*100).toFixed(1);
      const sp2W=(cur.sp2/maxV*100).toFixed(1);
      barEl.innerHTML=`<div class="bar-chart"><div class="bar-row"><div class="bar-label">標價</div><div class="bar-outer"><div class="bar-inner" style="width:${mpW}%;background:#3498db">$${cur.mp}</div></div></div><div class="diff-row"><div class="diff-label">折扣</div><div style="flex:1">$${cur.mp-cur.sp2}（${(cur.discPct1+cur.discPct2-cur.discPct1*cur.discPct2/100).toFixed(1)}%）</div></div><div class="bar-row"><div class="bar-label">最終售價</div><div class="bar-outer"><div class="bar-inner" style="width:${sp2W}%;background:#27ae60">$${cur.sp2}</div></div></div></div>`;
    } else if(cur.cost){
      const maxV=Math.max(cur.cost,cur.mp,cur.sp)*1.1;
      const costW=(cur.cost/maxV*100).toFixed(1);
      const mpW=(cur.mp/maxV*100).toFixed(1);
      const spW=(cur.sp/maxV*100).toFixed(1);
      const profitColor=(cur.sp-cur.cost)>=0?'#27ae60':'#e74c3c';
      barEl.innerHTML=`<div class="bar-chart"><div class="bar-row"><div class="bar-label">成本</div><div class="bar-outer"><div class="bar-inner" style="width:${costW}%;background:#7f8c8d">$${cur.cost}</div></div></div><div class="diff-row"><div class="diff-label">標價↑</div><div style="flex:1">標價 $${cur.mp}</div></div><div class="bar-row"><div class="bar-label">標價</div><div class="bar-outer"><div class="bar-inner" style="width:${mpW}%;background:#e67e22">$${cur.mp}</div></div></div><div class="diff-row"><div class="diff-label">折扣↓</div><div style="flex:1">-${cur.discPct}% → 售價 $${cur.sp}</div></div><div class="diff-row"><div class="diff-label" style="color:${profitColor}">${(cur.sp-cur.cost)>=0?'盈利':'虧蝕'}</div><div style="flex:1;color:${profitColor};font-weight:700">$${Math.abs(cur.sp-cur.cost)}</div></div><div class="bar-row"><div class="bar-label">售價</div><div class="bar-outer"><div class="bar-inner" style="width:${spW}%;background:${profitColor}">$${cur.sp}</div></div></div></div>`;
    }
    fbPanel.style.display='block';
    if(!l2Unlocked && l1Attempts>=UNLOCK_L2_MIN && l1Accuracy()>=UNLOCK_L2_ACCURACY) l2Unlocked=true;
    if(l2Unlocked && !l3Unlocked && l2Attempts>=UNLOCK_L3_MIN && l2Accuracy()>=UNLOCK_L3_ACCURACY) l3Unlocked=true;
    return;
  }

  // ===== multi3: [mp, sp, profit] =====
  if(cur.mode==='multi3'){
    const vals=Array.isArray(cur.val)?cur.val:[cur.val];
    const userVal=parseFloat(u.replace('$',''));
    if(!isFinite(userVal)){document.getElementById('msg').innerHTML='<span style="color:#e67e22">請輸入數字</span>';document.getElementById('result').style.display='flex';return;}
    const exp=vals[currentPart];
    const expStr='$'+fmt(Math.abs(exp));
    const userStr=fmt(Math.abs(userVal));
    const correct=userStr===fmt(Math.abs(exp));
    if(correct){
      const msgs=['✓ (a) 正確！繼續 (b)','✓ (b) 正確！繼續 (c)','✓ (c) 正確！'];
      handleCorrect(`<span style="color:#27ae60">${msgs[currentPart]}</span>`);
      currentPart++;
      if(currentPart>=3) currentPart=0;
    } else {
      const partLabels=[`標價 = $${fmt(Math.abs(vals[0]))}`,`售價 = $${fmt(Math.abs(vals[1]))}`,`${cur.isProfit?'盈利':'虧蝕'} = $${fmt(Math.abs(vals[2]))}`];
      handleWrong(`<span style="color:#e74c3c">✗ ${['(a)','(b)','(c)'][currentPart]} 不正確，正確答案：${partLabels[currentPart]}</span>`,cabox);
      currentPart=0;
    }
    barEl.innerHTML=renderBarChartDCMulti3(cur.cost,cur.mp,cur.sp,cur.markUp||20,cur.discPct||cur.discAmt?Math.round((cur.discAmt||0)/cur.mp*100):20,cur.profit||0);
    stepsEl.innerHTML=buildStepsDCMulti3(cur.cost,cur.mp,cur.sp,cur.markUp||20,cur.discPct||20,cur.profit||0).map((s,i)=>`<div class="step"><span class="step-num">${i+1}</span><span class="step-text">${s.s}</span></div>`).join('');
    fbPanel.style.display='block';
    if(!l2Unlocked && l1Attempts>=UNLOCK_L2_MIN && l1Accuracy()>=UNLOCK_L2_ACCURACY) l2Unlocked=true;
    if(l2Unlocked && !l3Unlocked && l2Attempts>=UNLOCK_L3_MIN && l2Accuracy()>=UNLOCK_L3_ACCURACY) l3Unlocked=true;
    return;
  }

  const uNum=parseFloat(u.replace('$','').replace('%',''));
  if(!isFinite(uNum)){document.getElementById('msg').innerHTML='<span style="color:#e67e22">請輸入有效數字</span>';document.getElementById('result').style.display='flex';return;}

  if(cur.mode==='percent'){
    if(!u.includes('%')){document.getElementById('msg').innerHTML='<span style="color:#e67e22">請以%格式作答（如 20%）</span>';document.getElementById('result').style.display='flex';return;}
    const userStr=fmt(Math.abs(uNum));
    const expStr=fmt(Math.abs(cur.val));
    const correct=userStr===expStr;
    if(correct) handleCorrect(`<span style="color:#27ae60">✓ 正確！</span>`);
    else{handleWrong(`<span style="color:#e74c3c">✗ 不正確。</span>`,cabox);cabox.innerHTML=`正確答案：<strong>${expStr}%</strong>`;}
    barEl.innerHTML=renderBarChartDC(cur.mp,cur.sp,cur.discount);
    stepsEl.innerHTML=buildStepsDC('percent',cur.mp,cur.sp,cur.discount,cur.discount/cur.mp*100).map((s,i)=>`<div class="step"><span class="step-num">${i+1}</span><span class="step-text">${s.s}</span></div>`).join('');
  } else if(cur.mode==='amount'){
    const userStr=fmt(Math.abs(uNum));
    const expStr=fmt(Math.abs(cur.val));
    const correct=userStr===expStr;
    if(correct) handleCorrect(`<span style="color:#27ae60">✓ 正確！</span>`);
    else{handleWrong(`<span style="color:#e74c3c">✗ 不正確。</span>`,cabox);cabox.innerHTML=`正確答案：<strong>$${expStr}</strong>`;}
    barEl.innerHTML=renderBarChartDC(cur.mp,cur.mp-cur.discount,cur.discount);
    stepsEl.innerHTML=buildStepsDC('amount',cur.mp,cur.mp-cur.discount,cur.discount,cur.discPct||20).map((s,i)=>`<div class="step"><span class="step-num">${i+1}</span><span class="step-text">${s.s}</span></div>`).join('');
  } else if(cur.mode==='value'||cur.mode==='sp'){
    const userStr=fmt(Math.abs(uNum));
    const expStr=fmt(Math.abs(cur.val));
    const correct=userStr===expStr;
    if(correct) handleCorrect(`<span style="color:#27ae60">✓ 正確！</span>`);
    else{handleWrong(`<span style="color:#e74c3c">✗ 不正確。</span>`,cabox);cabox.innerHTML=`正確答案：<strong>$${expStr}</strong>`;}
    const dPct=cur.discPctFixed||cur.discPct||((cur.mp-cur.sp)/cur.mp*100);
    barEl.innerHTML=renderBarChartDC(cur.mp,cur.sp,cur.discount||(cur.mp-cur.sp));
    stepsEl.innerHTML=buildStepsDC('value',cur.mp,cur.sp,cur.discount||(cur.mp-cur.sp),dPct).map((s,i)=>`<div class="step"><span class="step-num">${i+1}</span><span class="step-text">${s.s}</span></div>`).join('');
  } else if(cur.mode==='mp'){
    const userStr=fmt(Math.abs(uNum));
    const expStr=fmt(Math.abs(cur.val));
    const correct=userStr===expStr;
    if(correct) handleCorrect(`<span style="color:#27ae60">✓ 正確！</span>`);
    else{handleWrong(`<span style="color:#e74c3c">✗ 不正確。</span>`,cabox);cabox.innerHTML=`正確答案：<strong>$${expStr}</strong>`;}
    const dPct=cur.discPctFixed||cur.discPct||(cur.discount/cur.mp*100);
    stepsEl.innerHTML=buildStepsDC('mp',cur.mp,cur.sp,cur.discount,dPct).map((s,i)=>`<div class="step"><span class="step-num">${i+1}</span><span class="step-text">${s.s}</span></div>`).join('');
    barEl.innerHTML=renderBarChartDC(cur.mp,cur.sp,cur.discount);
  }

  // Check unlocks
  if(!l2Unlocked && l1Attempts>=UNLOCK_L2_MIN && l1Accuracy()>=UNLOCK_L2_ACCURACY) l2Unlocked=true;
  if(l2Unlocked && !l3Unlocked && l2Attempts>=UNLOCK_L3_MIN && l2Accuracy()>=UNLOCK_L3_ACCURACY) l3Unlocked=true;

  fbPanel.style.display='block';
  document.getElementById('result').style.display='flex';
  updateStats();
}

updateStats();
nextQ();
</script>
