    .top-button{border:1px solid var(--line);background:#fff;white-space:nowrap}
    .top-button:hover{color:var(--green-dark);background:var(--soft)}

    .stats{display:grid;grid-template-columns:1.1fr repeat(7,1fr);gap:5px;margin-bottom:9px}
    .stat{min-width:0;border:1px solid var(--line);border-radius:10px;padding:6px 3px;background:#fff;text-align:center}
    .stat strong{display:block;color:var(--green-dark);font-size:1rem;line-height:1.1}
    .stat small{display:block;margin-top:2px;color:var(--muted);font-size:.62rem;font-weight:800;white-space:nowrap}
    .stat.total{background:var(--soft)}
    .question-card,.accordion-card,.print-card{border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 10px 28px #164e3a10}
    .question-card{padding:13px;margin-bottom:9px}
    .question-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .eyebrow{color:var(--green-dark);font-size:.69rem;font-weight:950;letter-spacing:.04em}
    .refresh{border:1px solid var(--line);border-radius:7px;padding:4px 7px;color:var(--muted);background:#fff;font-size:.7rem;font-weight:850}
    .question-instruction{margin:8px 0;color:var(--muted);font-size:.82rem;font-weight:700}
    .question-expression{min-height:68px;display:grid;place-items:center;overflow:auto;border:1px solid #bfe5d5;border-radius:11px;padding:10px;background:linear-gradient(135deg,#effdf7,#f5fbef);font-size:1.25rem;text-align:center;white-space:nowrap}
    #accordion-container{display:grid;gap:7px}
    .accordion-card.locked{opacity:.62;background:#f8fbfa}
    .accordion-card.active{border-color:#34a879;box-shadow:0 8px 20px #05966918}
    .accordion-card.done{border-color:#9bd7bd;background:#f5fff9}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;cursor:pointer}
    .section-title{display:flex;align-items:center;gap:8px;min-width:0;font-size:.8rem;font-weight:950}
    .section-number{display:grid;place-items:center;flex:0 0 24px;width:24px;height:24px;border-radius:50%;color:var(--muted);background:#e5eeee;font-size:.72rem}
    .active .section-number{color:#fff;background:var(--green)}
    .done .section-number{color:var(--good);background:#d7f5e4}
    .section-state{color:var(--muted);font-size:.67rem;font-weight:850;white-space:nowrap}
    .section-body{border-top:1px solid #e5eeee;padding:10px 12px 12px}
    .section-prompt{margin-bottom:9px;color:var(--ink);font-size:.79rem;font-weight:700;line-height:1.65}
    .options{display:grid;gap:6px}
    .option{display:flex;align-items:flex-start;gap:8px;width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 9px;color:var(--ink);background:#fff;text-align:left;font-size:.77rem;line-height:1.55}
    .option:hover,.option.selected{border-color:#34a879;background:var(--soft)}
    .option-mark{display:grid;place-items:center;flex:0 0 20px;width:20px;height:20px;border:1px solid #b8cbca;border-radius:50%;font-size:.68rem;font-weight:900}
    .option.selected .option-mark{color:#fff;border-color:var(--green);background:var(--green)}
    .math-box{border:1px solid var(--line);border-radius:10px;padding:9px;background:#f8fbfa}
    .math-label{margin-bottom:5px;color:var(--green-dark);font-size:.75rem;font-weight:900}
    .math-input{width:100%;min-height:40px;border:2px solid #c9d9d7;border-radius:8px;padding:6px 9px;color:var(--ink);background:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9rem;font-weight:850}
    .math-input:read-only{cursor:default}
    .section-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
    .step-count{color:var(--muted);font-size:.67rem;font-weight:850}
    .action{border:0;border-radius:8px;padding:7px 12px;color:#fff;background:var(--green);font-size:.75rem;font-weight:900}
    .action:hover{background:var(--green-dark)}
    .action.secondary{border:1px solid var(--line);color:var(--ink);background:#fff}
    .action.secondary:hover{color:var(--green-dark);background:var(--soft)}
    .completed-summary{border-top:1px solid #e5eeee;padding:7px 12px;color:var(--muted);font-size:.71rem}
    .completed-summary b{color:var(--good)}
    .caption{margin:10px 0 2px;color:#839594;font-size:.68rem;text-align:center}
    footer.keypad{display:none;position:sticky;bottom:0;z-index:4;border-top:1px solid var(--line);padding:6px 10px;background:#fff;box-shadow:0 -8px 20px #164e3a10}
    footer.keypad.visible{display:block}
    .keypad-inner{width:min(500px,100%);margin:auto}
    .preview-line{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:25px;margin-bottom:4px;color:var(--green-dark);font-size:.75rem;font-weight:850}
    .preview-line span{overflow:auto;white-space:nowrap}
    .key-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
    .key{min-height:35px;border:1px solid #c9d9d7;border-radius:7px;color:var(--ink);background:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86rem;font-weight:900;touch-action:manipulation}
    .key:hover{background:#f1faf6}.key.op{color:var(--green-dark);background:#effcf7}.key.danger{color:var(--bad);background:var(--bad-soft)}
    .sheet{position:fixed;inset:auto 0 0;z-index:20;width:min(700px,100%);max-height:78dvh;margin:auto;border:1px solid var(--line);border-radius:17px 17px 0 0;background:#fff;box-shadow:0 -14px 36px #164e3a35;transform:translateY(110%);opacity:0;pointer-events:none;transition:transform .22s ease,opacity .18s ease}
    .sheet.open{transform:translateY(0);opacity:1;pointer-events:auto}
    .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid #e5eeee;background:#f7fbf9}
    .sheet-title{font-size:.82rem;font-weight:950}
    .sheet-body{max-height:55dvh;overflow:auto;padding:11px 12px;font-size:.76rem;line-height:1.7}
    .sheet-error{border-radius:8px;padding:8px;color:var(--bad);background:var(--bad-soft)}
    .proof-step{margin:5px 0;border:1px solid #ccebd9;border-radius:8px;padding:7px;background:#f8fffb}
    .sheet-actions{display:flex;gap:6px;padding:8px 12px;border-top:1px solid #e5eeee}
    .sheet-actions .action{flex:1}
    .dialog{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:12px;background:#102a2388}
    .dialog[hidden]{display:none}
    .dialog-panel{width:min(620px,100%);max-height:86dvh;display:flex;flex-direction:column;border-radius:15px;background:#fff;overflow:hidden}
    .dialog-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:linear-gradient(135deg,#ecfdf5,#fefce8)}
    .dialog-head h2{margin:0;font-size:1rem}
    .dialog-body{overflow:auto;padding:12px 14px;font-size:.76rem}
    .history-row{border-bottom:1px solid var(--line);padding:8px 0}.history-row:last-child{border-bottom:0}
    .history-row strong{display:block;color:var(--green-dark)}.history-row small{color:var(--muted)}
    .dialog-actions{display:flex;justify-content:flex-end;gap:7px;padding:9px 12px;border-top:1px solid #e5eeee}
    .completion-grid{display:grid;gap:6px;margin-top:9px}
    .completion-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#f8fbfa;font-size:.76rem}
    .completion-row strong{color:var(--green-dark)}
    .print-target{display:none}
    .print-target.print-measure{display:block;position:fixed;left:-100000px;top:0;width:800px;max-width:800px;background:#fff}
    @media(max-width:680px){.topbar{flex-wrap:wrap}.brand{order:0}.mode-select{order:1;flex-basis:calc(100% - 38px)}.difficulty{order:2}.top-actions{order:3;margin-left:auto}.stats{grid-template-columns:repeat(4,1fr)}.stat.total{grid-column:span 1}.stat small{font-size:.55rem}.question-expression{font-size:1.05rem}.section-head{padding:9px}.section-body{padding:9px}.option{font-size:.74rem}}

  </style>
</head>

    <section id="accordion-container" aria-live="polite"></section>
    <p class="caption" id="caption"></p>

  <footer class="keypad" id="keypad-container">

      <div class="key-grid" id="key-grid"></div>

    <div class="sheet-actions"><button class="action secondary" id="feedback-retry" type="button" hidden></button><button class="action" id="feedback-next" type="button"></button></div>
  </section>

  <section class="dialog" id="student-dialog" hidden>

  <section class="dialog" id="history-dialog" hidden>
    <div class="dialog-panel"><div class="dialog-head"><h2 id="history-title"></h2><button class="refresh" data-close-dialog="history-dialog" type="button">✕</button></div><div class="dialog-body" id="history-list"></div><div class="dialog-actions"><button class="action secondary" type="button" id="history-clear"></button><button class="action" data-close-dialog="history-dialog" type="button" id="history-close"></button></div></div>
  </section>

  <section class="dialog" id="completion-dialog" hidden>
    <div class="dialog-panel">
      <div class="dialog-head"><h2 id="completion-title"></h2><button class="refresh" data-close-dialog="completion-dialog" type="button">✕</button></div>
      <div class="dialog-body">
        <p id="completion-message"></p>
        <div class="completion-grid">
          <div class="completion-row"><span id="completion-total-label"></span><strong id="completion-total"></strong></div>
          <p id="completion-first-label"></p>
          <div class="completion-row"><span id="completion-setup-label"></span><strong id="completion-setup"></strong></div>
          <div class="completion-row"><span id="completion-base-label"></span><strong id="completion-base"></strong></div>
          <div class="completion-row"><span id="completion-hypothesis-label"></span><strong id="completion-hypothesis"></strong></div>
          <div class="completion-row"><span id="completion-inductive-label"></span><strong id="completion-inductive"></strong></div>
          <div class="completion-row"><span id="completion-conclusion-label"></span><strong id="completion-conclusion"></strong></div>
          <div class="completion-row"><span id="completion-score-label"></span><strong id="completion-score"></strong></div>
        </div>
      </div>
      <div class="dialog-actions"><button class="action secondary" id="completion-close" type="button"></button><button class="action" id="completion-restart" type="button"></button></div>
    </div>
  </section>

  <div class="print-target" id="print-target"></div>
</div>

  function latexToAscii(expr){

      if(!numerator||!denominator)break;

  function asciiLatex(value){

  function checkMathStep(sec,index,stepIndex){
    var step=sec.steps[stepIndex];
    if(step.slots){
      var firstValue=stepInputValue(index,stepIndex,0),secondValue=stepInputValue(index,stepIndex,1);
      var firstCorrect=!!firstValue&&equivalent(firstValue,step.slots[0].target),secondCorrect=!!secondValue&&equivalent(secondValue,step.slots[1].target);
      return {correct:firstCorrect&&secondCorrect,values:[firstValue,secondValue],reason:(firstValue&&secondValue)?text("mathIncorrect"):text("noInput"),slotResults:[firstCorrect,secondCorrect]}
    }
    var value=stepInputValue(index,stepIndex),correct;
    if(!value)return {correct:false,values:[value],reason:text("noInput")};
    if(step.strictSubstitution){
      correct=exactSubstitution(value,step.target);
      if(!correct&&equivalent(value,step.target))return {correct:false,values:[value],reason:text("substitutionIncorrect")}
    }else correct=equivalent(value,step.target);
    if(stepIndex===4&&sec.subFlow==="proof-chain"){
      var prior=state.answers[index]&&state.answers[index].steps&&state.answers[index].steps[2];
      if(!prior||!equivalent(prior,value))return {correct:false,values:[value],reason:text("crossMismatch")}
    }
    return {correct:correct,values:[value],reason:correct?"":text("mathIncorrect")}
  }

  function submitMath(index){
    if(state.answered)return;
    var sec=state.question.sections[index],stepIndex=sec.steps?state.inductiveStep:undefined,check=sec.steps?checkMathStep(sec,index,stepIndex):null;
    if(!sec.steps){
      var value=stepInputValue(index);if(!value){showError(text("noInput"),text("useKeypad"));return}
      check={correct:equivalent(value,sec.target),values:[value],reason:text("mathIncorrect")}
    }
    var firstKey=sec.steps?index+"_"+stepIndex:index;
    if(state.first[firstKey]===undefined)state.first[firstKey]=check.correct;
    if(!state.answers[index])state.answers[index]=sec.steps?{steps:[]}:"";
    if(sec.steps){
      if(!state.answers[index].steps)state.answers[index].steps=[];
      if(check.values.length>1)state.answers[index].steps[stepIndex]={slots:check.values.slice()};
      else state.answers[index].steps[stepIndex]=check.values[0];
    }else state.answers[index]=check.values[0];
    if(!check.correct){showError(sectionTitle(sec.key)+" · "+text("mathIncorrect"),check.reason||text("mathIncorrect"));return}
    if(sec.steps&&stepIndex+1<sec.steps.length){state.inductiveStep=stepIndex+1;state.activeInput=null;renderAccordion();return}
    if(sec.steps){
      var allFirst=sec.steps.every(function(_,subIndex){return state.first[index+"_"+subIndex]===true});
      state.first[index]=allFirst
    }
    advance(index)
  }

  function finishQuestion(){
    if(state.answered)return;
    state.answered=true;state.round++;
    var keys=["setup","base","hypothesis","inductive","conclusion"],score=0,result={};
    keys.forEach(function(key,index){var correct=state.first[index]===true;result[key]=correct;if(correct)score++});
    var all=score===5;state.last={question:state.question,score:score,result:result,isReview:state.reviewing};
    if(state.reviewing){
      state.reviewStats.answeredQuestions++;
      keys.forEach(function(key){if(result[key]){state.reviewStats.sectionStats[key]++;state.reviewStats.totalCorrect++}state.reviewStats.totalAttempted++});
      if(all){var reviewIndex=state.mistakes.findIndex(function(item){return item.question===state.question});if(reviewIndex!==-1)state.mistakes.splice(reviewIndex,1)}
    }else{
      state.answeredQuestions++;
      keys.forEach(function(key){if(result[key]){state.sectionStats[key]++;state.totalCorrect++}state.totalAttempted++});
      state.history.unshift({time:new Date().toISOString(),title:state.question.title,score:score,result:result,answer:state.question.displayAnswer,solution:state.question.stepsDisplay});
      if(!all)state.mistakes.push({question:state.question,score:score,result:result});
      saveHistory()
    }
    renderAccordion();updateStats();updateKeypad();showFinished(all)
  }
  function showFinished(all){
    $("feedback-title").textContent=all?text("fullMarks"):text("partial");$("feedback-error").hidden=true;
    var html="";state.question.stepsDisplay.forEach(function(step,index){html+='<div class="proof-step">('+(index+1)+') '+esc(step)+"</div>"});
    html+='<div class="proof-step"><strong>'+text("standardAnswer")+' $'+esc(state.question.displayAnswer)+'$</strong></div>';
    $("feedback-proof").innerHTML=html;$("feedback-retry").hidden=all;$("feedback-next").hidden=false;$("feedback-close").textContent=text("close");$("feedback-sheet").classList.add("open");typeset($("feedback-sheet"))
  }
  function closeFeedback(){$("feedback-sheet").classList.remove("open")}
  function updateStats(){
    $("stat-total").textContent=state.totalCorrect+"/"+(state.answeredQuestions*5||0);
    $("stat-setup").textContent=state.sectionStats.setup;$("stat-base").textContent=state.sectionStats.base;$("stat-hypothesis").textContent=state.sectionStats.hypothesis;$("stat-inductive").textContent=state.sectionStats.inductive;$("stat-conclusion").textContent=state.sectionStats.conclusion;$("stat-errors").textContent=state.mistakes.length;$("stat-question").textContent=Math.min(state.round,state.total)+"/"+state.total;$("review-button").hidden=!state.mistakes.length||state.reviewing
  }
  function saveHistory(){try{localStorage.setItem("hk_m2_induction_history",JSON.stringify(state.history.slice(0,50)))}catch(e){}}
  function loadHistory(){try{var saved=JSON.parse(localStorage.getItem("hk_m2_induction_history")||"[]");if(Array.isArray(saved))state.history=saved}catch(e){state.history=[]}}
  function renderHistory(){
    var list=$("history-list");if(!state.history.length){list.innerHTML="<p>"+text("noHistory")+"</p>";return}
    list.innerHTML=state.history.map(function(item){return'<div class="history-row"><strong>'+esc(item.title)+" · "+item.score+"/5</strong><small>"+new Date(item.time).toLocaleString(state.lang==="zh"?"zh-HK":"en-HK")+" · "+(item.score===5?text("correct"):text("wrong"))+"</small></div>"}).join("")
  }
  function resetSession(){
    state.round=1;state.total=10;state.sectionStats={setup:0,base:0,hypothesis:0,inductive:0,conclusion:0};state.totalCorrect=0;state.totalAttempted=0;state.answeredQuestions=0;state.mistakes=[];state.review=[];state.reviewing=false;state.reviewBaseline=null;state.reviewStats={sectionStats:{setup:0,base:0,hypothesis:0,inductive:0,conclusion:0},totalCorrect:0,totalAttempted:0,answeredQuestions:0};resetQuestion(generateQuestion());updateStats()
  }
  function startMistakesReview(){
    if(!state.mistakes.length)return;
    state.reviewBaseline={sectionStats:Object.assign({},state.sectionStats),totalCorrect:state.totalCorrect,totalAttempted:state.totalAttempted,answeredQuestions:state.answeredQuestions};
    state.reviewStats={sectionStats:{setup:0,base:0,hypothesis:0,inductive:0,conclusion:0},totalCorrect:0,totalAttempted:0,answeredQuestions:0};
    state.review=state.mistakes.slice();state.reviewing=true;state.round=1;state.total=state.review.length;
    resetQuestion(state.review.shift().question);updateStats()
  }
  function restoreReviewBaseline(){
    if(!state.reviewBaseline)return;
    state.sectionStats=Object.assign({},state.reviewBaseline.sectionStats);state.totalCorrect=state.reviewBaseline.totalCorrect;state.totalAttempted=state.reviewBaseline.totalAttempted;state.answeredQuestions=state.reviewBaseline.answeredQuestions;state.reviewBaseline=null
  }
  function changeMode(value){state.mode=value;resetSession()}
  function changeDifficulty(value){state.difficulty=value;$("diff-basic").classList.toggle("active",value==="basic");$("diff-advanced").classList.toggle("active",value==="advanced");resetSession()}
  function toggleLanguage(){
    state.lang=state.lang==="zh"?"en":"zh";localStorage.setItem("hk_m2_induction_lang",state.lang);applyLanguage();
    applyQuestionLanguage(state.question);renderHeaderQuestionCard();renderAccordion();updateKeypad()
  }

    document.documentElement.lang=state.lang==="zh"?"zh-HK":"en";
    document.title=text("pageTitle");$("mode-select").setAttribute("aria-label",text("modeLabel"));$("student-input").setAttribute("placeholder",text("studentPlaceholder"));
    $("brand-chapter").textContent=text("chapter");$("print-button").textContent=text("printMenu");$("lang-button").textContent=text("lang");$("student-button").textContent=sessionStorage.getItem("hk_m2_induction_student")||text("student");$("history-button").textContent=text("history");$("review-button").textContent=text("reviewMistakes");
    $("diff-basic").textContent=text("basic");$("diff-advanced").textContent=text("advanced");$("label-question").textContent=text("question");$("label-total").textContent=text("total");$("label-setup").textContent=text("setup");$("label-base").textContent=text("base");$("label-hypothesis").textContent=text("hypothesis");$("label-inductive").textContent=text("inductive");$("label-conclusion").textContent=text("conclusion");$("label-errors").textContent=text("errors");$("preview-label").textContent=text("preview");$("clear-button").textContent=text("clear");$("refresh-button").textContent=text("newQuestion");$("caption").textContent=text("caption");
    $("student-title").textContent=text("studentTitle");$("student-help").textContent=text("studentHelp");$("student-cancel").textContent=text("cancel");$("student-save").textContent=text("save");$("history-title").textContent=text("historyTitle");$("history-clear").textContent=text("clearHistory");$("history-close").textContent=text("historyClose");$("print-history").textContent=text("printHistory");$("print-new").textContent=text("printNew");$("print-comprehensive").textContent=text("printComprehensive");$("feedback-close").textContent=text("close");$("feedback-next").textContent=text("feedbackNext");$("feedback-retry").textContent=text("feedbackRetry");$("completion-close").textContent=text("finishClose");$("completion-restart").textContent=text("finishRestart");
    modeOptions();renderHistory()
  }
  function openDialog(id){$(id).hidden=false}
  function closeDialog(id){$(id).hidden=true}
  function showCompletionDialog(reviewMode){
    var resultStats=reviewMode?state.reviewStats:{sectionStats:state.sectionStats,totalCorrect:state.totalCorrect,answeredQuestions:state.answeredQuestions};
    closeFeedback();$("completion-title").textContent=reviewMode?text("finishReviewing"):text("finishNormal");$("completion-message").textContent=reviewMode?text("finishReviewMessage"):text("finishMessage");
    $("completion-total-label").textContent=text("finishTotal");$("completion-total").textContent=resultStats.answeredQuestions;
    $("completion-first-label").textContent=text("finishFirst");$("completion-setup-label").textContent=text("setup");$("completion-setup").textContent=resultStats.sectionStats.setup;
    $("completion-base-label").textContent=text("base");$("completion-base").textContent=resultStats.sectionStats.base;
    $("completion-hypothesis-label").textContent=text("hypothesis");$("completion-hypothesis").textContent=resultStats.sectionStats.hypothesis;
    $("completion-inductive-label").textContent=text("inductive");$("completion-inductive").textContent=resultStats.sectionStats.inductive;
    $("completion-conclusion-label").textContent=text("conclusion");$("completion-conclusion").textContent=resultStats.sectionStats.conclusion;
    $("completion-score-label").textContent=text("finishScore");$("completion-score").textContent=resultStats.totalCorrect+" / "+(resultStats.answeredQuestions*5);
    openDialog("completion-dialog")
  }
  function printActivate(html){
    var target=$("print-target");target.innerHTML=html;target.classList.add("print-active","print-measure");
    typeset(target).then(function(){target.classList.remove("print-measure");setTimeout(function(){window.print()},100)})
  }
  function printHeader(title,meta){return"<h1>"+title+"</h1><div class=\"print-meta\">"+meta+"</div>"}
  function worksheetLines(q){return q.sections.map(function(sec,index){return"<div>"+(index+1)+". "+sectionTitle(sec.key)+text("answerLineSuffix")+"</div>"}).join("")}
  function printHistory(){
    $("print-popover").hidden=true;
    if(!state.history.length){showError(text("history"),text("noHistory"));return}
    var html=printHeader(text("history"),"<span>"+text("student")+text("labelSeparator")+esc(sessionStorage.getItem("hk_m2_induction_student")||"—")+"</span><span>"+new Date().toLocaleDateString()+"</span>");
    state.history.slice(0,12).forEach(function(item,index){html+='<div class="print-answer"><strong>'+(index+1)+". "+esc(item.title)+" · "+item.score+"/5</strong><div>"+item.solution.map(function(solution){return"<div>"+esc(solution)+"</div>"}).join("")+"</div></div>"});printActivate(html)
  }
  function printNew(){
    $("print-popover").hidden=true;var questions=[],savedDifficulty=state.difficulty,savedMode=state.mode,printModes=["poly_sum","telescoping","factorial_power","full_proof","hence_eval"];
    try{for(var i=0;i<10;i++){state.mode=printModes[i%printModes.length];questions.push(generateQuestion())}}finally{state.difficulty=savedDifficulty;state.mode=savedMode}
    var html=printHeader(text("printNew"),"<span>"+text("difficulty")+text("labelSeparator")+(savedDifficulty==="basic"?text("basic"):text("advanced"))+"</span><span>"+new Date().toLocaleDateString()+"</span>")+"<h2>"+text("question")+"</h2>";
    questions.forEach(function(q,index){html+='<div class="print-question"><strong>'+(index+1)+'. '+esc(q.title)+'</strong><div class="print-expression">$$'+q.statement+'$$</div>'+worksheetLines(q)+'</div>'});
    html+='<div class="page-break"></div>'+printHeader(text("standardAnswer"),'<span>'+new Date().toLocaleDateString()+'</span>');questions.forEach(function(q,index){html+='<div class="print-answer"><strong>'+(index+1)+'. $'+esc(q.displayAnswer)+'$</strong><div>'+q.stepsDisplay.map(function(solution){return'<div>'+esc(solution)+'</div>'}).join('')+'</div></div>'});printActivate(html)
  }
  function printComprehensive(){
    $("print-popover").hidden=true;var savedDifficulty=state.difficulty,savedMode=state.mode,basic=[],advanced=[];
    try{state.difficulty="basic";["poly_sum","telescoping","factorial_power","full_proof","hence_eval"].forEach(function(mode){state.mode=mode;basic.push(generateQuestion())});state.difficulty="advanced";["poly_sum","telescoping","factorial_power","full_proof","hence_eval"].forEach(function(mode){state.mode=mode;advanced.push(generateQuestion())})}finally{state.difficulty=savedDifficulty;state.mode=savedMode}
    var all=basic.concat(advanced),html=printHeader(text("printComprehensive")+" · "+text("basic"),'<span>5</span><span>'+new Date().toLocaleDateString()+'</span>')+'<h2>'+text("question")+' 1–5</h2>';
    basic.forEach(function(q,index){html+='<div class="print-question"><strong>'+(index+1)+'. '+esc(q.title)+'</strong><div class="print-expression">$$'+q.statement+'$$</div>'+worksheetLines(q)+'</div>'});html+='<div class="page-break"></div>'+printHeader(text("printComprehensive")+" · "+text("advanced"),'<span>5</span><span>'+new Date().toLocaleDateString()+'</span>')+'<h2>'+text("question")+' 6–10</h2>';
    advanced.forEach(function(q,index){html+='<div class="print-question"><strong>'+(index+6)+'. '+esc(q.title)+'</strong><div class="print-expression">$$'+q.statement+'$$</div>'+worksheetLines(q)+'</div>'});html+='<div class="page-break"></div>'+printHeader(text("standardAnswer"),'<span>10</span><span>'+new Date().toLocaleDateString()+'</span>');all.forEach(function(q,index){html+='<div class="print-answer"><strong>'+(index+1)+'. '+esc(q.title)+' · $'+esc(q.displayAnswer)+'$</strong><div>'+q.stepsDisplay.map(function(solution){return'<div>'+esc(solution)+'</div>'}).join('')+'</div></div>'});printActivate(html)
  }
  function nextAfterFeedback(){
    closeFeedback();
    if(state.reviewing){
      if(state.review.length){resetQuestion(state.review.shift().question);return}
      restoreReviewBaseline();state.reviewing=false;state.review=[];state.total=10;state.round=1;showCompletionDialog(true);return
    }
    if(state.round>state.total){
      if(state.mistakes.length){startMistakesReview();return}
      showCompletionDialog(false);return
    }
    resetQuestion(generateQuestion())
  }
  function retryCurrentQuestion(){
    closeFeedback();if(!state.last)return;
    var last=state.last;state.answered=false;state.round=Math.max(1,state.round-1);
    if(!last.isReview){
      state.totalCorrect=Math.max(0,state.totalCorrect-last.score);
      Object.keys(last.result).forEach(function(key){if(last.result[key])state.sectionStats[key]=Math.max(0,state.sectionStats[key]-1)});
      state.totalAttempted=Math.max(0,state.totalAttempted-5);state.answeredQuestions=Math.max(0,state.answeredQuestions-1);
      if(last.score<5&&state.mistakes.length)state.mistakes.pop();if(state.history.length)state.history.shift();saveHistory()
    }else if(state.reviewStats){
      state.reviewStats.answeredQuestions=Math.max(0,state.reviewStats.answeredQuestions-1);state.reviewStats.totalCorrect=Math.max(0,state.reviewStats.totalCorrect-last.score);state.reviewStats.totalAttempted=Math.max(0,state.reviewStats.totalAttempted-5);
      Object.keys(last.result).forEach(function(key){if(last.result[key])state.reviewStats.sectionStats[key]=Math.max(0,state.reviewStats.sectionStats[key]-1)});
    }
    resetQuestion(last.question);updateStats()
  }
  function runSelfTests(){
    var cases=[
      ["(k+2)!-1","(k+2)!-1",true],["(k+2)*(k+1)!-1","(k+2)!-1",true],["-1+(k+2)!","(k+2)!-1",true],["(k+1)*(k+1)!","(k+1)*(k+1)!",true],
      ["(k+1)*2^k","(k+1)*2^k",true],["(1+k)*(2^k)","(k+1)*2^k",true],["k*2^k+2^k","(k+1)*2^k",true],
      ["(k+1)(k+2)","(k+1)(k+2)",true],["(k+2)(k+1)","(k+1)(k+2)",true],["k^2+3k+2","(k+1)(k+2)",true],
      ["(k+1)^2","(k+1)^2",true],["(1+k)^2","(k+1)^2",true],["1/((2k+1)(2k+3))","1/((2k+1)(2k+3))",true],
      ["1/(4k^2+8k+3)","1/((2k+1)(2k+3))",true],["((k+1)(4(k+1)^2+6(k+1)-1))/3","((k+1)(4(k+1)^2+6(k+1)-1))/3",true],
      ["(k+1)!-1","(k+2)!-1",false],["(k+3)!-1","(k+2)!-1",false],["k*2^k","(k+1)*2^k",false],
      ["(k+1)*2^(k+1)","(k+1)*2^k",false],["(k+1)(k+3)","(k+1)(k+2)",false],["k^2+2k+1","(k+1)(k+2)",false],
      ["1/((2k-1)(2k+1))","1/((2k+1)(2k+3))",false],
      ["(k+1)((k+1)+1)(2(k+1)+1)/6","(k+1)((k+1)+1)(2(k+1)+1)/6",true,"exact"],
      ["((k+1)(k+2)(2k+3))/6","(k+1)((k+1)+1)(2(k+1)+1)/6",false,"exact"],
      ["((k+1)(k+2)(2k+3))/6","((k+1)(k+2)(2k+3))/6",true,"exact"]
    ];
    var results=cases.map(function(test){var actual=test[3]==="exact"?exactSubstitution(test[0],test[1]):equivalent(test[0],test[1]),passed=actual===test[2];return{input:test[0],target:test[1],expected:test[2],actual:actual,checker:test[3]||"equivalent",passed:passed}});
    results.push({input:"C cross equal",target:"k^2+3k+2 ~= (k+1)(k+2)",expected:true,actual:crossStepEquivalent("k^2+3k+2","(k+1)(k+2)"),passed:crossStepEquivalent("k^2+3k+2","(k+1)(k+2)")===true});
    results.push({input:"C cross unequal",target:"k^2+3k+2 !~= (k+1)(k+3)",expected:false,actual:crossStepEquivalent("k^2+3k+2","(k+1)(k+3)"),passed:crossStepEquivalent("k^2+3k+2","(k+1)(k+3)")===false});
    return {total:results.length,passed:results.filter(function(result){return result.passed}).length,failed:results.filter(function(result){return !result.passed}),results:results}
  }

  $("mode-select").addEventListener("change",function(){changeMode(this.value)});
  $("diff-basic").addEventListener("click",function(){changeDifficulty("basic")});
  $("diff-advanced").addEventListener("click",function(){changeDifficulty("advanced")});
  $("lang-button").addEventListener("click",toggleLanguage);
  $("refresh-button").addEventListener("click",function(){resetQuestion(generateQuestion())});
  $("clear-button").addEventListener("click",clearInput);
  $("feedback-close").addEventListener("click",closeFeedback);
  $("feedback-next").addEventListener("click",nextAfterFeedback);
  $("feedback-retry").addEventListener("click",retryCurrentQuestion);
  $("history-button").addEventListener("click",function(){renderHistory();openDialog("history-dialog")});
  $("review-button").addEventListener("click",startMistakesReview);
  $("history-clear").addEventListener("click",function(){state.history=[];saveHistory();renderHistory()});
  $("student-button").addEventListener("click",function(){$("student-input").value=sessionStorage.getItem("hk_m2_induction_student")||"";openDialog("student-dialog")});
  $("student-save").addEventListener("click",function(){var value=$("student-input").value.trim();if(value)sessionStorage.setItem("hk_m2_induction_student",value);$("student-button").textContent=value||text("student");closeDialog("student-dialog")});
  document.querySelectorAll("[data-close-dialog]").forEach(function(button){button.addEventListener("click",function(){closeDialog(button.getAttribute("data-close-dialog"))})});
  $("completion-close").addEventListener("click",function(){closeDialog("completion-dialog")});
  $("completion-restart").addEventListener("click",function(){closeDialog("completion-dialog");resetSession()});
  $("print-button").addEventListener("click",function(){$("print-popover").hidden=!$("print-popover").hidden});
  $("print-history").addEventListener("click",printHistory);$("print-new").addEventListener("click",printNew);$("print-comprehensive").addEventListener("click",printComprehensive);

  loadHistory();applyLanguage();$("diff-basic").classList.add("active");resetQuestion(generateQuestion());updateStats();
  window.__M2_SELF_TEST=runSelfTests;
})();
