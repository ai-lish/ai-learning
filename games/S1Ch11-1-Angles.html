<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📐 角度偵探 — CH11 互動練習</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #c0392b;
    --primary-dark: #922b21;
    --bg: #fdf6e3;
    --card: #fffdf8;
    --text: #2d2a26;
    --muted: #7a7268;
    --success: #27ae60;
    --error: #e74c3c;
    --orange: #e67e22;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 12px 48px;
    user-select: none;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 900;
    color: var(--primary);
    text-align: center;
    margin-bottom: 2px;
  }
  .subtitle {
    font-size: 0.82rem;
    color: var(--muted);
    text-align: center;
    margin-bottom: 16px;
  }

  /* Score bar */
  .score-bar {
    display: flex;
    gap: 16px;
    margin-bottom: 14px;
    font-weight: 700;
    font-size: 0.9rem;
  }
  .score-bar span { color: var(--muted); }
  .score-bar .val { color: var(--primary); font-size: 1.1rem; }
  .score-bar .correct-val { color: var(--success); }
  .score-bar .wrong-val { color: var(--error); }

  /* Progress */
  .progress-bar {
    width: 100%;
    max-width: 520px;
    height: 6px;
    background: #e0d9c8;
    border-radius: 3px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  /* Diagram card */
  .diagram-card {
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    padding: 16px;
    max-width: 520px;
    width: 100%;
    margin-bottom: 14px;
  }
  .diagram-label {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .diagram-svg {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Question card */
  .question-card {
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    padding: 16px 20px;
    max-width: 520px;
    width: 100%;
    margin-bottom: 14px;
  }
  .q-number {
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .q-text {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1.5;
  }
  .q-sub {
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 4px;
  }

  /* Answer choices */
  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    max-width: 520px;
    width: 100%;
  }
  .choice-btn {
    background: var(--card);
    border: 2.5px solid #e0d9c8;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 0.95rem;
    font-weight: 700;
    font-family: inherit;
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, transform 0.1s;
    text-align: center;
    line-height: 1.3;
  }
  .choice-btn:hover { border-color: var(--primary); transform: translateY(-1px); }
  .choice-btn:active { transform: translateY(0); }
  .choice-btn.correct {
    border-color: var(--success);
    background: #eaf6ee;
    color: var(--success);
  }
  .choice-btn.wrong {
    border-color: var(--error);
    background: #fdf0ef;
    color: var(--error);
  }
  .choice-btn.disabled { pointer-events: none; opacity: 0.6; }

  /* Feedback */
  .feedback {
    max-width: 520px;
    width: 100%;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 0.88rem;
    font-weight: 700;
    margin-bottom: 12px;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct { background: #eaf6ee; color: var(--success); border: 2px solid var(--success); }
  .feedback.wrong { background: #fdf0ef; color: var(--error); border: 2px solid var(--error); }

  /* Next button */
  .next-btn {
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px 32px;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    display: none;
    margin-bottom: 10px;
    transition: background 0.2s;
  }
  .next-btn.show { display: inline-block; }
  .next-btn:hover { background: var(--primary-dark); }

  /* End screen */
  .end-screen {
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    padding: 28px 24px;
    max-width: 520px;
    width: 100%;
    text-align: center;
    margin-bottom: 16px;
    display: none;
  }
  .end-screen.show { display: block; }
  .end-score {
    font-size: 3rem;
    font-weight: 900;
    color: var(--primary);
  }
  .end-label {
    font-size: 0.88rem;
    color: var(--muted);
    margin-top: 4px;
    margin-bottom: 16px;
  }
  .end-message {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 20px;
    line-height: 1.5;
  }

  /* Restart */
  .restart-btn {
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px 32px;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    margin-top: 8px;
  }
  .restart-btn:hover { background: var(--primary-dark); }

  /* Start screen */
  .start-screen {
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    padding: 28px 24px;
    max-width: 520px;
    width: 100%;
    text-align: center;
    margin-bottom: 16px;
  }
  .start-screen h2 {
    font-size: 1.4rem;
    color: var(--primary);
    margin-bottom: 10px;
  }
  .start-screen p {
    font-size: 0.9rem;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 18px;
  }
  .start-btn {
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 14px 40px;
    font-size: 1.1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  .start-btn:hover { background: var(--primary-dark); }
</style>
</head>
<body>

<h1>📐 角度偵探</h1>
<p class="subtitle">分辨定理 · 睇圖答題</p>

<!-- Score -->
<div class="score-bar">
  <span>題目 <span class="val" id="qNum">1/10</span></span>
  <span>✅ <span class="correct-val" id="correctCount">0</span></span>
  <span>❌ <span class="wrong-val" id="wrongCount">0</span></span>
</div>

<!-- Progress -->
<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

<!-- Start screen -->
<div class="start-screen" id="startScreen">
  <h2>CH11 角 度 偵 探</h2>
  <p>
    睇圖片，分別以下角度關係：<br>
    📐 直線上的鄰角・對頂角<br>
    📏 同位角・內錯角・同旁內角<br>
    📐 三角形內角和<br><br>
    共 10 題，全部都有圖！
  </p>
  <button class="start-btn" onclick="startGame()">🎮 開始挑戰</button>
</div>

<!-- Diagram -->
<div class="diagram-card" id="diagramCard" style="display:none">
  <div class="diagram-label">👀 睇圖作答</div>
  <svg id="diagramSvg" class="diagram-svg" viewBox="0 0 420 240" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<!-- Question -->
<div class="question-card" id="questionCard" style="display:none">
  <div class="q-number" id="qNumberText">第 1 題</div>
  <div class="q-text" id="qText"></div>
  <div class="q-sub" id="qSub"></div>
</div>

<!-- Choices -->
<div class="choices" id="choicesArea" style="display:none"></div>

<!-- Feedback -->
<div class="feedback" id="feedback"></div>

<!-- Next -->
<button class="next-btn" id="nextBtn" onclick="nextQuestion()">下一題 →</button>

<!-- End -->
<div class="end-screen" id="endScreen">
  <div class="end-score" id="endScore">0</div>
  <div class="end-label">總分 / 10</div>
  <div class="end-message" id="endMessage"></div>
  <button class="restart-btn" onclick="restartGame()">🔄 再試一次</button>
</div>

<script>
// ── Question bank ─────────────────────────────────────────────────────────────
const QUESTIONS = [
  // 1  直線上的鄰角
  {
    type: 'linear',
    diagram: 'linear',
    question: '如圖，AB 係一直線。兩個標示咗嘅角係咩關係？',
    sub: '提示：相加 = 180°',
    choices: ['對頂角', '直線上的鄰角（互為補角）', '同位角', '內錯角'],
    answer: 1,
    explanation: '直線上的鄰角喺同一條直線上，相加 = 180°（互為補角）'
  },
  // 2  對頂角
  {
    type: 'vertical',
    diagram: 'vertical',
    question: '如圖，兩直線相交於 O 點。標示咗嘅兩個角係咩關係？',
    sub: '提示：X 形，對頂角相等',
    choices: ['同旁內角', '對頂角', '同位角', '直線上的鄰角'],
    answer: 1,
    explanation: '兩直線相交形成 X 形，對頂角相等'
  },
  // 3  同位角 (F)
  {
    type: 'correspond',
    diagram: 'correspond',
    question: '如圖，AB // CD，EF 係截線。標示咗嘅兩個角係咩關係？',
    sub: '提示：形似 F 字母',
    choices: ['內錯角', '同旁內角', '同位角', '對頂角'],
    answer: 2,
    explanation: '同位角喺平行線同一方 + 截線同側，形似 F，相等'
  },
  // 4  內錯角 (Z)
  {
    type: 'alternate',
    diagram: 'alternate',
    question: '如圖，AB // CD，EF 係截線。標示咗嘅兩個角係咩關係？',
    sub: '提示：形似 Z 字母',
    choices: ['同位角', '內錯角', '直線上的鄰角', '同旁內角'],
    answer: 1,
    explanation: '內錯角夾喺平行線之間 + 截線兩側，形似 Z，相等'
  },
  // 5  同旁內角 (C/U)
  {
    type: 'sameside',
    diagram: 'sameside',
    question: '如圖，AB // CD，EF 係截線。標示咗嘅兩個角係咩關係？',
    sub: '提示：夾喺平行線之間 + 截線同側',
    choices: ['對頂角', '同位角', '同旁內角', '內錯角'],
    answer: 2,
    explanation: '同旁內角夾喺平行線之間 + 截線同一側，相加 = 180°'
  },
  // 6  直線鄰角計算
  {
    type: 'calc_linear',
    diagram: 'calc_linear',
    question: '如圖，AB 係一直線。已知 ∠AOC = 65°，求 x。',
    sub: '提示：直線上的鄰角相加 = 180°',
    choices: ['115°', '65°', '90°', '180°'],
    answer: 0,
    explanation: 'x + 65° = 180° → x = 115°'
  },
  // 7  三角形內角和
  {
    type: 'triangle',
    diagram: 'triangle',
    question: '如圖，三角形 ABC 標示咗三個角。佢哋有咩關係？',
    sub: '提示：內角和 = ?',
    choices: ['相加 = 360°', '相加 = 180°', '相等', '相加 = 90°'],
    answer: 1,
    explanation: '三角形內角和 = 180°'
  },
  // 8  三角形計算
  {
    type: 'calc_triangle',
    diagram: 'calc_triangle',
    question: '△ABC 中，∠A = x°，∠B = 80°，∠C = 58°。求 x。',
    sub: '提示：三角形的內角和係...',
    choices: ['42°', '80°', '58°', '138°'],
    answer: 0,
    explanation: 'x + 80° + 58° = 180° → x = 42°'
  },
  // 9  同位角計算
  {
    type: 'calc_correspond',
    diagram: 'calc_correspond',
    question: '如圖，AB // CD，截線 EF 產生同位角。已知其中一個角係 64°，另一個係 x + 26°。求 x。',
    sub: '提示：同位角...',
    choices: ['38°', '64°', '90°', '26°'],
    answer: 0,
    explanation: '同位角相等 → x + 26° = 64° → x = 38°'
  },
  // 10  同旁內角計算
  {
    type: 'calc_sameside',
    diagram: 'calc_sameside',
    question: '如圖，AB // CD，截線 EF 產生同旁內角。已知其中一個角係 53°，另一個係 x°。求 x。',
    sub: '提示：同旁內角相加 = ?',
    choices: ['127°', '53°', '180°', '106°'],
    answer: 0,
    explanation: '同旁內角相加 = 180° → x + 53° = 180° → x = 127°'
  }
];

// ── Diagram renderers ─────────────────────────────────────────────────────────
function renderDiagram(svgEl, type) {
  svgEl.innerHTML = '';
  const ns = 'http://www.w3.org/2000/svg';

  function make(tag, attrs) {
    const el = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    return el;
  }
  function text(x, y, content, attrs) {
    const el = make('text', { x, y, ...attrs });
    el.textContent = content;
    return el;
  }

  switch (type) {
    case 'linear': {
      // AB is a straight line, O is a point, two adjacent angles
      svgEl.setAttribute('viewBox', '0 0 420 200');
      // Line AB
      const line = make('line', { x1: 30, y1: 100, x2: 390, y2: 100, stroke: '#1a3a6e', 'stroke-width': 3 });
      svgEl.appendChild(line);
      // Point O at center
      const o = make('circle', { cx: 210, cy: 100, r: 5, fill: '#1a3a6e' });
      svgEl.appendChild(o);
      svgEl.appendChild(text(220, 92, 'O', { 'font-size': 14, fill: '#1a3a6e', 'font-weight': 'bold' }));
      // Upper ray going up-left
      const r1 = make('line', { x1: 210, y1: 100, x2: 60, y2: 40, stroke: '#4aaa6a', 'stroke-width': 2.5 });
      svgEl.appendChild(r1);
      // Lower ray going down-right
      const r2 = make('line', { x1: 210, y1: 100, x2: 360, y2: 160, stroke: '#4aaa6a', 'stroke-width': 2.5 });
      svgEl.appendChild(r2);
      // Label A (left end)
      svgEl.appendChild(text(40, 92, 'A', { 'font-size': 14, fill: '#1a3a6e', 'font-weight': 'bold' }));
      // Label B (right end)
      svgEl.appendChild(text(375, 175, 'B', { 'font-size': 14, fill: '#1a3a6e', 'font-weight': 'bold' }));
      // Angle arc upper (left)
      const arc1 = make('path', { d: 'M168 86 A42 42 0 0 1 183 75', fill: 'none', stroke: '#e65555', 'stroke-width': 2.5 });
      svgEl.appendChild(arc1);
      svgEl.appendChild(text(152, 70, '65°', { 'font-size': 14, fill: '#e65555', 'font-weight': 'bold' }));
      // Angle arc lower (right)
      const arc2 = make('path', { d: 'M243 115 A42 42 0 0 1 258 106', fill: 'none', stroke: '#e65555', 'stroke-width': 2.5 });
      svgEl.appendChild(arc2);
      svgEl.appendChild(text(255, 108, 'x°', { 'font-size': 14, fill: '#e65555', 'font-weight': 'bold' }));
      break;
    }
    case 'vertical': {
      svgEl.setAttribute('viewBox', '0 0 420 220');
      // Two intersecting lines
      const l1 = make('line', { x1: 50, y1: 40, x2: 370, y2: 180, stroke: '#1a3a6e', 'stroke-width': 3 });
      svgEl.appendChild(l1);
      const l2 = make('line', { x1: 50, y1: 180, x2: 370, y2: 40, stroke: '#1a3a6e', 'stroke-width': 3 });
      svgEl.appendChild(l2);
      // Intersection point O
      const o = make('circle', { cx: 210, cy: 110, r: 5, fill: '#1a3a6e' });
      svgEl.appendChild(o);
      svgEl.appendChild(text(220, 105, 'O', { 'font-size': 14, fill: '#1a3a6e', 'font-weight': 'bold' }));
      // Label A,B,C,D at ends
      svgEl.appendChild(text(42, 38, 'A', { 'font-size': 14, fill: '#1a3a6e', 'font-weight': 'bold' }));
      svgEl.appendChild(text(360, 188, 'B', { 'font-size': 14, fill: '#1a3a6e', 'font-weight': 'bold' }));
      svgEl.appendChild(text(42, 188, 'C', { 'font-size': 14, fill: '#1a3a6e', 'font-weight': 'bold' }));
      svgEl.appendChild(text(360, 38, 'D', { 'font-size': 14, fill: '#1a3a6e', 'font-weight': 'bold' }));
      // Marked angle top (between line AB and AD... simplified: top-left)
      const arc1 = make('path', { d: 'M183 92 A28 28 0 0 1 198 77', fill: 'none', stroke: '#e65555', 'stroke-width': 2.5 });
      svgEl.appendChild(arc1);
      svgEl.appendChild(text(170, 72, '128°', { 'font-size': 13, fill: '#e65555', 'font-weight': 'bold' }));
      // Marked angle bottom-right
      const arc2 = make('path', { d: 'M238 133 A28 28 0 0 1 252 118', fill: 'none', stroke: '#e65555', 'stroke-width': 2.5 });
      svgEl.appendChild(arc2);
      svgEl.appendChild(text(258, 135, 'x°', { 'font-size': 13, fill: '#e65555', 'font-weight': 'bold' }));
      break;
    }
    case 'correspond': {
      svgEl.setAttribute('viewBox', '0 0 420 220');
      // Two parallel lines
      const l1 = make('line', { x1: 30, y1: 60, x2: 390, y2: 60, stroke: '#1a3a6e', 'stroke-width': 3 });
      svgEl.appendChild(l1);
      const l2 = make('line', { x1: 30, y1: 160, x2: 390, y2: 160, stroke: '#1a3a6e', 'stroke-width': 3 });
      svgEl.appendChild(l2);
      // Labels
      svgEl.appendChild(text(22, 58, 'A', { 'font-size': 14, fill: '#1a3a6e', 'font-weight': 'bold' }));
      svgEl.appendChild(text(385, 58, 'B', { 'font-size': 14, fill: '#1a3a6e', 'font-weight': 'bold' }));
      svgEl.appendChild(text(22, 165, 'C', { 'font-size': 14, fill: '#1a3a6e', 'font-weight': 'bold' }));
      svgEl.appendChild(text(385, 165, 'D', { 'font-size': 14, fill: '#1a3a6e', 'font-weight': 'bold' }));
      svgEl.appendChild(text(145, 50, 'AB // CD', { 'font-size': 11, fill: '#888', 'text-anchor': 'middle' }));
      // Transversal
      const t = make('line', { x1: 120, y1: 20, x2: 300, y2: 200, stroke: '#4aaa6a', 'stroke-width': 2.5 });
      svgEl.appendChild(t);
      svgEl.appendChild(text(310, 195, 'EF', { 'font-size': 13, fill: '#4aaa6a', 'font-weight': 'bold' }));
      // Corresponding angle top-right (F shape)
      const arc1 = make('path', { d: 'M228 62 A20 20 0 0 1 242 76', fill: 'none', stroke: '#e65555', 'stroke-width': 2.5 });
      svgEl.appendChild(arc1);
      svgEl.appendChild(text(244, 70, '64°', { 'font-size': 13, fill: '#e65555', 'font-weight': 'bold' }));
      // Corresponding angle bottom-left
      const arc2 = make('path', { d: 'M152 144 A20 20 0 0 1 166 130', fill: 'none', stroke: '#e65555', 'stroke-width': 2.5 });
      svgEl.appendChild(arc2);
      svgEl.appendChild(text(152, 128, 'x+26°', { 'font-size': 13, fill: '#e65555', 'font-weight': 'bold' }));
      // F letter label
      svgEl.appendChild(text(350, 45, 'F', { 'font-size': 20, fill: '#e67e22', 'font-weight': 'bold' }));
      break;
    }
    case 'alternate': {
      svgEl.setAttribute('viewBox', '0 0 420 220');
      // Two parallel lines
      const l1 = make('line', { x1: 30, y1: 60, x2: 390, y2: 60, stroke: '#1a3a6e', 'stroke-width': 3 });
      svgEl.appendChild(l1);
      const l2 = make('line', { x1: 30, y1: 160, x2: 390, y2: 160, stroke: '#1a3a6e', 'stroke-width': 3 });
      svgEl.appendChild(l2);
      svgEl.appendChild(text(22, 58, 'A', { 'font-size': 14, fill: '#1a3a6e', 'font-weight': 'bold' }));
      svgEl.appendChild(text(385, 58, 'B', { 'font-size': 14, fill: '#1a3a6e', 'font-weight': 'bold' }));
      svgEl.appendChild(text(22, 165, 'C', { 'font-size': 14, fill: '#1a3a6e', 'font-weight': 'bold' }));
      svgEl.appendChild(text(385, 165, 'D', { 'font-size': 14, fill: '#1a3a6e', 'font-weight': 'bold' }));
      svgEl.appendChild(text(148, 50, 'AB // CD', { 'font-size': 11, fill: '#888', 'text-anchor': 'middle' }));
      // Transversal (same direction as correspond)
      const t = make('line', { x1: 120, y1: 20, x2: 300, y2: 200, stroke: '#4aaa6a', 'stroke-width': 2.5 });
      svgEl.appendChild(t);

// ── Game state ────────────────────────────────────────────────────────────────
let currentQ = 0;
let correctCount = 0;
let wrongCount = 0;
let answered = false;

// ── Shuffle helper ────────────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── Render question ───────────────────────────────────────────────────────────
function showQuestion(idx) {
  const q = QUESTIONS[idx];
  answered = false;

  // Update score bar
  document.getElementById('qNum').textContent = `${idx + 1}/10`;
  document.getElementById('correctCount').textContent = correctCount;
  document.getElementById('wrongCount').textContent = wrongCount;
  document.getElementById('progressFill').style.width = `${(idx / 10) * 100}%`;

  // Show diagram card + question card
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('endScreen').classList.remove('show');
  document.getElementById('diagramCard').style.display = 'block';
  document.getElementById('questionCard').style.display = 'block';
  document.getElementById('choicesArea').style.display = 'grid';
  document.getElementById('nextBtn').classList.remove('show');
  document.getElementById('feedback').classList.remove('show', 'correct', 'wrong');

  // Render diagram
  renderDiagram(document.getElementById('diagramSvg'), q.diagram);

  // Question text
  document.getElementById('qNumberText').textContent = `第 ${idx + 1} 題`;
  document.getElementById('qText').textContent = q.question;
  document.getElementById('qSub').textContent = q.sub;

  // Shuffle choices
  const choiceEls = document.getElementById('choicesArea');
  choiceEls.innerHTML = '';
  const choices = q.choices.map((c, i) => ({ text: c, original: i }));
  // If answer is among choices and we want to shuffle position, keep answer index consistent
  const shuffled = shuffle(choices);
  // Find which shuffled index corresponds to answer
  const answerShuffledIdx = shuffled.findIndex(c => c.original === q.answer);

  shuffled.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = choice.text;
    btn.dataset.index = i;
    btn.addEventListener('click', () => handleAnswer(i, answerShuffledIdx, q));
    choiceEls.appendChild(btn);
  });
}

// ── Handle answer ─────────────────────────────────────────────────────────────
function handleAnswer(selectedIdx, correctIdx, q) {
  if (answered) return;
  answered = true;

  const buttons = document.querySelectorAll('.choice-btn');
  buttons.forEach(b => b.classList.add('disabled'));

  const isCorrect = selectedIdx === correctIdx;
  buttons[selectedIdx].classList.add(isCorrect ? 'correct' : 'wrong');
  if (!isCorrect) buttons[correctIdx].classList.add('correct');

  if (isCorrect) correctCount++;
  else wrongCount++;

  document.getElementById('correctCount').textContent = correctCount;
  document.getElementById('wrongCount').textContent = wrongCount;

  const fb = document.getElementById('feedback');
  fb.textContent = q.explanation;
  fb.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');

  document.getElementById('nextBtn').classList.add('show');
}

// ── Next question ─────────────────────────────────────────────────────────────
function nextQuestion() {
  currentQ++;
  if (currentQ >= 10) {
    showEnd();
  } else {
    showQuestion(currentQ);
  }
}

// ── End screen ────────────────────────────────────────────────────────────────
function showEnd() {
  document.getElementById('diagramCard').style.display = 'none';
  document.getElementById('questionCard').style.display = 'none';
  document.getElementById('choicesArea').style.display = 'none';
  document.getElementById('nextBtn').classList.remove('show');
  document.getElementById('feedback').classList.remove('show');

  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('qNum').textContent = '10/10';

  const end = document.getElementById('endScreen');
  end.classList.add('show');
  document.getElementById('endScore').textContent = correctCount;

  let msg = '';
  if (correctCount === 10) msg = '🎉 滿分！角 度 偵 探 實 鎵！';
  else if (correctCount >= 8) msg = '👍 做得好好！定理分辨好清楚';
  else if (correctCount >= 6) msg = '💪 繼續努力！記緊 Z/F/C 形狀';
  else msg = '📖 溫習筆記再試一次，你一定得！';
  document.getElementById('endMessage').textContent = msg;
}

// ── Start game ────────────────────────────────────────────────────────────────
function startGame() {
  currentQ = 0;
  correctCount = 0;
  wrongCount = 0;
  showQuestion(0);
}

// ── Restart ───────────────────────────────────────────────────────────────────
function restartGame() {
  startGame();
}
