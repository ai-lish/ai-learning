<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>AI Learning</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6f8; color: #18222d; }
    main { width: min(680px, calc(100% - 40px)); }
    section { padding: 32px; border: 1px solid #d8e0e8; border-radius: 16px; background: white; box-shadow: 0 16px 48px #18222d14; }
    h1 { margin: 0 0 12px; }
    p { color: #566575; line-height: 1.7; }
    .badge { display: inline-block; margin-top: 12px; padding: 7px 11px; border-radius: 999px; background: #fff2d6; color: #805b00; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>AI Learning</h1>
      <p>網站正在進行安全遷移，暫時未開放學習內容。</p>
      <span class="badge">Safe deployment maintenance</span>
    </section>
  </main>
</body>
</html>
