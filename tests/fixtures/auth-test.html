<!doctype html>
<!--
  tests/fixtures/auth-test.html — DEBUG_1 §3.8

  用途：俾 Playwright 載入，配 URL query 控制 Firebase mock 行為，
  然後載入真實 js/auth-state.js 嚟驗證錯誤處理、toast、widget、unhandledrejection/pageerror。

  URL params：
    ?scenario=<name>     — 設定 mock 行為（見下表）
    ?fail=<code>         — 短寫失敗 code（auth/<code>）
    ?avatar=<ok|bad>     — 控制 Firebase user.photoURL 載入成敗

  scenarios：
    success               — signInWithPopup resolves with fake user
    popup-closed-by-user  — signInWithPopup rejects with auth/popup-closed-by-user
    cancelled-popup-request
    popup-blocked
    network-request-failed
    unauthorized-domain
    operation-not-allowed
    invalid-api-key
    unknown
    persistence-fail     — setPersistence rejects；signInWithPopup 仍成功
    auth-state-error     — onAuthStateChanged 觸發 error callback（轉 unavailable）
    auth-subscribe-throw  — onAuthStateChanged throw（轉 unavailable）
    timeout              — auth 永遠 hang，whenReady() timeout 強制 settle
    avatar-fallback      — 用 photoURL 但 404，img.onerror 觸發 initial letter fallback

  __test API（Playwright 可用 page.evaluate 呼叫）：
    __test.getState()
    __test.signIn()
    __test.getUnhandledCount()
    __test.getPageErrorCount()
    __test.reset()
    __test.getToastText()
-->
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<title>Auth Test Fixture</title>
<style>body{font-family:sans-serif;padding:20px}</style>
</head>
<body>
<h1>Auth Test Fixture</h1>
<p>Scenario: <span id="scenario-label">—</span></p>
<div id="result" style="margin-top:20px;padding:12px;background:#f0f0f0;border-radius:8px;font-family:monospace;white-space:pre-wrap"></div>

<!-- 真實 css / js，唔可以改 -->
<link rel="stylesheet" href="/css/auth-widget.css">

<script>
(function () {
  'use strict';

  // 計數器
  window.__test = {
    unhandledCount: 0,
    pageErrorCount: 0,
    errors: []
  };

  // 收集 unhandled rejection（要嚴格計數）
  window.addEventListener('unhandledrejection', function (e) {
    window.__test.unhandledCount++;
    window.__test.errors.push('unhandledrejection: ' + (e.reason && e.reason.code || e.reason));
  });
  window.addEventListener('error', function (e) {
    window.__test.pageErrorCount++;
    window.__test.errors.push('pageerror: ' + (e.message || e.filename || 'unknown'));
  });

  // 讀 URL params
  function param(name) {
    var m = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
    return m ? decodeURIComponent(m[1]) : null;
  }
  var scenario = param('scenario') || 'success';
  var failCode = param('fail');
  var avatar = param('avatar') || 'ok';
  var loggedin = param('loggedin') === '1';
  var displayName = param('displayName') || 'Test User';
  document.getElementById('scenario-label').textContent =
    scenario + (failCode ? ' (fail=' + failCode + ')' : '') +
    (avatar === 'bad' ? ' [avatar=bad]' : '') +
    (loggedin ? ' [loggedin=1]' : '');

  // 構造 mock Firebase
  var mockUser = {
    uid: 'mock-uid-12345',
    email: 'mockuser@example.com',
    displayName: displayName,
    photoURL: avatar === 'bad' ? 'https://example.invalid/missing.png' : '',
    emailVerified: true
  };

  function makeFailingPromise(code) {
    return new Promise(function (_, reject) {
      // 異步 reject — Playwright 可以 await 後再 assert
      setTimeout(function () {
        var err = new Error('mock ' + code);
        err.code = code;
        reject(err);
      }, 0);
    });
  }

  function buildMock(scenario, failCode) {
    var signInResult = null;
    var persistenceShouldFail = (scenario === 'persistence-fail');
    var authStateError = (scenario === 'auth-state-error');
    var authStateThrow = (scenario === 'auth-subscribe-throw');

    if (scenario === 'success' || scenario === 'persistence-fail' || scenario === 'avatar-fallback') {
      signInResult = Promise.resolve({ user: Object.assign({}, mockUser, { photoURL: avatar === 'ok' ? 'https://example.invalid/missing.png' : 'https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/mail.svg' }) });
    } else if (scenario === 'avatar-fallback') {
      signInResult = Promise.resolve({ user: mockUser });
    } else if (failCode) {
      signInResult = makeFailingPromise('auth/' + failCode);
    } else {
      // scenario 名直接做 code
      signInResult = makeFailingPromise('auth/' + scenario);
    }

    return {
      apps: [],
      initializeApp: function () { return {}; },
      auth: function () {
        return {
          setPersistence: function (p) {
            if (persistenceShouldFail) {
              return Promise.reject(new Error('persistence failed'));
            }
            return Promise.resolve();
          },
          onAuthStateChanged: function (success, error) {
            // auth-subscribe-throw：直接 throw
            if (authStateThrow) {
              throw new Error('subscribe threw');
            }
            // 同步呼叫 success(user|guest) = state 落地
            // 然後 auth-state-error 會喺 1ms 後 call error
            setTimeout(function () {
              try {
                success(loggedin ? mockUser : null);
              } catch (e) {}
              if (authStateError) {
                setTimeout(function () {
                  try {
                    if (typeof error === 'function') {
                      error({ code: 'auth/internal-error', message: 'mocked' });
                    }
                  } catch (e) {}
                }, 0);
              }
            }, 0);
            return function unsubscribe() {};
          },
          signInWithPopup: function (provider) {
            return Promise.resolve(signInResult);
          },
          signOut: function () { return Promise.resolve(); }
        };
      },
      auth2: {
        GoogleAuthProvider: function () {
          this.setCustomParameters = function () {};
        },
        Auth: { Persistence: { LOCAL: 'local' } }
      }
    };
  }

  // Firebase 9+ 命名：firebase.auth.GoogleAuthProvider 喺 10.7.1 都用呢個 path
  // mock 兼容 firebase v9 / v10 compat 兩種訪問
  var mock = buildMock(scenario, failCode);
  // 確保 mock 結構包含所有 access path
  if (!mock.auth) mock.auth = function () { return mock.auth2; };
  if (!mock.auth.GoogleAuthProvider) mock.auth.GoogleAuthProvider = mock.auth2.GoogleAuthProvider;
  if (!mock.auth.Auth) mock.auth.Auth = mock.auth2.Auth;

  window.firebase = mock;
  window.FIREBASE_CONFIG = { apiKey: 'mock', projectId: 'mock' };
  window.TEACHER_EMAILS = ['mathteachlsh@gmail.com'];

  // 載入真實 auth-state.js
  var s = document.createElement('script');
  s.src = '/js/auth-state.js';
  s.defer = false; // 我哋想 mock 先 ready
  document.head.appendChild(s);

  s.addEventListener ? s.addEventListener('load', function () { /* loaded */ }) : null;

  // 額外 helpers
  window.__test.getState = function () { return window.AuthState && AuthState.get(); };
  window.__test.signIn = function () {
    if (window.AuthState && AuthState.signInWithGoogle) return AuthState.signInWithGoogle();
    return Promise.reject(new Error('no AuthState'));
  };
  window.__test.getUnhandledCount = function () { return window.__test.unhandledCount; };
  window.__test.getPageErrorCount = function () { return window.__test.pageErrorCount; };
  window.__test.reset = function () {
    window.__test.unhandledCount = 0;
    window.__test.pageErrorCount = 0;
    window.__test.errors = [];
  };
  window.__test.getToastText = function () {
    var t = document.getElementById('auth-toast');
    return t ? t.textContent : null;
  };
  window.__test.whenReady = function () {
    if (window.AuthState && AuthState.whenReady) return AuthState.whenReady();
    return Promise.resolve(null);
  };
})();
</script>
</body>
</html>
