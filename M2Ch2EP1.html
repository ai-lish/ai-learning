                    </svg>
                    知識測驗 / Knowledge Quiz
                </h3>
                
                <div id="quiz-container" class="flex flex-col gap-6">
                    <!-- Quizzes injected by JS -->
                </div>
            </section>
        </div>
    </main>

        // App State
        let lang = 'zh';
        let currentLevel = 1;
        
        // Level Specific States
        let state = {
            l1: { rows: 0, maxRows: 10, selected: null },
            l2: { hoverRow: -1, rows: 11 },
            l3: { step: 0 },
            l4: { n: 0, maxN: 12 },

                { id: 'q2_1', type: 'number', answer: 64 },

            ],

                { id: 'q3_2', type: 'number', answer: 161051 }
            ],
            4: [
                { id: 'q4_1', type: 'number', answer: 3 },
                { id: 'q4_2', type: 'number', answer: 7 }
            ],
            5: [
                { id: 'q5_1', type: 'select', options: ['optFractal', 'optSymmetry'], answer: 'optFractal' },
                { id: 'q5_2', type: 'number', answer: 2 }
            ],
            6: [
                { id: 'q6_1', type: 'number', answer: 3003 },
                { id: 'q6_2', type: 'number', answer: 1 }
            ]
        };

        const els = {
            tabs: document.getElementById('level-tabs'),
            title: document.getElementById('level-title'),
            desc: document.getElementById('level-desc'),
            controls: document.getElementById('controls-container'),
            canvas: document.getElementById('game-canvas'),
            container: document.getElementById('canvas-container'),
            log: document.getElementById('canvas-log'),

            langToggle: document.getElementById('lang-toggle'),
            returnLink: document.getElementById('return-link'),
            qHeader: document.getElementById('quiz-header')
        };

        const ctx = els.canvas.getContext('2d');
        
        // Pre-compute basic Pascal's Triangle for rendering up to Row 20
        const P = [];
        for (let i = 0; i <= 20; i++) {
            P[i] = [];
            for (let j = 0; j <= i; j++) {
                if (j === 0 || j === i) P[i][j] = 1;
                else P[i][j] = P[i-1][j-1] + P[i-1][j];
            }
        }

        // Language toggle event
        els.langToggle.addEventListener('click', () => {
            lang = lang === 'zh' ? 'en' : 'zh';
            buildUI();
            renderCanvas();
        });

        // Resize observer for responsive canvas
        window.addEventListener('resize', () => {
            resizeCanvas();
        });

        function resizeCanvas() {
            const rect = els.container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            els.canvas.width = rect.width * dpr;
            els.canvas.height = rect.height * dpr;
            ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset transform
            ctx.scale(dpr, dpr);
            renderCanvas();
        }

        function buildUI() {
            els.returnLink.innerText = dict[lang].backLink;
            // Translate header
            els.qHeader.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="text-indigo-500">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                ${dict[lang].q_header}
            `;

            // Build Tabs
            els.tabs.innerHTML = '';
            for (let i = 1; i <= 6; i++) {
                const li = document.createElement('li');
                li.className = 'snap-start';
                const btn = document.createElement('button');
                btn.className = `touch-target px-4 py-2 rounded-full font-medium transition ${currentLevel === i ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`;
                btn.innerText = dict[lang][`tab${i}`];
                btn.onclick = () => {
                    currentLevel = i;
                    buildUI();
                    resizeCanvas();
                };
                li.appendChild(btn);
                els.tabs.appendChild(li);
            }

            // Update Info Section
            els.title.innerText = dict[lang][`title${currentLevel}`];
            els.desc.innerText = dict[lang][`desc${currentLevel}`];
            els.log.classList.add('hidden');

            // Build Controls
            els.controls.innerHTML = '';
            if (currentLevel === 1) {
                const b1 = createBtn(dict[lang].btnNextRow, () => {
                    if (state.l1.rows < state.l1.maxRows) state.l1.rows++;
                    renderCanvas();
                });
                const b2 = createBtn(dict[lang].btnReset, () => {
                    state.l1.rows = 0; state.l1.selected = null; renderCanvas();
                }, true);
                els.controls.append(b1, b2);
            } else if (currentLevel === 3) {
                const b1 = createBtn(dict[lang].btnNextStep, () => {
                    if (state.l3.step < 2) state.l3.step++;
                    renderCanvas();
                });
                const b2 = createBtn(dict[lang].btnReset, () => {
                    state.l3.step = 0; renderCanvas();
                }, true);
                els.controls.append(b1, b2);
            } else if (currentLevel === 4) {
                const lbl = document.createElement('label');
                lbl.className = 'font-medium text-slate-700';
                lbl.innerText = `${dict[lang].lblDiagonal} ${state.l4.n}`;
                const slider = document.createElement('input');
                slider.type = 'range'; slider.min = 0; slider.max = state.l4.maxN; slider.value = state.l4.n;
                slider.className = 'w-32 md:w-48 cursor-pointer touch-target';
                slider.oninput = (e) => {
                    state.l4.n = parseInt(e.target.value);
                    lbl.innerText = `${dict[lang].lblDiagonal} ${state.l4.n}`;
                    renderCanvas();
                };
                els.controls.append(lbl, slider);
            } else if (currentLevel === 5) {
                const lbl = document.createElement('label');
                lbl.className = 'font-medium text-slate-700';
                lbl.innerText = `${dict[lang].lblRows} ${state.l5.rows}`;
                const slider = document.createElement('input');
                slider.type = 'range'; slider.min = 1; slider.max = 128; slider.value = state.l5.rows;
                slider.className = 'w-32 md:w-48 cursor-pointer touch-target';
                slider.oninput = (e) => {
                    state.l5.rows = parseInt(e.target.value);
                    lbl.innerText = `${dict[lang].lblRows} ${state.l5.rows}`;
                    renderCanvas();
                };

            } else if (currentLevel === 6) {

                lbl.innerText = dict[lang].lblSearch;
                const inp = document.createElement('input');
                inp.type = 'number'; inp.min = 1; inp.value = state.l6.inputVal;
                inp.className = 'border border-slate-300 rounded-lg px-3 py-2 w-24 touch-target focus:ring-2 focus:ring-indigo-500 outline-none';

                    state.l6.inputVal = inp.value;

                });

            // Build Quizzes
            els.quizContainer.innerHTML = '';
            const curQ = quizzes[currentLevel];
            curQ.forEach((q, idx) => {
                const qDiv = document.createElement('div');
                qDiv.className = 'flex flex-col gap-2';
                
                const qText = document.createElement('p');
                qText.className = 'font-medium text-slate-700';
                qText.innerText = `${idx + 1}. ${dict[lang][q.id]}`;
                
                const inputWrapper = document.createElement('div');
                inputWrapper.className = 'flex gap-2 items-center';
                
                let inputEl;
                if (q.type === 'number') {
                    inputEl = document.createElement('input');
                    inputEl.type = 'number';
                    inputEl.className = 'border border-slate-300 rounded-lg px-3 py-2 w-24 touch-target focus:ring-2 focus:ring-indigo-500 outline-none';
                } else if (q.type === 'select') {
                    inputEl = document.createElement('select');
                    inputEl.className = 'border border-slate-300 rounded-lg px-3 py-2 touch-target focus:ring-2 focus:ring-indigo-500 outline-none bg-white';
                    const defOpt = document.createElement('option');
                    defOpt.value = ""; defOpt.innerText = "---";
                    inputEl.appendChild(defOpt);
                    q.options.forEach(opt => {
                        const option = document.createElement('option');
                        option.value = opt; option.innerText = dict[lang][opt];
                        inputEl.appendChild(option);
                    });
                }

                const checkBtn = document.createElement('button');
                checkBtn.className = 'touch-target bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-2 rounded-lg font-medium shadow-sm transition';
                checkBtn.innerText = dict[lang].btnCheck;
                
                const fb = document.createElement('span');
                fb.className = 'text-sm font-bold ml-2 hidden';

                checkBtn.onclick = () => {
                    let val = q.type === 'number' ? parseInt(inputEl.value) : inputEl.value;
                    if (val === q.answer) {
                        fb.innerText = dict[lang].msgCorrect;
                        fb.className = 'text-sm font-bold ml-2 text-emerald-600';
                    } else {
                        fb.innerText = dict[lang].msgWrong;
                        fb.className = 'text-sm font-bold ml-2 text-rose-500';
                    }
                };

                inputWrapper.append(inputEl, checkBtn, fb);
                qDiv.append(qText, inputWrapper);
                els.quizContainer.appendChild(qDiv);

        function createBtn(text, onClick, secondary = false) {
            const btn = document.createElement('button');
            const bg = secondary ? 'bg-slate-200 hover:bg-slate-300 text-slate-700' : 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm';
            btn.className = `touch-target px-4 py-2 rounded-lg font-medium transition ${bg}`;
            btn.innerText = text;
            btn.onclick = onClick;
            return btn;
        }

        function combinationBig(n, k) {
            if (k < 0 || k > n) return -1n;
            let nB = BigInt(n);
            let kB = BigInt(k);
            let res = 1n;
            if (kB > nB / 2n) kB = nB - kB;
            for (let i = 1n; i <= kB; i++) {
                res = (res * (nB - i + 1n)) / i;
            }
            return res;
        }

        function runSingmaster() {
            let targetStr = state.l6.inputVal;
            let target;
            try {
                target = BigInt(targetStr);
            } catch (e) {
                return;
            }
            if (target <= 0n) return;
            
            els.log.classList.remove('hidden');
            els.log.innerHTML = `<span class="text-indigo-600 font-bold">${dict[lang].finding}</span>`;
            
            // Allow UI to update before heavy computation
            setTimeout(() => {
                let results = [];
                if (target === 1n) {
                    // 1 appears infinitely. Just show row 0 to 4
                    results = [[0,0], [1,0], [1,1], [2,0], [2,2], [3,0], [3,3]];
                } else {
                    let k = 1;
                    while (true) {
                        let maxKComb = combinationBig(2 * k, k);
                        if (maxKComb > target) break;
                        
                        if (k === 1) {
                            let n = Number(target);
                            results.push([n, 1]);
                            if (n !== 2) results.push([n, n - 1]);
                            k++; continue;
                        }
                        if (k === 2) {
                            // n(n-1)/2 = target => n^2 - n - 2*target = 0
                            // n = (1 + sqrt(1 + 8*target))/2
                            let numTarget = Number(target);
                            let n = Math.floor((1 + Math.sqrt(1 + 8 * numTarget)) / 2);
                            if (combinationBig(n, 2) === target) {
                                results.push([n, 2]);
                                if (n - 2 !== 2) results.push([n, n - 2]);
                            }
                            k++; continue;
                        }

                        // Binary search for larger k
                        let low = 2 * k;
                        let high = Number(target); // safe since target grows slower
                        
                        while (low <= high) {
                            let mid = Math.floor((low + high) / 2);
                            let val = combinationBig(mid, k);
                            if (val === target) {
                                results.push([mid, k]);
                                if (mid - k !== k) results.push([mid, mid - k]);
                                break;
                            } else if (val < target) {
                                low = mid + 1;
                            } else {
                                high = mid - 1;
                            }
                        }
                        k++;
                    }
                }
                
                results.sort((a,b) => a[0] - b[0] || a[1] - b[1]);
                state.l6.results = results;
                state.l6.target = target;
                showSingmasterLog();
                renderCanvas();
            }, 50);
        }

        function showSingmasterLog() {
            els.log.classList.remove('hidden');
            const res = state.l6.results;
            let html = `<strong>${dict[lang].occurrences} ${res.length > 6 && state.l6.target===1n ? '∞' : res.length}</strong><br>`;
            res.forEach(item => {
                html += `<span class="inline-block bg-white border border-slate-200 rounded px-2 py-1 m-1 text-xs shadow-sm">
                    ${dict[lang].row} ${item[0]}, ${dict[lang].pos} ${item[1]}
                </span>`;
            });
            els.log.innerHTML = html;
        }

        function getEventPos(e) {
            const rect = els.canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            return {
                x: (clientX - rect.left),
                y: (clientY - rect.top)
            };
        }

        function getLevel1Geometry(w) {
            const radius = Math.min(18, w / (12 * 2.5));
            return {
                radius,
                dy: radius * 2.5,
                dx: radius * 2.2,
                topOffset: 30 + radius,
                centerX: w / 2
            };
        }

        els.canvas.addEventListener('pointerdown', (e) => {
            if (currentLevel === 5 || currentLevel === 3 || currentLevel === 6) return;
            const pos = getEventPos(e);
            handleCanvasInteraction(pos.x, pos.y, true);
        });

        els.canvas.addEventListener('pointermove', (e) => {
            if (currentLevel !== 2) return; // Only level 2 needs hover
            const pos = getEventPos(e);
            handleCanvasInteraction(pos.x, pos.y, false);
        });

        function handleCanvasInteraction(x, y, isClick) {
            const rect = els.container.getBoundingClientRect();
            const w = rect.width;

            // Shared geometry parameters
            let rowsToDraw = 0;
            let geometry;
            if (currentLevel === 1) {
                rowsToDraw = state.l1.rows;
                geometry = getLevel1Geometry(w);
            } else {
                if (currentLevel === 2) rowsToDraw = state.l2.rows;
                if (currentLevel === 4) rowsToDraw = state.l4.maxN + 1;
                const radius = Math.min(18, w / (rowsToDraw * 2.5));
                geometry = {
                    radius,
                    dy: radius * 2.5,
                    dx: radius * 2.2,
                    topOffset: 30 + radius,
                    centerX: w / 2
                };
            }

            if (rowsToDraw === 0) return;

            const {radius, dy, dx, topOffset, centerX} = geometry;

            // Reverse calculate row from y
            let r = Math.round((y - topOffset) / dy);
            
            if (r >= 0 && r <= rowsToDraw) {
                if (currentLevel === 2) {
                    if (state.l2.hoverRow !== r) {
                        state.l2.hoverRow = r;
                        renderCanvas();
                    }
                } else if (currentLevel === 1 && isClick) {
                    // Check specific cell
                    let cFloat = (x - centerX) / dx + r / 2;
                    let c = Math.round(cFloat);
                    if (c >= 0 && c <= r) {
                        // verify distance
                        let cx = centerX + (c - r/2) * dx;
                        let cy = topOffset + r * dy;
                        let dist = Math.hypot(x - cx, y - cy);
                        if (dist <= Math.max(22, radius * 1.5)) {
                            state.l1.selected = {r, c};
                            renderCanvas();
                        }
                    }
                }
            } else if (currentLevel === 2) {
                if (state.l2.hoverRow !== -1) {
                    state.l2.hoverRow = -1;
                    renderCanvas();
                }
            }
        }

        function renderCanvas() {
            const rect = els.container.getBoundingClientRect();
            const w = rect.width;
            const h = rect.height;
            
            ctx.clearRect(0, 0, w, h);
            
            if (currentLevel === 1) drawLevel1(w, h);
            else if (currentLevel === 2) drawLevel2(w, h);
            else if (currentLevel === 3) drawLevel3(w, h);
            else if (currentLevel === 4) drawLevel4(w, h);
            else if (currentLevel === 5) drawLevel5(w, h);
            else if (currentLevel === 6) drawLevel6(w, h);
        }

        // Draw Hexagon or Circle for node
        function drawNode(cx, cy, radius, text, bg, fg, hl = false) {
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fillStyle = bg;
            ctx.fill();
            if (hl) {
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#f59e0b'; // amber
                ctx.stroke();
            }
            ctx.fillStyle = fg;
            ctx.font = `bold ${radius * 0.9}px Inter`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, cx, cy + radius*0.05); // slight optical adjustment
        }

        function drawLevel1(w, h) {
            const rows = state.l1.rows;
            const {radius, dy, dx, topOffset, centerX} = getLevel1Geometry(w);

            for (let r = 0; r <= rows; r++) {
                for (let c = 0; c <= r; c++) {
                    let cx = centerX + (c - r/2) * dx;
                    let cy = topOffset + r * dy;
                    
                    let bg = '#ffffff';
                    let fg = '#334155';
                    let hl = false;

                    // Highlight logic
                    if (state.l1.selected) {
                        let sr = state.l1.selected.r;
                        let sc = state.l1.selected.c;
                        if (r === sr && c === sc) {
                            bg = '#fef3c7'; // amber-100
                            fg = '#d97706'; // amber-600
                            hl = true;
                        } else if (r === sr - 1 && (c === sc || c === sc - 1)) {
                            bg = '#e0e7ff'; // indigo-100
                            fg = '#4338ca'; // indigo-700
                        }
                    }

                    drawNode(cx, cy, radius, P[r][c], bg, fg, hl);
                }
                
                // Draw Row label
                ctx.fillStyle = '#94a3b8';
                ctx.font = `${radius * 0.8}px Inter`;
                ctx.textAlign = 'left';
                ctx.fillText(dict[lang].canvasRowTemplate.replace("{n}", r), 10, topOffset + r * dy);
            }
        }

        function drawLevel2(w, h) {
            const rows = state.l2.rows;
            const radius = Math.min(16, w / (rows * 2.5));
            const dy = radius * 2.5;
            const dx = radius * 2.2;
            const topOffset = 20 + radius;
            const centerX = w / 2 - 40; // Shift left a bit for the sum text

            for (let r = 0; r < rows; r++) {
                let isHover = (state.l2.hoverRow === r);
                for (let c = 0; c <= r; c++) {
                    let cx = centerX + (c - r/2) * dx;
                    let cy = topOffset + r * dy;
                    let bg = isHover ? '#e0e7ff' : '#ffffff';
                    let fg = isHover ? '#4338ca' : '#475569';
                    drawNode(cx, cy, radius, P[r][c], bg, fg, false);
                }
                
                // Draw Sum
                ctx.fillStyle = isHover ? '#4338ca' : '#94a3b8';
                ctx.font = `bold ${radius * 0.9}px Inter`;
                ctx.textAlign = 'left';
                let rightmostX = centerX + (r/2) * dx + radius + 10;
                let sumTxt = isHover ? `${dict[lang].canvasSumLabel} = ${Math.pow(2, r)} (2^${r})` : `= ?`;
                ctx.fillText(sumTxt, rightmostX, topOffset + r * dy);
            }
        }

        function drawLevel3(w, h) {
            const step = state.l3.step;
            const topOffset = h / 2 - 40;
            const radius = 24;
            const dx = radius * 2.5;
            const vals = [1, 5, 10, 10, 5, 1]; // Row 5
            const displayVals = [...vals];
            let carryFrom = -1;
            let carryTo = -1;

            // Carry the 10 in the third place from the right, then the resulting 11.
            if (step >= 1) {
                displayVals[2] = 11;
                displayVals[3] = 0;
                carryFrom = 3;
                carryTo = 2;
            }
            if (step >= 2) {
                displayVals[1] = 6;
                displayVals[2] = 1;
                carryFrom = 2;
                carryTo = 1;
            }
            const actives = carryFrom >= 0 ? [carryFrom, carryTo] : [];

            const totalW = (vals.length - 1) * dx;
            const startX = (w - totalW) / 2;

            // Draw original row small at top
            ctx.fillStyle = '#64748b';
            ctx.font = '16px Inter';
            ctx.textAlign = 'center';
            ctx.fillText(dict[lang].canvasRow5 + "  " + vals.join("   "), w/2, topOffset - 70);

            // Draw interactive row
            for (let i = 0; i < displayVals.length; i++) {
                let cx = startX + i * dx;
                let cy = topOffset;
                let isAct = actives.includes(i);
                let bg = isAct ? '#fef3c7' : '#ffffff';
                let fg = isAct ? '#d97706' : '#1e293b';
                
                // Draw box instead of circle
                ctx.fillStyle = bg;
                ctx.beginPath();
                ctx.roundRect(cx - radius, cy - radius, radius*2, radius*2, 8);
                ctx.fill();
                if(isAct) {
                    ctx.strokeStyle = '#f59e0b';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                ctx.fillStyle = fg;
                ctx.font = `bold 20px Inter`;
                ctx.textBaseline = 'middle';
                ctx.fillText(displayVals[i], cx, cy);
            }

            if (carryFrom >= 0) {
                const fromX = startX + carryFrom * dx;
                const toX = startX + carryTo * dx;
                const arrowY = topOffset - radius - 5;

                ctx.beginPath();
                ctx.moveTo(fromX, arrowY);
                ctx.quadraticCurveTo((fromX + toX) / 2, arrowY - 25, toX, arrowY);
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(toX, arrowY);
                ctx.lineTo(toX + 9, arrowY - 5);
                ctx.lineTo(toX + 9, arrowY + 5);
                ctx.closePath();
                ctx.fillStyle = '#ef4444';
                ctx.fill();

                ctx.fillStyle = '#ef4444';
                ctx.font = '14px Inter';
                ctx.fillText('+1', (fromX + toX) / 2, arrowY - 12);
            }

            if (step >= 2) {
                ctx.fillStyle = '#4338ca';
                ctx.font = 'bold 24px Inter';
                ctx.fillText(`= 161051 (= 11^5)`, w/2, topOffset + 70);
            }
        }

        function drawLevel4(w, h) {
            const rows = state.l4.maxN + 1;
            const radius = Math.max(1, Math.min(18, w / (rows * 2.5), (h - 90) / (rows * 2.5 - 0.5)));
            const dy = radius * 2.5;
            const dx = radius * 2.2;
            const topOffset = 30 + radius;
            const centerX = w / 2;
            const n = state.l4.n;

            // Diagonal cells: (n-k, k) for k = 0 to floor(n/2)
            let diagCells = [];
            let sum = 0;
            for (let k = 0; k <= Math.floor(n/2); k++) {
                diagCells.push({r: n - k, c: k});
                sum += P[n-k][k];
            }

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c <= r; c++) {
                    let cx = centerX + (c - r/2) * dx;
                    let cy = topOffset + r * dy;
                    
                    let isDiag = diagCells.some(cell => cell.r === r && cell.c === c);
                    
                    let bg = isDiag ? '#10b981' : '#f8fafc';
                    let fg = isDiag ? '#ffffff' : '#cbd5e1'; // mute others

                    drawNode(cx, cy, radius, P[r][c], bg, fg, false);
                }
            }

            // Draw line through diagonal
            if (diagCells.length > 0) {
                ctx.beginPath();
                let first = diagCells[0];
                let last = diagCells[diagCells.length-1];
                let startX = centerX + (first.c - first.r/2) * dx;
                let startY = topOffset + first.r * dy;
                let endX = centerX + (last.c - last.r/2) * dx;
                let endY = topOffset + last.r * dy;
                
                ctx.moveTo(startX + dx, startY + dy); // extend a bit
                ctx.lineTo(endX - dx, endY - dy);
                ctx.strokeStyle = 'rgba(16, 185, 129, 0.3)';
                ctx.lineWidth = radius * 1.5;
                ctx.lineCap = 'round';
                ctx.stroke();
            }

            // Text output
            ctx.fillStyle = '#0f766e';
            ctx.font = `bold 20px Inter`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText(`${dict[lang].canvasSumLabel} = ${sum} (F_${n+1})`, w/2, h - 18);
        }

        function drawLevel5(w, h) {
            const rows = state.l5.rows;
            // maximize space use
            const maxTriHeight = h - 40;
            const dy = maxTriHeight / rows;
            const dx = dy; // right angle/equilateral mix visual
            const topOffset = 20;
            const centerX = w / 2;

            ctx.fillStyle = '#1e293b'; // slate-800 for odd numbers

            for (let r = 0; r < rows; r++) {
                let startX = centerX - (r/2) * dx;
                let y = topOffset + r * dy;
                for (let c = 0; c <= r; c++) {
                    // Lucas' Theorem bitwise trick for parity of C(r, c)
                    if ((r & c) === c) {
                        ctx.fillRect(startX + c * dx - dx/2 + 1, y, dx - 1, dy - 1);
                    }
                }
            }
        }

        function drawLevel6(w, h) {
            const rows = 16;
            const radius = Math.min(16, w / (rows * 2.5));
            const dy = radius * 2.5;
            const dx = radius * 2.2;
            const topOffset = 20 + radius;
            const centerX = w / 2;

            const res = state.l6.results;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c <= r; c++) {
                    let cx = centerX + (c - r/2) * dx;
                    let cy = topOffset + r * dy;
                    
                    let isTarget = false;
                    for (let i = 0; i < res.length; i++) {
                        if (res[i][0] === r && res[i][1] === c) {
                            isTarget = true; break;
                        }
                    }

                    let bg = isTarget ? '#ef4444' : '#ffffff'; // red if found
                    let fg = isTarget ? '#ffffff' : '#64748b';
                    drawNode(cx, cy, radius, P[r][c], bg, fg, isTarget);
                }
            }
        }

        window.onload = () => {
            buildUI();
            // Short delay to ensure layout is done before canvas resize
            setTimeout(() => {
                resizeCanvas();
            }, 100);
        };

    </script>
</body>
</html>
