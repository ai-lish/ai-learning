<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKDSE 卷一 答案 OCR 審核系統</title>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            startup: { typeset: false }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async crossorigin="anonymous"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans TC', sans-serif; background: #f5f5f5; padding: 20px; }
        .header { background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%); color: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        .header h1 { font-size: 22px; margin-bottom: 10px; }
        .toolbar { background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .toolbar select, .toolbar button { padding: 8px 15px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        .toolbar button { background: #27ae60; color: white; cursor: pointer; border: none; }
        .toolbar button:hover { background: #219a52; }
        .toolbar button.rescan { background: #e67e22; }
        .toolbar button.rescan:hover { background: #d35400; }
        .toolbar button.approve { background: #27ae60; }
        .toolbar button.reject { background: #e74c3c; }
        .mode-indicator { padding: 8px 15px; background: #e0e0e0; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .question-card { background: white; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
        .question-header { background: #27ae60; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .question-header .q-id { font-size: 18px; font-weight: bold; }
        .question-header .q-meta { font-size: 14px; opacity: 0.9; }
        .question-body { padding: 20px; }
        
        /* Answer Section */
        .answer-section { background: #e8f5e9; border: 2px solid #27ae60; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .answer-section h4 { color: #27ae60; margin-bottom: 10px; font-size: 14px; }
        .answer-text { background: white; border-radius: 8px; padding: 15px; font-size: 15px; line-height: 1.8; }
        .answer-text .latex { font-family: 'Times New Roman', serif; }
        
        /* Marking Info */
        .marking-section { background: #fff3cd; border: 2px solid #ffc107; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .marking-section h4 { color: #856404; margin-bottom: 10px; font-size: 14px; }
        .marking-codes { display: flex; flex-wrap: wrap; gap: 8px; }
        .marking-code { background: #fff3cd; border: 1px solid #ffc107; padding: 5px 12px; border-radius: 15px; font-size: 13px; font-family: monospace; }
        .marking-code.accepted { background: #d4edda; border-color: #27ae60; color: #155724; }
        .marking-code.rejected { background: #f8d7da; border-color: #e74c3c; color: #721c24; }
        
        /* Original Image */
        .image-section { background: #f8f9fa; border: 2px solid #ddd; border-radius: 10px; padding: 15px; margin-bottom: 15px; text-align: center; }
        .image-section h4 { color: #666; margin-bottom: 10px; font-size: 14px; }
        .image-section img { max-width: 100%; max-height: 400px; border-radius: 8px; cursor: pointer; }
        
        /* Status */
        .status-badge { padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; }
        .status-badge.pending { background: #e0e0e0; color: #333; }
        .status-badge.approved { background: #27ae60; color: white; }
        .status-badge.rejected { background: #e74c3c; color: white; }
        .status-badge.rescanning { background: #f39c12; color: white; }
        
        .nav-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .nav-buttons button { padding: 8px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .nav-buttons .prev { background: #e0e0e0; color: #333; }
        .nav-buttons .next { background: #27ae60; color: white; }
        
        .toast { position: fixed; top: 20px; right: 20px; background: #27ae60; color: white; padding: 15px 20px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity 0.3s; z-index: 1000; }
        .toast.show { opacity: 1; }
        .toast.error { background: #e74c3c; }
        
        .loading { text-align: center; padding: 50px; color: #888; }
        .loading::after { content: '...'; animation: dots 1.5s infinite; }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60%, 100% { content: '...'; } }
        
        /* Progress */
        .progress-bar { background: #e0e0e0; border-radius: 10px; height: 20px; margin-bottom: 10px; overflow: hidden; }
        .progress-bar .fill { background: #27ae60; height: 100%; transition: width 0.3s; }
        .progress-info { display: flex; justify-content: space-between; font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div class="toast" id="toast">✓ 已保存</div>
    
    <div class="header">
        <h1>📝 HKDSE 卷一 答案 OCR 審核系統</h1>
        <div id="stats"></div>
    </div>
    
    <div class="toolbar">
        <select id="yearFilter"><option value="all">全部年份</option></select>
        <select id="statusFilter">
            <option value="all">全部狀態</option>
            <option value="pending">待審批</option>
            <option value="approved">已確認</option>
            <option value="rejected">不合格</option>
        </select>
        <span class="mode-indicator" id="modeIndicator">📝 審批模式</span>
        <button onclick="exportData()">💾 匯出 JSON</button>
        <button onclick="syncToGitHub()" style="background:#27ae60;">☁️ 同步到 GitHub</button>
        <button onclick="window.open('https://docs.google.com/spreadsheets/d/1L5j_1vZxvC0yDRjrrzSdM34As5daFlaont6cZYWvMeM/edit', '_blank')" style="background:#f39c12;">📊 Google Sheet</button>
        <button class="prev" onclick="prevQuestion()">⬆ 上一題</button>
        <button class="next" onclick="nextQuestion()">⬇ 下一題</button>
    </div>
    
    <div id="progressSection" style="background:white;padding:15px;border-radius:10px;margin-bottom:20px;">
        <div class="progress-bar"><div class="fill" id="progressFill" style="width:0%"></div></div>
        <div class="progress-info">
            <span id="progressText">準備中...</span>
            <span id="progressPercent">0%</span>
        </div>
    </div>
    
    <div id="questionsContainer">
        <div class="loading">載入中</div>
    </div>
    
    <script>
        var allAnswers = {};
        var currentQid = null;
        var ocrStatus = {}; // Store approval status
        
        // Load OCR results and status
        async function loadData() {
            try {
                // Load OCR results
                var resp = await fetch("p1_answer_ocr_results.json");
                if (!resp.ok) {
                    throw new Error("OCR results not found. Please run OCR first.");
                }
                var data = await resp.json();
                
                // Store in format: {qid: ocr_result}
                allAnswers = data.results || {};
                
                console.log("Loaded OCR results:", Object.keys(allAnswers).length);
                
                // Load saved status
                var saved = localStorage.getItem("hkdse_p1_answer_status");
                if (saved) {
                    ocrStatus = JSON.parse(saved);
                }
                
                updateProgress();
                populateFilters();
                showQuestion(Object.keys(allAnswers)[0]);
                
            } catch (e) {
                console.error("Error:", e);
                document.getElementById("questionsContainer").innerHTML = 
                    "<div style='text-align:center;padding:50px;'>" +
                    "<h3 style='color:#e74c3c;'>無法載入數據</h3>" +
                    "<p style='color:#888;margin-top:10px;'>" + e.message + "</p>" +
                    "<p style='color:#888;margin-top:10px;font-size:13px;'>請先運行 OCR 腳本：python3 ocr_answer_images.py</p>" +
                    "</div>";
            }
        }
        
        function updateProgress() {
            var total = Object.keys(allAnswers).length;
            var approved = Object.values(ocrStatus).filter(s => s === 'approved').length;
            var rejected = Object.values(ocrStatus).filter(s => s === 'rejected').length;
            var pending = total - approved - rejected;
            
            var percent = total > 0 ? Math.round(((approved + rejected) / total) * 100) : 0;
            
            document.getElementById("progressFill").style.width = percent + "%";
            document.getElementById("progressText").textContent = 
                `已審批: ${approved} | 不合格: ${rejected} | 待審批: ${pending}`;
            document.getElementById("progressPercent").textContent = percent + "%";
            
            document.getElementById("stats").innerHTML = 
                `<div style="font-size:14px;margin-top:10px;">
                    總題目: ${total} | 已確認: ${approved} | 不合格: ${rejected} | 待審批: ${pending}
                </div>`;
        }
        
        function populateFilters() {
            var years = [...new Set(Object.keys(allAnswers).map(q => q.substring(0, 4)))].sort().reverse();
            var yearSel = document.getElementById("yearFilter");
            years.forEach(y => {
                var opt = document.createElement("option");
                opt.value = y; opt.textContent = y;
                yearSel.appendChild(opt);
            });
            
            document.getElementById("statusFilter").onchange = function() {
                filterAndShow();
            };
            document.getElementById("yearFilter").onchange = function() {
                filterAndShow();
            };
        }
        
        function filterAndShow() {
            var year = document.getElementById("yearFilter").value;
            var status = document.getElementById("statusFilter").value;
            
            var filtered = Object.keys(allAnswers).filter(qid => {
                var qYear = qid.substring(0, 4);
                var qStatus = ocrStatus[qid] || 'pending';
                
                if (year !== 'all' && qYear !== year) return false;
                if (status !== 'all' && qStatus !== status) return false;
                
                return true;
            });
            
            if (filtered.length > 0) {
                showQuestion(filtered[0]);
            } else {
                document.getElementById("questionsContainer").innerHTML = 
                    "<div style='text-align:center;padding:50px;color:#888;'>沒有符合條件的題目</div>";
            }
        }
        
        function showQuestion(qid) {
            currentQid = qid;
            var data = allAnswers[qid];
            if (!data) return;
            
            var status = ocrStatus[qid] || 'pending';
            var statusClass = status;
            var statusText = {'pending': '待審批', 'approved': '已確認', 'rejected': '不合格', 'rescanning': '重新掃描中'}[status];
            
            var html = `
                <div class="question-card">
                    <div class="question-header">
                        <div class="q-id">${qid}</div>
                        <div class="q-meta">
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                    </div>
                    <div class="question-body">
            `;
            
            // Original Image
            if (data.image_path) {
                var imageName = data.image_path.split('/').pop();
                html += `
                    <div class="image-section">
                        <h4>📷 原始答案圖片</h4>
                        <img src="../answer-images/${imageName}" alt="答案圖片" onclick="window.open(this.src, '_blank')">
                    </div>
                `;
            }
            
            // OCR Result
            html += `
                <div class="answer-section">
                    <h4>📝 OCR 識別結果</h4>
                    <div class="answer-text" id="answerText">
                        ${data.text || '<span style="color:#e74c3c;">OCR 識別失敗或無文字</span>'}
                    </div>
                </div>
            `;
            
            // Marking codes (need manual input for now)
            html += `
                <div class="marking-section">
                    <h4>🏷️ 評分標示（請手動輸入或編輯）</h4>
                    <div class="marking-codes" id="markingCodes">
                        <input type="text" id="markingInput" placeholder="例如: 1M, 1A, 2M" 
                            style="padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;flex:1;"
                            value="${data.marking_codes || ''}"
                            onchange="saveMarkingCodes()">
                    </div>
                </div>
            `;
            
            // Action Buttons
            html += `
                <div class="btn-row" style="margin-top:20px;">
                    <button class="approve" onclick="setStatus('approved')" ${status === 'approved' ? 'disabled' : ''}>
                        ✓ 確認答案
                    </button>
                    <button class="reject" onclick="setStatus('rejected')" ${status === 'rejected' ? 'disabled' : ''}>
                        ✗ 不合格（需重新掃描）
                    </button>
                </div>
            `;
            
            // Navigation
            html += `
                <div class="nav-buttons">
                    <button class="prev" onclick="prevQuestion()">⬆ 上一題</button>
                    <button class="next" onclick="nextQuestion()">⬇ 下一題</button>
                </div>
            `;
            
            html += `
                    </div>
                </div>
            `;
            
            document.getElementById("questionsContainer").innerHTML = html;
            
            // Typeset MathJax
            if (window.MathJax) {
                MathJax.typesetPromise([document.getElementById("answerText")]).catch(console.error);
            }
        }
        
        function setStatus(status) {
            if (!currentQid) return;
            ocrStatus[currentQid] = status;
            localStorage.setItem("hkdse_p1_answer_status", JSON.stringify(ocrStatus));
            showToast(status === 'approved' ? '✓ 已確認' : '✗ 已標記為不合格');
            updateProgress();
            showQuestion(currentQid);
        }
        
        function saveMarkingCodes() {
            if (!currentQid) return;
            var codes = document.getElementById("markingInput").value;
            if (!allAnswers[currentQid]) allAnswers[currentQid] = {};
            allAnswers[currentQid].marking_codes = codes;
            localStorage.setItem("hkdse_p1_answer_ocr_results", JSON.stringify(allAnswers));
            showToast('✓ 已保存評分標示');
        }
        
        function prevQuestion() {
            var allIds = Object.keys(allAnswers);
            var idx = allIds.indexOf(currentQid);
            if (idx > 0) {
                showQuestion(allIds[idx - 1]);
            }
        }
        
        function nextQuestion() {
            var allIds = Object.keys(allAnswers);
            var idx = allIds.indexOf(currentQid);
            if (idx < allIds.length - 1) {
                showQuestion(allIds[idx + 1]);
            }
        }
        
        function exportData() {
            var exportData = {
                ocr_results: allAnswers,
                status: ocrStatus,
                exported_at: new Date().toISOString()
            };
            
            var blob = new Blob([JSON.stringify(exportData, null, 2)], { type: "application/json" });
            var url = URL.createObjectURL(blob);
            var a = document.createElement("a");
            a.href = url;
            a.download = "p1_answer_ocr_" + new Date().toISOString().split("T")[0] + ".json";
            a.click();
        }
        
        async function syncToGitHub() {
            showToast("需要 GitHub Token，請在 console 中手動上傳", true);
        }
        
        function showToast(msg, isError = false) {
            var toast = document.getElementById("toast");
            toast.textContent = msg;
            toast.className = "toast show" + (isError ? " error" : "");
            setTimeout(() => { toast.className = "toast"; }, 3000);
        }
        
        // Keyboard navigation
        document.addEventListener("keydown", function(e) {
            if (e.key === "ArrowLeft") prevQuestion();
            if (e.key === "ArrowRight") nextQuestion();
        });
        
        // Load data on page load
        loadData();
    </script>
</body>
</html>
