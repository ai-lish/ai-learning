<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKDSE 仿題模板系統</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans TC', sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        .header h1 { font-size: 24px; margin-bottom: 10px; }
        
        .card { background: white; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .card h2 { font-size: 16px; margin-bottom: 15px; color: #333; border-bottom: 2px solid #667eea; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .card h2 .badge { background: #667eea; color: white; padding: 2px 10px; border-radius: 10px; font-size: 12px; }
        
        /* Stats */
        .stats { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat { background: white; padding: 12px 20px; border-radius: 10px; text-align: center; flex: 1; min-width: 100px; }
        .stat .number { font-size: 24px; font-weight: bold; color: #667eea; }
        .stat .label { font-size: 11px; color: #888; }
        
        /* Main Layout: 2 columns */
        .main-layout { display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } }
        
        /* Left: Question List */
        .question-list-container { max-height: 70vh; overflow-y: auto; }
        .question-item { border: 2px solid #e0e0e0; border-radius: 10px; padding: 12px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s; }
        .question-item:hover { border-color: #667eea; background: #f8f9fa; }
        .question-item.selected { border-color: #667eea; background: #e8f0fe; }
        .question-item .q-id { font-weight: bold; color: #667eea; font-size: 12px; }
        .question-item .q-topic { background: #e0e0e0; padding: 2px 6px; border-radius: 8px; font-size: 10px; margin-left: 5px; }
        .question-item .q-text { margin-top: 5px; font-size: 13px; color: #333; line-height: 1.4; }
        .question-item .q-status { display: inline-block; width: 18px; height: 18px; border-radius: 50%; margin-left: 5px; font-size: 10px; text-align: center; line-height: 18px; }
        .question-item .q-status.approved { background: #27ae60; color: white; }
        .question-item .q-status.rejected { background: #ff5252; color: white; }
        
        /* Filter */
        .filter-bar { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .filter-bar select, .filter-bar input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; flex: 1; }
        .filter-bar button { padding: 8px 15px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
        
        /* Right: Template Editor & Preview */
        .editor-preview-section { display: flex; flex-direction: column; gap: 15px; }
        
        /* Original Question (Green) */
        .ocr-box { background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%); border: 2px solid #4caf50; border-radius: 12px; padding: 15px; }
        .ocr-box .label { font-size: 12px; color: #2e7d32; margin-bottom: 8px; font-weight: bold; }
        .ocr-box .text { font-size: 14px; color: #333; line-height: 1.6; }
        
        /* Template Editor (White) */
        .template-editor-box { background: white; border: 2px solid #667eea; border-radius: 12px; padding: 15px; }
        .template-editor-box .label { font-size: 12px; color: #667eea; margin-bottom: 8px; font-weight: bold; }
        .template-editor-box input, .template-editor-box textarea { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: inherit; }
        .template-editor-box textarea { min-height: 60px; resize: vertical; background: #fffef0; }
        
        /* Variables Tags */
        .var-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .var-tag { background: #e8f0fe; border: 1px solid #667eea; border-radius: 15px; padding: 5px 10px; font-size: 12px; display: flex; align-items: center; gap: 5px; }
        .var-tag .name { font-weight: bold; color: #667eea; }
        .var-tag input { width: 50px; padding: 2px 5px; border: 1px solid #ddd; border-radius: 4px; font-size: 11px; }
        
        /* Displacement Options */
        .disp-options { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .disp-option { background: #fff3e0; border: 2px solid #ff9800; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 12px; transition: all 0.2s; }
        .disp-option:hover { background: #ffe0b2; }
        .disp-option.selected { background: #ff9800; color: white; border-color: #e65100; }
        .disp-option input { display: none; }
        
        /* Generated Preview (Blue) */
        .preview-box { background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%); border: 2px solid #2196f3; border-radius: 12px; padding: 20px; text-align: center; }
        .preview-box .label { font-size: 12px; color: #1565c0; margin-bottom: 10px; font-weight: bold; }
        .preview-box .question-text { font-size: 16px; color: #333; line-height: 1.8; margin-bottom: 15px; text-align: left; }
        .preview-box .answer { background: #fff3cd; padding: 10px 15px; border-radius: 8px; display: inline-block; font-weight: bold; }
        
        /* Arrow */
        .arrow { text-align: center; font-size: 24px; margin: 5px 0; }
        
        /* Buttons */
        .btn-row { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5568d3; }
        .btn-success { background: #27ae60; color: white; }
        .btn-success:hover { background: #219a52; }
        .btn-secondary { background: #e0e0e0; color: #333; }
        .btn-secondary:hover { background: #d0d0d0; }
        .btn-danger { background: #e0e0e0; color: #333; }
        .btn-danger:hover { background: #ff5252; color: white; }
        
        /* Tab styles */
        .tab-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { padding: 10px 25px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; background: #e0e0e0; color: #333; }
        .tab-btn.active { background: #667eea; color: white; }
        .tab-btn.answer-tab.active { background: #27ae60; color: white; }
        
        /* Placeholder when no question selected */
        .placeholder { text-align: center; padding: 60px 20px; color: #888; }
        .placeholder .icon { font-size: 48px; margin-bottom: 15px; }
        
        /* Saved Section */
        .saved-section { margin-top: 20px; }
        .saved-item { background: #f8f9fa; border-radius: 8px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .saved-item .info .title { font-weight: bold; color: #333; font-size: 13px; }
        .saved-item .info .meta { font-size: 11px; color: #888; margin-top: 2px; }
        .saved-item .actions { display: flex; gap: 5px; }
        .saved-item .actions button { padding: 5px 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; }
        .saved-item .actions .edit-btn { background: #667eea; color: white; }
        .saved-item .actions .delete-btn { background: #ff6b6b; color: white; }
        
        /* Topic input */
        .topic-input { margin-bottom: 10px; }
        .topic-input input { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 HKDSE 仿題模板系統</h1>
            <p>選擇題目 → 查看對照 → 確認模板</p>
        </div>
        
        <!-- Stats -->
        <div class="stats">
            <div class="stat">
                <div class="number" id="totalQuestions">0</div>
                <div class="label">總題目</div>
            </div>
            <div class="stat">
                <div class="number" id="totalTemplates">0</div>
                <div class="label">已建立模板</div>
            </div>
            <div class="stat">
                <div class="number" id="approvedCount">0✓</div>
                <div class="label">已確認</div>
            </div>
            <div class="stat">
                <div class="number" id="rejectedCount">0✗</div>
                <div class="label">不合格</div>
            </div>
        </div>
        
        <!-- Main Content: 2 Columns -->
        <div class="main-layout">
            <!-- Left: Question List -->
            <div class="card">
                <h2>📚 題目列表 <span class="badge" id="questionCount">0 題</span></h2>
                
                <div class="filter-bar">
                    <select id="paperSelect" onchange="loadQuestions()">
                        <option value="P1">卷一 (P1)</option>
                        <option value="P2">卷二 (P2)</option>
                    </select>
                    <select id="topicSelect">
                        <option value="概率">概率</option>
                        <option value="all">全部課題</option>
                    </select>
                </div>
                <div class="filter-bar">
                    <input type="text" id="searchInput" placeholder="搜尋..." onkeyup="filterQuestions()">
                    <button onclick="loadQuestions()">🔄</button>
                </div>
                
                <div class="question-list-container" id="questionList">
                    <p style="color:#888;text-align:center;padding:40px;">點擊「🔄」載入題目</p>
                </div>
            </div>
            
            <!-- Right: Editor & Preview -->
            <div class="editor-preview-section">
                
                <!-- Tab Bar -->
                <div class="tab-bar">
                    <button class="tab-btn active" id="tabTemplate" onclick="switchTab('template')">📝 題目模板</button>
                    <button class="tab-btn answer-tab" id="tabAnswer" onclick="switchTab('answer')">📝 答案</button>
                </div>
                
                <!-- Template Panel -->
                <div id="templatePanel">
                
                <!-- Placeholder when no question selected -->
                <div class="card" id="placeholderCard">
                    <div class="placeholder">
                        <div class="icon">👈</div>
                        <div>請從左側選擇一道題目</div>
                        <div style="font-size:12px;margin-top:5px;">選擇後會自動顯示模板編輯器和預覽</div>
                    </div>
                </div>
                
                <!-- Editor/Preview Panel (hidden by default) -->
                <div id="editorPanel" style="display:none;">
                    <!-- OCR Original Question -->
                    <div class="ocr-box">
                        <div class="label">📄 OCR 原題</div>
                        <div class="text" id="ocrOriginalText">-</div>
                    </div>
                    
                    <!-- Arrow -->
                    <div class="arrow">⬇️</div>
                    
                    <!-- Template Editor -->
                    <div class="template-editor-box">
                        <div class="label">📝 模板設定</div>
                        
                        <div class="topic-input">
                            <input type="text" id="editTopic" placeholder="課題名稱">
                        </div>
                        
                        <div>
                            <textarea id="editTemplate" placeholder="題目模板（數字會自動被標記為變數）"></textarea>
                        </div>
                        
                        <!-- Variable Tags -->
                        <div class="var-tags" id="variableTags"></div>
                        
                        <!-- Displacement Options -->
                        <div class="disp-options" id="displacementOptions">
                            <label class="disp-option selected" onclick="toggleDisp(this)">
                                <input type="checkbox" checked value="original"> 原始題型
                            </label>
                            <label class="disp-option" onclick="toggleDisp(this)">
                                <input type="checkbox" value="swap-numbers"> 換數字
                            </label>
                            <label class="disp-option" onclick="toggleDisp(this)">
                                <input type="checkbox" value="change-condition"> 改條件
                            </label>
                            <label class="disp-option" onclick="toggleDisp(this)">
                                <input type="checkbox" value="reverse"> 逆向題
                            </label>
                        </div>
                    </div>
                    
                    <!-- Arrow -->
                    <div class="arrow">⬇️</div>
                    
                    <!-- Generated Preview -->
                    <div class="preview-box">
                        <div class="label">✨ 模板生成版本（隨機）</div>
                        <div class="question-text" id="previewQuestion">點擊下方按鈕生成</div>
                        <div class="answer" id="previewAnswer">答案：-</div>
                    </div>
                    
                    <!-- Buttons -->
                    <div class="btn-row" style="justify-content:center;">
                        <button class="btn btn-success" onclick="approveTemplate()" style="font-size:15px;padding:12px 30px;">✓ 確認模板</button>
                        <button class="btn btn-primary" onclick="generatePreview()" style="font-size:15px;padding:12px 30px;">🔄 重新生成</button>
                        <button class="btn btn-danger" onclick="rejectTemplate()" style="font-size:15px;padding:12px 30px;">✗ 不合格</button>
                    </div>
                </div>
            </div>
            
            <!-- Answer Panel (hidden by default) -->
            <div id="answerPanel" style="display:none;">
                <div class="ocr-box">
                    <div class="label">📄 標準答案</div>
                    <div class="text" id="answerImageText">選擇題目後自動載入答案</div>
                </div>
                
                <div id="answerContent"></div>
            </div>
            
        </div>
        
        <!-- Saved Templates -->
        <div class="card saved-section">
            <h2>📋 已儲存模板</h2>
            <div id="savedList">
                <p style="color:#888;text-align:center;padding:30px;">暫時冇已儲存嘅模板</p>
            </div>
            <div class="btn-row">
                <button class="btn btn-secondary" onclick="exportAll()">📤 導出全部</button>
                <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">📥 導入</button>
                <input type="file" id="importFile" accept=".json" style="display:none" onchange="importAll(event)">
            </div>
        </div>
    </div>
    
    <script>
        // ============== Data ==============
        let allQuestions = [];
        let savedTemplates = {};
        let currentQuestion = null;
        let currentVariables = [];
        
        // ============== Load Questions ==============
        async function loadQuestions() {
            const paper = document.getElementById('paperSelect').value;
            const grid = document.getElementById('questionList');
            grid.innerHTML = '<p style="color:#888;text-align:center;padding:40px;">載入中...</p>';
            
            try {
                const file = paper === 'P1' ? '../pages/p1_latex_ocr_results.json' : '../pages/p2_latex_ocr_results.json';
                const resp = await fetch(file);
                const data = await resp.json();
                
                allQuestions = Object.entries(data).map(([id, q]) => ({ id, ...q }));
                
                const topicFilter = document.getElementById('topicSelect').value;
                if (topicFilter !== 'all') {
                    allQuestions = allQuestions.filter(q => q.topic && q.topic.includes(topicFilter));
                }
                
                document.getElementById('totalQuestions').textContent = allQuestions.length;
                document.getElementById('questionCount').textContent = allQuestions.length + ' 題';
                renderQuestionGrid();
                updateStats();
                
            } catch (e) {
                grid.innerHTML = '<p style="color:red;text-align:center;padding:40px;">載入失敗：' + e.message + '</p>';
            }
        }
        
        // ============== Render Question Grid ==============
        function renderQuestionGrid() {
            const grid = document.getElementById('questionList');
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = allQuestions.filter(q => {
                const text = (q.question || q.question_text || '').toLowerCase();
                return text.includes(search);
            });
            
            if (filtered.length === 0) {
                grid.innerHTML = '<p style="color:#888;text-align:center;padding:40px;">冇匹配嘅題目</p>';
                return;
            }
            
            grid.innerHTML = filtered.map(q => {
                const saved = savedTemplates[q.id];
                let statusHtml = '';
                if (saved) {
                    if (saved.status === 'approved') {
                        statusHtml = '<span class="q-status approved">✓</span>';
                    } else if (saved.status === 'rejected') {
                        statusHtml = '<span class="q-status rejected">✗</span>';
                    }
                }
                return `
                    <div class="question-item" onclick="selectQuestion('${q.id}')" id="q-${q.id}">
                        <span class="q-id">${q.id}${statusHtml} <span class="q-topic">${q.topic || 'N/A'}</span></span>
                        <div class="q-text">${(q.question || q.question_text || '').substring(0, 80)}...</div>
                    </div>
                `;
            }).join('');
        }
        
        // ============== Filter Questions ==============
        function filterQuestions() {
            renderQuestionGrid();
        }
        
        // ============== Select Question ==============
        function selectQuestion(questionId) {
            currentQuestion = allQuestions.find(q => q.id === questionId);
            if (!currentQuestion) return;
            
            // Highlight selected
            document.querySelectorAll('.question-item').forEach(el => el.classList.remove('selected'));
            document.getElementById('q-' + questionId).classList.add('selected');
            
            // Show editor panel, hide placeholder
            document.getElementById('placeholderCard').style.display = 'none';
            document.getElementById('editorPanel').style.display = 'block';
            
            // Fill OCR original
            document.getElementById('ocrOriginalText').textContent = currentQuestion.question || currentQuestion.question_text || '';
            
            // Fill topic
            document.getElementById('editTopic').value = currentQuestion.topic || '';
            
            // Auto-generate template
            const originalText = currentQuestion.question || currentQuestion.question_text || '';
            const result = autoGenerateTemplate(originalText);
            document.getElementById('editTemplate').value = result.template;
            currentVariables = result.variables;
            renderVariableTags();
            
            // Generate initial preview
            generatePreview();
            
            // Switch to answer tab and render if needed
            if (window.currentTab === 'answer') {
                renderAnswer();
            }
        }
        
        // ============== Auto Generate Template ==============
        function autoGenerateTemplate(text) {
            let template = text;
            const variables = [];
            let varIndex = 0;
            
            const numbers = text.match(/\d+/g) || [];
            const uniqueNumbers = [...new Set(numbers)];
            
            uniqueNumbers.forEach(num => {
                const letter = String.fromCharCode(97 + varIndex);
                const regex = new RegExp('\\b' + num + '\\b', 'g');
                template = template.replace(regex, '{' + letter + '}');
                
                const numVal = parseInt(num);
                let min = Math.max(1, numVal - 5);
                let max = numVal + 5;
                
                if (numVal > 100) { min = 100; max = 500; }
                else if (numVal > 50) { min = 50; max = 200; }
                
                variables.push({ name: letter, min, max });
                varIndex++;
            });
            
            return { template, variables };
        }
        
        // ============== Render Variable Tags ==============
        function renderVariableTags() {
            const container = document.getElementById('variableTags');
            if (!currentVariables || currentVariables.length === 0) {
                container.innerHTML = '';
                return;
            }
            
            container.innerHTML = '<span style="font-size:11px;color:#888;">變數：</span>' + 
                currentVariables.map((v, i) => `
                    <div class="var-tag">
                        <span class="name">{${v.name}}</span>
                        <input type="number" value="${v.min}" onchange="updateVariable(${i}, 'min', this.value)">
                        <span>至</span>
                        <input type="number" value="${v.max}" onchange="updateVariable(${i}, 'max', this.value)">
                    </div>
                `).join('');
        }
        
        // ============== Update Variable ==============
        function updateVariable(index, field, value) {
            currentVariables[index][field] = parseInt(value);
        }
        
        // ============== Toggle Displacement ==============
        function toggleDisp(el) {
            const input = el.querySelector('input');
            input.checked = !input.checked;
            el.classList.toggle('selected', input.checked);
        }
        
        // ============== Generate Preview ==============
        function generatePreview() {
            const template = document.getElementById('editTemplate').value;
            
            // Generate random values
            const values = {};
            currentVariables.forEach(v => {
                values[v.name] = Math.floor(Math.random() * (v.max - v.min + 1)) + v.min;
            });
            
            // Replace placeholders
            let questionText = template;
            Object.keys(values).forEach(key => {
                questionText = questionText.replace(new RegExp('\\{' + key + '\\}', 'g'), values[key]);
            });
            
            document.getElementById('previewQuestion').textContent = questionText;
            document.getElementById('previewAnswer').textContent = '答案：待計算';
        }
        
        // ============== Approve Template ==============
        function approveTemplate() {
            if (!currentQuestion) return;
            
            const displacements = [];
            document.querySelectorAll('.disp-option input:checked').forEach(input => {
                displacements.push(input.value);
            });
            
            savedTemplates[currentQuestion.id] = {
                id: currentQuestion.id,
                topic: document.getElementById('editTopic').value,
                originalQuestion: currentQuestion.question || currentQuestion.question_text,
                generalization: document.getElementById('editTemplate').value,
                variables: currentVariables,
                displacements: displacements,
                savedAt: new Date().toISOString(),
                status: 'approved'
            };
            
            localStorage.setItem('hkdse_templates_v3', JSON.stringify(savedTemplates));
            
            // Update UI
            updateQuestionItemStatus(currentQuestion.id, 'approved');
            updateStats();
        }
        
        // ============== Reject Template ==============
        function rejectTemplate() {
            if (!currentQuestion) return;
            
            savedTemplates[currentQuestion.id] = {
                id: currentQuestion.id,
                topic: document.getElementById('editTopic').value,
                originalQuestion: currentQuestion.question || currentQuestion.question_text,
                generalization: document.getElementById('editTemplate').value,
                variables: currentVariables,
                displacements: [],
                savedAt: new Date().toISOString(),
                status: 'rejected'
            };
            
            localStorage.setItem('hkdse_templates_v3', JSON.stringify(savedTemplates));
            
            updateQuestionItemStatus(currentQuestion.id, 'rejected');
            updateStats();
        }
        
        // ============== Update Question Item Status ==============
        function updateQuestionItemStatus(id, status) {
            const item = document.getElementById('q-' + id);
            if (!item) return;
            
            const existingStatus = item.querySelector('.q-status');
            if (existingStatus) existingStatus.remove();
            
            const statusEl = document.createElement('span');
            statusEl.className = 'q-status ' + status;
            if (status === 'approved') {
                statusEl.textContent = '✓';
                statusEl.style.background = '#27ae60';
            } else {
                statusEl.textContent = '✗';
                statusEl.style.background = '#ff5252';
            }
            statusEl.style.color = 'white';
            statusEl.style.display = 'inline-block';
            statusEl.style.width = '18px';
            statusEl.style.height = '18px';
            statusEl.style.borderRadius = '50%';
            statusEl.style.fontSize = '10px';
            statusEl.style.textAlign = 'center';
            statusEl.style.lineHeight = '18px';
            statusEl.style.marginLeft = '5px';
            
            item.querySelector('.q-id').appendChild(statusEl);
        }
        
        // ============== Update Stats ==============
        function updateStats() {
            const templates = Object.values(savedTemplates);
            const approved = templates.filter(t => t.status === 'approved').length;
            const rejected = templates.filter(t => t.status === 'rejected').length;
            
            document.getElementById('totalTemplates').textContent = templates.length;
            document.getElementById('approvedCount').textContent = approved + '✓';
            document.getElementById('rejectedCount').textContent = rejected + '✗';
            
            renderSavedList();
        }
        
        // ============== Render Saved List ==============
        function renderSavedList() {
            const container = document.getElementById('savedList');
            const templates = Object.values(savedTemplates);
            
            if (templates.length === 0) {
                container.innerHTML = '<p style="color:#888;text-align:center;padding:30px;">暫時冇已儲存嘅模板</p>';
                return;
            }
            
            container.innerHTML = templates.map(t => {
                const icon = t.status === 'approved' ? '✓' : '✗';
                const color = t.status === 'approved' ? '#27ae60' : '#ff5252';
                return `
                    <div class="saved-item">
                        <div class="info">
                            <div class="title"><span style="color:${color};font-weight:bold;">${icon}</span> ${t.id} - ${t.topic || 'N/A'}</div>
                            <div class="meta">${(t.generalization || '').substring(0, 50)}...</div>
                        </div>
                        <div class="actions">
                            <button class="edit-btn" onclick="editSavedTemplate('${t.id}')">編輯</button>
                            <button class="delete-btn" onclick="deleteSavedTemplate('${t.id}')">刪除</button>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // ============== Edit Saved Template ==============
        function editSavedTemplate(id) {
            const card = document.getElementById('q-' + id);
            if (card) card.click();
        }
        
        // ============== Delete Saved Template ==============
        function deleteSavedTemplate(id) {
            if (!confirm('確定刪除？')) return;
            delete savedTemplates[id];
            localStorage.setItem('hkdse_templates_v3', JSON.stringify(savedTemplates));
            
            const item = document.getElementById('q-' + id);
            if (item) {
                const status = item.querySelector('.q-status');
                if (status) status.remove();
            }
            
            updateStats();
        }
        
        // ============== Export All ==============
        function exportAll() {
            const templates = Object.values(savedTemplates);
            if (templates.length === 0) {
                alert('暫時冇模板');
                return;
            }
            const blob = new Blob([JSON.stringify(templates, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'hkdse_templates_' + new Date().toISOString().split('T')[0] + '.json';
            a.click();
        }
        
        // ============== Import All ==============
        function importAll(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        imported.forEach(t => { if (t.id) savedTemplates[t.id] = t; });
                        localStorage.setItem('hkdse_templates_v3', JSON.stringify(savedTemplates));
                        loadQuestions();
                        updateStats();
                        alert('成功導入 ' + imported.length + ' 個模板');
                    }
                } catch (err) {
                    alert('解析失敗');
                }
            };
            reader.readAsText(file);
        }
        
        // ============== Tab Switching ==============
        window.currentTab = 'template';
        
        // Helper function
        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        
        async function switchTab(tab) {
            window.currentTab = tab;
            
            // Update tab buttons
            document.getElementById('tabTemplate').className = tab === 'template' ? 'tab-btn active' : 'tab-btn';
            document.getElementById('tabAnswer').className = tab === 'answer' ? 'tab-btn answer-tab active' : 'tab-btn answer-tab';
            
            // Show/hide panels
            document.getElementById('editorPanel').style.display = tab === 'template' ? 'block' : 'none';
            document.getElementById('answerPanel').style.display = tab === 'answer' ? 'block' : 'none';
            
            // Render answer if switching to answer tab
            if (tab === 'answer' && currentQuestion) {
                await renderAnswer();
            }
        }
        
        // ============== Load Answer Data ==============
        window.answerData = null;
        async function loadAnswerData() {
            if (window.answerData) return;
            try {
                var resp = await fetch('../pages/p1_answer_ocr_results.json');
                if (resp.ok) {
                    var data = await resp.json();
                    window.answerData = data.results || {};
                    console.log("Loaded answer data:", Object.keys(window.answerData).length);
                }
            } catch(e) {
                console.log("No answer data found");
            }
        }
        
        // ============== Load Sheet Data ==============
        window.sheetData = null;
        async function loadSheetData() {
            if (window.sheetData) return;
            try {
                var resp = await fetch('../pages/p1_sheet_data.json');
                if (resp.ok) {
                    var data = await resp.json();
                    window.sheetData = data;
                    console.log("Loaded sheet data:", Object.keys(window.sheetData).length);
                }
            } catch(e) {
                console.log("No sheet data found");
            }
        }
        
        // ============== Render Answer ==============
        async function renderAnswer() {
            if (!currentQuestion) return;
            
            await loadAnswerData();
            await loadSheetData();
            
            var qid = currentQuestion.id;
            var ans = window.answerData ? window.answerData[qid] : null;
            var sheetInfo = window.sheetData ? window.sheetData[qid] : null;
            
            var answerStatus = JSON.parse(localStorage.getItem("hkdse_p1_answer_status") || "{}");
            var status = answerStatus[qid] || 'pending';
            var statusLabel = {'pending': '待審批', 'approved': '已確認', 'rejected': '不合格'}[status];
            var statusColor = {'pending': '#e0e0e0', 'approved': '#27ae60', 'rejected': '#e74c3c'}[status];
            
            var html = '<div class="ocr-box">';
            html += '<div class="label">📄 標準答案 - ' + qid + '</div>';
            if (sheetInfo && sheetInfo.photo_link) {
                html += '<img src="' + sheetInfo.photo_link + '" style="max-width:100%;max-height:300px;border-radius:8px;margin-top:10px;">';
            }
            html += '</div>';
            
            // OCR Result
            html += '<div style="background:white;border:2px solid #27ae60;border-radius:12px;padding:15px;margin-top:15px;">';
            html += '<div style="font-size:12px;color:#27ae60;font-weight:bold;margin-bottom:10px;">📝 OCR 識別結果</div>';
            if (ans && ans.text) {
                html += '<div style="background:#f8f9fa;padding:12px;border-radius:8px;line-height:1.8;">' + escapeHtml(ans.text) + '</div>';
            } else if (ans && ans.error) {
                html += '<div style="color:#e74c3c;padding:12px;">OCR 識別失敗: ' + ans.error + '</div>';
            } else {
                html += '<div style="color:#888;padding:12px;">暫無 OCR 結果</div>';
            }
            html += '</div>';
            
            // Stats
            if (sheetInfo) {
                html += '<div style="background:#fff3cd;border:2px solid #ffc107;border-radius:12px;padding:15px;margin-top:15px;">';
                html += '<div style="font-size:12px;color:#856404;font-weight:bold;margin-bottom:10px;">📊 統計數據</div>';
                html += '<div style="display:flex;gap:20px;flex-wrap:wrap;">';
                if (sheetInfo.hk_rate) html += '<div>全港答對率: <strong>' + sheetInfo.hk_rate + '%</strong></div>';
                if (sheetInfo.lsc_rate) html += '<div>LSC答對率: <strong>' + sheetInfo.lsc_rate + '%</strong></div>';
                html += '</div></div>';
            }
            
            // Action buttons
            html += '<div class="btn-row" style="margin-top:15px;">';
            html += '<button class="btn btn-success" onclick="setAnswerStatus(\'' + qid + '\', \'approved\')">✓ 確認答案</button>';
            html += '<button class="btn btn-danger" onclick="setAnswerStatus(\'' + qid + '\', \'rejected\')">✗ 不合格</button>';
            html += '<button class="btn btn-primary" onclick="setAnswerStatus(\'' + qid + '\', \'pending\')">🔄 重置</button>';
            html += '</div>';
            
            // Status display
            html += '<div style="margin-top:10px;text-align:center;">';
            html += '狀態: <span style="background:' + statusColor + ';color:white;padding:3px 12px;border-radius:10px;font-size:12px;">' + statusLabel + '</span>';
            html += '</div>';
            
            document.getElementById('answerContent').innerHTML = html;
        }
        
        function setAnswerStatus(qid, status) {
            var answerStatus = JSON.parse(localStorage.getItem("hkdse_p1_answer_status") || "{}");
            answerStatus[qid] = status;
            localStorage.setItem("hkdse_p1_answer_status", JSON.stringify(answerStatus));
            showToast(status === 'approved' ? '✓ 已確認答案' : status === 'rejected' ? '✗ 已標記為不合格' : '🔄 已重置');
            renderAnswer();
        }
        
        function showToast(msg) {
            var toast = document.getElementById('toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toast';
                toast.style = 'position:fixed;top:20px;right:20px;background:#27ae60;color:white;padding:15px 20px;border-radius:8px;font-size:14px;z-index:1000;transition:opacity 0.3s;';
                document.body.appendChild(toast);
            }
            toast.textContent = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 3000);
        }
        
        // ============== Init ==============
        function init() {
            const stored = localStorage.getItem('hkdse_templates_v3');
            if (stored) savedTemplates = JSON.parse(stored);
            updateStats();
            loadAnswerData();
            loadSheetData();
        }
        init();
    </script>
</body>
</html>
