<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HKDSE 卷一 甲部(一) 練習｜因式分解</title>
  <link rel="stylesheet" href="../css/tw/site.css">
  <link rel="stylesheet" href="../css/site-layout.css">
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
      startup: { typeset: false }
    };
  </script>
  <script id="MathJax-script" defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  <script src="../practice-enhancements.js" defer></script>
  <script src="js/p1a1-factorization.js?v=2" defer></script>
  <style>
    body.responsive-layout--hkdse-p1a1 { min-height: 100vh; padding-bottom: 24px; background: #F4F6F9; color: #14213D; }
    .p1a1-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-block: 12px; padding: 16px 22px; border-radius: 14px; background: #14213D; color: #fff; }
    .p1a1-header a { color: #C9D6F5; font-weight: 700; text-decoration: none; }
    .p1a1-header-tools { display: flex; align-items: center; gap: 8px; }
    .p1a1-header .layout-chapter-badge { background: #26395F; color: #fff; }
    .p1a1-main { display: grid; gap: 18px; padding-bottom: 20px; }
    .p1a1-title, .p1a1-card, .p1a1-secondary { min-width: 0; border: 1px solid #D5DBE5; border-radius: 14px; background: #fff; color: #14213D; }
    .p1a1-title { padding: clamp(18px, 3vw, 32px); }
    .p1a1-title h1 { margin: 0 0 8px; font-size: clamp(26px, 3vw, 34px); line-height: 1.2; overflow-wrap: anywhere; }
    .p1a1-title p { margin: 6px 0 14px; color: #4B5563; font-size: 18px; }
    .p1a1-card, .p1a1-secondary { padding: clamp(16px, 2.5vw, 28px); }
    .p1a1-card h2, .p1a1-secondary h2 { margin: 0 0 12px; font-size: 1.25rem; }
    .p1a1-controls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: end; }
    .p1a1-field { display: grid; gap: 5px; min-width: 0; }
    .p1a1-field label { font-weight: 700; }
    .p1a1-field input, .p1a1-field select, .p1a1-answer-input { width: 100%; min-width: 0; min-height: 50px; border: 1px solid #9AA5B8; border-radius: 10px; padding: 9px 12px; background: #fff; color: #14213D; }
    .p1a1-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .p1a1-button { min-height: 48px; border: 1px solid #1F4FD8; border-radius: 10px; padding: 8px 18px; background: #fff; color: #1F4FD8; font-size: 18px; font-weight: 700; cursor: pointer; touch-action: manipulation; }
    .p1a1-button.primary { border-color: #1F4FD8; background: #1F4FD8; color: #fff; }
    .p1a1-button:disabled { opacity: .55; cursor: not-allowed; }
    .p1a1-status { margin-top: 10px; color: #4B5563; }
    .p1a1-status.error { color: #8A3B00; }
    .p1a1-practice-panel { padding: clamp(16px, 3vw, 32px); }
    .p1a1-question-text { min-width: 0; margin-bottom: 24px; color: #14213D; }
    .p1a1-exam-title { margin-bottom: 8px; font-size: 1.25rem; font-weight: 700; }
    .p1a1-exam-parts { display: grid; gap: 10px; }
    .p1a1-exam-part { display: grid; grid-template-columns: 58px minmax(0, 1fr); align-items: start; gap: 8px; padding: 10px 0; border-bottom: 1px solid #E3E7EE; font-size: clamp(26px, 3vw, 32px); line-height: 1.55; }
    .p1a1-exam-part:last-child { border-bottom: 0; }
    .p1a1-exam-part > span { padding-top: 3px; }
    .p1a1-exam-part .hkdse-math-display { min-width: 0; text-align: left; }
    .hkdse-math-display { max-width: 100%; overflow-wrap: anywhere; }
    .hkdse-math-display mjx-container { max-width: 100%; overflow-x: auto; overflow-y: hidden; }
    .p1a1-answer-content { display: grid; gap: 14px; }
    .p1a1-answer-part { min-width: 0; padding: 14px 0 4px; border-top: 1px solid #D5DBE5; }
    .p1a1-response-row { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; align-items: center; margin: 8px 0; }
    .p1a1-response-row label { font-size: 18px; font-weight: 700; }
    .p1a1-answer-input { font-family: var(--layout-font-math); font-size: 22px; }
    .p1a1-input-tools { margin-top: 8px; }
    .p1a1-input-tools summary { color: #1F4FD8; cursor: pointer; font-size: 15px; }
    .p1a1-keyboard { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
    .p1a1-key { min-width: 0; min-height: 46px; border: 1px solid #C4CBD8; border-radius: 8px; background: #F4F6F9; color: #14213D; font-size: 18px; font-weight: 700; touch-action: manipulation; }
    .p1a1-feedback { margin-top: 12px; padding: 14px; border: 1px solid transparent; border-radius: 10px; overflow-wrap: anywhere; }
    .p1a1-feedback:empty, [hidden] { display: none !important; }
    .p1a1-feedback.correct { border-color: #B9D9C7; background: #E3F2EA; color: #1E6B3E; }
    .p1a1-feedback.mismatch, .p1a1-feedback.incomplete, .p1a1-feedback.format { border-color: #F3D3B5; background: #FCEBD9; color: #8A3B00; }
    .p1a1-feedback mjx-container { color: inherit; }
    .p1a1-feedback-part { padding: 10px 0; border-bottom: 1px solid #D5DBE5; }
    .p1a1-feedback-part:last-child { border-bottom: 0; }
    .p1a1-feedback-heading { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 18px; font-weight: 700; }
    .p1a1-feedback-chip { display: inline-block; border-radius: 999px; padding: 2px 12px; font-size: 15px; }
    .p1a1-feedback-chip.correct { background: #E3F2EA; color: #1E6B3E; }
    .p1a1-feedback-chip.incorrect { background: #FCEBD9; color: #8A3B00; }
    .p1a1-solution { margin-top: 10px; padding: 12px; border-radius: 9px; background: #F4F6F9; color: #14213D; }
    .p1a1-solution summary, .p1a1-secondary summary { color: #1F4FD8; font-weight: 700; cursor: pointer; }
    .p1a1-solution mjx-container { max-width: 100%; overflow-x: auto; }
    .p1a1-secondary { margin-top: 4px; }
    .p1a1-secondary > summary { font-size: 17px; font-weight: 700; cursor: pointer; }
    .p1a1-secondary-content { margin-top: 14px; }
    .p1a1-scoring-list { display: grid; gap: 6px; margin: 0; padding-left: 1.3rem; color: #14213D; }
    .p1a1-history { display: grid; gap: 8px; padding-left: 1.3rem; }
    .p1a1-history li { overflow-wrap: anywhere; }
    .p1a1-empty { color: #4B5563; }
    .p1a1-history-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .p1a1-history-note { margin: 12px 0 0; color: #4B5563; }
    .p1a1-progress { display: flex; flex-wrap: wrap; gap: 8px 18px; color: #4B5563; }
    .cross-table { width: 100%; max-width: 100%; margin: 8px 0; border-collapse: collapse; font-size: .9rem; table-layout: fixed; }
    .cross-table th, .cross-table td { border: 1px solid #D5DBE5; padding: 5px; text-align: left; overflow-wrap: anywhere; }
    .cross-table th { background: #F4F6F9; }
    .p1a1-print { display: none; }
    body.practice-active .p1a1-header, body.practice-active .p1a1-title { display: none; }
    body.practice-active .p1a1-main { padding-top: 10px; }
    .p1a1-sticky-actions { position: sticky; z-index: 5; bottom: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 18px -8px -8px; padding: 12px 8px 8px; border-top: 1px solid #D5DBE5; background: rgba(255,255,255,.96); }
    .p1a1-sticky-actions .p1a1-button { min-height: 56px; font-size: 20px; }
    @media (max-width: 680px) {
      .p1a1-header { align-items: flex-start; }
      .p1a1-controls { grid-template-columns: minmax(0, 1fr); }
      .p1a1-exam-part { grid-template-columns: 36px minmax(0, 1fr); gap: 4px; font-size: clamp(16px, 4.6vw, 18px); }
      .p1a1-response-row { grid-template-columns: 78px minmax(0, 1fr); gap: 8px; }
      .p1a1-keyboard { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      .p1a1-sticky-actions { position: fixed; right: 0; bottom: 0; left: 0; margin: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 14px rgba(20,33,61,.12); }
      body.responsive-layout--hkdse-p1a1 { padding-bottom: 92px; }
    }
    @page { size: A4 portrait; margin: 14mm; }
    @media print {
      html, body { width: 100%; min-height: 0 !important; margin: 0 !important; padding: 0 !important; overflow: visible !important; background: #fff !important; color: #111 !important; font-size: 11pt !important; }
      body * { visibility: hidden !important; }
      #worksheet-print, #worksheet-print * { visibility: visible !important; }
      #worksheet-print { display: block !important; position: absolute; inset: 0 auto auto 0; width: 100%; color: #111; background: #fff; font-family: var(--layout-font-sans); font-size: 11pt; }
      .p1a1-print-page { break-after: page; page-break-after: always; }
      .p1a1-print-page:last-child { break-after: auto; page-break-after: auto; }
      .p1a1-print-head { border-bottom: 1.5pt solid #111; margin-bottom: 12pt; padding-bottom: 7pt; }
      .p1a1-print-meta { display: flex; justify-content: space-between; gap: 10pt; margin-top: 7pt; }
      .p1a1-print-question-number { margin-bottom: 5pt; font-size: 11pt; }
      .p1a1-print .p1a1-exam-title { margin-bottom: 5pt; font-size: 13pt; }
      .p1a1-print .p1a1-exam-part { grid-template-columns: 30pt minmax(0, 1fr); gap: 5pt; margin-top: 4pt; padding: 0; border: 0; font-size: 18pt; }
      .p1a1-print .p1a1-exam-part .hkdse-math-display { min-width: 0; text-align: left; }
      .p1a1-print-response { margin: 5pt 0 10pt 30pt; break-inside: avoid; page-break-inside: avoid; }
      .p1a1-print-writing { min-height: 18mm; margin-top: 3pt; border-bottom: .5pt solid #999; }
      .p1a1-print-writing.p1a1-print-work { min-height: 28mm; }
      .p1a1-print-answer-part { margin-top: 5pt; font-size: 13pt; font-weight: 700; }
      .p1a1-print-solutions { break-before: page; page-break-before: always; }
      .p1a1-print-solution { margin-bottom: 8pt; }
      .p1a1-print .hkdse-math-display { font-size: 11pt !important; }
      .p1a1-print mjx-container { font-size: 100% !important; max-width: 100%; }
      .cross-table th, .cross-table td { padding: 2pt 4pt; }
    }
  </style>

<body class="responsive-layout responsive-layout--hkdse-p1a1">
  <header class="layout-shell p1a1-header">
    <a href="../index.html" aria-label="返回 AI Learning 首頁">AI Learning · 公開試專區</a>
    <span class="layout-chapter-badge">公開試專區</span>
  </header>

  <main class="layout-shell p1a1-main">
    <section class="p1a1-title" id="intro-panel">
      <h1>HKDSE 卷一 甲部(一) 練習｜因式分解</h1>
      <p>輸入答案並核對，然後按下一題繼續練習。</p>
      <button type="button" class="p1a1-button primary" id="start-quick">開始練習</button>
      <div class="p1a1-status" id="setup-status" role="status" aria-live="polite"></div>
    </section>

    <section class="p1a1-card p1a1-practice-panel no-print" id="practice-panel" hidden aria-label="因式分解練習">
      <div class="p1a1-question-text" id="question-content"></div>
      <div class="p1a1-answer-content" id="answer-content"></div>
      <div class="p1a1-sticky-actions" id="main-actions">
        <button type="button" class="p1a1-button primary" id="check-answers">核對</button>
        <button type="button" class="p1a1-button" id="next-question">下一題</button>
      </div>
      <section class="p1a1-feedback" id="question-feedback" aria-live="polite" hidden></section>
      <details class="p1a1-secondary">
        <summary>本組進度</summary>
        <div class="p1a1-secondary-content p1a1-progress">
          <span id="progress-label">第 1 題 / 共 4 題</span>
          <span>目前得分：<strong id="score-label">0</strong></span>
          <span>種子：<strong id="seed-label"></strong></span>
        </div>
      </details>
    </section>

    <details class="p1a1-secondary no-print" id="settings-details">
      <summary>出題及工作紙設定</summary>
      <div class="p1a1-secondary-content" id="setup-panel">
        <div class="p1a1-controls">
          <div class="p1a1-field">
            <label for="question-type">題型</label>
            <select id="question-type">
              <option value="2021">2021 型（a、b）</option>
              <option value="2019">2019 型（a、b、c）</option>
              <option value="mixed">隨機題型</option>
            </select>
          </div>
          <div class="p1a1-field">
            <label for="question-count">題數</label>
            <select id="question-count">
              <option value="4">4 題</option>
              <option value="8">8 題</option>
              <option value="12">12 題</option>
            </select>
          </div>
          <div class="p1a1-field">
            <label for="question-seed">種子（留空自動產生）</label>
            <input id="question-seed" type="text" autocomplete="off" placeholder="例如：P1A1-2026">
          </div>
        </div>
        <div class="p1a1-actions">
          <button type="button" class="p1a1-button primary" id="start-practice">開始練習</button>
          <button type="button" class="p1a1-button" id="print-worksheet">產生 A4 工作紙</button>
        </div>
        <div class="p1a1-status" id="worksheet-status" role="status" aria-live="polite"></div>
      </div>
    </details>

    <details class="p1a1-secondary no-print" id="scoring-details">
      <summary>評分說明</summary>
      <ul class="p1a1-scoring-list p1a1-secondary-content">
        <li>2021 Q3：(a) 1A；(b) 1M + 1A，共 3 分。</li>
        <li>2019 Q4：(a) 1A；(b) 1A；(c) 1M + 1A，共 4 分。</li>
      </ul>
    </details>

    <details class="p1a1-secondary no-print" id="history-details">
      <summary>本機答題紀錄</summary>
      <div class="p1a1-secondary-content">
        <div class="p1a1-history-actions">
          <span>紀錄只保存在這部裝置，不保存答案。</span>
          <button type="button" class="p1a1-button" id="clear-history">清除紀錄</button>
        </div>
        <div class="p1a1-status" id="history-status" role="status" aria-live="polite"></div>
        <ol class="p1a1-history" id="history-list"></ol>
      </div>
    </details>

    <details class="p1a1-secondary p1a1-input-tools no-print" id="math-keyboard-details" hidden>
      <summary>數學輸入符號</summary>
      <div class="p1a1-secondary-content p1a1-keyboard" id="math-keyboard" aria-label="數學輸入快捷鍵"></div>
    </details>
  </main>

  <div class="p1a1-print" id="worksheet-print" aria-hidden="true"></div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      'use strict';
      const Core = window.HKDSEP1A1;
      const HISTORY_KEY = 'hkdse_p1a1_factorization_history_v1';
      const MAX_HISTORY = 40;
      const typeNames = { '2021': '2021 型', '2019': '2019 型', mixed: '隨機題型' };
      const state = { session: null, index: 0, question: null, partStates: {}, activeInput: null, batchNumber: 0, questionNumber: 0 };
      const byId = (id) => document.getElementById(id);
      const mathJaxReady = new Promise((resolve) => {
        const ready = () => window.MathJax && typeof window.MathJax.typesetPromise === 'function';
        if (ready()) { resolve(window.MathJax); return; }
        const script = byId('MathJax-script');
        const finish = () => resolve(ready() ? window.MathJax : null);
        if (script) {
          script.addEventListener('load', finish, { once: true });
          script.addEventListener('error', finish, { once: true });
        }
        window.addEventListener('load', finish, { once: true });
      });
      const mathKeys = ['x', 'y', 'm', 'n', '²', '^', '(', ')', '+', '−', '×', '⌫', '清除'];

      byId('start-quick').addEventListener('click', startPractice);
      byId('start-practice').addEventListener('click', startPractice);
      byId('check-answers').addEventListener('click', checkQuestion);
      byId('next-question').addEventListener('click', nextQuestion);
      byId('print-worksheet').addEventListener('click', printWorksheet);
      byId('clear-history').addEventListener('click', clearHistory);
      renderHistory();

      function freshSeed() {
        if (window.crypto && window.crypto.getRandomValues) {
          const data = new Uint32Array(2);
          window.crypto.getRandomValues(data);
          return data[0].toString(36) + data[1].toString(36);
        }
        return String(Date.now()) + '-' + Math.floor(Math.random() * 1000000000);
      }

      function readSettings() {
        const type = byId('question-type').value;
        const count = Number(byId('question-count').value);
        let seed = byId('question-seed').value.trim();
        if (!seed) { seed = freshSeed(); byId('question-seed').value = seed; }
        return { type, count, seed };
      }

      function buildQuestions(type, count, seed) {
        return Core.chooseTypes(type, count, seed).map((questionType, index) => Core.generateQuestion(questionType, seed, index));
      }

      function buildPracticeQuestions(type, count, seed) {
        const practiceType = Core.chooseTypes(type, 1, seed)[0];
        return Array.from({ length: count }, (_, index) => Core.generateQuestion(practiceType, seed, index));
      }

      function startPractice() {
        const status = byId('setup-status');
        if (!Core) { status.textContent = '核心模組載入失敗，請重新載入頁面。'; status.classList.add('error'); return; }
        try {
          const settings = readSettings();
          const questions = buildPracticeQuestions(settings.type, settings.count, settings.seed);
          state.session = {
            selectedType: settings.type, count: settings.count, seed: settings.seed,
            questions: questions, bestScores: Array(settings.count).fill(null),
            actualQuestions: questions.map((question, index) => ({ type: question.type, seed: question.seed, index: question.index, slot: index })),
            checkedSlots: Array(settings.count).fill(false), startedAt: Date.now(), attempts: 0
          };
          state.index = 0; state.batchNumber = 0; state.questionNumber = 0;
          status.textContent = '';
          status.classList.remove('error');
          byId('intro-panel').hidden = true;
          byId('settings-details').open = false;
          document.body.classList.add('practice-active');
          byId('practice-panel').hidden = false;
          showQuestion(0);
          byId('practice-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
        } catch (error) {
          status.textContent = '未能產生題目：' + error.message;
          status.classList.add('error');
        }
      }

      function showQuestion(index) {
        state.index = index;
        state.question = state.session.questions[index];
        state.activeInput = null;
        state.partStates = Object.fromEntries(state.question.parts.map((part) => [part.id, { wrongAttempts: 0, locked: false, lastCheck: null }]));
        byId('progress-label').textContent = '第 ' + (index + 1) + ' 題 / 共 ' + state.session.count + ' 題 · ' + typeNames[state.question.type];
        byId('score-label').textContent = currentScore() + ' / ' + maximumScore();
        byId('seed-label').textContent = state.session.seed;
        byId('question-content').innerHTML = state.question.questionHtml;
        byId('answer-content').replaceChildren();
        state.question.parts.forEach((part) => byId('answer-content').appendChild(renderPart(part)));
        byId('question-feedback').replaceChildren();
        byId('question-feedback').hidden = true;
        byId('question-feedback').className = 'p1a1-feedback';
        byId('math-keyboard-details').hidden = false;
        byId('check-answers').disabled = false;
        byId('next-question').disabled = false;
        byId('math-keyboard').querySelectorAll('button').forEach((button) => { button.disabled = false; });
        byId('math-keyboard-details').open = false;
        typeset([byId('question-content'), byId('answer-content')]);
      }

      function renderPart(part) {
        const section = document.createElement('section');
        section.className = 'p1a1-answer-part';
        section.id = 'response-part-' + state.index + '-' + part.id;
        const answerId = 'answer-' + state.index + '-' + part.id;
        if (part.methodInput) {
          const methodId = 'method-' + state.index + '-' + part.id;
          section.appendChild(createResponseRow('步驟', methodId, '第 ' + (state.index + 1) + ' 題 (' + part.id + ') 步驟'));
        }
        section.appendChild(createResponseRow('(' + part.id + ') 答案', answerId, '第 ' + (state.index + 1) + ' 題 (' + part.id + ') 答案'));
        return section;
      }

      function createResponseRow(labelText, inputId, ariaLabel) {
        const row = document.createElement('div'); row.className = 'p1a1-response-row';
        const label = document.createElement('label'); label.htmlFor = inputId; label.textContent = labelText;
        const input = document.createElement('input');
        input.type = 'text'; input.id = inputId; input.autocomplete = 'off'; input.spellcheck = false;
        input.className = 'p1a1-answer-input'; input.setAttribute('aria-label', ariaLabel);
        input.addEventListener('focus', function () { state.activeInput = input; });
        row.append(label, input);
        return row;
      }

      byId('math-keyboard').replaceChildren(...mathKeys.map((key) => {
        const button = document.createElement('button');
        button.type = 'button'; button.className = 'p1a1-key'; button.textContent = key;
        button.setAttribute('aria-label', key === '²' ? '平方' : key === '⌫' ? '刪除游標前字元' : key === '清除' ? '清空答案' : '輸入 ' + key);
        button.addEventListener('click', function () {
          if (!state.activeInput || state.activeInput.disabled) return;
          if (key === '⌫') editInput(state.activeInput, 'backspace');
          else if (key === '清除') { state.activeInput.value = ''; state.activeInput.focus(); }
          else editInput(state.activeInput, key === '−' ? '-' : key === '×' ? '*' : key);
        });
        return button;
      }));

      function checkQuestion() {
        if (!state.session) return;
        const question = state.question;
        let checkedAny = false;
        question.parts.forEach((part) => {
          const partState = state.partStates[part.id];
          if (!partState || partState.locked) return;
          checkedAny = true;
          const answerInput = byId('answer-' + state.index + '-' + part.id);
          const answerResult = Core.checkAnswer(part, answerInput ? answerInput.value : '');
          let methodResult = null;
          if (part.methodInput) {
            const methodInput = byId('method-' + state.index + '-' + part.id);
            const sourceAnswers = {};
            part.methodInput.sources.forEach((sourceId) => {
              const sourceInput = byId('answer-' + state.index + '-' + sourceId);
              sourceAnswers[sourceId] = sourceInput ? sourceInput.value : '';
            });
            methodResult = Core.checkMethodStep(part, methodInput ? methodInput.value : '', sourceAnswers);
          }
          const submitted = { M: methodResult ? methodResult.marks.M : 0, A: answerResult.marks.A };
          const score = updateBestScore(part, submitted);
          const isCorrect = answerResult.status === 'correct' && (!methodResult || methodResult.status === 'correct');
          if (!isCorrect) partState.wrongAttempts += 1;
          partState.locked = isCorrect || partState.wrongAttempts >= 2;
          partState.lastCheck = {
            part, answerResult, methodResult, score, isCorrect,
            wrongAttempts: partState.wrongAttempts,
            locked: partState.locked,
            revealSolution: isCorrect || partState.wrongAttempts >= 2
          };
          if (partState.locked) {
            byId('response-part-' + state.index + '-' + part.id).querySelectorAll('input').forEach((input) => { input.disabled = true; });
          }
        });
        if (!checkedAny) return;
        state.session.checkedSlots[state.index] = true;
        state.session.attempts += 1;
        renderFeedback();
        const allLocked = question.parts.every((part) => state.partStates[part.id].locked);
        byId('check-answers').disabled = allLocked;
        byId('math-keyboard').querySelectorAll('button').forEach((button) => { button.disabled = allLocked; });
        byId('score-label').textContent = currentScore() + ' / ' + maximumScore();
      }

      function renderFeedback() {
        const feedback = byId('question-feedback');
        feedback.replaceChildren();
        feedback.className = 'p1a1-feedback';
        const total = document.createElement('p');
        total.innerHTML = '<strong>本題得分：' + questionScore(state.session.bestScores[state.index]) + ' / ' + state.question.maxMarks + '</strong>';
        feedback.appendChild(total);
        state.question.parts.forEach((part) => {
          const result = state.partStates[part.id].lastCheck;
          if (!result) return;
          const { answerResult, methodResult, score, isCorrect, locked, revealSolution } = result;
          const article = document.createElement('article'); article.className = 'p1a1-feedback-part';
          const heading = document.createElement('div'); heading.className = 'p1a1-feedback-heading';
          const partLabel = document.createElement('span'); partLabel.textContent = '(' + part.id + ')';
          const answerChip = document.createElement('span');
          const statusInfo = answerStatus(answerResult);
          answerChip.className = 'p1a1-feedback-chip ' + (isCorrect ? 'correct' : 'incorrect');
          answerChip.textContent = isCorrect ? '正確' : '未全對';
          const scoreLabel = document.createElement('span'); scoreLabel.textContent = scoreText(score, part);
          heading.append(partLabel, answerChip, scoreLabel); article.appendChild(heading);
          const message = document.createElement('p');
          message.textContent = isCorrect
            ? '答案及所需步驟均正確。'
            : (answerResult.status === 'correct'
              ? '最後答案正確；此部分的步驟仍未成立。'
              : '此部分未全對：' + (answerResult.message || statusInfo.message)) +
              (locked ? ' 已核對兩次，此部分已鎖定。' : ' 可修改後再按「核對」。');
          article.appendChild(message);
          if (answerResult.status === 'mismatch') {
            article.appendChild(mathParagraph('你的展開式：', answerResult.studentExpandTex));
            article.appendChild(mathParagraph('題目：', answerResult.targetExpandTex));
          }
          if (methodResult) {
            const methodLine = document.createElement('p');
            methodLine.innerHTML = '<strong>步驟核對：</strong>' + escapeHtml(methodStatus(methodResult.status)) + '　M ' + methodResult.marks.M + '/' + part.marks.M;
            article.appendChild(methodLine);
            const methodMessage = document.createElement('p'); methodMessage.textContent = methodResult.message || '';
            article.appendChild(methodMessage);
            if (methodResult.status === 'mismatch' || (methodResult.status === 'missing_substitution' && methodResult.studentExpandTex)) {
              article.appendChild(mathParagraph('步驟展開：', methodResult.studentExpandTex));
              article.appendChild(mathParagraph('題目：', methodResult.targetExpandTex));
            }
          }
          if (revealSolution) {
            const solution = document.createElement('div'); solution.className = 'p1a1-solution';
            solution.innerHTML = '<strong>參考解答與步驟</strong>' + (part.hintHtml ? '<div class="p1a1-hint">' + part.hintHtml + '</div>' : '') + part.stepsHtml + '<p>標準答案：\\[\\displaystyle ' + part.answerTex + '\\]</p>';
            article.appendChild(solution);
          } else if (part.hintHtml) {
            const hint = document.createElement('div'); hint.className = 'p1a1-solution';
            hint.innerHTML = '<strong>提示</strong><div class="p1a1-hint">' + part.hintHtml + '</div>';
            article.appendChild(hint);
          }
          feedback.appendChild(article);
        });
        feedback.hidden = false;
        typeset([feedback]);
      }

      function answerStatus(result) {
        if (result.status === 'correct') return { label: '正確', message: '答案正確，已完全因式分解。' };
        if (result.status === 'mismatch') return { label: '展開後不相等', message: '請對照以下展開結果。' };
        if (result.status === 'incomplete') return { label: '未完全因式分解', message: '請檢查仍可再分解的因式。' };
        return { label: '格式無法辨識', message: '請改用括號列出乘積，例如 (2x-3y)(x+5y)。' };
      }

      function methodStatus(status) {
        if (status === 'correct') return '成立';
        if (status === 'missing_substitution') return '未顯示所需步驟';
        if (status === 'mismatch') return '展開後不相等';
        return '格式無法辨識';
      }

      function mathParagraph(label, expression) {
        const paragraph = document.createElement('p');
        paragraph.innerHTML = escapeHtml(label) + ' \\[\\displaystyle ' + escapeHtml(expression || '') + '\\]';
        return paragraph;
      }

      function updateBestScore(part, submittedScore) {
        const allScores = state.session.bestScores[state.index] || {};
        const previous = allScores[part.id];
        const previousTotal = previous ? (previous.M || 0) + (previous.A || 0) : -1;
        const submittedTotal = (submittedScore.M || 0) + (submittedScore.A || 0);
        const best = submittedTotal > previousTotal ? { M: submittedScore.M || 0, A: submittedScore.A || 0 } : previous;
        allScores[part.id] = best;
        state.session.bestScores[state.index] = allScores;
        return best;
      }

      function scoreText(score, part) {
        const chunks = [];
        if (part.marks.M) chunks.push('M ' + score.M + '/' + part.marks.M);
        if (part.marks.A) chunks.push('A ' + score.A + '/' + part.marks.A);
        return chunks.join(' + ') || '0 分';
      }

      function editInput(input, value) {
        input.focus();
        const start = input.selectionStart == null ? input.value.length : input.selectionStart;
        const end = input.selectionEnd == null ? start : input.selectionEnd;
        if (value === 'backspace') {
          if (start !== end) input.setRangeText('', start, end, 'end');
          else if (start > 0) input.setRangeText('', start - 1, start, 'end');
        } else input.setRangeText(value, start, end, 'end');
      }

      function nextQuestion() {
        if (!state.session) return;
        const previous = state.question;
        const nextIndex = state.index + 1;
        if (nextIndex >= state.session.count) {
          savePracticeBatch();
          startNextBatch(previous.type);
          return;
        }
        state.index = nextIndex;
        state.questionNumber += 1;
        const seed = state.session.seed + ':next:' + state.questionNumber;
        const next = Core.generateQuestion(previous.type, seed, 0);
        state.session.questions[nextIndex] = next;
        state.session.actualQuestions[nextIndex] = { type: next.type, seed: next.seed, index: next.index, slot: nextIndex };
        state.session.bestScores[nextIndex] = null;
        state.session.checkedSlots[nextIndex] = false;
        showQuestion(nextIndex);
        byId('practice-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      function startNextBatch(type) {
        state.batchNumber += 1;
        const settings = state.session;
        const seed = settings.seed + ':batch:' + state.batchNumber;
        const firstQuestion = Core.generateQuestion(type, seed, 0);
        const questions = Array.from({ length: settings.count }, (_, index) => index === 0 ? firstQuestion : Core.generateQuestion(type, seed + ':slot:' + index, 0));
        state.session = {
          selectedType: settings.selectedType, count: settings.count, seed: seed,
          questions: questions, bestScores: Array(settings.count).fill(null),
          actualQuestions: questions.map((question, index) => ({ type: question.type, seed: question.seed, index: question.index, slot: index })),
          checkedSlots: Array(settings.count).fill(false), startedAt: Date.now(), attempts: 0
        };
        state.index = 0;
        showQuestion(0);
        byId('practice-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      function questionScore(scores) {
        if (!scores) return 0;
        return Object.values(scores).reduce((sum, score) => sum + (score.M || 0) + (score.A || 0), 0);
      }

      function currentScore() {
        if (!state.session) return 0;
        return state.session.bestScores.reduce((sum, result) => sum + questionScore(result), 0);
      }

      function maximumScore() {
        if (!state.session) return 0;
        return state.session.questions.reduce((sum, question) => sum + (question ? question.maxMarks : 0), 0);
      }

      function savePracticeBatch() {
        if (!state.session || !state.session.checkedSlots.some(Boolean)) return;
        const record = {
          type: state.session.selectedType, count: state.session.count, seed: state.session.seed,
          questionSeeds: state.session.actualQuestions.filter(Boolean), partScores: state.session.bestScores,
          score: currentScore(), maxScore: maximumScore(), attempts: state.session.attempts,
          startedAt: new Date(state.session.startedAt).toISOString(), completedAt: new Date().toISOString(),
          elapsedSeconds: Math.max(0, Math.floor((Date.now() - state.session.startedAt) / 1000))
        };
        try {
          const history = readHistory(); history.push(record);
          localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(-MAX_HISTORY)));
          renderHistory();
        } catch (_) {
          const historyNote = byId('history-status');
          historyNote.textContent = '本機儲存不可用，本組成績未保存。'; historyNote.classList.add('error');
        }
      }

      function readHistory() {
        try {
          const parsed = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
          return Array.isArray(parsed) ? parsed.filter((item) => item && typeof item === 'object') : [];
        } catch (_) { return []; }
      }

      function renderHistory() {
        const list = byId('history-list'); list.replaceChildren();
        const history = readHistory().slice().reverse();
        if (!history.length) {
          const empty = document.createElement('li'); empty.className = 'p1a1-empty'; empty.textContent = '尚無本機紀錄。'; list.appendChild(empty); return;
        }
        history.forEach((record) => {
          const item = document.createElement('li');
          const when = record.completedAt ? new Date(record.completedAt).toLocaleString('zh-HK') : '時間未記錄';
          const breakdown = (record.partScores || []).map((question, index) => {
            const parts = Object.entries(question || {}).map(([part, score]) => '(' + part + ') M' + (score.M || 0) + ' A' + (score.A || 0)).join('、');
            return '第' + (index + 1) + '題 ' + (parts || '未提交');
          }).join('；');
          item.textContent = when + '｜' + (typeNames[record.type] || record.type) + '｜' + record.count + ' 題｜' + record.score + '/' + record.maxScore + ' 分｜' + (record.attempts || 0) + ' 次核對｜Seed ' + record.seed + (breakdown ? '｜' + breakdown : '');
          list.appendChild(item);
        });
      }

      function clearHistory() {
        const historyStatus = byId('history-status');
        try { localStorage.removeItem(HISTORY_KEY); renderHistory(); historyStatus.textContent = '已清除本工具在此裝置保存的紀錄。'; historyStatus.classList.remove('error'); }
        catch (_) { historyStatus.textContent = '無法存取此瀏覽器的本機紀錄。'; historyStatus.classList.add('error'); }
      }

      function printWorksheet() {
        const status = byId('worksheet-status');
        if (!Core) { status.textContent = '核心模組載入失敗，暫時不能產生工作紙。'; status.classList.add('error'); return; }
        try {
          const settings = readSettings();
          const questions = buildQuestions(settings.type, settings.count, settings.seed);
          const max = questions.reduce((sum, question) => sum + question.maxMarks, 0);
          const printRoot = byId('worksheet-print');
          const questionPages = questions.map((question, index) => {
            const blanks = question.parts.map((part) => (part.methodInput ? '<div class="p1a1-print-response"><div class="p1a1-print-answer-part">(' + part.id + ') 步驟</div><div class="p1a1-print-writing p1a1-print-work" aria-hidden="true"></div></div>' : '') +
              '<div class="p1a1-print-response"><div class="p1a1-print-answer-part">(' + part.id + ') 答案</div><div class="p1a1-print-writing" aria-hidden="true"></div></div>').join('');
            return '<section class="p1a1-print-page"><header class="p1a1-print-head"><strong>HKDSE 卷一 甲部(一) 因式分解工作紙</strong><div class="p1a1-print-meta"><span>姓名：________________　班別：________　日期：____________</span><span>總分：______ / ' + max + '</span></div></header><div class="p1a1-print-question-number">' + (index + 1) + '.</div>' + question.questionHtml + blanks + '</section>';
          }).join('');
          const answerPages = questions.map((question, index) => '<section class="p1a1-print-page p1a1-print-solutions"><header class="p1a1-print-head"><strong>答案及完整步驟</strong><div class="p1a1-print-meta"><span>第 ' + (index + 1) + ' 題</span><span>總分：______ / ' + max + '　Seed：' + escapeHtml(settings.seed) + '</span></div></header>' + question.parts.map((part) => '<article class="p1a1-print-solution"><div class="p1a1-print-answer-part">(' + part.id + ')</div><div class="hkdse-math-display">\\[\\displaystyle ' + part.questionTex + '\\]</div><div class="p1a1-solution"><strong>參考解答與步驟</strong>' + (part.hintHtml ? '<div class="p1a1-hint">' + part.hintHtml + '</div>' : '') + part.stepsHtml + '<p>標準答案：\\[\\displaystyle ' + part.answerTex + '\\]</p></div></article>').join('') + '</section>').join('');
          printRoot.innerHTML = questionPages + answerPages;
          printRoot.setAttribute('aria-hidden', 'false');
          typeset([printRoot]).then(function () {
            status.textContent = '工作紙已產生，列印預覽已開啟。';
            status.classList.remove('error');
            document.body.classList.add('printing');
            window.print();
          });
        } catch (error) {
          status.textContent = '工作紙未能產生：' + error.message;
          status.classList.add('error');
        }
      }

      window.addEventListener('afterprint', function () {
        document.body.classList.remove('printing');
        byId('worksheet-print').setAttribute('aria-hidden', 'true');
      });

      function typeset(elements) {
        return mathJaxReady.then((mathJax) => {
          if (!mathJax || typeof mathJax.typesetPromise !== 'function') return undefined;
          const startup = mathJax.startup && mathJax.startup.promise ? mathJax.startup.promise : Promise.resolve();
          return startup.then(() => mathJax.typesetPromise(elements));
        }).catch(function (error) { console.error('HKDSE P1A1 MathJax rendering failed.', error); });
      }

      function escapeHtml(text) {
        return String(text).replace(/[&<>"']/g, function (char) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
        });
      }
    });
  </script>
</body>
