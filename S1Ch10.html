<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ch10 坐標 - AI Learning</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">

    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        /* Page-specific: S1Ch10.html */
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; }
        .chapter-header-bar { background: #34495e; }
        .tab.active { color: #34495e; border-bottom-color: #34495e; }
        .note-title { border-bottom-color: #34495e; }
        .note-subtitle { color: #34495e; }
        .practice-label { background: #34495e; }
        .game-card:hover { border-color: #34495e; }
        .game-btn { background: #34495e; }
    </style>
    <link rel="stylesheet" href="css/auth-widget.css">
    <script src="js/auth-state.js" defer></script>
</head>
<body>
    <!-- 漢堡包菜單 -->
    <div class="hamburger" onclick="toggleMenu()">
        <span></span><span></span><span></span>
    </div>
    <div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>
    <div class="side-menu" id="sideMenu">
        <div class="side-menu-header">
            <h2>選單</h2>
            <span class="close-menu" onclick="closeMenu()">✕</span>
        </div>
        <div class="side-menu-content">
            <div class="menu-section">
                <div class="menu-btn grade-header" onclick="toggleGrade('s1')">▼ 中一</div>
                <div class="grade-chapters" id="chapters-s1">
                    <button class="menu-btn" onclick="goToCh(1)">Ch1 基礎運算</button>
                    <button class="menu-btn" onclick="goToCh(2)">Ch2 有向數</button>
                    <button class="menu-btn" onclick="goToCh(3)">Ch3 代數式</button>
                    <button class="menu-btn" onclick="goToCh(4)">Ch4 多項式</button>
                    <button class="menu-btn" onclick="goToCh(5)">Ch5 面積與體積</button>
                    <button class="menu-btn" onclick="goToCh(6)">Ch6 多項式</button>
                    <button class="menu-btn" onclick="goToCh(7)">Ch7 方程</button>
                    <button class="menu-btn" onclick="goToCh(9)">Ch9 百分法</button>
                    <button class="menu-btn" onclick="goToCh(10)">Ch10 坐標</button>
                </div>
            </div>
            <div class="menu-section">
                <button class="menu-btn exam" onclick="goToExam()">📝 考試專區</button>
            </div>
        </div>
    </div>

    <div class="chapter-container">
        <div class="chapter-header-bar">
            <a href="index.html" class="back-link">← 返回</a>
            <h1>Ch10 坐標幾何</h1>
            <p>直角坐標系統</p>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab(1)">📖 筆記</button>
            <button class="tab" onclick="switchTab(2)">📝 例題重做</button>
            <button class="tab" onclick="switchTab(3)">🎮 互動練習</button>
        </div>
        
        <div id="tab1" class="tab-content active">
            <div class="note-section">
                <div class="note-title">📚 直角坐標系統</div>
                <div class="note-subtitle">咩係坐標？</div>
                <div class="note-desc">
                    坐標系統用兩個數字來確定平面上一點既位置。<br>
                    格式：(x, y)
                </div>
                <div class="note-subtitle">X軸同Y軸</div>
                <div class="note-desc">
                    • X軸：水平方向<br>
                    • Y軸：垂直方向<br>
                    • 原點O：(0, 0)
                </div>
                <div class="note-points">
                    <strong>例子：</strong>
                    <ul>
                        <li>A點：(3, 2）</li>
                        <li>B點：(-1, 4)</li>
                    </ul>
                </div>
            </div>
        </div>
        
        <div id="tab2" class="tab-content">
            <div class="practice-item">
                <span class="practice-label">坐標認識</span>
                <div class="practice-question">寫出以下點既坐標：</div>
                <div class="practice-hint">由X軸讀到，再由Y軸讀上</div>
            </div>
        </div>
        
        <div id="tab3" class="tab-content">
            <div class="games-grid">
                <div class="game-card">
                    <h3>📐 坐標幾何</h3>
                    <a href="games/S1Ch10-1-CoordinateGeometry.html" class="game-btn">開始練習</a>
                </div>
                <div class="game-card">
                    <h3>🗺️ 坐標冒險</h3>
                    <a href="games/S1Ch10-3-CoordinateAdventure.html" class="game-btn">開始練習</a>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function switchTab(num) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab')[num-1].classList.add('active');
            document.getElementById('tab' + num).classList.add('active');
        }
    </script>
<script>
function toggleMenu() { document.getElementById('sideMenu').classList.toggle('open'); document.getElementById('menuOverlay').classList.toggle('open'); }
function closeMenu() { document.getElementById('sideMenu').classList.remove('open'); document.getElementById('menuOverlay').classList.remove('open'); }
function goToCh(n) { window.location.href = 'S1Ch' + n + '.html'; closeMenu(); }
function goToExam() { window.location.href = 'index.html'; closeMenu(); }
function toggleGrade(grade) { const el = document.getElementById('chapters-' + grade); el.classList.toggle('open'); }
</script>
</body>
</html>
