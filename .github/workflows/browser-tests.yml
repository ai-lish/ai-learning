name: Browser tests

on:
  push:
    branches:
      - feat/firebase-auth-google-v3
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium system dependencies
        # Ubuntu 24.04 (noble) 已將 libasound2 改為 libasound2t64
        # @playwright/test 1.38 嘅 --with-deps 仲未識轉，所以人手裝
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 \
            libatspi2.0-0t64 libxshmfence1 fonts-liberation

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run auth browser tests
        run: npm run test:browser:auth

      - name: Run viewport browser tests
        run: npm run test:browser:viewport

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
