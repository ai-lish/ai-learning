name: Build and deploy Pages (filtered)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare site directory (explicit safe copy)
        run: |
          rm -rf site || true
          mkdir -p site
          echo "Copying selected site files..."
          mkdir -p site/games site/student site/login site/css site/images site/js
          cp -v index.html site/ || true
          # Copy all chapter HTML files
          cp -v S*.html site/ || true
          cp -Rv games/* site/games/ || true
          cp -Rv student/* site/student/ || true
          cp -Rv login/* site/login/ || true
          cp -Rv css/* site/css/ || true
          cp -Rv images/* site/images/ || true
          cp -Rv js/* site/js/ || true
          # ensure .nojekyll so GitHub Pages serves files as-is
          touch site/.nojekyll
          echo "Site built: $(du -sh site || true)"

      - name: List site tree
        run: |
          du -sh site || true
          ls -la site | head -n 200

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
