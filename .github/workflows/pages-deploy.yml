name: Build and deploy Pages (filtered)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare site directory (whitelist small site)
        run: |
          rm -rf site || true
          mkdir -p site
          echo "Building site from whitelist..."
          # Whitelist only the front-end site files we want on Pages to keep artifact small.
          git ls-files -z -- index.html games/ student/ login/ S1Ch9.html S1Ch9*/student/change-password.html \
            | tar --null -T - -cf - \
            | (cd site && tar -xf -)
          echo "Site built."

      - name: List site tree
        run: |
          du -sh site || true
          ls -la site | head -n 200

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
