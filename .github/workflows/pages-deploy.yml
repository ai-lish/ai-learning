name: Build and deploy Pages (filtered)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare site directory (exclude large dirs)
        run: |
          rm -rf site || true
          mkdir -p site
          # copy only the files we want to publish, exclude node_modules, logs, hkdse/ocr-output, .git, .github, node_modules
          rsync -av --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='logs' --exclude='hkdse/ocr-output' --exclude='hkdse/node_modules' --exclude='hkdse/ocr-output' --exclude='hkdse/ocr-output/*' --exclude='**/*.map' ./ site/ 

      - name: List site tree
        run: |
          du -sh site || true
          ls -la site | head -n 200

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
