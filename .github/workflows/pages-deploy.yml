name: Build and deploy Pages (filtered)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare site directory (exclude large dirs)
        run: |
          rm -rf site || true
          mkdir -p site
          # Create site using only tracked files to avoid transient or generated files that make rsync fail.
          # Exclude large folders that we don't want on Pages.
          echo "Building site from tracked files..."
          git ls-files -z \
            | grep -z -v -E '^(?:node_modules/|\.github/|logs/|hkdse/ocr-output/|hkdse/node_modules/|source/|\.git/|\.DS_Store$)' \
            | tar --null -T - -cf - \
            | (cd site && tar -xf -)
          echo "Site built."

      - name: List site tree
        run: |
          du -sh site || true
          ls -la site | head -n 200

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
