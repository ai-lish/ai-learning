name: Build and deploy Pages (blacklist-style)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare site directory (blacklist-style copy)
        run: |
          rm -rf site || true
          mkdir -p site
          echo "Copying repo → site/ via rsync (excluding non-public directories)..."
          #
          # Blacklist approach: copy everything EXCEPT the directories below.
          # This ensures that new directories added in future Phases (e.g. topics/,
          # tools/, archive/) are published automatically without editing this file,
          # except for genuinely non-public dirs which remain excluded here.
          #
          # Excluded (non-public / dev-only):
          #   archive/   — future archive of deprecated files (Decision C: not deployed)
          #   PLANNING/  — formal planning files (not student-facing)
          #   REFERENCE/ — repo audits and reference docs (not student-facing)
          #   gas/       — Google Apps Script source (backend, not deployed)
          #   tests/     — Playwright / Node test suite (dev only)
          #   scripts/   — build / maintenance scripts (dev only)
          #   prompts/   — AI prompt texts (dev only)
          #   content/   — admin operational notes (not student-facing)
          #   planning/  — legacy lowercase planning files (not student-facing)
          #   node_modules/ — npm deps (should not exist in checkout, excluded for safety)
          #   site/      — rsync destination itself (prevents site/site/ creation)
          #   .git/      — git internals
          #   .github/   — CI/CD config and agent instructions
          #
          rsync -a \
            --exclude='archive' \
            --exclude='PLANNING' \
            --exclude='REFERENCE' \
            --exclude='gas' \
            --exclude='tests' \
            --exclude='scripts' \
            --exclude='prompts' \
            --exclude='content' \
            --exclude='planning' \
            --exclude='node_modules' \
            --exclude='site' \
            --exclude='.git' \
            --exclude='.github' \
            . site/
          # Ensure GitHub Pages serves files as-is (no Jekyll processing)
          touch site/.nojekyll
          echo "Site built: $(du -sh site || true)"

      - name: List site tree (top level)
        run: |
          du -sh site || true
          ls -la site | head -n 200

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
