<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>直線方程 — 參數探索</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Nunito:wght@400;700&display=swap');

        body {
            font-family: 'Noto Sans TC', 'Nunito', sans-serif;
            background-color: #f0fdf4;
            touch-action: none; /* 完全禁止預設的滑動與縮放，確保遊戲機手感 */
            -webkit-user-select: none; /* 禁用文字選取 */
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 600px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            background-color: white;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 慶祝動畫 */
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .success-animate {
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes confetti-fall {
            0% { transform: translateY(-100vh) rotate(0deg); }
            100% { transform: translateY(100vh) rotate(360deg); }
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #facc15;
            top: -10px;
            z-index: 50;
            animation: confetti-fall linear infinite;
        }

        #intro-dialog {
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="h-[100dvh] overflow-hidden flex flex-col p-2 sm:p-4 md:p-8 text-gray-800">

    <header class="text-center mb-1 sm:mb-2 flex-shrink-0">
        <h1 class="text-xl sm:text-2xl font-bold text-green-800 mb-0.5">直線方程 — 參數探索</h1>
        <p class="text-xs sm:text-sm text-gray-600 hidden sm:block">尋找相同的直線</p>
    </header>

    <!-- 背景故事對話框 -->
    <div id="intro-dialog" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 transition-opacity duration-300">
        <div class="bg-white rounded-2xl p-6 md:p-8 max-w-md w-[90%] shadow-2xl transform transition-transform duration-300 scale-100">
            <h2 class="text-2xl font-bold text-blue-600 mb-4 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                今日任務
            </h2>
            <div class="text-gray-700 space-y-3 leading-relaxed mb-6 text-sm sm:text-base">
                <p>今日要學直線方程，目標係利用未知數坐標(x,y)為每條直線建構一個獨一無二既方程名稱。</p>
                <p>係講解計算方法之前，等我地一齊探究一下直線既特徵。</p>
                <p class="font-bold text-green-700 bg-green-50 p-3 rounded-lg border border-green-200">
                    呢到有個小遊戲，目標係要將<span class="text-blue-600">控制線</span>完完全全重疊在<span class="text-red-500">目標線</span>之上！<br>
                    過程中可以使用上下移動及左斜右斜。
                </p>
            </div>
            <button id="start-btn" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-lg shadow-md transition-colors active:scale-95">
                開始挑戰！
            </button>
        </div>
    </div>

    <!-- main 容器 -->
    <main class="flex-1 flex flex-col gap-2 sm:gap-3 max-w-3xl mx-auto w-full min-h-0 pb-1">
        
        <!-- 上方：繪圖區 -->
        <div class="flex-1 relative flex flex-col w-full rounded-2xl overflow-hidden shadow-sm border-2 border-gray-200 bg-white">
            <div id="game-container" class="flex-1 flex-grow">
                <canvas id="math-canvas"></canvas>
                
                <!-- 成功提示圖層 -->
                <div id="success-overlay" class="absolute inset-0 bg-green-500/20 hidden flex-col items-center justify-center backdrop-blur-[2px] z-20">
                    <div class="bg-white p-6 rounded-2xl shadow-xl flex flex-col items-center success-animate text-center mx-4">
                        <span class="text-5xl sm:text-6xl mb-2">✨</span>
                        <h2 class="text-2xl sm:text-3xl font-bold text-green-600 mb-6">成功重疊！</h2>
                        
                        <button id="next-target-btn" class="px-6 py-3 bg-green-500 hover:bg-green-600 text-white rounded-full font-bold shadow-md transition-transform active:scale-95 text-lg">
                            下一個挑戰
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 下方：遊戲機控制器 -->
        <div class="w-full bg-slate-800 p-3 sm:p-4 rounded-[24px] shadow-[0_10px_30px_rgba(0,0,0,0.3)] flex-shrink-0 text-white select-none relative border-3 sm:border-4 border-slate-700">
            
            <div class="flex justify-between items-center mb-3 sm:mb-4 px-1 sm:px-3">
                <div class="flex gap-2 sm:gap-3">
                    <button id="reset-btn" class="px-3 py-1.5 sm:px-4 sm:py-2 bg-slate-700 hover:bg-slate-600 active:scale-95 rounded-full transition-all text-xs font-semibold text-slate-300 shadow-inner border border-slate-600">
                        🔄 重置
                    </button>
                    <button id="random-btn" class="px-3 py-1.5 sm:px-4 sm:py-2 bg-purple-600 hover:bg-purple-500 active:scale-95 rounded-full transition-all text-xs font-bold text-white shadow-md border border-purple-400">
                        🎲 隨機目標
                    </button>
                </div>
                <div class="flex gap-2 sm:gap-4 text-xs sm:text-sm font-mono bg-black px-2 sm:px-3 py-1.5 rounded-xl border-2 border-slate-600 shadow-inner tracking-wider items-center whitespace-nowrap">
                    <div>m: <span id="m-val-display" class="text-blue-400 font-bold">1.0</span></div>
                    <div class="text-slate-600">|</div>
                    <div>參考點: <span class="text-green-400 font-bold">(<span id="refx-val-display">0</span>, <span id="refy-val-display">0.0</span>)</span></div>
                </div>
            </div>

            <div class="flex justify-between items-center px-1 sm:px-6 pb-1">
                <div class="flex gap-3 sm:gap-4">
                    <button id="btn-tilt-left" class="w-12 h-12 sm:w-14 sm:h-14 bg-blue-500 rounded-full shadow-[0_4px_0_#1e3a8a] active:shadow-[0_0px_0_#1e3a8a] active:translate-y-[4px] transition-all flex flex-col items-center justify-center border-2 border-blue-300">
                        <span class="text-lg sm:text-xl font-bold font-mono text-white">-m</span>
                    </button>
                    <button id="btn-tilt-right" class="w-12 h-12 sm:w-14 sm:h-14 bg-blue-500 rounded-full shadow-[0_4px_0_#1e3a8a] active:shadow-[0_0px_0_#1e3a8a] active:translate-y-[4px] transition-all flex flex-col items-center justify-center border-2 border-blue-300">
                        <span class="text-lg sm:text-xl font-bold font-mono text-white">+m</span>
                    </button>
                </div>

                <div class="flex gap-1.5 opacity-30">
                    <div class="w-1.5 h-4 sm:h-5 bg-slate-500 rounded-full"></div>
                    <div class="w-1.5 h-4 sm:h-5 bg-slate-500 rounded-full"></div>
                    <div class="w-1.5 h-4 sm:h-5 bg-slate-500 rounded-full"></div>
                </div>

                <div class="flex flex-col gap-2 sm:gap-3">
                    <button id="btn-move-up" class="w-12 h-10 sm:w-14 sm:h-12 bg-green-500 rounded-[12px] shadow-[0_4px_0_#14532d] active:shadow-[0_0px_0_#14532d] active:translate-y-[4px] transition-all flex flex-col items-center justify-center border-2 border-green-300">
                        <span class="text-lg sm:text-xl">⬆️</span>
                    </button>
                    <button id="btn-move-down" class="w-12 h-10 sm:w-14 sm:h-12 bg-green-500 rounded-[12px] shadow-[0_4px_0_#14532d] active:shadow-[0_0px_0_#14532d] active:translate-y-[4px] transition-all flex flex-col items-center justify-center border-2 border-green-300">
                        <span class="text-lg sm:text-xl">⬇️</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('math-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        
        const gridScale = 10; 
        let pixelsPerUnit = 0;
        const axisRange = 10;

        let targetM = 0;
        let targetC = 0;

        let currentM = 1;
        let refX = 0;
        let refY = 0;

        let isSuccess = false;

        const mDisplay = document.getElementById('m-val-display');
        const refXDisplay = document.getElementById('refx-val-display');
        const refYDisplay = document.getElementById('refy-val-display');
        
        const btnTiltLeft = document.getElementById('btn-tilt-left');
        const btnTiltRight = document.getElementById('btn-tilt-right');
        const btnMoveUp = document.getElementById('btn-move-up');
        const btnMoveDown = document.getElementById('btn-move-down');
        
        const resetBtn = document.getElementById('reset-btn');
        const randomBtn = document.getElementById('random-btn');
        const introDialog = document.getElementById('intro-dialog');
        const startBtn = document.getElementById('start-btn');
        const successOverlay = document.getElementById('success-overlay');
        const nextTargetBtn = document.getElementById('next-target-btn');

        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            canvas.style.width = `${rect.width}px`;
            canvas.style.height = `${rect.height}px`;

            const minDimension = Math.min(rect.width, rect.height);
            pixelsPerUnit = minDimension / (axisRange * 2);
            draw();
        }
        window.addEventListener('resize', resizeCanvas);

        function mathToPx(x, y) {
            const rect = canvas.getBoundingClientRect();
            return { 
                px: (rect.width / 2) + x * pixelsPerUnit, 
                py: (rect.height / 2) - y * pixelsPerUnit 
            };
        }

        function drawGrid() {
            const rect = canvas.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;
            const centerX = width / 2;
            const centerY = height / 2;

            ctx.clearRect(0, 0, width, height);
            ctx.beginPath();
            ctx.strokeStyle = '#e5e7eb';
            ctx.lineWidth = 1;

            for (let i = -axisRange; i <= axisRange; i++) {
                if (i === 0) continue;
                const x = centerX + i * pixelsPerUnit;
                ctx.moveTo(x, 0); ctx.lineTo(x, height);
                const y = centerY - i * pixelsPerUnit;
                ctx.moveTo(0, y); ctx.lineTo(width, y);
            }
            ctx.stroke();

            ctx.beginPath();
            ctx.strokeStyle = '#9ca3af';
            ctx.lineWidth = 2;
            ctx.moveTo(0, centerY); ctx.lineTo(width, centerY);
            ctx.moveTo(centerX, 0); ctx.lineTo(centerX, height);
            ctx.stroke();

            ctx.fillStyle = '#6b7280';
            ctx.font = '12px Noto Sans TC';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';

            for (let i = -axisRange; i <= axisRange; i += 2) {
                if (i === 0) continue;
                ctx.fillText(i.toString(), centerX + i * pixelsPerUnit, centerY + 5);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillText(i.toString(), centerX - 5, centerY - i * pixelsPerUnit);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
            }
            ctx.textAlign = 'right';
            ctx.fillText('0', centerX - 5, centerY + 5);
            
            ctx.fillStyle = '#4b5563';
            ctx.font = 'italic 16px Noto Sans TC';
            ctx.fillText('x', width - 10, centerY - 20);
            ctx.fillText('y', centerX + 15, 10);
        }

        function drawLine(m, c, color, isDashed = false, isThick = false) {
            const x1 = -axisRange - 2;
            const x2 = axisRange + 2;
            const pt1 = mathToPx(x1, m * x1 + c);
            const pt2 = mathToPx(x2, m * x2 + c);

            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = isThick ? 4 : 3;
            if (isDashed) ctx.setLineDash([10, 10]);
            else ctx.setLineDash([]);

            ctx.moveTo(pt1.px, pt1.py);
            ctx.lineTo(pt2.px, pt2.py);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function draw() {
            drawGrid();
            const currentC = refY - currentM * refX;

            if (isSuccess) {
                drawLine(currentM, currentC, '#22c55e', false, true);
            } else {
                drawLine(targetM, targetC, '#ef4444', true, false);
                drawLine(currentM, currentC, '#3b82f6', false, true);
            }

            const refPt = mathToPx(refX, refY);
            ctx.beginPath();
            ctx.arc(refPt.px, refPt.py, 6, 0, Math.PI * 2);
            ctx.fillStyle = isSuccess ? '#22c55e' : '#3b82f6';
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function updateUI() {
            mDisplay.textContent = currentM.toFixed(1);
            refXDisplay.textContent = refX;
            refYDisplay.textContent = refY.toFixed(1);
            draw();
            checkSuccess();
        }

        function triggerVibration(duration = 15) {
            if (navigator.vibrate) {
                navigator.vibrate(duration);
            }
        }

        function checkSuccess() {
            const currentC = refY - currentM * refX;
            const epsilon = 0.05;
            const mMatch = Math.abs(currentM - targetM) < epsilon;
            const cMatch = Math.abs(currentC - targetC) < epsilon;

            if (mMatch && cMatch && !isSuccess) {
                isSuccess = true;
                triggerVibration([30, 50, 30]); // 成功時連續震動
                successOverlay.classList.remove('hidden');
                successOverlay.classList.add('flex');
                createConfetti();
            } else if ((!mMatch || !cMatch) && isSuccess) {
                isSuccess = false;
                successOverlay.classList.add('hidden');
                successOverlay.classList.remove('flex');
                document.querySelectorAll('.confetti').forEach(el => el.remove());
            }
        }

        function generateRandomTarget() {
            isSuccess = false;
            successOverlay.classList.add('hidden');
            successOverlay.classList.remove('flex');
            document.querySelectorAll('.confetti').forEach(el => el.remove());

            const mSteps = [-3, -2.5, -2, -1.5, -1, -0.5, 0.5, 1, 1.5, 2, 2.5, 3];
            targetM = mSteps[Math.floor(Math.random() * mSteps.length)];
            targetC = Math.floor(Math.random() * 17) - 8;
            refX = Math.floor(Math.random() * 9) - 4;
            currentM = 1;
            refY = 0;

            const initialC = refY - currentM * refX;
            if (targetM === currentM && targetC === initialC) {
                generateRandomTarget();
                return;
            }
            updateUI();
        }

        // === 長按連發控制器 (Long Press Logic) ===
        function setupHoldButton(button, actionFunction) {
            let holdTimer = null;
            let intervalTimer = null;

            const startAction = (e) => {
                e.preventDefault(); // 防止手機預設行為
                if(isSuccess) return; // 成功後鎖定按鈕
                
                actionFunction(); // 點擊當下執行一次
                triggerVibration();

                // 按住 300 毫秒後開始連發
                holdTimer = setTimeout(() => {
                    intervalTimer = setInterval(() => {
                        actionFunction();
                        triggerVibration();
                    }, 120); // 連發速度
                }, 300);
            };

            const stopAction = (e) => {
                if(e) e.preventDefault();
                clearTimeout(holdTimer);
                clearInterval(intervalTimer);
            };

            // 滑鼠事件
            button.addEventListener('mousedown', startAction);
            button.addEventListener('mouseup', stopAction);
            button.addEventListener('mouseleave', stopAction);
            
            // 觸控事件
            button.addEventListener('touchstart', startAction, {passive: false});
            button.addEventListener('touchend', stopAction, {passive: false});
            button.addEventListener('touchcancel', stopAction, {passive: false});
        }

        // 綁定按鈕動作
        setupHoldButton(btnMoveUp, () => { refY = Math.min(10, refY + 0.5); updateUI(); });
        setupHoldButton(btnMoveDown, () => { refY = Math.max(-10, refY - 0.5); updateUI(); });
        setupHoldButton(btnTiltLeft, () => { currentM = Math.max(-3, currentM - 0.5); updateUI(); });
        setupHoldButton(btnTiltRight, () => { currentM = Math.min(3, currentM + 0.5); updateUI(); });

        resetBtn.addEventListener('click', () => { currentM = 1; refY = 0; updateUI(); triggerVibration(); });
        randomBtn.addEventListener('click', () => { generateRandomTarget(); triggerVibration(); });
        nextTargetBtn.addEventListener('click', () => { generateRandomTarget(); triggerVibration(); });

        startBtn.addEventListener('click', () => {
            triggerVibration();
            introDialog.classList.add('opacity-0');
            setTimeout(() => {
                introDialog.classList.add('hidden');
                introDialog.classList.remove('flex');
            }, 300);
            setTimeout(() => {
                resizeCanvas();
                generateRandomTarget();
            }, 100);
        });

        function createConfetti() {
            const colors = ['#facc15', '#ef4444', '#3b82f6', '#22c55e', '#a855f7'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
                confetti.style.animationDelay = Math.random() * 1 + 's';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                document.body.appendChild(confetti);
            }
        }

        window.addEventListener('load', () => {
            updateUI();
        });

    </script>
</body>
</html>
