<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考試專區 | ai-learning</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f0f23; color: #fff; min-height: 100vh; padding: 2rem; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .subtitle { color: #888; margin-bottom: 2rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; max-width: 1200px; }
    .card { background: #1a1a2e; border-radius: 12px; padding: 1.5rem; border: 1px solid #333; transition: transform 0.2s, border-color 0.2s; }
    .card:hover { transform: translateY(-4px); border-color: #4A90D9; }
    .card h2 { font-size: 1.2rem; margin-bottom: 0.5rem; }
    .card p { color: #888; font-size: 0.9rem; margin-bottom: 1rem; }
    .card a { display: inline-block; padding: 0.6rem 1.2rem; background: #4A90D9; color: #fff; text-decoration: none; border-radius: 6px; font-size: 0.9rem; transition: background 0.2s; }
    .card a:hover { background: #357ABD; }
    .card a.secondary { background: transparent; border: 1px solid #4A90D9; margin-left: 0.5rem; }
    .card a.secondary:hover { background: rgba(74, 144, 217, 0.1); }
    .back { color: #888; text-decoration: none; margin-bottom: 1rem; display: inline-block; }
    .back:hover { color: #fff; }
  </style>
  <link rel="stylesheet" href="../css/auth-widget.css">
  <script src="../js/auth-state.js" defer></script>
</head>
<body>
  <a href="../index.html" class="back">← 返回首頁</a>
  <h1>📝 考試專區</h1>
  <p class="subtitle">LSC 數學自學平台 — 考試練習系統</p>

  <div class="grid">
    <div class="card">
      <h2>🎯 校內考試練習</h2>
      <p>選擇學年、年級、學期和卷別，進行模擬練習。</p>
      <a href="practice.html">開始練習 →</a>
    </div>

    <div class="card">
      <h2>📋 OCR 審核（老師）</h2>
      <p>審核 OCR 試卷結果，修復識別錯誤。</p>
      <a href="review-p1.html">卷一審核 →</a>
      <a href="review-p2.html" class="secondary">卷二審核 →</a>
    </div>

    <div class="card">
      <h2>🧪 仿題模板管理</h2>
      <p>管理和創建仿題模板，用於生成練習題目。</p>
      <a href="mimic/index.html">開啟模板系統 →</a>
    </div>

    <div class="card">
      <h2>📊 評分工具</h2>
      <p>自動評分工具，計算學生得分和統計。</p>
      <a href="scoring.py">評分腳本（需本地運行）</a>
    </div>
  </div>
</body>
</html>
