<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKDSE 仿題生成器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans TC', sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        .header h1 { font-size: 24px; margin-bottom: 10px; }
        .card { background: white; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .card h2 { font-size: 18px; margin-bottom: 15px; color: #333; border-bottom: 2px solid #667eea; padding-bottom: 8px; }
        
        .topic-selector { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .topic-selector select, .topic-selector button { padding: 10px 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; cursor: pointer; }
        .topic-selector button { background: #667eea; color: white; border: none; }
        .topic-selector button:hover { background: #5568d3; }
        
        .question-list { max-height: 400px; overflow-y: auto; }
        .question-item { padding: 15px; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; }
        .question-item:hover { background: #f8f9fa; border-color: #667eea; }
        .question-item.selected { background: #e8f0fe; border-color: #667eea; border-width: 2px; }
        .question-item .q-id { font-weight: bold; color: #667eea; }
        .question-item .q-topic { font-size: 12px; color: #888; margin-left: 10px; }
        .question-item .q-text { margin-top: 8px; font-size: 14px; color: #333; }
        
        .generator-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .panel-left, .panel-right { background: white; border-radius: 15px; padding: 20px; }
        
        .field-group { margin-bottom: 15px; }
        .field-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; font-size: 14px; }
        .field-group textarea, .field-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; }
        .field-group textarea { min-height: 80px; resize: vertical; }
        .field-group input { min-height: 40px; }
        
        .btn-row { display: flex; gap: 10px; margin-top: 15px; }
        .btn { padding: 12px 20px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold; }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5568d3; }
        .btn-secondary { background: #e0e0e0; color: #333; }
        .btn-secondary:hover { background: #d0d0d0; }
        .btn-success { background: #27ae60; color: white; }
        .btn-success:hover { background: #219a52; }
        
        .generated-output { background: #f8f9fa; border-radius: 10px; padding: 15px; margin-top: 15px; }
        .generated-output h4 { color: #27ae60; margin-bottom: 10px; }
        .generated-output .q-text { font-size: 15px; line-height: 1.8; margin-bottom: 15px; }
        .generated-output .answer { background: #fff3cd; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .generated-output .solution { background: #e8f4f8; padding: 10px; border-radius: 8px; font-size: 13px; }
        
        .loading { text-align: center; padding: 20px; color: #888; }
        .loading::after { content: '...'; animation: dots 1.5s infinite; }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60%, 100% { content: '...'; } }
        
        .status { padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        
        .question-meta { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
        .question-meta span { background: #e0e0e0; padding: 2px 8px; border-radius: 4px; font-size: 11px; }
        
        @media (max-width: 768px) { .generator-panel { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 HKDSE 仿題生成器</h1>
            <p>選擇題目 → 填寫概括 → 生成仿題 → 微調導出</p>
        </div>
        
        <!-- 課題選擇 -->
        <div class="card">
            <h2>📚 選擇課題</h2>
            <div class="topic-selector">
                <select id="paperSelect">
                    <option value="P1">卷一 (P1)</option>
                    <option value="P2">卷二 (P2)</option>
                </select>
                <select id="topicSelect">
                    <option value="概率">概率（全部）</option>
                </select>
                <button onclick="loadQuestions()">載入題目</button>
            </div>
            
            <div class="question-list" id="questionList">
                <p style="color:#888;text-align:center;padding:40px;">請先選擇課題然後點擊「載入題目」</p>
            </div>
        </div>
        
        <!-- 生成面板 -->
        <div class="generator-panel">
            <div class="panel-left">
                <h2>📝 原題資料</h2>
                
                <div class="field-group">
                    <label>課題</label>
                    <input type="text" id="inputTopic" placeholder="例如：概率">
                </div>
                
                <div class="field-group">
                    <label>概括（題目模式）</label>
                    <textarea id="inputGeneralization" placeholder="描述呢條題目嘅核心結構同考核點，例如：
「從n件物品中抽m件，計算起碼有1件係某色嘅概率」
「用排列P或組合C嘅公式計數」"></textarea>
                </div>
                
                <div class="field-group">
                    <label>位移方向（可選）</label>
                    <input type="text" id="inputDisplacement" placeholder="例如：古典概率 → 幾何概率，或：P → C">
                </div>
                
                <div class="field-group">
                    <label>原題內容</label>
                    <textarea id="inputQuestion" placeholder="選擇題目後會自動填入，或直接粘貼題目"></textarea>
                </div>
                
                <div class="btn-row">
                    <button class="btn btn-primary" onclick="generate()">🔄 生成仿題</button>
                    <button class="btn btn-secondary" onclick="clearAll()">清除</button>
                </div>
            </div>
            
            <div class="panel-right">
                <h2>✨ 仿題輸出</h2>
                
                <div id="outputArea">
                    <p style="color:#888;text-align:center;padding:40px;">生成嘅仿題會喺呢度顯示</p>
                </div>
                
                <div class="btn-row" id="outputActions" style="display:none;">
                    <button class="btn btn-success" onclick="saveToJSON()">💾 儲存</button>
                    <button class="btn btn-primary" onclick="regenerate()">🔄 重做（隨機變化）</button>
                </div>
                
                <div id="savedList" style="margin-top:20px;">
                    <h4 style="color:#333;margin-bottom:10px;">📋 已儲存仿題</h4>
                    <div id="savedItems"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // 課題數據
        const questionData = {
            P1: {},
            P2: {}
        };
        
        let currentQuestions = [];
        let selectedQuestion = null;
        let generatedQuestion = null;
        let savedQuestions = [];
        
        // 載入課題
        async function loadQuestions() {
            const paper = document.getElementById('paperSelect').value;
            const topic = document.getElementById('topicSelect').value;
            const listEl = document.getElementById('questionList');
            
            listEl.innerHTML = '<div class="loading">載入中</div>';
            
            try {
                const file = paper === 'P1' ? 'p1_latex_ocr_results.json' : 'p2_latex_ocr_results.json';
                const resp = await fetch(`../${file}`);
                const data = await resp.json();
                
                questionData[paper] = data;
                
                // 過濾概率課題
                const probQuestions = Object.entries(data)
                    .filter(([k, v]) => v.topic && v.topic.includes('概率'))
                    .map(([k, v]) => ({ id: k, ...v }));
                
                currentQuestions = probQuestions;
                
                if (probQuestions.length === 0) {
                    listEl.innerHTML = '<p style="color:#888;text-align:center;padding:40px;">呢個課題冇題目</p>';
                    return;
                }
                
                listEl.innerHTML = probQuestions.map(q => `
                    <div class="question-item" onclick="selectQuestion('${q.id}')" id="q-${q.id}">
                        <span class="q-id">${q.id}</span>
                        <span class="q-topic">[${q.topic}]</span>
                        <div class="q-text">${q.question || q.question_text || '(無題目文字)'}</div>
                        <div class="question-meta">
                            <span>${paper}</span>
                        </div>
                    </div>
                `).join('');
                
            } catch (e) {
                listEl.innerHTML = '<p style="color:red;text-align:center;padding:40px;">載入失敗：' + e.message + '</p>';
            }
        }
        
        // 選擇題目
        function selectQuestion(id) {
            // 清除其他選擇
            document.querySelectorAll('.question-item').forEach(el => el.classList.remove('selected'));
            document.getElementById('q-' + id).classList.add('selected');
            
            const q = currentQuestions.find(x => x.id === id);
            selectedQuestion = q;
            
            // 填入資料
            document.getElementById('inputTopic').value = q.topic || '';
            document.getElementById('inputQuestion').value = q.question || q.question_text || '';
            document.getElementById('inputGeneralization').value = '';
            document.getElementById('inputDisplacement').value = '';
            document.getElementById('outputArea').innerHTML = '<p style="color:#888;text-align:center;padding:40px;">生成嘅仿題會喺呢度顯示</p>';
            document.getElementById('outputActions').style.display = 'none';
        }
        
        // 生成仿題
        async function generate() {
            if (!selectedQuestion) {
                alert('請先選擇一道題目');
                return;
            }
            
            const topic = document.getElementById('inputTopic').value;
            const question = document.getElementById('inputQuestion').value;
            const generalization = document.getElementById('inputGeneralization').value.trim();
            const displacement = document.getElementById('inputDisplacement').value.trim();
            
            const outputEl = document.getElementById('outputArea');
            const actionsEl = document.getElementById('outputActions');
            
            outputEl.innerHTML = '<div class="loading">生成中</div>';
            actionsEl.style.display = 'none';
            
            // 構造 Prompt
            const systemPrompt = `你係 HKDSE 數學仿題生成器，專門為香港中學文憑試（HKDSE）數學科生成高質量仿題。

【核心原則】
1. 仿題唔係抄襲，係「似其神不抄其形」
2. 考核概念相同，但題境、數值、表達方式必須原創
3. 確保數學邏輯正確，答案準確
4. 適合香港中學生程度

【仿題類型】
- 數值變化：更換數字，保持相同解題步驟
- 概念位移：在同一課題內，轉移考核重點（如：加法→減法，古典概率→幾何概率）

【質量標準】
- 題目語境生活化，避免抄襲官方試題文字
- 難度與原題相若
- 答案唯一且正確
- 解題步驟清晰`;

            let userPrompt = `【生成任務】

原題：
${question}

課題：${topic}
`;

            if (generalization) {
                userPrompt += `\n題目概括（呢個係老師提供嘅題目結構指引）：
${generalization}`;
            }

            if (displacement) {
                userPrompt += `\n\n位移方向：${displacement}`;
            } else {
                userPrompt += `\n\n請隨機選擇適當嘅位移方向（數值變化或概念位移）`;
            }

            userPrompt += `\n\n要求：
1. 生成一道仿題，保持同一課題
2. 題境原創，避免抄襲原題表達
3. 答案必須正確
4. 提供解題步驟

請用以下JSON格式輸出（只需要JSON，唔好有其他文字）：
{
  "question_text": "仿題內容",
  "answer": "答案",
  "solution": "解題步驟",
  "displacement_applied": "位移描述"
}`;

            try {
                // 調用 MiniMax API
                const response = await fetch('https://api.minimax.io/v1/text/chatcompletion_pro?GroupId=2028908157014651652', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + API_KEY
                    },
                    body: JSON.stringify({
                        model: 'MiniMax-Text-01',
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: userPrompt }
                        ],
                        temperature: 0.7
                    })
                });
                
                const data = await response.json();
                const content = data.choices?.[0]?.message?.content || '';
                
                // 解析 JSON
                const jsonMatch = content.match(/\{[\s\S]*\}/);
                if (jsonMatch) {
                    const generated = JSON.parse(jsonMatch[0]);
                    generatedQuestion = {
                        ...generated,
                        source_id: selectedQuestion.id,
                        source_topic: topic,
                        generated_at: new Date().toISOString()
                    };
                    
                    displayGenerated(generated);
                    actionsEl.style.display = 'flex';
                } else {
                    outputEl.innerHTML = '<div class="status error">解析失敗，請重試</div>';
                }
            } catch (e) {
                outputEl.innerHTML = '<div class="status error">生成失敗：' + e.message + '</div>';
            }
        }
        
        // 顯示生成的仿題
        function displayGenerated(g) {
            const outputEl = document.getElementById('outputArea');
            outputEl.innerHTML = `
                <div class="generated-output">
                    <h4>✨ 仿題</h4>
                    <div class="q-text">${g.question_text}</div>
                    <div class="answer"><strong>答案：</strong>${g.answer}</div>
                    <div class="solution"><strong>解題：</strong>${g.solution}</div>
                    ${g.displacement_applied ? `<div style="margin-top:10px;font-size:12px;color:#888;"><strong>位移：</strong>${g.displacement_applied}</div>` : ''}
                </div>
            `;
        }
        
        // 重做（隨機變化）
        function regenerate() {
            generate();
        }
        
        // 儲存到 JSON
        function saveToJSON() {
            if (!generatedQuestion) return;
            
            savedQuestions.push(generatedQuestion);
            renderSavedList();
            
            // 顯示提示
            const actionsEl = document.getElementById('outputActions');
            const originalHTML = actionsEl.innerHTML;
            actionsEl.innerHTML = '<div class="status success" style="flex:1;">✓ 已儲存</div>' + originalHTML;
            setTimeout(() => {
                actionsEl.innerHTML = originalHTML;
            }, 2000);
        }
        
        // 渲染已儲存列表
        function renderSavedList() {
            const el = document.getElementById('savedItems');
            if (savedQuestions.length === 0) {
                el.innerHTML = '<p style="color:#888;font-size:13px;">暫時冇已儲存嘅仿題</p>';
                return;
            }
            
            el.innerHTML = savedQuestions.map((q, i) => `
                <div style="background:#f8f9fa;padding:10px;border-radius:8px;margin-bottom:8px;font-size:13px;">
                    <strong>${i + 1}. ${q.source_id}</strong> → ${q.displacement_applied || '新題目'}
                    <div style="color:#666;margin-top:5px;">${q.question_text.substring(0, 50)}...</div>
                    <button onclick="removeSaved(${i})" style="margin-top:5px;padding:3px 8px;font-size:11px;background:#e0e0e0;border:none;border-radius:4px;cursor:pointer;">刪除</button>
                </div>
            `).join('') + `
                <button onclick="exportAll()" class="btn btn-success" style="margin-top:10px;width:100%;">📤 導出全部 JSON</button>
            `;
        }
        
        // 刪除已儲存
        function removeSaved(index) {
            savedQuestions.splice(index, 1);
            renderSavedList();
        }
        
        // 導出全部
        function exportAll() {
            const blob = new Blob([JSON.stringify(savedQuestions, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'generated_questions_' + new Date().toISOString().split('T')[0] + '.json';
            a.click();
        }
        
        // 清除
        function clearAll() {
            document.getElementById('inputGeneralization').value = '';
            document.getElementById('inputDisplacement').value = '';
            document.getElementById('outputArea').innerHTML = '<p style="color:#888;text-align:center;padding:40px;">生成嘅仿題會喺呢度顯示</p>';
            document.getElementById('outputActions').style.display = 'none';
            generatedQuestion = null;
        }
        
        // 初始化 Topic Select
        function updateTopicOptions() {
            const topicSelect = document.getElementById('topicSelect');
            topicSelect.innerHTML = '<option value="概率">概率（全部）</option>';
        }
        
        updateTopicOptions();
    </script>
    <script src="config.js"></script>
</body>
</html>
