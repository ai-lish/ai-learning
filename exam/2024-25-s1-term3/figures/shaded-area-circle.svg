<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <!-- 長方形 -->
  <rect x="30" y="30" width="240" height="120" fill="none" stroke="black" stroke-width="2"/>
  <!-- 圓形 (陰影) -->
  <circle cx="150" cy="90" r="{r}" fill="#ddd" stroke="black" stroke-width="1.5"/>
  <!-- 尺寸標記 -->
  <text x="145" y="160" font-size="11">{width} cm</text>
  <text x="10" y="95" font-size="11">{height} cm</text>
  <text x="145" y="95" font-size="11" fill="#c0392b">r = {r} cm</text>
</svg>