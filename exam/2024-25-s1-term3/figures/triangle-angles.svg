<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="280" height="200">
  <polygon points="30,170 140,30 250,170" fill="none" stroke="black" stroke-width="2"/>
  <!-- 角度標記 -->
  <text x="70" y="155" font-size="11" fill="#2980b9">{a}°</text>
  <text x="135" y="25" font-size="11" fill="#2980b9">{b}°</text>
  <text x="225" y="155" font-size="11" fill="#2980b9">{c}°</text>
  <!-- 邊標記 -->
  <text x="80" y="110" font-size="11">{side1}</text>
  <text x="165" y="110" font-size="11">{side2}</text>
  <!-- x 標記 -->
  <text x="138" y="105" font-size="14" font-weight="bold" fill="#8e44ad">x</text>
  <circle cx="140" cy="100" r="12" fill="none" stroke="#8e44ad" stroke-width="1.5"/>
</svg>