<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <!-- 外長方形 -->
  <rect x="30" y="30" width="260" height="120" fill="none" stroke="black" stroke-width="2"/>
  <!-- 平行四邊形疊加 -->
  <polygon points="80,30 200,30 260,150 140,150" fill="#eee" stroke="black" stroke-width="2"/>
  <!-- 標記尺寸 -->
  <text x="140" y="20" font-size="11">{base} cm</text>
  <text x="275" y="95" font-size="11">{height} cm</text>
</svg>