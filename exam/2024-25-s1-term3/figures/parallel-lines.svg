<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <!-- 兩條平行線 -->
  <line x1="20" y1="50" x2="280" y2="50" stroke="black" stroke-width="2"/>
  <line x1="20" y1="150" x2="280" y2="150" stroke="black" stroke-width="2"/>
  <!-- 截線 -->
  <line x1="80" y1="20" x2="60" y2="180" stroke="black" stroke-width="1.5"/>
  <!-- 標記角度 (可參數化) -->
  <text x="100" y="43" font-size="12" fill="#c0392b">{angle1}°</text>
  <text x="100" y="170" font-size="12" fill="#2980b9">{angle2}°</text>
  <text x="230" y="43" font-size="12" fill="#c0392b">{angle3}°</text>
  <!-- 標記平行線 -->
  <text x="285" y="55" font-size="10">AB // CD</text>
  <!-- x 標記 -->
  <text x="200" y="105" font-size="14" font-weight="bold" fill="#8e44ad">x</text>
  <circle cx="190" cy="100" r="15" fill="none" stroke="#8e44ad" stroke-width="1.5"/>
</svg>