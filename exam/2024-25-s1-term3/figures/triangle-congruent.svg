<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160">
  <!-- ΔABC -->
  <polygon points="30,130 130,30 180,130" fill="none" stroke="black" stroke-width="2"/>
  <text x="70" y="80" font-size="11">A</text>
  <text x="120" y="25" font-size="11">B</text>
  <text x="170" y="145" font-size="11">C</text>
  <!-- ΔDEF (向右移) -->
  <polygon points="190,130 250,30 300,130" fill="none" stroke="#2980b9" stroke-width="2"/>
  <text x="210" y="80" font-size="11">D</text>
  <text x="240" y="25" font-size="11">E</text>
  <text x="290" y="145" font-size="11">F</text>
  <!-- 邊標記 (表示全等) -->
  <text x="55" y="125" font-size="10" fill="#c0392b">{mark1}</text>
  <text x="105" y="125" font-size="10" fill="#c0392b">{mark2}</text>
  <!-- x 位置 -->
  <text x="250" y="80" font-size="14" font-weight="bold" fill="#8e44ad">x</text>
</svg>