<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260">
  <!-- 坐標軸 -->
  <line x1="20" y1="230" x2="240" y2="230" stroke="black" stroke-width="1.5"/>
  <line x1="30" y1="10" x2="30" y2="240" stroke="black" stroke-width="1.5"/>
  <!-- 箭頭 -->
  <text x="235" y="225" font-size="14">x</text>
  <text x="35" y="18" font-size="14">y</text>
  <!-- 網格 -->
  <line x1="30" y1="190" x2="230" y2="190" stroke="#ddd" stroke-width="0.5"/>
  <line x1="30" y1="150" x2="230" y2="150" stroke="#ddd" stroke-width="0.5"/>
  <line x1="30" y1="110" x2="230" y2="110" stroke="#ddd" stroke-width="0.5"/>
  <line x1="30" y1="70" x2="230" y2="70" stroke="#ddd" stroke-width="0.5"/>
  <line x1="30" y1="30" x2="230" y2="30" stroke="#ddd" stroke-width="0.5"/>
  <line x1="70" y1="230" x2="70" y2="30" stroke="#ddd" stroke-width="0.5"/>
  <line x1="110" y1="230" x2="110" y2="30" stroke="#ddd" stroke-width="0.5"/>
  <line x1="150" y1="230" x2="150" y2="30" stroke="#ddd" stroke-width="0.5"/>
  <line x1="190" y1="230" x2="190" y2="30" stroke="#ddd" stroke-width="0.5"/>
  <!-- 坐標點 -->
  <circle cx="{px}" cy="{py}" r="5" fill="#c0392b"/>
  <text x="{px+8}" y="{py-8}" font-size="12" fill="#c0392b">({x},{y})</text>
  <!-- 原點 -->
  <text x="12" y="245" font-size="10">O</text>
</svg>