<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>學生 Dashboard — AI Learning</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<!-- V3-FIREBASE-SDK 10.7.1 -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js" defer></script>
<script src="../../js/firebase-config.js" defer></script>
<link rel="stylesheet" href="../../css/auth-widget.css">
<style>
* {box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:#f0f4ff;min-height:100vh}

/* ── 未登入提示 ── */
.login-prompt{background:#fff;border-radius:16px;padding:32px 24px;text-align:center;max-width:480px;margin:40px auto;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
.login-prompt h2{color:#1a1a2e;margin-bottom:12px;font-size:1.3rem}
.login-prompt p{color:#666;font-size:0.95rem;margin-bottom:20px;line-height:1.6}
.btn-login-prompt{display:inline-block;background:#2b9edb;color:#fff;padding:12px 28px;border-radius:10px;font-weight:700;text-decoration:none;font-size:1rem;margin-bottom:10px;border:none;cursor:pointer;font-family:inherit}
.btn-login-prompt:hover{background:#2589bd}
.btn-home-prompt{display:inline-block;color:#2b9edb;padding:8px 16px;font-size:0.9rem;text-decoration:none}

/* ── Mock data 免責聲明 ── */
.demo-notice{background:#fff3cd;border:1px solid #ffd700;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:0.8rem;color:#856404;line-height:1.5}

/* Header */
.header{background:linear-gradient(135deg,#2b9edb,#1a6fa3);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 16px rgba(43,158,219,0.3);flex-wrap:wrap;gap:8px}
.header-left{display:flex;align-items:center;gap:12px}
.header-avatar{width:44px;height:44px;background:#fff;color:#2b9edb;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.2rem;border:2px solid rgba(255,255,255,0.5);flex-shrink:0;overflow:hidden}
.header-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.header-info{display:flex;flex-direction:column}
.header-name{font-weight:700;font-size:1.1rem}
.header-class{font-size:0.85rem;opacity:0.85;word-break:break-all}
.header-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.btn-home-link{color:rgba(255,255,255,0.85);font-size:0.85rem;text-decoration:none;padding:4px 0}
.btn-home-link:hover{color:#fff}

/* Main */
.main{max-width:900px;margin:24px auto;padding:0 16px}

/* Chapters */
.section-title{font-size:1rem;font-weight:700;color:#1a1a2e;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title span{color:#2b9edb}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.chapter-card{background:#fff;border-radius:16px;padding:20px 16px;text-align:center;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,0.06);transition:all 0.2s;border:2px solid transparent;text-decoration:none;color:inherit;display:block}
.chapter-card:hover{border-color:#2b9edb;transform:translateY(-3px);box-shadow:0 8px 30px rgba(43,158,219,0.2)}
.chapter-num{font-size:2rem;font-weight:900;color:#2b9edb;margin-bottom:6px}
.chapter-title{font-size:0.9rem;font-weight:700;color:#1a1a2e}
.chapter-sub{font-size:0.75rem;color:#aaa;margin-top:4px}

@media(max-width:480px){
  .header{padding:12px 16px}
}
</style>
</head>
<body data-no-auth-widget>
<!-- V3: 唔再 render 右上角 widget（避免遮擋），但 SDK 仍載入用於 AuthState -->

<!-- 未登入提示（由 JS 控制顯示） -->
<div id="login-prompt-wrap" style="display:none">
  <div style="background:linear-gradient(135deg,#2b9edb,#1a6fa3);padding:16px 24px;color:#fff;font-weight:700;">
    📊 學習 Dashboard
    <span style="float:right"><a href="../../index.html" style="color:rgba(255,255,255,0.85);font-size:0.85rem;text-decoration:none;">← 返回首頁</a></span>
  </div>
  <div class="login-prompt">
    <h2>🔑 請先登入</h2>
    <p>登入後可查看個人學習紀錄。<br>未登入學生仍可由首頁直接使用所有教材。</p>
    <button class="btn-login-prompt" id="loginPromptBtn">使用 Google 登入</button><br>
    <a href="../../index.html" class="btn-home-prompt">← 返回首頁（無需登入）</a>
  </div>
</div>

<!-- 已登入 Dashboard -->
<div id="dashboard-wrap" style="display:none">

<!-- Header -->
<div class="header">
  <div class="header-left">
    <div class="header-avatar" id="avatar">?</div>
    <div class="header-info">
      <div class="header-name" id="studentName">載入中...</div>
      <div class="header-class" id="studentEmail">—</div>
    </div>
  </div>
  <div class="header-right">
    <a href="../../index.html" class="btn-home-link">← 首頁</a>
  </div>
</div>

<div class="main">
  <!-- V3：明確標示「未有同步紀錄」並移除所有 fake 數字 -->
  <div class="demo-notice">
    ⚠️ <strong>未有同步紀錄</strong> · 本頁面只顯示 Firebase 帳戶識別資訊。
    真實學習紀錄同步功能尚未開放。章節連結仍然可跳轉到練習頁。
  </div>

  <!-- V3：移除假 XP / 假題數 / 假 streak / 假徽章。
       改為提供一個簡單「由 Google 帳戶保護嘅 profile 區」 -->
  <div style="background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,0.06);margin-bottom:20px;">
    <div class="section-title" style="margin-bottom:16px;">👤 <span>帳戶資料</span></div>
    <table style="width:100%;font-size:0.9rem;border-collapse:collapse;">
      <tr><td style="padding:6px 0;color:#666;width:30%;">顯示名稱</td><td id="profileName" style="font-weight:700;color:#1a1a2e;">—</td></tr>
      <tr><td style="padding:6px 0;color:#666;">電郵</td><td id="profileEmail" style="font-weight:700;color:#1a1a2e;word-break:break-all;">—</td></tr>
      <tr><td style="padding:6px 0;color:#666;">Firebase UID</td><td id="profileUid" style="font-family:ui-monospace,Menlo,monospace;font-size:0.8rem;color:#888;word-break:break-all;">—</td></tr>
      <tr><td style="padding:6px 0;color:#666;">登入時間</td><td id="profileTs" style="color:#666;">—</td></tr>
    </table>
  </div>

  <!-- Chapters -->
  <div class="section-title">📖 <span>章節練習</span></div>
  <div class="chapters" id="chapters"></div>
</div>

</div><!-- #dashboard-wrap -->

<script src="../../js/auth-state.js"></script>
<script>
/**
 * V3 Dashboard:
 * - 唔再用 student_token；身份由 Firebase Auth 提供（window.AuthState）。
 * - Guest 唔強制 redirect，只顯示登入提示（同 V3 §8.8）。
 * - 已登入用 Firebase display name / email / photo。
 * - 移除 mock XP、題數、streak、徽章；只保留章節連結（用戶可繼續跳去練習）。
 * - 登出：AuthState.logout()，唔用 localStorage.clear()。
 */
function triggerSignIn() {
  if (typeof AuthState !== 'undefined' && AuthState.signInWithGoogle) {
    // DEBUG_1 §3.1：UI handler 必須 catch 避免 unhandledrejection
    var p = AuthState.signInWithGoogle();
    if (p && typeof p.catch === 'function') {
      p.catch(function () { /* 已被 signInWithGoogle 處理 */ });
    }
  } else {
    // AuthState 尚未 ready（Firebase SDK 未載入），提示用戶稍候
    alert('登入系統準備中，請稍候再試。');
  }
}

function showLoginPrompt() {
  document.getElementById('login-prompt-wrap').style.display = 'block';
  document.getElementById('dashboard-wrap').style.display = 'none';
}

function showDashboard(state) {
  document.getElementById('login-prompt-wrap').style.display = 'none';
  document.getElementById('dashboard-wrap').style.display = 'block';
  initDashboard(state);
}

function initDashboard(state) {
  var user = (state && state.user) || {};
  var name = user.displayName || (user.email ? user.email.split('@')[0] : '用戶');
  var email = user.email || '';
  var photo = user.photoURL || '';
  var uid = user.uid || '';

  // Header
  var avatarEl = document.getElementById('avatar');
  // DEBUG_1 §3.6：清空再用 createElement + addEventListener('error', ...)
  // displayName / photoURL 唔再拼入 HTML event handler
  avatarEl.textContent = '';
  if (photo) {
    var img = document.createElement('img');
    img.alt = '';
    img.src = photo;
    img.addEventListener('error', function () {
      try { avatarEl.textContent = (name || '?').charAt(0) || '?'; } catch (e) {}
    });
    avatarEl.appendChild(img);
  } else {
    avatarEl.textContent = (name || '?').charAt(0) || '?';
  }
  document.getElementById('studentName').textContent = name;
  document.getElementById('studentEmail').textContent = email || '—';

  // Profile table
  document.getElementById('profileName').textContent = name;
  document.getElementById('profileEmail').textContent = email || '—';
  document.getElementById('profileUid').textContent = uid;
  document.getElementById('profileTs').textContent = new Date().toLocaleString('zh-HK');

  // Chapters
  var chapters = [
    {num:'Ch1', title:'正負數與數線', topics:'整數・數線・絕對值'},
    {num:'Ch2', title:'分數與小數', topics:'分數運算・小數・分數小數互換'},
    {num:'Ch3', title:'代數基礎', topics:'代數式・項・係數'},
    {num:'Ch4', title:'一元一次方程式', topics:'列方程・解方程・應用題'},
    {num:'Ch5', title:'比與比例', topics:'比・比例・百分率'},
  ];
  var container = document.getElementById('chapters');
  container.innerHTML = '';
  chapters.forEach(function(ch) {
    var a = document.createElement('a');
    a.className = 'chapter-card';
    a.href = '../../S1' + ch.num + '.html';
    a.innerHTML =
      '<div class="chapter-num">'+ch.num+'</div>' +
      '<div class="chapter-title">'+ch.title+'</div>' +
      '<div class="chapter-sub">'+ch.topics+'</div>';
    container.appendChild(a);
  });
}

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// 訂閱 AuthState
function boot() {
  if (typeof AuthState === 'undefined') {
    // AuthState 尚未準備好（理論上唔應該發生因為 auth-state.js defer 載入）
    showLoginPrompt();
    return;
  }
  AuthState.whenReady().then(function (state) {
    if (state.state === 'student' || state.state === 'teacher') {
      showDashboard(state);
    } else {
      showLoginPrompt();
    }
  });
  // 訂閱後續變化（例如用戶喺另一個 tab 登入）
  if (typeof AuthState.onChange === 'function') {
    AuthState.onChange(function (state) {
      if (state.state === 'student' || state.state === 'teacher') {
        showDashboard(state);
      } else {
        showLoginPrompt();
      }
    });
  }

  // DEBUG_1 §3.1：將 inline onclick="triggerSignIn()" 換成 addEventListener，
  // 確保唔再有 inline event handler
  var promptBtn = document.getElementById('loginPromptBtn');
  if (promptBtn) {
    promptBtn.addEventListener('click', function (e) {
      e.preventDefault();
      triggerSignIn();
    });
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
</body>
</html>
