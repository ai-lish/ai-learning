<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>修改密碼 — 學生</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Noto Sans TC',sans-serif;background:#f4f7fb;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:16px;box-sizing:border-box}
.card{background:#fff;padding:24px;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,0.08);width:100%;max-width:420px}
.input{width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;margin-bottom:10px;box-sizing:border-box;font-size:1rem;font-family:inherit}
.input:disabled{background:#f0f0f0;color:#999}
.btn{background:#28a745;color:#fff;padding:10px;border:none;border-radius:8px;width:100%;font-weight:700;cursor:pointer;font-size:1rem}
.btn:disabled{background:#aaa;cursor:not-allowed}
.small{font-size:0.85rem;color:#666;margin-top:8px;line-height:1.5}
.notice{background:#fff3cd;border:1px solid #ffd700;border-radius:8px;padding:12px;margin-bottom:14px;font-size:0.85rem;color:#856404;line-height:1.5}
.back-link{display:block;margin-top:14px;font-size:0.85rem;color:#2b9edb;text-align:center}
</style>
</head>
<body>
<div class="card">
  <h2>🔒 修改密碼</h2>
  <div id="status-notice"></div>
  <input id="oldPwd" class="input" type="password" placeholder="舊密碼" aria-label="舊密碼">
  <input id="newPwd" class="input" type="password" placeholder="新密碼" aria-label="新密碼">
  <input id="confirmPwd" class="input" type="password" placeholder="確認新密碼" aria-label="確認新密碼">
  <button class="btn" id="submitBtn" onclick="changePwd()">提交修改</button>
  <div id="msg" class="small"></div>
  <a href="dashboard/index.html" class="back-link">← 返回 Dashboard</a>
  <a href="../login/index.html" class="back-link" style="margin-top:4px">← 返回登入頁</a>
</div>
<script src="../js/auth-state.js"></script>
<script>
// endpoint 設定（佔位符未替換時禁用功能）
var GWS_ENDPOINT = 'https://script.google.com/macros/s/YOUR_DEPLOY_ID/exec';
var endpointReady = GWS_ENDPOINT.indexOf('YOUR_DEPLOY_ID') === -1;

var statusNotice = document.getElementById('status-notice');
var submitBtn = document.getElementById('submitBtn');
var inputs = [document.getElementById('oldPwd'), document.getElementById('newPwd'), document.getElementById('confirmPwd')];

if (!endpointReady) {
  statusNotice.innerHTML = '<div class="notice">⚠️ <strong>修改密碼功能尚未設定</strong><br>後端 endpoint 尚未設定，目前無法修改密碼。請聯絡老師處理。</div>';
  submitBtn.disabled = true;
  inputs.forEach(function(el){ el.disabled = true; });
} else {
  // 未登入時提示
  var authS = (typeof AuthState !== 'undefined') ? AuthState.get() : { state: 'guest' };
  if (authS.state !== 'legacy-student') {
    statusNotice.innerHTML = '<div class="notice">⚠️ 請先登入才能修改密碼。</div>';
    submitBtn.disabled = true;
    inputs.forEach(function(el){ el.disabled = true; });
  }
}

async function changePwd(){
  if (!endpointReady) return;
  var authS = (typeof AuthState !== 'undefined') ? AuthState.get() : { state: 'guest' };
  if (authS.state !== 'legacy-student') {
    alert('請先登入');
    window.location.href = '../login/index.html';
    return;
  }
  var oldPwd = document.getElementById('oldPwd').value.trim();
  var newPwd = document.getElementById('newPwd').value.trim();
  var confirmPwd = document.getElementById('confirmPwd').value.trim();
  if(!oldPwd||!newPwd||!confirmPwd){alert('請填寫所有欄位');return;}
  if(newPwd!==confirmPwd){alert('兩次新密碼不一致');return;}
  var cls = authS.studentClass;
  var number = authS.number;
  var msg = document.getElementById('msg');
  try{
    var payload={action:'changePassword', class:cls, number:number, oldPassword:oldPwd, newPassword:newPwd};
    var resp=await fetch(GWS_ENDPOINT,{method:'POST',body:JSON.stringify(payload),headers:{'Content-Type':'application/json'}});
    var j=await resp.json();
    if(j.success){
      msg.textContent='修改成功';
      setTimeout(function(){ window.location.href='dashboard/index.html'; }, 1000);
    } else {
      msg.textContent='錯誤：'+(j.error||'');
    }
  }catch(e){
    msg.textContent='網絡錯誤：'+e.message;
  }
}
</script>
</body>
</html>
