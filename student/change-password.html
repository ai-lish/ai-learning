<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>修改密碼 — 學生</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Noto Sans TC',sans-serif;background:#f4f7fb;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
.card{background:#fff;padding:24px;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,0.08);width:420px}
.input{width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;margin-bottom:10px}
.btn{background:#28a745;color:#fff;padding:10px;border:none;border-radius:8px;width:100%;font-weight:700;cursor:pointer}
.small{font-size:0.9rem;color:#666;margin-top:8px}
</style>
</head>
<body>
<div class="card">
  <h2>修改密碼</h2>
  <input id="oldPwd" class="input" placeholder="舊密碼">
  <input id="newPwd" class="input" placeholder="新密碼">
  <input id="confirmPwd" class="input" placeholder="確認新密碼">
  <button class="btn" onclick="changePwd()">提交修改</button>
  <div id="msg" class="small"></div>
</div>
<script>
const GWS_ENDPOINT = 'https://script.google.com/macros/s/YOUR_DEPLOY_ID/exec'; // replace
async function changePwd(){
  const token = localStorage.getItem('student_token');
  if(!token){alert('請先登入');window.location.href='../login/index.html';return}
  const oldPwd=document.getElementById('oldPwd').value.trim();
  const newPwd=document.getElementById('newPwd').value.trim();
  const confirmPwd=document.getElementById('confirmPwd').value.trim();
  if(!oldPwd||!newPwd||!confirmPwd){alert('請填寫所有欄位');return}
  if(newPwd!==confirmPwd){alert('兩次新密碼不一致');return}
  const cls=localStorage.getItem('student_class');
  const number=localStorage.getItem('student_number');
  try{
    const payload={action:'changePassword', class:cls, number:number, oldPassword:oldPwd, newPassword:newPwd};
    const resp=await fetch(GWS_ENDPOINT,{method:'POST',body:JSON.stringify(payload),headers:{'Content-Type':'application/json'}});
    const j=await resp.json();
    if(j.success){document.getElementById('msg').innerText='修改成功';setTimeout(()=>window.location.href='dashboard/index.html',1000)}else{document.getElementById('msg').innerText='錯誤：'+(j.error||'')}
  }catch(e){document.getElementById('msg').innerText='網絡錯誤：'+e.message}
}
</script>
</body>
</html>
