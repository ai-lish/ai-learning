<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>帳戶密碼說明 — AI Learning</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<!-- V3-FIREBASE-SDK 10.7.1 -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js" defer></script>
<script src="../js/firebase-config.js" defer></script>
<link rel="stylesheet" href="../css/auth-widget.css">
<style>
body{font-family:'Noto Sans TC',sans-serif;background:#f4f7fb;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:16px;box-sizing:border-box}
.card{background:#fff;padding:24px;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,0.08);width:100%;max-width:460px}
.icon{font-size:2.4rem;margin-bottom:8px}
h1{font-size:1.2rem;margin:0 0 12px;color:#1a1a2e;font-weight:900}
p{font-size:0.92rem;color:#555;line-height:1.6;margin:8px 0}
.note{background:#e8f5ff;border:1px solid #b8daff;border-radius:8px;padding:12px;font-size:0.85rem;color:#004085;line-height:1.6;margin:14px 0}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.btn{display:inline-block;background:#2b9edb;color:#fff;padding:11px 18px;border-radius:8px;text-decoration:none;font-weight:700;text-align:center;font-size:0.95rem;font-family:inherit;border:none;cursor:pointer}
.btn:hover{background:#2589bd}
.btn-secondary{background:#fff;color:#2b9edb;border:1px solid #2b9edb}
.btn-secondary:hover{background:#e9f3ff}
.back-link{display:block;margin-top:14px;font-size:0.85rem;color:#2b9edb;text-align:center;text-decoration:none}
.back-link:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔑</div>
  <h1>本站用 Google 帳戶登入</h1>
  <p>本站（<code>ai-lish.github.io/ai-learning/</code>）已經由 2026 年 6 月起改用 Google 帳戶登入，唔再保留傳統嘅「班別／學號／密碼」帳號系統。</p>

  <div class="note">
    ℹ️ <strong>密碼由 Google 管理。</strong><br>
    本站 <em>唔會</em> 儲存或處理您嘅 Google 密碼。如需變更密碼，請直接去 Google 帳戶設定：
    <ul style="margin:6px 0 0 18px;padding:0;">
      <li><a href="https://myaccount.google.com/security" target="_blank" rel="noopener noreferrer" style="color:#1a6fa3;">https://myaccount.google.com/security</a></li>
    </ul>
  </div>

  <p>如要切換登入身份，請用右上角嘅 widget 按「登出」後再用另一個 Google 帳戶登入。</p>

  <div class="actions">
    <a href="dashboard/index.html" class="btn">前往 Dashboard</a>
    <a href="../index.html" class="btn btn-secondary">返回首頁</a>
    <button class="btn btn-secondary" id="signoutBtn" type="button" style="display:none">登出（右上角已登入）</button>
  </div>

  <a href="../index.html" class="back-link">← 返回首頁</a>
</div>

<script src="../js/auth-state.js"></script>
<script>
/**
 * V3 change-password.html 改成說明頁。
 * - 唔再有「修改密碼」form
 * - 唔再連 GAS endpoint
 * - 顯示「用 Google 帳戶」說明 + 連結到 Google 帳戶設定
 * - 如果用戶已登入，提供「登出」按鈕（AuthState.logout()）
 */
function boot() {
  var signoutBtn = document.getElementById('signoutBtn');
  if (typeof AuthState === 'undefined') return;
  if (typeof AuthState.onChange === 'function') {
    AuthState.onChange(function (state) {
      if (signoutBtn) {
        signoutBtn.style.display = (state.state === 'student' || state.state === 'teacher') ? 'inline-block' : 'none';
      }
    });
  }
  if (signoutBtn) {
    signoutBtn.addEventListener('click', function () {
      if (typeof AuthState !== 'undefined' && AuthState.logout) {
        AuthState.logout();
      }
    });
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
</body>
</html>
