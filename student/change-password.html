<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>帳戶密碼 — 學生</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<!-- V2 (20260609): Firebase Auth + Google provider — 不再使用網站自訂密碼 -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/teacher-allowlist.js"></script>
<link rel="stylesheet" href="../css/auth-widget.css">
<style>
body{font-family:'Noto Sans TC',sans-serif;background:#f4f7fb;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:16px;box-sizing:border-box}
.card{background:#fff;padding:24px;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,0.08);width:100%;max-width:420px}
.input{width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;margin-bottom:10px;box-sizing:border-box;font-size:1rem;font-family:inherit}
.input:disabled{background:#f0f0f0;color:#999}
.btn{background:#28a745;color:#fff;padding:10px;border:none;border-radius:8px;width:100%;font-weight:700;cursor:pointer;font-size:1rem}
.btn:disabled{background:#aaa;cursor:not-allowed}
.small{font-size:0.85rem;color:#666;margin-top:8px;line-height:1.5}
.notice{background:#fff3cd;border:1px solid #ffd700;border-radius:8px;padding:12px;margin-bottom:14px;font-size:0.85rem;color:#856404;line-height:1.5}
.btn-link{display:block;width:100%;background:#2b9edb;color:#fff;padding:12px;border-radius:8px;text-align:center;text-decoration:none;font-weight:700;font-size:0.95rem;margin-top:10px;box-sizing:border-box}
.btn-link:hover{background:#2589bd}
.back-link{display:block;margin-top:14px;font-size:0.85rem;color:#2b9edb;text-align:center;text-decoration:none}
.back-link:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <h2>🔒 帳戶密碼</h2>
  <div class="notice">
    <strong>本站已改用 Google 帳戶登入。</strong><br>
    你的密碼由 <strong>Google</strong> 管理，本網站不會存有任何密碼。
  </div>
  <p class="small" style="line-height:1.6">
    如要修改密碼、兩步驗證、登入裝置管理或帳戶刪除，請到 Google 帳戶設定處理。
  </p>
  <a class="btn-link" href="https://myaccount.google.com/security" target="_blank" rel="noopener">→ 前往 Google 帳戶安全設定</a>
  <a class="btn-link" href="https://myaccount.google.com/signinoptions/two-step-verification" target="_blank" rel="noopener">→ 設定 Google 兩步驗證</a>
  <a class="back-link" href="dashboard/index.html">← 返回 Dashboard</a>
  <a class="back-link" href="../index.html">← 返回首頁</a>
  <!-- V2 §8.10: 不再有密碼修改 form；舊 returnTo / 連結仍有效 -->
</div>
<script src="../js/auth-state.js"></script>
<script>
// V2: 此頁只是 Google 帳戶管理說明，不需 form submit
// 如未登入 → 提示去右上角登入
(function(){
  if (typeof AuthState === 'undefined') return;
  if (typeof AuthState.whenReady === 'function') {
    AuthState.whenReady().then(function(s){
      if (s.state !== 'student' && s.state !== 'teacher') {
        var notice = document.querySelector('.notice');
        if (notice) {
          notice.innerHTML += '<br><br>💡 <strong>未登入：</strong>請喺右上角按「登入」以使用 Google 帳戶。';
        }
      }
    });
  }
})();
</script>
</body>
</html>
