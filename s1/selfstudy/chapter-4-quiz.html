<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第四章測驗 — 代數運算 - AI Learning</title><script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans TC', sans-serif; background: linear-gradient(135deg, #1a3a4a 0%, #2e2060 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; padding-bottom: 20px; }
        .header { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 16px; padding: 20px 24px; margin-bottom: 20px; text-align: center; }
        .header h1 { color: #fff; font-size: 1.5rem; margin-bottom: 6px; }
        .header p { color: rgba(255,255,255,0.7); font-size: 0.9rem; }
        .back-link { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 16px; }
        .back-link:hover { color: #fff; }
        .progress-text { color: rgba(255,255,255,0.8); font-size: 0.85rem; text-align: center; margin-bottom: 8px; }
        .progress-bar { background: rgba(255,255,255,0.1); border-radius: 8px; height: 8px; margin-bottom: 20px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #f39c12, #e74c3c); border-radius: 8px; transition: width 0.3s; }
        .source-label { background: rgba(255,255,255,0.12); border-radius: 8px; padding: 4px 12px; font-size: 0.78rem; color: rgba(255,255,255,0.6); margin-bottom: 16px; text-align: center; }
        .question-card { background: #fff; border-radius: 16px; padding: 24px; margin-bottom: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
        .question-num { font-size: 0.85rem; color: #888; margin-bottom: 12px; }
        .question-text { font-size: 1.1rem; color: #333; line-height: 1.6; margin-bottom: 16px; }
        .answer-input { width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 1rem; font-family: inherit; transition: border-color 0.2s; }
        .answer-input:focus { outline: none; border-color: #2e2060; }
        .answer-input.correct { border-color: #4CAF50; background: #f0fff0; }
        .answer-input.wrong { border-color: #f44336; background: #fff0f0; }
        .btn-check { width: 100%; padding: 14px; background: linear-gradient(135deg, #1a3a4a, #2e2060); color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 12px; }
        .btn-check:hover { opacity: 0.9; }
        .btn-check:disabled { opacity: 0.5; cursor: not-allowed; }
        .feedback { padding: 14px; border-radius: 10px; margin-top: 14px; font-size: 0.95rem; display: none; }
        .feedback.show { display: block; }
        .feedback.correct { background: #e8f5e9; color: #2e7d32; border: 1px solid #4CAF50; }
        .feedback.wrong { background: #ffebee; color: #c62828; border: 1px solid #f44336; }
        .result-card { background: #fff; border-radius: 16px; padding: 32px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
        .result-score { font-size: 3.5rem; font-weight: 900; margin-bottom: 8px; }
        .result-score.pass { color: #4CAF50; }
        .result-score.fail { color: #f44336; }
        .result-label { color: #555; font-size: 1rem; margin-bottom: 8px; }
        .result-pass-msg { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; padding: 10px 20px; border-radius: 10px; }
        .result-pass-msg.pass { background: #e8f5e9; color: #2e7d32; }
        .result-pass-msg.fail { background: #ffebee; color: #c62828; }
        .result-actions { display: flex; gap: 12px; }
        .result-btn { flex: 1; padding: 14px; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; font-family: inherit; }
        .result-btn.retry { background: #2e2060; color: #fff; }
        .result-btn.home { background: #4CAF50; color: #fff; }
        .info-bar { background: rgba(255,255,255,0.08); border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; color: rgba(255,255,255,0.75); font-size: 0.85rem; line-height: 1.6; }
        #questionArea { }
    </style>
</head>
<body>
<div class="container">
    <a href="index.html" class="back-link">← 返回總目錄</a>
    <div class="header">
        <h1>📝 第四章測驗</h1>
        <p>代數運算 — 每練習抽 5 題，共 15 題</p>
    </div>
    <div class="info-bar">
        🎯 合格門檻：答對 ≥ 50%（即 7 題或以上）<br>
        📚 涵蓋：練習13 · 練習14 · 練習15
    </div>
    <div class="progress-text" id="progressText">題目 1 / 15</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="source-label" id="sourceLabel"></div>
    <div id="questionArea"></div>
</div>

<script>
// ===== 第四章測驗題目資料 =====
// 每個 practiceBank[i] 是一個練習的所有題目
const practiceBank = [
    /* 練習 13 — 指數乘法 */
    [
    { q: "$a \\times a^3$", a: "a^4" },
    { q: "$a^3 \\times a^4$", a: "a^7" },
    { q: "$(3a^5)(a^6)$", a: "3a^11" },
    { q: "$a \\times a^5$", a: "a^6" },
    { q: "$(5a^4)(a^5)$", a: "5a^9" },
    { q: "$(a^6)(7a)$", a: "7a^7" },
    { q: "$(4c^3)(5c)$", a: "20c^4" },
    { q: "$(7c^9)(9c^7)$", a: "63c^16" },
    { q: "$(6c^4)(-3c^3)$", a: "-18c^7" },
    { q: "$(11c^7)(3c^2)$", a: "33c^9" },
    { q: "$(4c^6)(8c^7)$", a: "32c^13" },
    { q: "$(13c)(-2c)$", a: "-26c^2" }
],
    /* 練習 14 — 指數除法 */
    [
    { q: "$b^6 \\div b$", a: "b^5" },
    { q: "$b^{12} \\div b^4$", a: "b^8" },
    { q: "$8b^9 \\div b^8$", a: "8b" },
    { q: "$b^7 \\div b^3$", a: "b^4" },
    { q: "$12b^{17} \\div b^5$", a: "12b^12" },
    { q: "$(-3b^{11}) \\div (-b^5)$", a: "3b^6" },
    { q: "$(8d^2) \\div (8d)$", a: "d" },
    { q: "$(15d^4) \\div (3d^2)$", a: "5d^2" },
    { q: "$(18d^4) \\div (-9d^2)$", a: "-2d^2" },
    { q: "$(2d^2) \\div (6d^4)$", a: "1/(3d^2)" },
    { q: "$(11d^{12}) \\div (22d^7)$", a: "d^5/2" },
    { q: "$(13d^6) \\div (-26d^9)$", a: "-1/(2d^3)" }
],
    /* 練習 15 — 指數綜合 */
    [
    { q: "$(a^2)(a^3)$", a: "a^5" },
    { q: "$(e)(-e^7)$", a: "-e^8" },
    { q: "$(-5g^2)(-3g^3)$", a: "15g^5" },
    { q: "$(3y^6)(7y^2)$", a: "21y^8" },
    { q: "$(2y^2)(2y^6)(7y^2)$", a: "28y^10" },
    { q: "$(12x^4)(-2x^2)$", a: "-24x^6" },
    { q: "$(5a^3)^2$", a: "25a^6" },
    { q: "$(3ab^2)^2$", a: "9a^2b^4" },
    { q: "$(2^2a^2b^3)^2$", a: "16a^4b^6" }
]
];

const practiceNums = [13, 14, 15];
const practiceTitles = ["指數乘法", "指數除法", "指數綜合"];
const TOTAL = 15;
const PASS_THRESHOLD = Math.ceil(TOTAL * 0.5);
const PER_PRACTICE = 5;
const QUIZ_PROGRESS_STORAGE_NAMESPACE = 'chapter-4-quiz';

let quizQuestions = []; // { q, a, practiceIdx }
let currentIndex = 0;
let correct = 0;

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

function buildQuiz() {
    quizQuestions = [];
    practiceBank.forEach((bank, idx) => {
        const pool = [...bank];
        shuffle(pool);
        pool.slice(0, PER_PRACTICE).forEach(q => {
            quizQuestions.push({ ...q, practiceIdx: idx });
        });
    });
    // Interleave: sort by practiceIdx to keep grouped, or shuffle all
    // Keep grouped by practice for clarity
    currentIndex = 0;
    correct = 0;
    renderQuestion();
}

function renderQuestion() {
    const q = quizQuestions[currentIndex];
    const pIdx = q.practiceIdx;
    document.getElementById('sourceLabel').textContent = `練習 ${practiceNums[pIdx]} — ${practiceTitles[pIdx]}`;
    document.getElementById('progressText').textContent = `題目 ${currentIndex + 1} / ${TOTAL}`;
    document.getElementById('progressFill').style.width = (currentIndex / TOTAL * 100) + '%';
    document.getElementById('questionArea').innerHTML = `
        <div class="question-card">
            <div class="question-num">第 ${currentIndex + 1} 題</div>
            <div class="question-text" id="questionText">${q.q}</div>
            <input type="text" class="answer-input" id="answerInput" placeholder="輸入答案">
            <button class="btn-check" id="btnCheck" onclick="checkAnswer()">確定</button>
            <div class="feedback" id="feedback"></div>
        </div>
    `;
    renderMath();
    const inp = document.getElementById('answerInput');
    inp.focus();
    inp.onkeydown = e => { if (e.key === 'Enter') checkAnswer(); };
}

function renderMath() {
    const el = document.getElementById('questionText');
    if (!el) return;
    let html = el.innerHTML;
    html = html.replace(/\$(.*?)\$/g, (m, tex) => {
        try { return katex.renderToString(tex, { throwOnError: false, displayMode: false }); } catch(e) { return m; }
    });
    el.innerHTML = html;
}

function normalizeAnswer(s) {
    if (typeof s !== 'string') return '';
    return s.trim().replace(/\s+/g, '').replace(/＜/g, '<').replace(/>/g, '>').replace('%', '');
}

function checkAnswer() {
    const input = document.getElementById('answerInput');
    const userAns = normalizeAnswer(input.value);
    const q = quizQuestions[currentIndex];

    let isCorrect = false;
    if (Array.isArray(q.a)) {
        isCorrect = q.a.some(ans => normalizeAnswer(ans) === userAns);
    } else {
        isCorrect = normalizeAnswer(q.a) === userAns;
    }

    if (isCorrect) {
        input.className = 'answer-input correct';
        document.getElementById('feedback').className = 'feedback correct show';
        document.getElementById('feedback').innerHTML = '✅ 正確！';
        correct++;
    } else {
        input.className = 'answer-input wrong';
        document.getElementById('feedback').className = 'feedback wrong show';
        const correctDisplay = Array.isArray(q.a) ? q.a[0] : q.a;
        document.getElementById('feedback').innerHTML = `❌ 正確答案：<strong>${correctDisplay}</strong>`;
    }
    input.disabled = true;
    document.getElementById('btnCheck').disabled = true;

    setTimeout(() => {
        currentIndex++;
        if (currentIndex >= TOTAL) showResult();
        else renderQuestion();
    }, 1200);
}

function showResult() {
    const pct = Math.round(correct / TOTAL * 100);
    const passed = correct >= PASS_THRESHOLD;

    // Save to localStorage
    const data = JSON.parse(localStorage.getItem('chapter_quiz_progress') || '{}');
    const prev = data[QUIZ_PROGRESS_STORAGE_NAMESPACE] || {};
    data[QUIZ_PROGRESS_STORAGE_NAMESPACE] = {
        completed: passed || (prev.completed || false),
        score: pct,
        bestScore: Math.max(pct, prev.bestScore || 0),
        date: new Date().toISOString().slice(0, 10)
    };
    localStorage.setItem('chapter_quiz_progress', JSON.stringify(data));

    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('progressText').textContent = '完成！';
    document.getElementById('sourceLabel').textContent = '';
    document.getElementById('questionArea').innerHTML = `
        <div class="result-card">
            <div class="result-score ${passed ? 'pass' : 'fail'}">${correct}/${TOTAL}</div>
            <div class="result-label">正確率 ${pct}%</div>
            <div class="result-pass-msg ${passed ? 'pass' : 'fail'}">${passed ? '🎉 合格！恭喜通過第四章測驗！' : '❌ 未合格。繼續練習後再嘗試！'}</div>
            <div class="result-actions">
                <button class="result-btn retry" onclick="buildQuiz()">🔄 重新測驗</button>
                <button class="result-btn home" onclick="location.href='index.html'">📚 返回目錄</button>
            </div>
        </div>
    `;
}

// ===== 鍵盤快捷鍵 =====
document.addEventListener('keydown', function(e) {
    const inp = document.getElementById('answerInput');
    if (e.target.tagName === 'INPUT') {
        if (e.key === 'Escape' && inp && !inp.disabled) { e.preventDefault(); inp.value = ''; }
        return;
    }
    if (e.key === 'Enter') {
        e.preventDefault();
        const btn = document.getElementById('btnCheck');
        if (btn && !btn.disabled) checkAnswer();
    } else if (e.key === 'Escape') {
        if (inp && !inp.disabled) { inp.value = ''; inp.focus(); }
    } else if ((e.key >= '0' && e.key <= '9') || e.key === '.' || e.key === '-' || e.key === '<' || e.key === ' ') {
        if (inp && !inp.disabled) { e.preventDefault(); inp.value += e.key; inp.focus(); }
    } else if (e.key === 'Backspace') {
        if (inp && !inp.disabled) { e.preventDefault(); inp.value = inp.value.slice(0, -1); inp.focus(); }
    }
});

// Start
buildQuiz();
</script>
</body>
</html>
