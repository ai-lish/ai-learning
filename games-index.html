<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 挑戰區 - 少康老師教學網站</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Page-specific: games-index.html */
        body { background: linear-gradient(135deg, #1a1a2e 0%, #0f0f23 100%); color: white; }
        .back-btn { background: rgba(255,255,255,0.1); color: white; }
        .back-btn:hover { background: rgba(255,255,255,0.2); }
        .game-card { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 25px; text-align: center; cursor: pointer; transition: all 0.3s; border: 2px solid transparent; }
        .game-card:hover { transform: translateY(-5px); border-color: #e74c3c; background: rgba(255,255,255,0.1); }
        .game-emoji { font-size: 3rem; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← 返回教學網站</a>
        
        <header>
            <h1>🏆 挑戰區</h1>
            <p>訓練計算機技巧，挑戰最快最準！</p>
        </header>
        
        <h2 class="section-title">🧮 計算機大賽</h2>
        
        <div class="games-grid">
            <div class="game-card" onclick="window.location.href='calculator-game.html'">
                <div class="game-emoji">🧮</div>
                <div class="game-title">計算機大賽</div>
                <div class="game-desc">訓練計算機技巧<br>快問快答挑戰</div>
                <div class="game-tag">中一至中六</div>
            </div>
            
            <div class="game-card" onclick="window.location.href='games/S1Ch13-1-PlaceValue.html'">
                <div class="game-emoji">🎯</div>
                <div class="game-title">位值大挑戰</div>
                <div class="game-desc">重溫位值概念<br>取個/十/百/千/萬位</div>
                <div class="game-tag">小學複習</div>
            </div>
        </div>
        
        <h2 class="section-title">📐 數學遊戲</h2>
        
        <div class="games-grid">
            <div class="game-card" onclick="window.location.href='games/S1Ch1-1-PrimeFactor.html'">
                <div class="game-emoji">🔢</div>
                <div class="game-title">質因數分解</div>
                <div class="game-desc">將數字分解成質因數</div>
                <div class="game-tag">中一</div>
            </div>
            
            <div class="game-card" onclick="window.location.href='games/S1Ch5-10-Area.html'">
                <div class="game-emoji">📐</div>
                <div class="game-title">面積計算</div>
                <div class="game-desc">各種圖形面積計算</div>
                <div class="game-tag">中一</div>
            </div>
            
            <div class="game-card" onclick="window.location.href='games/S1Ch2-1-DirectedNumber.html'">
                <div class="game-emoji">➕</div>
                <div class="game-title">正負數運算</div>
                <div class="game-desc">正負數加减乘除</div>
                <div class="game-tag">中一</div>
            </div>
            
            <div class="game-card" onclick="window.location.href='games/S1Ch6-1-AlgebraLanguage.html'">
                <div class="game-emoji">📝</div>
                <div class="game-title">代數語言</div>
                <div class="game-desc">代數表達式練習</div>
                <div class="game-tag">中一</div>
            </div>
        </div>
    </div>
</body>
</html>
