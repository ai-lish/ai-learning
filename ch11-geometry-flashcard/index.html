<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第十一章 幾何定理 閃卡 · 中一數學</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; background: #f1f5f9; }
    .kalam { font-family: 'Kalam', cursive; }

    /* ── 3D Flip ── */
    .flip-wrapper { perspective: 1200px; }
    .flip-inner {
      position: relative; width: 100%; height: 680px;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4,0,0.2,1);
    }
    .flip-inner.flipped { transform: rotateY(180deg); }
    .flip-front, .flip-back {
      position: absolute; inset: 0;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      overflow-y: auto; border-radius: 1rem; background: white;
      box-shadow: 0 2px 20px rgba(30,58,138,0.10);
    }
    .flip-back { transform: rotateY(180deg); }

    /* ── Canvas ── */
    .canvas-wrap {
      position: relative; width: 100%; aspect-ratio: 5/3;
      border-radius: 0.75rem; background: #f8fafc;
      border: 1px solid #e2e8f0; overflow: hidden;
    }
    .canvas-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .canvas-overlay { position: absolute; inset: 0; pointer-events: none; }

    /* ── Canvas Labels (variable overlays) ── */
    .clabel {
      position: absolute; pointer-events: all;
      transform: translate(-50%, -50%);
      font-family: 'Kalam', cursive; font-weight: 700; font-size: 1rem;
      color: #1e3a8a; background: rgba(255,255,255,0.93);
      border: 2px solid #1e3a8a; border-radius: 5px; padding: 1px 6px;
      cursor: grab; user-select: none; z-index: 10; white-space: nowrap;
      transition: opacity 0.2s; box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }
    .clabel:active { cursor: grabbing; }
    .clabel.used { opacity: 0.18; pointer-events: none; }

    /* ── Drag Chips ── */
    .chip {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0.3rem 0.9rem; background: #1e3a8a; color: white;
      border-radius: 9999px; cursor: grab; user-select: none;
      font-weight: 600; font-size: 0.875rem; white-space: nowrap;
      box-shadow: 0 2px 8px rgba(30,58,138,0.25);
      transition: transform 0.1s, opacity 0.2s, box-shadow 0.1s;
    }
    .chip:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(30,58,138,0.3); }
    .chip:active { cursor: grabbing; transform: scale(0.96); }
    .chip.used { opacity: 0.2; pointer-events: none; }

    /* ── Drop Slots ── */
    .dslot {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 3.5rem; height: 2.25rem; padding: 0 0.6rem;
      border: 2px dashed #94a3b8; border-radius: 0.5rem;
      background: #f8fafc; cursor: pointer;
      transition: all 0.15s; font-size: 0.9rem; font-weight: 600;
      vertical-align: middle; white-space: nowrap; color: #64748b;
    }
    .dslot.over { border-color: #3b82f6; background: #eff6ff; transform: scale(1.06); }
    .dslot.filled { border-style: solid; border-color: #22c55e; background: #f0fdf4; color: #15803d; }
    .dslot.filled:hover { background: #dcfce7; }

    /* ── Mode buttons ── */
    .mode-btn {
      padding: 0.45rem 1.5rem; border-radius: 9999px;
      font-weight: 600; font-size: 0.9rem; cursor: pointer;
      transition: all 0.2s; border: 2px solid transparent;
    }
    .mode-btn.active { background: #1e3a8a; color: white; }
    .mode-btn:not(.active) { background: white; color: #64748b; border-color: #e2e8f0; }
    .mode-btn:not(.active):hover { border-color: #1e3a8a; color: #1e3a8a; }

    /* ── Angle buttons ── */
    .abtn {
      padding: 0.15rem 0.6rem; border-radius: 9999px;
      border: 1.5px solid #1e3a8a; cursor: pointer;
      font-size: 0.75rem; font-weight: 600; color: #1e3a8a;
      background: white; transition: all 0.15s;
    }
    .abtn.active { background: #1e3a8a; color: white; }

    /* ── Progress dots ── */
    .pdot {
      width: 0.75rem; height: 0.75rem; border-radius: 50%;
      background: #cbd5e1; transition: all 0.3s;
    }
    .pdot.current { background: #1e3a8a; transform: scale(1.35); }
    .pdot.done { background: #22c55e; }

    /* ── Step checkbox ── */
    .schk {
      width: 1.4rem; height: 1.4rem; min-width: 1.4rem;
      border: 2px solid #94a3b8; border-radius: 0.3rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; transition: all 0.2s; background: white; flex-shrink: 0;
    }
    .schk.done { border-color: #22c55e; background: #22c55e; color: white; }

    /* ── Correct badge ── */
    .cbadge {
      display: none; padding: 0.2rem 0.8rem;
      background: #dcfce7; color: #166534;
      border: 1.5px solid #86efac; border-radius: 9999px;
      font-size: 0.82rem; font-weight: 700;
      align-items: center; gap: 0.25rem;
    }
    .cbadge.show { display: inline-flex; }

    /* ── Pulse for flip button ── */
    @keyframes pulse-glow {
      0%,100% { box-shadow: 0 0 0 0 rgba(245,158,11,0.6); }
      50%      { box-shadow: 0 0 0 10px rgba(245,158,11,0); }
    }
    .pulse-btn { animation: pulse-glow 1.5s ease-in-out infinite; }

    .step-text { display: none; }
    .step-text.show { display: inline; }

    /* formula line height */
    .fline { line-height: 3rem; }

    /* scrollbar */
    .flip-front::-webkit-scrollbar,
    .flip-back::-webkit-scrollbar { width: 4px; }
    .flip-front::-webkit-scrollbar-thumb,
    .flip-back::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">

<!-- HEADER -->
<header style="background:#1e3a8a;" class="text-white shadow-lg">
  <div class="max-w-2xl mx-auto px-4 py-4">

    <p class="text-blue-200 text-sm mt-0.5">中一數學 · 互動閃卡</p>

</header>

<!-- MODE SWITCHER -->
<div class="sticky top-0 z-20 bg-slate-100/95 backdrop-blur-sm shadow-sm py-3">

</div>

<footer class="text-center text-slate-400 text-xs py-6 mt-4">

    <a href="https://ai-lish.github.io/ai-learning/ch11-geometry-flashcard/"

<script>
/* ═══════════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════════ */
const VAR_POOL = 'abcdefghkmnpqrstxyz'.split('');

const ARC_FILL = [
  'rgba(245,158,11,0.30)', 'rgba(59,130,246,0.30)',
  'rgba(16,185,129,0.30)', 'rgba(239,68,68,0.30)',
  'rgba(139,92,246,0.30)',
];
const ARC_LINE = ['#d97706','#2563eb','#059669','#dc2626','#7c3aed'];

const THM = {
  1: {
    name:'直線上的鄰角', hasAngleSel:true, angleOpts:[2,3,4], defAngle:2,
    nVars:(n)=>n, frontConst:'180°', frontReason:'直線上的鄰角',
    trayItems:(vars,n)=>['180°','直線上的鄰角'],
    backItems:['x','180°','直線上的鄰角'],
    backSteps:['x + 65° = 180°（直線上的鄰角）','x = 180° − 65°','x = 115°'],
  },
  2: {
    name:'同頂角', hasAngleSel:true, angleOpts:[3,4,5], defAngle:3,
    nVars:(n)=>n, frontConst:'360°', frontReason:'同頂角',
    trayItems:(vars,n)=>['360°','同頂角'],
    backItems:['x','360°','同頂角'],
    backSteps:['x + 130° + 80° = 360°（同頂角）','x = 360° − 210°','x = 150°'],
  },
  3: {
    name:'對頂角', hasAngleSel:false, defAngle:null,
    nVars:()=>2, frontReason:'對頂角',
    trayItems:()=>['對頂角'],
    backItems:['x','47°','對頂角'],
    backSteps:['∵ 對頂角相等','∴ x = 47°（對頂角）','∴ x = 47°'],
  },
  4: {
    name:'同位角', hasAngleSel:false, defAngle:null,
    nVars:()=>2, frontReason:'同位角',
    trayItems:()=>['同位角','AB','CD'],
    backItems:['x','63°','同位角','AB','CD'],
    backSteps:['∵ AB//CD（已知）','∴ x = 63°（同位角，AB//CD）','∴ x = 63°'],
  },
  5: {
    name:'錯角', hasAngleSel:false, defAngle:null,
    nVars:()=>2, frontReason:'錯角',
    trayItems:()=>['錯角','AB','CD'],
    backItems:['x','52°','錯角','AB','CD'],
    backSteps:['∵ AB//CD（已知）','∴ x = 52°（錯角，AB//CD）','∴ x = 52°'],
  },
  6: {
    name:'同旁內角', hasAngleSel:false, defAngle:null,
    nVars:()=>2, frontConst:'180°', frontReason:'同旁內角',
    trayItems:()=>['180°','同旁內角','AB','CD'],
    backItems:['x','180°','同旁內角','AB','CD'],
    backSteps:['∵ AB//CD（已知）','x + 110° = 180°（同旁內角，AB//CD）','x = 70°'],
  },
  7: {
    name:'三角形內角和', hasAngleSel:false, defAngle:null,
    nVars:()=>3, frontConst:'180°', frontReason:'內角和',
    trayItems:()=>['180°','內角和'],
    backItems:['x','180°','內角和'],
    backSteps:['x + 50° + 70° = 180°（△內角和）','x = 180° − 120°','x = 60°'],
  },
};

/* ═══════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════ */
let STATES = {};          // keyed by cardId (string)
let dragSt = { cardId:null, value:null, srcEl:null };
let currentMode = 'presentation';
let randQueue = [], randIdx = 0;

function pickVars(n) {
  const p = [...VAR_POOL];
  for (let i = p.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [p[i],p[j]] = [p[j],p[i]];
  }
  return p.slice(0,n);
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function initState(id) {
  const t = THM[id];
  const ac = t.defAngle;
  const nv = t.nVars(ac);
  STATES[id] = {
    isFlipped: false,
    angleCount: ac,
    vars: pickVars(nv),
    frontDone: false,
    backDone: false,
    stepsRevealed: [false,false,false],
  };
  return STATES[id];
}

/* ═══════════════════════════════════════════════
   CANVAS HELPERS  (logical 500×300)
═══════════════════════════════════════════════ */
const CW=500, CH=300;

function setupCtx(canvas) {
  const dpr = window.devicePixelRatio||1;
  canvas.width  = CW*dpr;
  canvas.height = CH*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,CW,CH);
  return ctx;
}

function dl(ctx,x1,y1,x2,y2,col='#64748b',w=2.5){
  ctx.save();ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
  ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.stroke();ctx.restore();
}

function arrowHead(ctx,x1,y1,x2,y2,col='#64748b'){
  const a=Math.atan2(y2-y1,x2-x1),L=11,S=Math.PI/6;
  ctx.save();ctx.beginPath();
  ctx.moveTo(x2,y2);ctx.lineTo(x2-L*Math.cos(a-S),y2-L*Math.sin(a-S));
  ctx.moveTo(x2,y2);ctx.lineTo(x2-L*Math.cos(a+S),y2-L*Math.sin(a+S));
  ctx.strokeStyle=col;ctx.lineWidth=2;ctx.lineCap='round';ctx.stroke();ctx.restore();
}

/* Filled arc sector (pie slice) */
function pie(ctx,cx,cy,r,a1,a2,fill,ccw=false){
  ctx.save();ctx.beginPath();ctx.moveTo(cx,cy);
  ctx.arc(cx,cy,r,a1,a2,ccw);ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();ctx.restore();
}

/* Arc stroke only */
function arcStroke(ctx,cx,cy,r,a1,a2,col,w=1.8,ccw=false){
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,a1,a2,ccw);
  ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke();ctx.restore();
}

function ctxTxt(ctx,t,x,y,{col='#334155',sz=13,bold=false,align='center',base='middle'}={}){
  ctx.save();
  ctx.font=`${bold?'bold ':''}${sz}px "Noto Sans TC",sans-serif`;
  ctx.fillStyle=col;ctx.textAlign=align;ctx.textBaseline=base;
  ctx.fillText(t,x,y);ctx.restore();
}

function doubleTick(ctx,cx,cy){
  for(const d of [-4,4]){
    ctx.save();ctx.beginPath();
    ctx.moveTo(cx+d-5,cy-7);ctx.lineTo(cx+d+5,cy+7);
    ctx.strokeStyle='#64748b';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
  }
}

/* Draw two parallel horizontal lines + transversal.
   Returns { y1,y2,ix1,iy1,ix2,iy2,alpha } */
function drawParTrans(ctx){
  const y1=96,y2=204,lx=35,rx=465;
  const ix1=200,ix2=300;
  const alpha=Math.atan2(y2-y1,ix2-ix1); // ≈0.826 rad
  const dx=Math.cos(alpha),dy=Math.sin(alpha),ext=45;

  // parallel lines
  dl(ctx,lx,y1,rx,y1);arrowHead(ctx,lx,y1,rx,y1);
  dl(ctx,lx,y2,rx,y2);arrowHead(ctx,lx,y2,rx,y2);
  doubleTick(ctx,390,y1);doubleTick(ctx,390,y2);

  // transversal
  dl(ctx,ix1-dx*ext,y1-dy*ext,ix2+dx*ext,y2+dy*ext);

  // line-end labels
  ctxTxt(ctx,'A',lx-10,y1,{sz:13,bold:true,align:'right'});
  ctxTxt(ctx,'B',rx+10,y1,{sz:13,bold:true,align:'left'});
  ctxTxt(ctx,'C',lx-10,y2,{sz:13,bold:true,align:'right'});
  ctxTxt(ctx,'D',rx+10,y2,{sz:13,bold:true,align:'left'});

  return {y1,y2,ix1,iy1:y1,ix2,iy2:y2,alpha};
}

/* ═══════════════════════════════════════════════
   FRONT CANVAS DRAWING
   Returns [{value,xPct,yPct}] for canvas label overlay
═══════════════════════════════════════════════ */
function drawFront(id,canvas,vars,angleCount){
  const ctx=setupCtx(canvas);
  const cx=250,cy=150;
  switch(id){
    case 1: return drawF1(ctx,cx,cy,vars,angleCount);
    case 2: return drawF2(ctx,cx,cy,vars,angleCount);
    case 3: return drawF3(ctx,cx,cy,vars);
    case 4: return drawF4(ctx,vars);
    case 5: return drawF5(ctx,vars);
    case 6: return drawF6(ctx,vars);
    case 7: return drawF7(ctx,vars);
  }
  return [];
}

/* Theorem 1 – adjacent angles on a straight line */
function drawF1(ctx,cx,cy,vars,N){
  const r=42, rl=72;
  // Horizontal line
  dl(ctx,30,cy,470,cy);
  arrowHead(ctx,30,cy,470,cy);arrowHead(ctx,470,cy,30,cy);

  // N-1 upward rays (canvas: going upward = negative y)
  for(let k=1;k<N;k++){
    const a=k*Math.PI/N; // math angle from right
    const ex=cx+140*Math.cos(a), ey=cy-140*Math.sin(a);
    dl(ctx,cx,cy,ex,ey);
  }
  // N arc sectors (CCW through upper half)
  for(let k=0;k<N;k++){
    const a1=-k*Math.PI/N, a2=-(k+1)*Math.PI/N;
    pie(ctx,cx,cy,r,a1,a2,ARC_FILL[k%ARC_FILL.length],true);
    arcStroke(ctx,cx,cy,r,a1,a2,ARC_LINE[k%ARC_LINE.length],1.8,true);
  }
  // Label positions
  return vars.slice(0,N).map((v,k)=>{
    const mid=(k+0.5)*Math.PI/N;
    return { value:v, xPct:(cx+rl*Math.cos(mid))/CW, yPct:(cy-rl*Math.sin(mid))/CH };
  });
}

/* Theorem 2 – angles at a point */
function drawF2(ctx,cx,cy,vars,N){
  const r=42, rl=80;
  for(let k=0;k<N;k++){
    const a=k*2*Math.PI/N; // math angle (canvas x=cos,y=-sin)
    dl(ctx,cx,cy,cx+140*Math.cos(a),cy-140*Math.sin(a));
  }
  for(let k=0;k<N;k++){
    const a1=-k*2*Math.PI/N, a2=-(k+1)*2*Math.PI/N;
    pie(ctx,cx,cy,r,a1,a2,ARC_FILL[k%ARC_FILL.length],true);
    arcStroke(ctx,cx,cy,r,a1,a2,ARC_LINE[k%ARC_LINE.length],1.8,true);
  }
  return vars.slice(0,N).map((v,k)=>{
    const mid=(k+0.5)*2*Math.PI/N;
    return { value:v, xPct:(cx+rl*Math.cos(mid))/CW, yPct:(cy-rl*Math.sin(mid))/CH };
  });
}

/* Theorem 3 – vertically opposite */
function drawF3(ctx,cx,cy,vars){
  const oblRad=35*Math.PI/180; // oblique angle from horizontal (math)
  const r=40, rl=65;

  // Horizontal line
  dl(ctx,30,cy,470,cy);arrowHead(ctx,30,cy,470,cy);arrowHead(ctx,470,cy,30,cy);
  // Oblique line
  dl(ctx,cx-140*Math.cos(oblRad),cy+140*Math.sin(oblRad),
       cx+140*Math.cos(oblRad),cy-140*Math.sin(oblRad));

  // alpha_canvas = oblRad (oblique goes to lower-right at oblRad in canvas)
  const a=oblRad;
  // 4 sectors (CW): LR(0→a), LL(a→π), UL(π→π+a), UR(π+a→2π)
  // vars[0] = LR pair (LR + UL, same color), vars[1] = LL pair (LL + UR)
  pie(ctx,cx,cy,r,0,a,ARC_FILL[0]);           // LR – vars[0]
  arcStroke(ctx,cx,cy,r,0,a,ARC_LINE[0]);
  pie(ctx,cx,cy,r,Math.PI,Math.PI+a,ARC_FILL[0]); // UL – vars[0]
  arcStroke(ctx,cx,cy,r,Math.PI,Math.PI+a,ARC_LINE[0]);
  pie(ctx,cx,cy,r,a,Math.PI,ARC_FILL[1]);     // LL – vars[1]
  arcStroke(ctx,cx,cy,r,a,Math.PI,ARC_LINE[1]);
  pie(ctx,cx,cy,r,Math.PI+a,2*Math.PI,ARC_FILL[1]); // UR – vars[1]
  arcStroke(ctx,cx,cy,r,Math.PI+a,2*Math.PI,ARC_LINE[1]);

  // vars[0] at LR midpoint, vars[1] at UL midpoint (vertically opposite to LR)
  const midLR=a/2, midUL=Math.PI+a/2;
  return [
    {value:vars[0],xPct:(cx+rl*Math.cos(midLR))/CW, yPct:(cy+rl*Math.sin(midLR))/CH},
    {value:vars[1],xPct:(cx+rl*Math.cos(midUL))/CW, yPct:(cy+rl*Math.sin(midUL))/CH},
  ];
}

/* Theorem 4 – corresponding (F-shape) */
function drawF4(ctx,vars){
  const {y1,y2,ix1,iy1,ix2,iy2,alpha}=drawParTrans(ctx);
  const r=38, rl=58;
  // UL at both intersections (above line, left of transversal) – acute angle
  const aUL1=Math.PI, aUL2=Math.PI+alpha;
  pie(ctx,ix1,iy1,r,aUL1,aUL2,ARC_FILL[0]);arcStroke(ctx,ix1,iy1,r,aUL1,aUL2,ARC_LINE[0]);
  pie(ctx,ix2,iy2,r,aUL1,aUL2,ARC_FILL[0]);arcStroke(ctx,ix2,iy2,r,aUL1,aUL2,ARC_LINE[0]);
  const midUL=Math.PI+alpha/2;
  return [
    {value:vars[0],xPct:(ix1+rl*Math.cos(midUL))/CW,yPct:(iy1+rl*Math.sin(midUL))/CH},
    {value:vars[1],xPct:(ix2+rl*Math.cos(midUL))/CW,yPct:(iy2+rl*Math.sin(midUL))/CH},
  ];
}

/* Theorem 5 – alternate (Z-shape) */
function drawF5(ctx,vars){
  const {y1,y2,ix1,iy1,ix2,iy2,alpha}=drawParTrans(ctx);
  const r=38, rl=58;
  // LR at top (interior, right), UL at bottom (interior, left) → Z-shape
  pie(ctx,ix1,iy1,r,0,alpha,ARC_FILL[2]);arcStroke(ctx,ix1,iy1,r,0,alpha,ARC_LINE[2]);
  pie(ctx,ix2,iy2,r,Math.PI,Math.PI+alpha,ARC_FILL[2]);arcStroke(ctx,ix2,iy2,r,Math.PI,Math.PI+alpha,ARC_LINE[2]);
  const midLR=alpha/2, midUL=Math.PI+alpha/2;
  return [
    {value:vars[0],xPct:(ix1+rl*Math.cos(midLR))/CW,yPct:(iy1+rl*Math.sin(midLR))/CH},
    {value:vars[1],xPct:(ix2+rl*Math.cos(midUL))/CW,yPct:(iy2+rl*Math.sin(midUL))/CH},
  ];
}

/* Theorem 6 – co-interior (U-shape) */
function drawF6(ctx,vars){
  const {y1,y2,ix1,iy1,ix2,iy2,alpha}=drawParTrans(ctx);
  const r=38, rl=58;
  // LL at top (interior, left, obtuse), UL at bottom (interior, left, acute)
  const aLL1=alpha, aLL2=Math.PI;
  const aUL1=Math.PI, aUL2=Math.PI+alpha;
  pie(ctx,ix1,iy1,r,aLL1,aLL2,ARC_FILL[3]);arcStroke(ctx,ix1,iy1,r,aLL1,aLL2,ARC_LINE[3]);
  pie(ctx,ix2,iy2,r,aUL1,aUL2,ARC_FILL[1]);arcStroke(ctx,ix2,iy2,r,aUL1,aUL2,ARC_LINE[1]);
  const midLL=alpha+(Math.PI-alpha)/2;
  const midUL2=Math.PI+alpha/2;
  return [
    {value:vars[0],xPct:(ix1+rl*Math.cos(midLL))/CW,yPct:(iy1+rl*Math.sin(midLL))/CH},
    {value:vars[1],xPct:(ix2+rl*Math.cos(midUL2))/CW,yPct:(iy2+rl*Math.sin(midUL2))/CH},
  ];
}

/* Theorem 7 – triangle */
function drawF7(ctx,vars){
  const vx=[100,400,250], vy=[248,248,55];
  ctx.save();ctx.beginPath();
  ctx.moveTo(vx[0],vy[0]);ctx.lineTo(vx[1],vy[1]);
  ctx.lineTo(vx[2],vy[2]);ctx.closePath();
  ctx.strokeStyle='#64748b';ctx.lineWidth=2.5;ctx.stroke();ctx.restore();
  const gcx=(vx[0]+vx[1]+vx[2])/3, gcy=(vy[0]+vy[1]+vy[2])/3;
  const r=36, rl=55;
  const positions=[];
  for(let k=0;k<3;k++){
    const dx=gcx-vx[k],dy=gcy-vy[k],dist=Math.sqrt(dx*dx+dy*dy);
    const nx=dx/dist,ny=dy/dist;
    // arc between two edges: find angles of the two edges from vertex
    const prevK=(k+2)%3, nextK=(k+1)%3;
    const a1=Math.atan2(vy[prevK]-vy[k],vx[prevK]-vx[k]);
    const a2=Math.atan2(vy[nextK]-vy[k],vx[nextK]-vx[k]);
    // ensure arc goes through inward direction (CW)
    let s=a1,e=a2;
    pie(ctx,vx[k],vy[k],r,s,e,ARC_FILL[k%ARC_FILL.length]);
    arcStroke(ctx,vx[k],vy[k],r,s,e,ARC_LINE[k%ARC_LINE.length]);
    positions.push({value:vars[k],xPct:(vx[k]+nx*rl)/CW,yPct:(vy[k]+ny*rl)/CH});
  }
  return positions;
}

/* ═══════════════════════════════════════════════
   BACK CANVAS DRAWING  (specific examples)
═══════════════════════════════════════════════ */
function drawBack(id,canvas){
  const ctx=setupCtx(canvas);
  const cx=250,cy=150;
  switch(id){
    case 1: drawB1(ctx,cx,cy); break;
    case 2: drawB2(ctx,cx,cy); break;
    case 3: drawB3(ctx,cx,cy); break;
    case 4: drawB4(ctx);       break;
    case 5: drawB5(ctx);       break;
    case 6: drawB6(ctx);       break;
    case 7: drawB7(ctx);       break;
  }
}

function drawB1(ctx,cx,cy){
  // Straight line, one ray at 65° from right going up, angles: 65° and x
  const rayA=65*Math.PI/180;
  const rx=cx+130*Math.cos(rayA), ry=cy-130*Math.sin(rayA);
  dl(ctx,30,cy,470,cy);arrowHead(ctx,30,cy,470,cy);arrowHead(ctx,470,cy,30,cy);
  dl(ctx,cx,cy,rx,ry);
  // arcs (CCW)
  pie(ctx,cx,cy,44,0,-rayA,ARC_FILL[0],true);
  arcStroke(ctx,cx,cy,44,0,-rayA,ARC_LINE[0],1.8,true);
  pie(ctx,cx,cy,44,-rayA,-Math.PI,ARC_FILL[1],true);
  arcStroke(ctx,cx,cy,44,-rayA,-Math.PI,ARC_LINE[1],1.8,true);
  // labels
  const r=70;
  const m65=rayA/2;
  const mX=rayA+(Math.PI-rayA)/2;
  ctxTxt(ctx,'65°',cx+r*Math.cos(m65),cy-r*Math.sin(m65),{sz:13,bold:true,col:'#1e3a8a'});
  ctxTxt(ctx,'x',cx+r*Math.cos(mX),cy-r*Math.sin(mX),{sz:15,bold:true,col:'#dc2626'});
}

function drawB2(ctx,cx,cy){
  // 3 rays from center, angles 130°, 80°, x=150°
  // Ray start angles (math): 90°, 90°+130°=220°, 220°+80°=300°
  const rays=[90,220,300].map(d=>d*Math.PI/180);
  const labels=['130°','80°','x'];
  const labCols=['#1e3a8a','#1e3a8a','#dc2626'];
  for(const a of rays) dl(ctx,cx,cy,cx+140*Math.cos(a),cy-140*Math.sin(a));
  const r=40,rl=72;
  for(let k=0;k<3;k++){
    const a1=-rays[k], a2=-rays[(k+1)%3];
    pie(ctx,cx,cy,r,a1,a2,ARC_FILL[k],true);
    arcStroke(ctx,cx,cy,r,a1,a2,ARC_LINE[k],1.8,true);
    const rA=rays[k], rB=rays[(k+1)%3];
    // When the next ray has a smaller angle than the current one, the arc wraps
    // past 0°/360°; add 2π so the midpoint label falls inside the correct sector.
    const mid = rA < rB ? (rA + rB) / 2 : (rA + rB + 2 * Math.PI) / 2;
    ctxTxt(ctx,labels[k],cx+rl*Math.cos(mid),cy-rl*Math.sin(mid),{sz:13,bold:true,col:labCols[k]});
  }
}

function drawB3(ctx,cx,cy){
  // Two crossing lines, 47° and x opposite
  const oblRad=47*Math.PI/180;
  dl(ctx,30,cy,470,cy);arrowHead(ctx,30,cy,470,cy);arrowHead(ctx,470,cy,30,cy);
  dl(ctx,cx-140*Math.cos(oblRad),cy+140*Math.sin(oblRad),
       cx+140*Math.cos(oblRad),cy-140*Math.sin(oblRad));
  const a=oblRad,r=42,rl=68;
  pie(ctx,cx,cy,r,0,a,ARC_FILL[0]);arcStroke(ctx,cx,cy,r,0,a,ARC_LINE[0]);
  pie(ctx,cx,cy,r,Math.PI,Math.PI+a,ARC_FILL[0]);arcStroke(ctx,cx,cy,r,Math.PI,Math.PI+a,ARC_LINE[0]);
  ctxTxt(ctx,'47°',cx+rl*Math.cos(a/2),cy+rl*Math.sin(a/2),{sz:13,bold:true,col:'#1e3a8a'});
  ctxTxt(ctx,'x',cx+rl*Math.cos(Math.PI+a/2),cy+rl*Math.sin(Math.PI+a/2),{sz:15,bold:true,col:'#dc2626'});
}

function drawBParallel(ctx,angle63or52or110,xLabel,isCorr,isAlt){
  const {y1,y2,ix1,iy1,ix2,iy2,alpha}=drawParTrans(ctx);
  const r=38,rl=62;
  if(isCorr){
    // F-shape: UL at both
    const a1=Math.PI,a2=Math.PI+alpha,mid=Math.PI+alpha/2;
    pie(ctx,ix1,iy1,r,a1,a2,ARC_FILL[0]);arcStroke(ctx,ix1,iy1,r,a1,a2,ARC_LINE[0]);
    pie(ctx,ix2,iy2,r,a1,a2,ARC_FILL[0]);arcStroke(ctx,ix2,iy2,r,a1,a2,ARC_LINE[0]);
    ctxTxt(ctx,angle63or52or110+'°',ix1+rl*Math.cos(mid),iy1+rl*Math.sin(mid),{sz:13,bold:true,col:'#1e3a8a'});
    ctxTxt(ctx,xLabel,ix2+rl*Math.cos(mid),iy2+rl*Math.sin(mid),{sz:15,bold:true,col:'#dc2626'});
  } else if(isAlt){
    // Z-shape: LR top, UL bottom
    const midLR=alpha/2,midUL2=Math.PI+alpha/2;
    pie(ctx,ix1,iy1,r,0,alpha,ARC_FILL[2]);arcStroke(ctx,ix1,iy1,r,0,alpha,ARC_LINE[2]);
    pie(ctx,ix2,iy2,r,Math.PI,Math.PI+alpha,ARC_FILL[2]);arcStroke(ctx,ix2,iy2,r,Math.PI,Math.PI+alpha,ARC_LINE[2]);
    ctxTxt(ctx,angle63or52or110+'°',ix1+rl*Math.cos(midLR),iy1+rl*Math.sin(midLR),{sz:13,bold:true,col:'#1e3a8a'});
    ctxTxt(ctx,xLabel,ix2+rl*Math.cos(midUL2),iy2+rl*Math.sin(midUL2),{sz:15,bold:true,col:'#dc2626'});
  } else {
    // co-interior: LL top, UL bottom
    const midLL=alpha+(Math.PI-alpha)/2,midUL2=Math.PI+alpha/2;
    pie(ctx,ix1,iy1,r,alpha,Math.PI,ARC_FILL[3]);arcStroke(ctx,ix1,iy1,r,alpha,Math.PI,ARC_LINE[3]);
    pie(ctx,ix2,iy2,r,Math.PI,Math.PI+alpha,ARC_FILL[1]);arcStroke(ctx,ix2,iy2,r,Math.PI,Math.PI+alpha,ARC_LINE[1]);
    ctxTxt(ctx,angle63or52or110+'°',ix1+rl*Math.cos(midLL),iy1+rl*Math.sin(midLL),{sz:13,bold:true,col:'#1e3a8a'});
    ctxTxt(ctx,xLabel,ix2+rl*Math.cos(midUL2),iy2+rl*Math.sin(midUL2),{sz:15,bold:true,col:'#dc2626'});
  }
}

function drawB4(ctx){ drawBParallel(ctx,63,'x',true,false); }
function drawB5(ctx){ drawBParallel(ctx,52,'x',false,true); }
function drawB6(ctx){ drawBParallel(ctx,110,'x',false,false); }

function drawB7(ctx){
  // Triangle with angles 50° at A(150,250), 70° at B(350,250), x=60° at C(290,84)
  const vx=[150,350,290],vy=[250,250,84];
  ctx.save();ctx.beginPath();
  ctx.moveTo(vx[0],vy[0]);ctx.lineTo(vx[1],vy[1]);ctx.lineTo(vx[2],vy[2]);ctx.closePath();
  ctx.strokeStyle='#64748b';ctx.lineWidth=2.5;ctx.stroke();ctx.restore();
  const gcx=(vx[0]+vx[1]+vx[2])/3,gcy=(vy[0]+vy[1]+vy[2])/3;
  const r=36,rl=58;
  const labels=['50°','70°','x'],cols=['#1e3a8a','#1e3a8a','#dc2626'];
  for(let k=0;k<3;k++){
    const pK=(k+2)%3,nK=(k+1)%3;
    const a1=Math.atan2(vy[pK]-vy[k],vx[pK]-vx[k]);
    const a2=Math.atan2(vy[nK]-vy[k],vx[nK]-vx[k]);
    pie(ctx,vx[k],vy[k],r,a1,a2,ARC_FILL[k]);
    arcStroke(ctx,vx[k],vy[k],r,a1,a2,ARC_LINE[k]);
    const dx=gcx-vx[k],dy=gcy-vy[k],dist=Math.sqrt(dx*dx+dy*dy);
    ctxTxt(ctx,labels[k],vx[k]+(dx/dist)*rl,vy[k]+(dy/dist)*rl,{sz:13,bold:true,col:cols[k]});
  }
}

/* ═══════════════════════════════════════════════
   FORMULA HTML BUILDERS
═══════════════════════════════════════════════ */
function slot(id,slotKey,cardId){
  return `<span class="dslot" data-slot="${slotKey}" data-cid="${cardId}" onclick="slotClick(this)"></span>`;
}
function fx(t){ return `<span class="text-slate-600 font-semibold">${t}</span>`; }

function frontFormulaHTML(id,cardId,vars,ac){
  const N=vars.length;
  let formula='', reason='';
  switch(id){
    case 1:
    case 2:{
      // v0 + v1 + ... = const （reason）
      const parts=vars.map((_,k)=>`${k>0?fx(' + '):''}${slot(id,'fv'+k,cardId)}`).join('');
      formula=`${parts}${fx(' = ')}${slot(id,'fc',cardId)}`;
      reason=`${fx('（')}${slot(id,'fr',cardId)}${fx('）')}`;
      break;
    }
    case 3:{
      formula=`${slot(id,'fv0',cardId)}${fx(' = ')}${slot(id,'fv1',cardId)}`;
      reason=`${fx('（')}${slot(id,'fr',cardId)}${fx('）')}`;
      break;
    }
    case 4:
    case 5:{
      formula=`${slot(id,'fv0',cardId)}${fx(' = ')}${slot(id,'fv1',cardId)}`;
      reason=`${fx('（')}${slot(id,'fr',cardId)}${fx('，')}${slot(id,'fl0',cardId)}${fx(' // ')}${slot(id,'fl1',cardId)}${fx('）')}`;
      break;
    }
    case 6:{
      formula=`${slot(id,'fv0',cardId)}${fx(' + ')}${slot(id,'fv1',cardId)}${fx(' = ')}${slot(id,'fc',cardId)}`;
      reason=`${fx('（')}${slot(id,'fr',cardId)}${fx('，')}${slot(id,'fl0',cardId)}${fx(' // ')}${slot(id,'fl1',cardId)}${fx('）')}`;
      break;
    }
    case 7:{
      formula=`${slot(id,'fv0',cardId)}${fx(' + ')}${slot(id,'fv1',cardId)}${fx(' + ')}${slot(id,'fv2',cardId)}${fx(' = ')}${slot(id,'fc',cardId)}`;
      reason=`${fx('（△')}${slot(id,'fr',cardId)}${fx('）')}`;
      break;
    }
  }
  return `<div class="fline flex flex-wrap items-center gap-1">${formula}</div>
          <div class="fline flex flex-wrap items-center gap-1 mt-1">${reason}</div>`;
}

function backFormulaHTML(id,cardId){
  const s=(k)=>slot(id,'b'+k,cardId);
  switch(id){
    case 1: return `
      <div class="fline flex flex-wrap items-center gap-1">${s('v')}${fx(' + 65° = ')}${s('c')}</div>
      <div class="fline flex flex-wrap items-center gap-1 mt-1">${fx('（')}${s('r')}${fx('）')}</div>`;
    case 2: return `
      <div class="fline flex flex-wrap items-center gap-1">${s('v')}${fx(' + 130° + 80° = ')}${s('c')}</div>
      <div class="fline flex flex-wrap items-center gap-1 mt-1">${fx('（')}${s('r')}${fx('）')}</div>`;
    case 3: return `
      <div class="fline flex flex-wrap items-center gap-1">${s('v')}${fx(' = ')}${s('c')}</div>
      <div class="fline flex flex-wrap items-center gap-1 mt-1">${fx('（')}${s('r')}${fx('）')}</div>`;
    case 4: return `
      <div class="fline flex flex-wrap items-center gap-1">${s('v')}${fx(' = ')}${s('c')}</div>
      <div class="fline flex flex-wrap items-center gap-1 mt-1">${fx('（')}${s('r')}${fx('，')}${s('l0')}${fx(' // ')}${s('l1')}${fx('）')}</div>`;
    case 5: return `
      <div class="fline flex flex-wrap items-center gap-1">${s('v')}${fx(' = ')}${s('c')}</div>
      <div class="fline flex flex-wrap items-center gap-1 mt-1">${fx('（')}${s('r')}${fx('，')}${s('l0')}${fx(' // ')}${s('l1')}${fx('）')}</div>`;
    case 6: return `
      <div class="fline flex flex-wrap items-center gap-1">${s('v')}${fx(' + 110° = ')}${s('c')}</div>
      <div class="fline flex flex-wrap items-center gap-1 mt-1">${fx('（')}${s('r')}${fx('，')}${s('l0')}${fx(' // ')}${s('l1')}${fx('）')}</div>`;
    case 7: return `
      <div class="fline flex flex-wrap items-center gap-1">${s('v')}${fx(' + 50° + 70° = ')}${s('c')}</div>
      <div class="fline flex flex-wrap items-center gap-1 mt-1">${fx('（△')}${s('r')}${fx('）')}</div>`;
  }
}

function buildCardHTML(id){
  const t=THM[id];
  const state=STATES[id];
  const {vars,angleCount:ac}=state;

  // Angle selector buttons (theorems 1 & 2 only)

  // Chip tray for front (constants + reason + AB/CD)

      <div class="flex items-center gap-2 mb-3">
        <div class="flex items-center justify-center w-8 h-8 rounded-full text-white text-sm font-bold flex-shrink-0"

        <canvas id="fc-${id}"></canvas>
        <div class="canvas-overlay" id="fov-${id}"></div>
      </div>
      <!-- Chip tray (constants + reason) -->
      <div class="flex flex-wrap gap-2 mb-3 p-2 bg-slate-50 rounded-lg border border-slate-200 min-h-10">
        <div class="flex flex-wrap gap-2" id="ftray-${id}">${trayChips}</div>
      </div>
      <!-- Formula slots -->
      <div class="px-1 mb-3" id="fformula-${id}">
        ${frontFormulaHTML(id,cid,vars,ac)}
      </div>
      <!-- Status row -->
      <div class="flex items-center gap-3 mt-auto pt-2">
        <span class="cbadge" id="fbadge-${id}">✓ 正確！</span>
        <button id="fflip-${id}"
          class="ml-auto px-5 py-2 rounded-full font-bold text-white text-sm hidden"
          style="background:#f59e0b;"
          onclick="flipCard(${id})">翻轉查看例題 →</button>

    </div>
  </div>`;

  // Back face
  const back=`
  <div class="flip-back" data-cid="${cid}">
    <div class="p-4 h-full flex flex-col">
      <!-- Header -->
      <div class="flex items-center gap-2 mb-3">
        <div class="flex items-center justify-center px-3 h-8 rounded-full text-white text-sm font-bold flex-shrink-0"
             style="background:#f59e0b; color:#1e3a8a;">例題</div>
        <span class="font-bold text-slate-800 text-base">${t.name}</span>
      </div>
      <!-- Canvas -->
      <div class="canvas-wrap mb-3">
        <canvas id="bc-${id}"></canvas>
      </div>
      <!-- Chip tray -->
      <div class="flex flex-wrap gap-2 mb-3 p-2 bg-slate-50 rounded-lg border border-slate-200 min-h-10">
        <div class="flex flex-wrap gap-2" id="btray-${id}">${backChips}</div>

  return `<div class="flip-wrapper" id="card-${id}">

/* ═══════════════════════════════════════════════
   CANVAS LABEL OVERLAY
═══════════════════════════════════════════════ */
function buildCanvasOverlay(id){
  const st=STATES[id];
  const labels=drawFront(id,
    document.getElementById('fc-'+id),
    st.vars, st.angleCount);

  const ov=document.getElementById('fov-'+id);
  ov.innerHTML='';
  labels.forEach(({value,xPct,yPct})=>{
    const div=document.createElement('div');
    div.className='clabel';
    div.textContent=value;
    div.dataset.value=value;
    div.dataset.cid=String(id);
    div.style.left=(xPct*100)+'%';
    div.style.top=(yPct*100)+'%';
    div.draggable=true;
    ov.appendChild(div);
  });
  setupCanvasLabelDrag(id);
}

function setupCanvasLabelDrag(id){
  const ov=document.getElementById('fov-'+id);
  ov.querySelectorAll('.clabel').forEach(el=>{
    el.addEventListener('dragstart',e=>{
      dragSt={cardId:String(id),value:el.dataset.value,srcEl:el};
      e.dataTransfer.setData('text/plain',el.dataset.value);
      e.dataTransfer.effectAllowed='move';
      setTimeout(()=>el.classList.add('used'),0);
    });
    el.addEventListener('dragend',()=>{
      // If drag was not consumed by a valid drop, restore element
      if(dragSt.srcEl===el && dragSt.value){
        el.classList.remove('used');
        dragSt={cardId:null,value:null,srcEl:null};
      }
    });
  });
}

/* ═══════════════════════════════════════════════
   DRAG & DROP (chips in trays)
═══════════════════════════════════════════════ */
function setupChipDrag(cardId,side){
  const trayId=side==='front'?'ftray-'+cardId:'btray-'+cardId;
  const tray=document.getElementById(trayId);
  if(!tray) return;
  tray.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('dragstart',e=>{
      dragSt={cardId:String(cardId),value:el.dataset.value,srcEl:el};
      e.dataTransfer.setData('text/plain',el.dataset.value);
      e.dataTransfer.effectAllowed='move';
      setTimeout(()=>el.classList.add('used'),0);
    });
    el.addEventListener('dragend',()=>{
      // If drag was not consumed by a valid drop, restore chip
      if(dragSt.srcEl===el && dragSt.value){
        el.classList.remove('used');
        dragSt={cardId:null,value:null,srcEl:null};
      }
    });
  });
}

function setupSlotDrop(cardId,side){
  const formulaId=side==='front'?'fformula-'+cardId:'bformula-'+cardId;
  const formulaDiv=document.getElementById(formulaId);
  if(!formulaDiv) return;
  formulaDiv.querySelectorAll('.dslot').forEach(sl=>{
    sl.addEventListener('dragover',e=>{
      if(dragSt.cardId!==String(cardId)) return;
      e.preventDefault(); sl.classList.add('over');
    });
    sl.addEventListener('dragleave',()=>sl.classList.remove('over'));
    sl.addEventListener('drop',e=>{
      e.preventDefault(); sl.classList.remove('over');
      if(dragSt.cardId!==String(cardId)) return;
      if(!dragSt.value) return;
      // Return previous value if slot was filled
      const prev=sl.dataset.filled;
      if(prev) unmarkUsed(cardId,prev,side);
      // Fill slot
      sl.dataset.filled=dragSt.value;
      sl.textContent=dragSt.value;
      sl.classList.add('filled');
      // Mark source as used
      markUsed(cardId,dragSt.value,side);
      dragSt={cardId:null,value:null,srcEl:null};
      // Validate
      if(side==='front') validateFront(cardId);
      else validateBack(cardId);
    });
  });
}

function slotClick(sl){
  if(!sl.dataset.filled) return;
  const cardId=sl.dataset.cid;
  const val=sl.dataset.filled;
  // Determine side by slot key prefix
  const key=sl.dataset.slot;
  const side=key.startsWith('b')?'back':'front';
  unmarkUsed(cardId,val,side);
  sl.dataset.filled='';
  sl.textContent='';
  sl.classList.remove('filled');
  if(side==='front') validateFront(parseInt(cardId));
  else validateBack(parseInt(cardId));
}

function markUsed(cardId,value,side){
  const ov=document.getElementById('fov-'+cardId);
  if(ov) [...ov.querySelectorAll('.clabel')].filter(e=>e.dataset.value===value).forEach(e=>e.classList.add('used'));
  const trayId=side==='front'?'ftray-'+cardId:'btray-'+cardId;
  const t=document.getElementById(trayId);
  if(t) [...t.querySelectorAll('.chip')].filter(e=>e.dataset.value===value).forEach(e=>e.classList.add('used'));
}

function unmarkUsed(cardId,value,side){
  const ov=document.getElementById('fov-'+cardId);
  if(ov) [...ov.querySelectorAll('.clabel')].filter(e=>e.dataset.value===value).forEach(e=>e.classList.remove('used'));
  const trayId=side==='front'?'ftray-'+cardId:'btray-'+cardId;
  const t=document.getElementById(trayId);
  if(t) [...t.querySelectorAll('.chip')].filter(e=>e.dataset.value===value).forEach(e=>e.classList.remove('used'));
}

/* ═══════════════════════════════════════════════
   VALIDATION
═══════════════════════════════════════════════ */
function getSlots(cardId,side){
  const fId=side==='front'?'fformula-'+cardId:'bformula-'+cardId;
  const f=document.getElementById(fId);
  if(!f) return {};
  const map={};
  f.querySelectorAll('.dslot').forEach(s=>{
    if(s.dataset.filled) map[s.dataset.slot]=s.dataset.filled;
  });
  return map;
}

function validateFront(cardId){
  const id=parseInt(cardId);
  const st=STATES[id];
  if(!st) return;
  const slots=getSlots(cardId,'front');
  const vars=st.vars;
  const N=vars.length;
  let ok=false;

  switch(id){
    case 1:
    case 2:{
      const vSlots=vars.map((_,k)=>slots['fv'+k]||'').sort();
      const vExpect=[...vars].sort();
      const allFilled=vSlots.every(x=>x!=='');
      const cOk=slots['fc']===THM[id].frontConst;
      const rOk=slots['fr']===THM[id].frontReason;
      ok=allFilled && JSON.stringify(vSlots)===JSON.stringify(vExpect) && cOk && rOk;
      break;
    }
    case 3:{
      const v0=slots['fv0']||'',v1=slots['fv1']||'';
      const pair=[v0,v1].sort();
      const expect=[...vars].sort();
      ok=JSON.stringify(pair)===JSON.stringify(expect) && slots['fr']===THM[id].frontReason;
      break;
    }
    case 4:
    case 5:{
      const v0=slots['fv0']||'',v1=slots['fv1']||'';
      const pair=[v0,v1].sort();
      const expect=[...vars].sort();
      const lines=[slots['fl0']||'',slots['fl1']||''].sort();
      ok=JSON.stringify(pair)===JSON.stringify(expect) &&
         slots['fr']===THM[id].frontReason &&
         JSON.stringify(lines)===JSON.stringify(['AB','CD']);
      break;
    }
    case 6:{
      const v0=slots['fv0']||'',v1=slots['fv1']||'';
      const pair=[v0,v1].sort();
      const expect=[...vars].sort();
      const lines=[slots['fl0']||'',slots['fl1']||''].sort();
      ok=JSON.stringify(pair)===JSON.stringify(expect) &&
         slots['fc']===THM[id].frontConst &&
         slots['fr']===THM[id].frontReason &&
         JSON.stringify(lines)===JSON.stringify(['AB','CD']);
      break;
    }
    case 7:{
      const vSlots=[slots['fv0']||'',slots['fv1']||'',slots['fv2']||''].sort();
      const expect=[...vars].sort();
      ok=JSON.stringify(vSlots)===JSON.stringify(expect) &&
         slots['fc']===THM[id].frontConst &&
         slots['fr']===THM[id].frontReason;
      break;
    }
  }

  const badge=document.getElementById('fbadge-'+id);
  const flipBtn=document.getElementById('fflip-'+id);
  if(ok && !st.frontDone){
    st.frontDone=true;
    badge.classList.add('show');
    flipBtn.classList.remove('hidden');
    flipBtn.classList.add('pulse-btn');
  } else if(!ok && st.frontDone){
    st.frontDone=false;
    badge.classList.remove('show');
    flipBtn.classList.add('hidden');
    flipBtn.classList.remove('pulse-btn');
  }
}

function validateBack(cardId){
  const id=parseInt(cardId);
  const st=STATES[id];
  if(!st) return;
  const slots=getSlots(cardId,'back');
  let ok=false;

  switch(id){
    case 1:
      ok=slots['bv']==='x' && slots['bc']==='180°' && slots['br']==='直線上的鄰角'; break;
    case 2:
      ok=slots['bv']==='x' && slots['bc']==='360°' && slots['br']==='同頂角'; break;
    case 3:
      ok=slots['bv']==='x' && slots['bc']==='47°' && slots['br']==='對頂角'; break;
    case 4:{
      const lines=[slots['bl0']||'',slots['bl1']||''].sort();
      ok=slots['bv']==='x' && slots['bc']==='63°' && slots['br']==='同位角' &&
         JSON.stringify(lines)===JSON.stringify(['AB','CD']); break;
    }
    case 5:{
      const lines=[slots['bl0']||'',slots['bl1']||''].sort();
      ok=slots['bv']==='x' && slots['bc']==='52°' && slots['br']==='錯角' &&
         JSON.stringify(lines)===JSON.stringify(['AB','CD']); break;
    }
    case 6:{
      const lines=[slots['bl0']||'',slots['bl1']||''].sort();
      ok=slots['bv']==='x' && slots['bc']==='180°' && slots['br']==='同旁內角' &&
         JSON.stringify(lines)===JSON.stringify(['AB','CD']); break;
    }
    case 7:
      ok=slots['bv']==='x' && slots['bc']==='180°' && slots['br']==='內角和'; break;
  }

  const badge=document.getElementById('bbadge-'+id);
  const stepsDiv=document.getElementById('steps-'+id);
  if(ok && !st.backDone){
    st.backDone=true;
    badge.classList.add('show');
    stepsDiv.classList.remove('hidden');
  } else if(!ok && st.backDone){
    st.backDone=false;
    badge.classList.remove('show');
    stepsDiv.classList.add('hidden');
    // reset steps
    st.stepsRevealed=[false,false,false];
    for(let i=0;i<3;i++){
      const chk=document.getElementById('schk-'+id+'-'+i);
      const txt=document.getElementById('stxt-'+id+'-'+i);
      if(chk){chk.classList.remove('done');chk.textContent='';}
      if(txt) txt.classList.remove('show');
    }
  }
}

/* ═══════════════════════════════════════════════
   STEPS
═══════════════════════════════════════════════ */
function clickStep(id,stepIdx){
  const st=STATES[id];
  if(!st||!st.backDone) return;
  // Must click in order
  if(stepIdx>0 && !st.stepsRevealed[stepIdx-1]) return;
  if(st.stepsRevealed[stepIdx]) return;
  st.stepsRevealed[stepIdx]=true;
  const chk=document.getElementById('schk-'+id+'-'+stepIdx);
  const txt=document.getElementById('stxt-'+id+'-'+stepIdx);
  if(chk){chk.classList.add('done');chk.textContent='✓';}
  if(txt) txt.classList.add('show');
}

/* ═══════════════════════════════════════════════
   FLIP
═══════════════════════════════════════════════ */
function flipCard(id){
  const st=STATES[id];
  if(!st) return;
  st.isFlipped=!st.isFlipped;
  const fi=document.getElementById('fi-'+id);
  if(fi) fi.classList.toggle('flipped',st.isFlipped);
}

/* ═══════════════════════════════════════════════
   ANGLE COUNT SELECTOR
═══════════════════════════════════════════════ */
function setAngleCount(id,n){
  const st=STATES[id];
  if(!st||st.angleCount===n) return;
  st.angleCount=n;
  st.vars=pickVars(THM[id].nVars(n));
  st.frontDone=false;

  // Update angle buttons
  const card=document.getElementById('card-'+id);
  card.querySelectorAll('.abtn').forEach(btn=>{
    btn.classList.toggle('active',Number(btn.dataset.count)===n);
  });

  // Rebuild formula
  const ff=document.getElementById('fformula-'+id);
  if(ff) ff.innerHTML=frontFormulaHTML(id,String(id),st.vars,n);

  // Rebuild chip tray
  const ftray=document.getElementById('ftray-'+id);
  if(ftray){
    ftray.innerHTML=THM[id].trayItems(st.vars,n).map(v=>
      `<span class="chip" draggable="true" data-value="${v}" data-cid="${id}">${v}</span>`
    ).join('');
  }

  // Reset front badge + flip btn
  document.getElementById('fbadge-'+id)?.classList.remove('show');
  const fb=document.getElementById('fflip-'+id);
  if(fb){fb.classList.add('hidden');fb.classList.remove('pulse-btn');}

  // Redraw canvas + overlay
  buildCanvasOverlay(id);

  // Re-attach drag/drop
  setupChipDrag(id,'front');
  setupSlotDrop(id,'front');
}

/* ═══════════════════════════════════════════════
   MODE SWITCHING
═══════════════════════════════════════════════ */
function switchMode(mode){
  currentMode=mode;
  document.getElementById('modePresent').style.display=mode==='presentation'?'':'none';
  document.getElementById('modeRandom').style.display=mode==='random'?'':'none';
  document.getElementById('btnPresent').classList.toggle('active',mode==='presentation');
  document.getElementById('btnRandom').classList.toggle('active',mode==='random');
  if(mode==='random') startRandom();
}

function startRandom(){
  randQueue=shuffle([1,2,3,4,5,6,7]);
  randIdx=0;
  document.getElementById('randDone').style.display='none';
  document.getElementById('randControls').style.display='';
  buildProgressDots();
  showRandomCard();
}

function buildProgressDots(){
  const prog=document.getElementById('randProgress');
  prog.innerHTML=randQueue.map((_,i)=>
    `<div class="pdot${i===0?' current':''}" id="pdot-${i}"></div>`
  ).join('');
}

function updateProgressDots(){
  randQueue.forEach((_,i)=>{
    const d=document.getElementById('pdot-'+i);
    if(!d) return;
    d.className='pdot'+(i<randIdx?' done':i===randIdx?' current':'');
  });
}

function showRandomCard(){
  if(randIdx>=randQueue.length){
    document.getElementById('randCard').innerHTML='';
    document.getElementById('randControls').style.display='none';
    document.getElementById('randDone').style.display='';
    return;
  }
  const id=randQueue[randIdx];
  // Fresh state for random mode
  initState(id);
  const slot=document.getElementById('randCard');
  slot.innerHTML=buildCardHTML(id);
  // Draw canvases
  buildCanvasOverlay(id);
  drawBack(id,document.getElementById('bc-'+id));
  // Setup D&D
  setupChipDrag(id,'front');
  setupSlotDrop(id,'front');
  setupChipDrag(id,'back');
  setupSlotDrop(id,'back');
  updateProgressDots();
}

function nextRandom(){
  if(randIdx<randQueue.length) randIdx++;
  showRandomCard();
}

function restartRandom(){ startRandom(); }

/* ═══════════════════════════════════════════════
   RENDER ALL CARDS (presentation mode)
═══════════════════════════════════════════════ */
function renderPresentationCards(){
  const container=document.getElementById('modePresent');
  container.innerHTML='';
  for(let id=1;id<=7;id++){
    initState(id);
    const div=document.createElement('div');
    div.innerHTML=buildCardHTML(id);
    container.appendChild(div.firstElementChild);
  }
  // Draw canvases and setup drag/drop
  for(let id=1;id<=7;id++){
    buildCanvasOverlay(id);
    drawBack(id,document.getElementById('bc-'+id));
    setupChipDrag(id,'front');
    setupSlotDrop(id,'front');
    setupChipDrag(id,'back');
    setupSlotDrop(id,'back');
  }
}

/* ═══════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════ */
window.addEventListener('DOMContentLoaded',()=>{
  renderPresentationCards();
});
</script>
