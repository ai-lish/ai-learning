<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S1 Ch3｜代數式運算互動練習｜AI Learning</title>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QRCode CDN (for printable worksheets) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }
        .animate-fade-in {
            animation: fadeIn 0.2s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        html, body { max-width: 100%; overflow-x: hidden; }
        .mode-question { font-size: 18px !important; line-height: 1.55 !important; }
        .answer-field { font-size: 20px !important; line-height: 1.35 !important; }
        .feedback-text { font-size: 16px !important; line-height: 1.45 !important; }
        #keypad-grid .key { min-height: 48px; font-size: 20px; line-height: 1.1; }
        #keypad-action-btn { min-height: 48px; font-size: 20px !important; }
        .keypad-row { grid-template-columns: repeat(8, minmax(0, 1fr)); }
        .keypad-dynamic-slot { display: flex; min-width: 0; }
        .keypad-dynamic-slot button, .keypad-dynamic-slot span { width: 100%; min-width: 0; }
        .mode3-expression-tokens { display: inline-flex; flex-wrap: wrap; align-items: center; min-width: 0; overflow-wrap: anywhere; }
        .mode3-variable-token { min-width: 44px; min-height: 44px; padding: 0 7px; border: 2px dashed #a855f7; border-radius: 8px; background: #faf5ff; color: #6b21a8; cursor: pointer; vertical-align: middle; }
        .mode3-variable-token:focus-visible, .mode3-slot-box:focus-visible, #m3-line2-input-wrapper:focus-visible { outline: 3px solid #c4b5fd; outline-offset: 2px; }
        .mode3-substitution-group { display: inline-flex; flex-shrink: 0; align-items: center; white-space: nowrap; }
        .mode3-slot-box { display: inline-flex; min-width: 44px; min-height: 44px; align-items: center; justify-content: center; padding: 0 5px; border: 2px dashed #a855f7; border-radius: 8px; background: #faf5ff; color: #334155; cursor: pointer; vertical-align: middle; }
        .mode3-slot-box[aria-disabled="true"] { cursor: not-allowed; opacity: .6; }
        .mode3-slot-box[aria-invalid="true"] { border-color: #e11d48; background: #fff1f2; color: #9f1239; }
        .mode3-slot-box[data-correct="true"] { border-color: #059669; background: #ecfdf5; color: #065f46; }
        .mode3-slot-box[data-locked="true"] { cursor: default; }
        #m3-copy-step { border-color: #e9d5ff; background: #faf5ff; }
        #mode-3-container .mode3-step-heading { color: #581c87; }
        #m3-line1-input-wrapper { border-color: #c084fc; }
        #m3-selection-guidance { color: #6b21a8; }
        #m3-line2-input-val { overflow-wrap: anywhere; }
        #keypad-action-btn:disabled { background-color: #94a3b8; cursor: not-allowed; }
        #m3-line2-input-wrapper { cursor: pointer; }
        #m3-line2-input-wrapper[aria-disabled="true"] { cursor: not-allowed; opacity: .55; }
        #m3-line2-input-wrapper { min-height: 48px; }
        .print-only { display: none; }
        @media screen and (max-width: 420px) {
            #keypad-grid button { min-width: 0; }
        }
        @media print {
            .no-print { display: none !important; }
            body { display: block !important; background: #fff !important; color: #000 !important; font-size: 12pt; height: auto !important; overflow: visible !important; }
            .print-only, #print-worksheet-container { display: block !important; }
            @page { size: A4 portrait; margin: 10mm; }
            .worksheet-page { display: block !important; width: 190mm !important; height: 265mm !important; box-sizing: border-box !important; page-break-after: always; page-break-inside: avoid; margin: 0 !important; padding: 8mm !important; overflow: hidden !important; background: #fff !important; }
            .worksheet-page:last-child { page-break-after: auto; }
            .worksheet-page-content { height: 100%; display: flex; flex-direction: column; }
            .worksheet-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8mm; border-bottom: .5mm solid #1e293b; padding-bottom: 3mm; }
            .worksheet-title { margin: 0; font-size: 15pt; line-height: 1.2; font-weight: 700; }
            .worksheet-meta { margin: 2mm 0 0; font-size: 9pt; line-height: 1.45; }
            .worksheet-qr { flex: 0 0 24mm; width: 24mm; height: 24mm; }
            .worksheet-qr img, .worksheet-qr canvas { display: block; width: 24mm !important; height: 24mm !important; }
            .worksheet-section-title { margin: 4mm 0 2mm; font-size: 12pt; line-height: 1.2; font-weight: 700; }
            .worksheet-short-section { flex: 1 1 auto; min-height: 0; }
            .worksheet-short-row { display: grid; grid-template-columns: minmax(0, 1fr) 52mm; gap: 3mm; align-items: baseline; min-height: 13mm; padding: 1.5mm 0; border-bottom: .25mm solid #cbd5e1; font-size: 11pt; line-height: 1.4; }
            .worksheet-short-prompt { min-width: 0; }
            .worksheet-short-answer { white-space: nowrap; }
            .worksheet-blank { display: inline-block; min-width: 32mm; border-bottom: .25mm solid #334155; height: 1em; vertical-align: baseline; }
            .worksheet-problem-section { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
            .worksheet-problems { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 3mm; }
            .worksheet-problem { flex: 1 1 0; min-height: 0; padding: 3mm 0; font-size: 11pt; line-height: 1.45; }
            .worksheet-problem-title { margin: 0; font-weight: 700; }
            .worksheet-framework { margin: 2mm 0 0 10mm; line-height: 1.8; }
            .worksheet-framework-blank { display: inline-block; min-width: 86mm; border-bottom: .25mm solid #334155; height: 1em; vertical-align: baseline; }
            .worksheet-answer-space { flex: 1 1 auto; min-height: 24mm; margin-top: 2mm; }
            .worksheet-answer-strip { margin-top: auto; padding-top: 3mm; border-top: .25mm dashed #64748b; font-size: 8pt; line-height: 1.35; }
            .worksheet-fold-label { text-align: center; font-size: 7pt; color: #64748b; margin-bottom: 1mm; }
            .worksheet-answer-strip-content { transform: rotate(180deg); transform-origin: center; }
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <link rel="stylesheet" href="css/tw/site.css">
</head>
<body class="bg-slate-50 text-slate-800 h-[100dvh] flex flex-col justify-between overflow-hidden">

    <!-- Header & Mode Switcher -->
    <header class="bg-white shadow-sm border-b border-slate-200 z-40 no-print flex-shrink-0">
        <div class="max-w-4xl mx-auto px-3 py-2 flex flex-nowrap justify-between items-center gap-1">
            <div class="flex items-center gap-2 min-w-0 flex-1">
                <a href="S1Ch3.html#practice" aria-label="返回 S1 Ch3 練習" class="shrink-0 bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1 rounded-lg text-xs font-bold transition-all flex items-center gap-1 shadow-sm whitespace-nowrap no-print">
                    <i class="fa-solid fa-arrow-left"></i><span class="hidden sm:inline">返回 S1 Ch3</span>
                </a>
                <div class="bg-blue-600 text-white p-1.5 rounded-lg shadow-sm shrink-0">
                    <i class="fa-solid fa-square-root-variable text-sm"></i>
                </div>
                <div class="min-w-0">
                    <h1 class="text-xs sm:text-sm font-bold text-slate-900 leading-tight truncate">S1 Ch3 Ex2 數學互動練習</h1>
                    <p class="text-[10px] text-slate-500 truncate">代數式加減乘、混合運算與代入法</p>
                </div>
            </div>
            <div class="flex items-center gap-1 shrink-0">
                <button onclick="openPrintPreview()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1 rounded-lg text-xs font-bold transition-all flex items-center gap-1 shadow-sm">
                    <i class="fa-solid fa-print text-blue-600"></i><span class="hidden sm:inline">列印 PDF</span>
                </button>
                <button onclick="openScoreModal()" class="bg-blue-50 hover:bg-blue-100 text-blue-700 px-2 py-1 rounded-lg text-xs font-bold transition-all flex items-center gap-1 shadow-sm">
                    <i class="fa-solid fa-trophy"></i><span class="hidden sm:inline">計分卡</span>
                </button>
            </div>
        </div>
        <!-- Mode Tabs -->
        <div class="bg-slate-100 border-t border-slate-200 px-3 py-1.5">
            <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-1.5">
                <div class="grid grid-cols-3 gap-1 w-full sm:w-auto">
                    <button onclick="switchMode(1)" id="btn-mode-1" class="px-2 py-1 rounded-md transition-all text-xs font-medium bg-white text-blue-600 shadow-sm whitespace-nowrap text-center">
                        ① 代數加減乘
                    </button>
                    <button onclick="switchMode(2)" id="btn-mode-2" class="px-2 py-1 rounded-md transition-all text-xs font-medium text-slate-600 hover:text-blue-600 whitespace-nowrap text-center">
                        ② 乘法與混合
                    </button>
                    <button onclick="switchMode(3)" id="btn-mode-3" class="px-2 py-1 rounded-md transition-all text-xs font-medium text-slate-600 hover:text-blue-600 whitespace-nowrap text-center">
                        ③ 代入法
                    </button>
                </div>
                <div class="flex items-center space-x-2 text-xs self-end sm:self-center">
                    <div class="bg-blue-50 text-blue-700 px-2 py-0.5 rounded-md font-semibold flex items-center gap-1">
                        <i class="fa-solid fa-star"></i>
                        <span id="score-display">得分：0.0 / 0</span>
                    </div>
                    <button onclick="resetCurrentMode()" class="text-slate-500 hover:text-slate-700 bg-white border border-slate-200 px-2 py-0.5 rounded-md font-medium transition-all shadow-sm">
                        <i class="fa-solid fa-rotate-right mr-0.5"></i>重設
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-xl w-full mx-auto px-3 py-2 min-h-0 flex-grow overflow-y-auto no-print flex flex-col justify-start">
        <div class="my-auto w-full space-y-3">

            <!-- ================= MODE 1 ================= -->
            <div id="mode-1-container" class="space-y-3">
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 animate-fade-in">
                    <div class="flex justify-between items-center mb-2">
                        <span id="m1-badge" class="bg-blue-100 text-blue-800 text-[11px] font-bold px-2 py-0.5 rounded-full">代數加減</span>
                        <div class="flex items-center gap-1.5">
                            <span id="m1-progress" class="text-xs text-slate-500 font-medium">練習題</span>
                            <button onclick="openHintModal(1)" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-[11px] font-bold px-2 py-1 rounded-lg transition-all flex items-center gap-1 shadow-sm">
                                <i class="fa-solid fa-lightbulb"></i> 題解
                            </button>
                        </div>
                    </div>
                    <div class="bg-slate-50 border border-slate-200 rounded-lg p-3 mb-3 text-center">
                        <p class="text-[11px] text-slate-500 uppercase tracking-wider mb-1 font-semibold">化簡下列代數式</p>
                        <h2 id="m1-scenario" class="mode-question font-bold font-mono text-slate-800">題目載入中……</h2>
                    </div>

                    <div class="max-w-sm mx-auto space-y-2.5">
                        <div>
                            <div onclick="setFocusField('m1-input')" id="m1-input-wrapper" class="border-2 border-blue-500 rounded-xl px-3 py-2 bg-white font-mono font-bold text-lg text-slate-800 min-h-[44px] flex items-center cursor-pointer shadow-sm">
                                <span id="m1-input-val" class="text-slate-400">點擊輸入化簡後代數式...</span>
                            </div>
                        </div>
                        <div id="m1-feedback" class="hidden p-2.5 rounded-lg text-xs font-medium space-y-1 text-center"></div>
                    </div>
                </div>
            </div>

            <!-- ================= MODE 2 ================= -->
            <div id="mode-2-container" class="hidden space-y-3">
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 animate-fade-in">
                    <div class="flex justify-between items-center mb-2">
                        <span class="bg-emerald-100 text-emerald-800 text-[11px] font-bold px-2 py-0.5 rounded-full">乘法與混合運算</span>
                        <div class="flex items-center gap-1.5">
                            <span id="m2-progress" class="text-xs text-slate-500 font-medium">練習題</span>
                            <button onclick="openHintModal(2)" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-[11px] font-bold px-2 py-1 rounded-lg transition-all flex items-center gap-1 shadow-sm">
                                <i class="fa-solid fa-lightbulb"></i> 題解
                            </button>
                        </div>
                    </div>
                    <div class="bg-slate-50 border border-slate-200 rounded-lg p-3 mb-3 text-center">
                        <p class="text-[11px] text-slate-500 uppercase tracking-wider mb-1 font-semibold">化簡下列代數式</p>
                        <h2 id="m2-scenario" class="mode-question font-bold font-mono text-slate-800">題目載入中……</h2>
                    </div>

                    <div class="max-w-sm mx-auto space-y-2.5">
                        <div>
                            <div onclick="setFocusField('m2-input')" id="m2-input-wrapper" class="border-2 border-emerald-500 rounded-xl px-3 py-2 bg-white font-mono font-bold text-lg text-slate-800 min-h-[44px] flex items-center cursor-pointer shadow-sm">
                                <span id="m2-input-val" class="text-slate-400">點擊輸入化簡後代數式...</span>
                            </div>
                        </div>
                        <div id="m2-feedback" class="hidden p-2.5 rounded-lg text-xs font-medium space-y-1 text-center"></div>
                    </div>
                </div>
            </div>

            <!-- ================= MODE 3 ================= -->
            <div id="mode-3-container" class="hidden space-y-3">
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 animate-fade-in">
                    <div class="flex justify-between items-center mb-2">
                        <span class="bg-purple-100 text-purple-800 text-[11px] font-bold px-2 py-0.5 rounded-full">代入法求值</span>
                        <div class="flex items-center gap-1.5">
                            <span id="m3-progress" class="text-xs text-slate-500 font-medium">練習題</span>
                            <button onclick="openHintModal(3)" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-[11px] font-bold px-2 py-1 rounded-lg transition-all flex items-center gap-1 shadow-sm">
                                <i class="fa-solid fa-lightbulb"></i> 題解
                            </button>
                        </div>
                    </div>
                    <div class="bg-slate-50 border border-slate-200 rounded-lg p-3 mb-3 text-center">
                        <p class="text-[11px] text-slate-500 uppercase tracking-wider mb-1 font-semibold">求下列代數式的值</p>
                        <h2 id="m3-scenario" class="mode-question font-bold font-mono text-slate-800">題目載入中……</h2>
                    </div>

                    <div class="max-w-lg mx-auto space-y-2.5">
                        <div id="m3-copy-step" class="rounded-lg border p-2.5">
                            <p class="mode3-step-heading mb-1 text-xs font-bold">第 1 步：複製公式</p>
                            <button type="button" id="m3-copy-formula-btn" onclick="copyMode3Formula()" class="min-h-[44px] rounded-lg bg-purple-600 px-3 py-2 text-sm font-bold text-white shadow-sm transition-all hover:bg-purple-700">
                                <i class="fa-solid fa-copy mr-1"></i>複製公式
                            </button>
                        </div>
                        <div class="rounded-lg border border-slate-200 bg-white p-2.5 shadow-sm">
                            <p class="mb-1 text-xs font-bold text-slate-700">第 2 步：逐個撳公式入面的未知數</p>
                            <div id="m3-line1-input-wrapper" onclick="setFocusField('m3-line1-input')" class="flex min-h-[52px] items-center gap-1.5 rounded-lg border-2 border-purple-400 bg-slate-50 px-2 py-1.5 font-mono text-lg font-bold text-slate-800 shadow-sm">
                                <span class="shrink-0">=</span>
                                <div id="m3-expression-tokens" class="mode3-expression-tokens answer-field min-w-0 flex-1" aria-live="polite">
                                    <span class="text-sm font-sans font-medium text-slate-400">先按「複製公式」</span>
                                </div>
                                <span id="m3-line1-status" class="shrink-0 text-sm font-bold" aria-live="polite"></span>
                            </div>
                            <p id="m3-selection-guidance" class="mt-1 text-xs font-semibold text-purple-800" aria-live="polite">複製公式後，撳晒公式入面每一個未知數。</p>
                        </div>
                        <div class="rounded-lg border border-slate-200 bg-slate-50 p-2.5">
                            <p class="mb-1 text-xs font-bold text-slate-700">第 3 步：填數及答案</p>
                            <div class="flex items-center gap-2">
                                <div onclick="focusMode3Answer()" onkeydown="handleMode3FieldKeydown(event, 'm3-line2-input')" id="m3-line2-input-wrapper" role="textbox" aria-label="整數答案輸入框" aria-readonly="true" aria-disabled="true" tabindex="-1" class="flex min-w-0 flex-1 items-center gap-2 rounded-xl border-2 border-slate-300 bg-white px-3 py-2 font-mono text-lg font-bold text-slate-800 shadow-sm">
                                    <span class="shrink-0">=</span>
                                    <span id="m3-line2-input-val" class="answer-field min-w-0 flex-1 break-words text-slate-400">輸入整數答案...</span>
                                </div>
                                <span id="m3-line2-status" class="shrink-0 text-sm font-bold" aria-live="polite"></span>
                            </div>
                        </div>
                        <div id="m3-feedback" class="hidden p-2.5 rounded-lg text-xs font-medium space-y-1 text-center"></div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Score Modal -->
    <div id="score-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-xl max-w-sm w-full p-5 shadow-xl animate-fade-in space-y-3">
            <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                <h3 class="font-bold text-slate-800 text-sm flex items-center gap-1.5">
                    <i class="fa-solid fa-trophy text-amber-500"></i> 學習計分卡
                </h3>
                <button onclick="closeScoreModal()" class="text-slate-400 hover:text-slate-600 font-bold text-base px-2">&times;</button>

            <div id="score-modal-content" class="text-slate-600 text-xs space-y-2 leading-relaxed">

            </div>
            <div class="flex justify-end pt-1">

            </div>
        </div>

    <div id="hint-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">

                <h3 class="font-bold text-slate-800 text-sm flex items-center gap-1.5">
                    <i class="fa-solid fa-lightbulb text-amber-500"></i> 單元題解與概念溫習

                <button onclick="closeHintModal()" class="text-slate-400 hover:text-slate-600 font-bold text-base px-2">&times;</button>

            </div>
            <div class="flex justify-end pt-1">
                <button onclick="closeHintModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-3 py-1.5 rounded-lg text-xs transition-all">
                    關閉題解
                </button>
            </div>
        </div>
    </div>

    <!-- Print Preview Container -->
    <div id="print-worksheet-container" class="print-only"></div>

    <!-- ================= FIXED VIRTUAL KEYBOARD (Ex1 Standard grid-cols-8) ================= -->
    <div id="bottom-keypad-container" class="bg-white border-t border-slate-300 shadow-2xl z-40 p-1.5 sm:p-2 no-print flex-shrink-0">
        <div class="max-w-xl mx-auto space-y-1">
            <div id="keypad-grid" class="space-y-1">
                <div class="keypad-row grid grid-cols-8 gap-1">
                    <button onclick="pressKey('7')" class="key bg-slate-100 hover:bg-slate-200 active:bg-slate-300 py-2 rounded-md font-bold shadow-sm">7</button>
                    <button onclick="pressKey('8')" class="key bg-slate-100 hover:bg-slate-200 active:bg-slate-300 py-2 rounded-md font-bold shadow-sm">8</button>
                    <button onclick="pressKey('9')" class="key bg-slate-100 hover:bg-slate-200 active:bg-slate-300 py-2 rounded-md font-bold shadow-sm">9</button>
                    <button onclick="pressKey('+')" class="key bg-blue-50 text-blue-700 hover:bg-blue-100 active:bg-blue-200 py-2 rounded-md font-bold shadow-sm">+</button>
                    <button onclick="pressKey('-')" class="key bg-blue-50 text-blue-700 hover:bg-blue-100 active:bg-blue-200 py-2 rounded-md font-bold shadow-sm">−</button>
                    <button onclick="pressKey('(')" class="key bg-slate-100 hover:bg-slate-200 active:bg-slate-300 py-2 rounded-md font-bold shadow-sm">(</button>
                    <button onclick="pressKey(')')" class="key bg-slate-100 hover:bg-slate-200 active:bg-slate-300 py-2 rounded-md font-bold shadow-sm">)</button>
                    <button onclick="pressBackspace()" class="key bg-rose-50 text-rose-700 hover:bg-rose-100 active:bg-rose-200 py-2 rounded-md font-bold shadow-sm flex items-center justify-center"><i class="fa-solid fa-delete-left"></i></button>
                </div>
                <div class="keypad-row grid grid-cols-8 gap-1">
                    <button onclick="pressKey('4')" class="key bg-slate-100 hover:bg-slate-200 active:bg-slate-300 py-2 rounded-md font-bold shadow-sm">4</button>
                    <button onclick="pressKey('5')" class="key bg-slate-100 hover:bg-slate-200 active:bg-slate-300 py-2 rounded-md font-bold shadow-sm">5</button>
                    <button onclick="pressKey('6')" class="key bg-slate-100 hover:bg-slate-200 active:bg-slate-300 py-2 rounded-md font-bold shadow-sm">6</button>
                    <button onclick="pressKey('*')" class="key bg-blue-50 text-blue-700 hover:bg-blue-100 active:bg-blue-200 py-2 rounded-md font-bold shadow-sm">×</button>
                    <button onclick="pressKey('^')" class="key bg-blue-50 text-blue-700 hover:bg-blue-100 active:bg-blue-200 py-2 rounded-md font-bold shadow-sm">^</button>
                    <div id="dynamic-slot-1" class="keypad-dynamic-slot"></div>
                    <div id="dynamic-slot-2" class="keypad-dynamic-slot"></div>
                    <div id="dynamic-slot-3" class="keypad-dynamic-slot"></div>
                </div>
                <div class="keypad-row grid grid-cols-8 gap-1">
                    <button onclick="pressKey('1')" class="key bg-slate-100 hover:bg-slate-200 active:bg-slate-300 py-2 rounded-md font-bold shadow-sm">1</button>
                    <button onclick="pressKey('2')" class="key bg-slate-100 hover:bg-slate-200 active:bg-slate-300 py-2 rounded-md font-bold shadow-sm">2</button>
                    <button onclick="pressKey('3')" class="key bg-slate-100 hover:bg-slate-200 active:bg-slate-300 py-2 rounded-md font-bold shadow-sm">3</button>
                    <button onclick="pressKey('0')" class="key bg-slate-100 hover:bg-slate-200 active:bg-slate-300 py-2 rounded-md font-bold shadow-sm">0</button>
                    <button onclick="submitCurrentActive()" id="keypad-action-btn" class="bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white py-2 rounded-md font-bold shadow-sm col-span-4 flex items-center justify-center gap-1"><span>送出答案</span></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================= STATE, SCORING AND NAVIGATION =================
        let currentActiveMode = 1;
        let activeFocusField = 'm1-input';
        let mode3FormulaCopied = false;
        let mode3ExpressionTokens = [];
        let mode3SubstitutionSlots = [];
        let mode3LineState = { 1: { errors: 0, done: false }, 2: { errors: 0, done: false } };
        let sessionStartTime = new Date();
        let questionCounts = { 1: 0, 2: 0, 3: 0 };
        const sessionStats = {
            1: { earned: 0, total: 0, correct: 0, wrong: 0 },
            2: { earned: 0, total: 0, correct: 0, wrong: 0 },
            3: { earned: 0, total: 0, correct: 0, wrong: 0 }
        };
        const currentQ = { 1: null, 2: null, 3: null };
        const modeInputs = { 1: '', 2: '', 3: '' };
        const modeErrors = { 1: 0, 2: 0, 3: 0 };
        const modeGraded = { 1: false, 2: false, 3: false };
        const currentBreakdownStep = { 1: 0, 2: 0, 3: 0 };

        window.onload = function () {
            sessionStartTime = new Date();
            loadNewQuestion(1);
            loadNewQuestion(2);
            loadNewQuestion(3);
            switchMode(1);
        };

        function switchMode(modeNum) {
            currentActiveMode = modeNum;
            [1, 2, 3].forEach(function (mode) {
                document.getElementById('mode-' + mode + '-container').classList.add('hidden');
                document.getElementById('btn-mode-' + mode).className = 'px-2 py-1 rounded-md transition-all text-xs font-medium text-slate-600 hover:text-blue-600 whitespace-nowrap text-center';
            });
            document.getElementById('mode-' + modeNum + '-container').classList.remove('hidden');
            document.getElementById('btn-mode-' + modeNum).className = 'px-2 py-1 rounded-md transition-all text-xs font-medium bg-white text-blue-600 shadow-sm whitespace-nowrap text-center';
            updateScoreDisplay();
            updateKeypadButtons();
            if (modeNum === 3 && mode3FormulaCopied && isMode3AllVariablesSelected()) {
                if (!mode3LineState[1].done) {
                    const nextSlot = mode3SubstitutionSlots.findIndex(function (slot) {
                        return !/^[+-]?\d+$/.test(normalizeMode3Value(slot.value)) || slot.incorrect;
                    });
                    setFocusField('m3-sub-slot-' + (nextSlot >= 0 ? nextSlot : 0));
                } else {
                    setFocusField('m3-line2-input');
                }
            } else {
                setFocusField(modeNum === 3 ? 'm3-line1-input' : 'm' + modeNum + '-input');
            }
            updateActionButton();
        }

        function updateScoreDisplay() {
            const stats = sessionStats[currentActiveMode];
            document.getElementById('score-display').innerText = '得分：' + stats.earned.toFixed(1) + ' / ' + stats.total;
        }

        function resetCurrentMode() {
            sessionStats[currentActiveMode] = { earned: 0, total: 0, correct: 0, wrong: 0 };
            questionCounts[currentActiveMode] = 0;
            loadNewQuestion(currentActiveMode);
            updateScoreDisplay();
        }

        function setFocusField(fieldId) {
            if (currentActiveMode === 3) {
                const slotMatch = fieldId.match(/^m3-sub-slot-(\d+)$/);
                const lineNumber = fieldId === 'm3-line1-input' || slotMatch ? 1 : fieldId === 'm3-line2-input' ? 2 : 0;
                if (lineNumber && mode3LineState[lineNumber].done) return;
                if (slotMatch && (!mode3FormulaCopied || !isMode3AllVariablesSelected() || !mode3SubstitutionSlots[Number(slotMatch[1])])) return;
                if (fieldId === 'm3-line2-input' && (!mode3FormulaCopied || !isMode3AllVariablesSelected())) return;
            }
            activeFocusField = fieldId;
            document.querySelectorAll('[id$="-wrapper"]').forEach(function (element) {
                element.classList.remove('border-blue-600', 'border-emerald-600', 'border-purple-600', 'ring-2', 'ring-blue-200');
                if (!element.classList.contains('mode3-slot-box')) element.classList.add('border-slate-300');
            });
            const activeElement = document.getElementById(fieldId + '-wrapper');
            if (activeElement) {
                activeElement.classList.remove('border-slate-300');
                const borderColor = currentActiveMode === 2 ? 'border-emerald-600' : currentActiveMode === 3 ? 'border-purple-600' : 'border-blue-600';
                if (!(activeElement.classList.contains('mode3-slot-box') && activeElement.getAttribute('aria-invalid') === 'true')) {
                    activeElement.classList.add(borderColor);
                }
                activeElement.classList.add('ring-2', 'ring-blue-100');
                if (activeElement.classList.contains('mode3-slot-box') || fieldId === 'm3-line2-input') {
                    activeElement.focus({ preventScroll: true });
                }
            }
            if (currentActiveMode === 3) scrollMode3FieldIntoView(fieldId);
        }

        function isMode3AllVariablesSelected() {
            return mode3SubstitutionSlots.length > 0 && mode3SubstitutionSlots.every(function (slot) { return slot.selected; });
        }

        function updateMode3InputAvailability() {
            const allSelected = mode3FormulaCopied && isMode3AllVariablesSelected();
            const answerWrapper = document.getElementById('m3-line2-input-wrapper');
            if (answerWrapper) {
                const answerEnabled = allSelected && !mode3LineState[2].done;
                answerWrapper.setAttribute('aria-disabled', answerEnabled ? 'false' : 'true');
                answerWrapper.tabIndex = answerEnabled ? 0 : -1;
            }
            document.querySelectorAll('.mode3-slot-box').forEach(function (element) {
                const slotEnabled = allSelected && !mode3LineState[1].done;
                element.setAttribute('aria-disabled', slotEnabled ? 'false' : 'true');
                element.tabIndex = slotEnabled ? 0 : -1;
            });
            const guidance = document.getElementById('m3-selection-guidance');
            if (guidance) {
                guidance.textContent = !mode3FormulaCopied
                    ? '按「複製公式」後，撳晒公式入面每一個未知數。'
                    : !isMode3AllVariablesSelected()
                        ? '撳晒公式入面每一個未知數。'
                        : '已選好所有未知數；填妥每個括號，再輸入答案。';
            }
            return allSelected;
        }

        function scrollMode3FieldIntoView(fieldId) {
            const wrapper = document.getElementById(fieldId + '-wrapper');
            if (!wrapper) return;
            window.requestAnimationFrame(function () {
                wrapper.scrollIntoView({ block: 'nearest', inline: 'nearest' });
                window.requestAnimationFrame(function () {
                    const main = document.querySelector('main');
                    const keypad = document.getElementById('bottom-keypad-container');
                    const target = mode3FormulaCopied && isMode3AllVariablesSelected()
                        ? document.getElementById('m3-line2-input-wrapper')
                        : wrapper;
                    if (!main || !keypad || !target) return;
                    const clearance = 8;
                    const overlap = target.getBoundingClientRect().bottom - keypad.getBoundingClientRect().top + clearance;
                    if (overlap > 0) main.scrollTop += overlap;
                });
            });
        }

        function updateActionButton() {
            const button = document.getElementById('keypad-action-btn');
            if (!button) return;
            if (modeGraded[currentActiveMode]) {
                button.innerHTML = '<span>下一題</span>';
                button.className = 'bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white py-2 rounded-md font-bold shadow-sm col-span-4 flex items-center justify-center gap-1';
                button.disabled = false;
                return;
            }
            const colorClass = currentActiveMode === 2 ? 'bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800' : currentActiveMode === 3 ? 'bg-purple-600 hover:bg-purple-700 active:bg-purple-800' : 'bg-blue-600 hover:bg-blue-700 active:bg-blue-800';
            const mode3Ready = currentActiveMode !== 3 || (mode3FormulaCopied && isMode3AllVariablesSelected());
            const actionLabel = currentActiveMode === 3
                ? !mode3FormulaCopied ? '先複製公式' : !mode3Ready ? '撳晒未知數' : '核對答案'
                : '送出答案';
            button.innerHTML = '<span>' + actionLabel + '</span>';
            button.disabled = !mode3Ready;
            button.className = (mode3Ready ? colorClass : 'bg-slate-400 cursor-not-allowed') + ' text-white py-2 rounded-md font-bold shadow-sm col-span-4 flex items-center justify-center gap-1';
        }

        // ================= KEYPAD AND INPUT =================
        function updateKeypadButtons() {
            const slots = [
                document.getElementById('dynamic-slot-1'),
                document.getElementById('dynamic-slot-2'),
                document.getElementById('dynamic-slot-3')
            ];
            slots.forEach(function (slot) { slot.replaceChildren(); });
            const question = currentQ[currentActiveMode];
            const variables = question && currentActiveMode !== 3 ? (question.vars || []) : [];
            slots.forEach(function (slot, index) {
                const variable = variables[index];
                if (!variable) {
                    const blank = document.createElement('span');
                    blank.setAttribute('aria-hidden', 'true');
                    slot.appendChild(blank);
                    return;
                }
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'key bg-slate-200 hover:bg-slate-300 active:bg-slate-400 py-2 rounded-md font-bold shadow-sm transition-all flex items-center justify-center';
                button.textContent = variable;
                button.onclick = function () { pressKey(variable); };
                slot.appendChild(button);
            });
        }

        function pressKey(character) {
            if (modeGraded[currentActiveMode]) return;
            if (currentActiveMode === 3) {
                if (!mode3FormulaCopied || !isMode3AllVariablesSelected()) return;
                const slotMatch = activeFocusField.match(/^m3-sub-slot-(\d+)$/);
                if (slotMatch) {
                    const slotIndex = Number(slotMatch[1]);
                    const slot = mode3SubstitutionSlots[slotIndex];
                    if (!slot || mode3LineState[1].done) return;
                    slot.value += character === '-' ? '−' : character;
                    slot.incorrect = false;
                    slot.correct = false;
                    renderMode3Expression();
                    if (/^[+-]?\d+$/.test(normalizeMode3Value(slot.value))) {
                        const nextSlot = findNextMode3SlotNeedingValue(slotIndex);
                        setFocusField(nextSlot >= 0 ? 'm3-sub-slot-' + nextSlot : 'm3-line2-input');
                    } else {
                        setFocusField('m3-sub-slot-' + slotIndex);
                    }
                    return;
                }
                if (activeFocusField !== 'm3-line2-input' || mode3LineState[2].done) return;
                modeInputs[3] = (modeInputs[3] || '') + (character === '-' ? '−' : character);
                renderFieldDisplay('m3-line2-input-val', modeInputs[3], '輸入整數答案...');
                setFocusField('m3-line2-input');
                return;
            }
            modeInputs[currentActiveMode] = (modeInputs[currentActiveMode] || '') + character;
            renderFieldDisplay('m' + currentActiveMode + '-input-val', modeInputs[currentActiveMode], '點擊輸入化簡後代數式...');
        }

        function pressBackspace() {
            if (modeGraded[currentActiveMode]) return;
            if (currentActiveMode === 3) {
                if (!mode3FormulaCopied || !isMode3AllVariablesSelected()) return;
                const slotMatch = activeFocusField.match(/^m3-sub-slot-(\d+)$/);
                if (slotMatch) {
                    const slotIndex = Number(slotMatch[1]);
                    const slot = mode3SubstitutionSlots[slotIndex];
                    if (!slot || mode3LineState[1].done) return;
                    slot.value = slot.value.slice(0, -1);
                    slot.incorrect = false;
                    slot.correct = false;
                    renderMode3Expression();
                    setFocusField('m3-sub-slot-' + slotIndex);
                    return;
                }
                if (activeFocusField !== 'm3-line2-input' || mode3LineState[2].done) return;
                modeInputs[3] = (modeInputs[3] || '').slice(0, -1);
                renderFieldDisplay('m3-line2-input-val', modeInputs[3], '輸入整數答案...');
                setFocusField('m3-line2-input');
                return;
            }
            modeInputs[currentActiveMode] = (modeInputs[currentActiveMode] || '').slice(0, -1);
            renderFieldDisplay('m' + currentActiveMode + '-input-val', modeInputs[currentActiveMode], '點擊輸入化簡後代數式...');
        }

        function findNextMode3SlotNeedingValue(currentIndex) {
            for (let offset = 1; offset <= mode3SubstitutionSlots.length; offset += 1) {
                const index = (currentIndex + offset) % mode3SubstitutionSlots.length;
                if (mode3SubstitutionSlots[index].selected && !/^[+-]?\d+$/.test(normalizeMode3Value(mode3SubstitutionSlots[index].value))) return index;
            }
            return -1;
        }

        function renderFieldDisplay(elementId, value, placeholder) {
            const element = document.getElementById(elementId);
            if (!element) return;
            if (!value) {
                element.textContent = placeholder;
                element.className = elementId === 'm3-line2-input-val'
                    ? 'answer-field min-w-0 flex-1 break-words text-slate-400'
                    : 'answer-field text-slate-400';
            } else {
                element.innerHTML = formatDisplayMath(value);
                element.className = elementId === 'm3-line2-input-val'
                    ? 'answer-field min-w-0 flex-1 break-words text-slate-800 font-mono'
                    : 'answer-field text-slate-800 font-mono';
            }
        }

        // ================= NORMALIZATION AND ALGEBRA PARSER =================
        function normalizeMathStr(value) {
            if (!value) return '';
            return String(value).replace(/\s+/g, '')
                .replace(/−/g, '-').replace(/＋/g, '+')
                .replace(/[×·]/g, '*').replace(/÷/g, '/')
                .replace(/[（]/g, '(').replace(/[）]/g, ')')
                .replace(/²/g, '^2').replace(/³/g, '^3')
                .replace(/⁴/g, '^4').replace(/⁵/g, '^5');
        }

        function formatDisplayMath(value) {
            if (!value) return '';
            return String(value).replace(/-/g, '−').replace(/\^(\d+)/g, '<sup>$1</sup>');
        }

        class AlgebraicParser {
            constructor(expression) {
                this.tokens = [];
                this.position = 0;
                this.ast = null;
                this.errorMsg = null;
                this.tokenizeAndParse(expression);
            }

            tokenizeAndParse(expression) {
                const source = normalizeMathStr(expression);
                const tokens = [];
                let index = 0;
                while (index < source.length) {
                    const rest = source.slice(index);
                    const number = rest.match(/^\d+(?:\.\d+)?/);
                    if (number) {
                        tokens.push({ type: 'NUM', value: Number(number[0]) });
                        index += number[0].length;
                        continue;
                    }
                    const character = source[index];
                    if (/[a-zA-Z]/.test(character)) {
                        tokens.push({ type: 'VAR', value: character });
                        index += 1;
                        continue;
                    }
                    if ('+-*/^()'.includes(character)) {
                        tokens.push({ type: 'OP', value: character });
                        index += 1;
                        continue;
                    }
                    this.errorMsg = '算式格式有誤（包含未知符號）';
                    return;
                }

                const expanded = [];
                for (let tokenIndex = 0; tokenIndex < tokens.length; tokenIndex += 1) {
                    const current = tokens[tokenIndex];
                    const next = tokens[tokenIndex + 1];
                    expanded.push(current);
                    if (!next) continue;
                    const currentEndsValue = current.type === 'NUM' || current.type === 'VAR' || (current.type === 'OP' && current.value === ')');
                    const nextStartsValue = next.type === 'VAR' || next.type === 'NUM' || (next.type === 'OP' && next.value === '(');
                    const noExplicitOperator = (current.type === 'NUM' && (next.type === 'VAR' || (next.type === 'OP' && next.value === '('))) ||
                        (current.type === 'VAR' && nextStartsValue) ||
                        (current.type === 'OP' && current.value === ')' && nextStartsValue);
                    if (currentEndsValue && nextStartsValue && noExplicitOperator) expanded.push({ type: 'OP', value: '*' });
                }

                this.tokens = expanded;
                this.position = 0;
                try {
                    this.ast = this.parseExpr();
                    if (this.position !== this.tokens.length) throw new Error('算式未完整解析');
                } catch (error) {
                    this.ast = null;
                    this.errorMsg = '算式格式有誤';
                }
            }

            peek() { return this.tokens[this.position]; }

            consume(value) {
                const token = this.peek();
                if (token && token.value === value) {
                    this.position += 1;
                    return true;
                }
                return false;
            }

            parseExpr() {
                let node = this.parseTerm();
                while (this.peek() && (this.peek().value === '+' || this.peek().value === '-')) {
                    const operator = this.peek().value;
                    this.position += 1;
                    const right = this.parseTerm();
                    const left = node;
                    node = operator === '+' ? function (environment) { return left(environment) + right(environment); } :
                        function (environment) { return left(environment) - right(environment); };
                }
                return node;
            }

            parseTerm() {
                let node = this.parseUnary();
                while (this.peek() && (this.peek().value === '*' || this.peek().value === '/')) {
                    const operator = this.peek().value;
                    this.position += 1;
                    const right = this.parseUnary();
                    const left = node;
                    if (operator === '*') {
                        node = function (environment) { return left(environment) * right(environment); };
                    } else {
                        node = function (environment) {
                            const denominator = right(environment);
                            if (denominator === 0) throw new Error('除數不可為 0');
                            return left(environment) / denominator;
                        };
                    }
                }
                return node;
            }

            parseUnary() {
                if (this.consume('+')) return this.parseUnary();
                if (this.consume('-')) {
                    const child = this.parseUnary();
                    return function (environment) { return -child(environment); };
                }
                return this.parsePower();
            }

            parsePower() {
                const base = this.parsePrimary();
                if (this.consume('^')) {
                    const exponent = this.parseUnary();
                    return function (environment) { return Math.pow(base(environment), exponent(environment)); };
                }
                return base;
            }

            parsePrimary() {
                const token = this.peek();
                if (!token) throw new Error('算式意外結束');
                if (token.type === 'NUM') {
                    this.position += 1;
                    const value = token.value;
                    return function () { return value; };
                }
                if (token.type === 'VAR') {
                    this.position += 1;
                    const variable = token.value;
                    return function (environment) {
                        if (!environment || !Object.prototype.hasOwnProperty.call(environment, variable)) {
                            throw new Error('未知變數：' + variable);
                        }
                        return environment[variable];
                    };
                }
                if (this.consume('(')) {
                    const inner = this.parseExpr();
                    if (!this.consume(')')) throw new Error('欠缺右括號');
                    return inner;
                }
                throw new Error('算式格式有誤');
            }

            evaluate(environment) {
                if (this.errorMsg || !this.ast) return null;
                try {
                    const result = this.ast(environment || {});
                    return Number.isFinite(result) ? result : null;
                } catch (error) {
                    return null;
                }
            }
        }

        function checkAlgebraicEquivalence(userExpression, correctExpression, variables) {
            const userParser = new AlgebraicParser(userExpression);
            if (userParser.errorMsg) return { syntaxError: true, msg: userParser.errorMsg };
            const correctParser = new AlgebraicParser(correctExpression);
            if (correctParser.errorMsg) return { syntaxError: false, equivalent: false };
            const points = [
                { a: 2, b: 3, m: 2, x: 2, y: 3, n: 2, k: 2, p: 2, q: 3 },
                { a: 3, b: 2, m: 3, x: 3, y: 2, n: 3, k: 3, p: 3, q: 2 },
                { a: -1, b: 2, m: -2, x: -2, y: 2, n: -2, k: -1, p: -2, q: 2 },
                { a: 2, b: -2, m: 1, x: 1, y: -2, n: 1, k: 2, p: 1, q: -2 },
                { a: 4, b: 1, m: 2, x: 4, y: 1, n: 2, k: 4, p: 2, q: 1 }
            ];
            for (const point of points) {
                const environment = {};
                (variables || []).forEach(function (variable) { environment[variable] = point[variable] !== undefined ? point[variable] : 2; });
                const userValue = userParser.evaluate(environment);
                const correctValue = correctParser.evaluate(environment);
                if (userValue === null || correctValue === null || Math.abs(userValue - correctValue) > 1e-8) {
                    return { syntaxError: false, equivalent: false };
                }
            }
            return { syntaxError: false, equivalent: true };
        }

        function checkSimplifiedForm(userExpression) {
            const normalized = normalizeMathStr(userExpression);
            const parser = new AlgebraicParser(normalized);
            if (parser.errorMsg) return { valid: false, errType: 'syntax', msg: parser.errorMsg };
            if (/[()*/]/.test(normalized)) return { valid: false, errType: 'simplified', msg: '答案仍有括號或乘除符號，未完全化簡' };

            const terms = [];
            let start = 0;
            for (let index = 1; index < normalized.length; index += 1) {
                if ((normalized[index] === '+' || normalized[index] === '-') && normalized[index - 1] !== '^') {
                    terms.push(normalized.slice(start, index));
                    start = index;
                }
            }
            terms.push(normalized.slice(start));
            const signatures = new Set();
            let constantTerms = 0;

            for (let term of terms) {
                if (!term) return { valid: false, errType: 'simplified', msg: '答案有空白項' };
                let sign = 1;
                if (term[0] === '+' || term[0] === '-') {
                    if (term[0] === '-') sign = -1;
                    term = term.slice(1);
                }
                const match = term.match(/^(\d*)(.*)$/);
                if (!match || (!match[1] && !match[2])) return { valid: false, errType: 'simplified', msg: '項格式錯誤' };
                const coefficientText = match[1];
                const variableText = match[2];
                const coefficient = (coefficientText ? Number(coefficientText) : 1) * sign;
                if (!Number.isFinite(coefficient) || coefficient === 0) return { valid: false, errType: 'simplified', msg: '化簡後係數不得為 0' };
                if (coefficientText === '1' && variableText) return { valid: false, errType: 'simplified', msg: '係數為 1 時不可寫出數字 1' };

                if (!variableText) {
                    if (!coefficientText) return { valid: false, errType: 'simplified', msg: '常數項格式錯誤' };
                    constantTerms += 1;
                    if (constantTerms > 1) return { valid: false, errType: 'simplified', msg: '常數項多於一個，須合併' };
                    if (signatures.has('CONST')) return { valid: false, errType: 'simplified', msg: '同類項未合併' };
                    signatures.add('CONST');
                    continue;
                }

                let position = 0;
                const seenVariables = new Set();
                let signature = '';
                while (position < variableText.length) {
                    const variable = variableText[position];
                    if (!/[a-zA-Z]/.test(variable)) return { valid: false, errType: 'simplified', msg: '變數格式錯誤' };
                    position += 1;
                    let exponent = 1;
                    if (variableText[position] === '^') {
                        position += 1;
                        let exponentText = '';
                        while (position < variableText.length && /\d/.test(variableText[position])) {
                            exponentText += variableText[position];
                            position += 1;
                        }
                        exponent = Number(exponentText);
                        if (!exponentText || exponent < 2) return { valid: false, errType: 'simplified', msg: '指數須為至少 2 的整數，1 次方不可寫 ^1' };
                    }
                    if (seenVariables.has(variable)) return { valid: false, errType: 'simplified', msg: '同一項內不可有重複字母' };
                    seenVariables.add(variable);
                    signature += variable + '^' + exponent + ';';
                }
                if (signatures.has(signature)) return { valid: false, errType: 'simplified', msg: '同類項未合併' };
                signatures.add(signature);
            }
            return { valid: true };
        }

        // ================= RANDOM GENERATORS AND FORMATTING =================
        function getRandomInt(minimum, maximum) {
            return Math.floor(Math.random() * (maximum - minimum + 1)) + minimum;
        }

        function getNonzeroInt(minimum, maximum) {
            let value = 0;
            while (value === 0) value = getRandomInt(minimum, maximum);
            return value;
        }

        function randomVariable(excluded) {
            const letters = ['a', 'b', 'm', 'n', 'p', 'q', 'x', 'y'];
            const available = letters.filter(function (letter) { return !(excluded || []).includes(letter); });
            return available[getRandomInt(0, available.length - 1)];
        }

        const referenceScenarioKeys = {
            1: new Set([
                '5m+2m−4m', '2m−5m', '3m+4m', '3x−7x+2x',
                '3a(2a)', '−2m²(4m)', '5m²(2m)(4m)', '−3m(2m²)',
                '2m(−4m)', '3a(−2a)'
            ].map(normalizeMathStr)),
            2: new Set([
                '3x(2x)−4x²', '2a(3b)+4b(a)',
                '2m(3m)−5m+m²', '4x(x)+3x²−2x'
            ].map(normalizeMathStr)),
            3: new Set([
                '當a=−2時，求3a²−5a的值。',
                '當x=3時，求−2x²+4x−1的值。',
                '當m=−1，n=2時，求4m²n+3mn的值。',
                '當y=−3時，求y²+2y−5的值。'
            ].map(normalizeMathStr))
        };

        function isReferenceScenario(modeNum, scenario) {
            return referenceScenarioKeys[modeNum].has(normalizeMathStr(scenario));
        }

        function formatTerm(coefficient, variableMap) {
            if (coefficient === 0) throw new Error('formatTerm 不接受零係數');
            const variables = Object.keys(variableMap || {}).filter(function (variable) { return variableMap[variable] > 0; }).sort();
            const sign = coefficient < 0 ? '-' : '';
            const magnitude = Math.abs(coefficient);
            const coefficientText = variables.length && magnitude === 1 ? '' : String(magnitude);
            const variableText = variables.map(function (variable) {
                const exponent = variableMap[variable];
                return variable + (exponent > 1 ? '^' + exponent : '');
            }).join('');
            return sign + coefficientText + variableText;
        }

        function formatSum(terms) {
            let result = '';
            terms.forEach(function (term) {
                if (!term.coef) return;
                const formatted = formatTerm(term.coef, term.vars);
                if (!result) result = formatted;
                else result += term.coef > 0 ? '+' + formatted : formatted;
            });
            return result || '0';
        }

        function formatSignedPromptTerm(coefficient, variableMap) {
            return formatTerm(coefficient, variableMap);
        }

        function renderExpandedAtoms(signs, variable, struckIndices) {
            return signs.map(function (sign, index) {
                const prefix = index === 0 && sign > 0 ? '' : sign > 0 ? '+' : '−';
                const atom = prefix + variable;
                return struckIndices && struckIndices.has(index) ? '<s>' + atom + '</s>' : atom;
            }).join('');
        }

        function buildAddSubBreakdown(coefficients, variable) {
            const signs = [];
            coefficients.forEach(function (coefficient) {
                for (let count = 0; count < Math.abs(coefficient); count += 1) signs.push(coefficient > 0 ? 1 : -1);
            });
            const total = coefficients.reduce(function (sum, coefficient) { return sum + coefficient; }, 0);
            const positiveIndices = [];
            const negativeIndices = [];
            signs.forEach(function (sign, index) { (sign > 0 ? positiveIndices : negativeIndices).push(index); });
            const lines = ['= ' + renderExpandedAtoms(signs, variable)];
            if (positiveIndices.length && negativeIndices.length) {
                const struck = new Set();
                const pairs = Math.min(positiveIndices.length, negativeIndices.length);
                for (let pair = 0; pair < pairs; pair += 1) {
                    struck.add(positiveIndices[pair]);
                    struck.add(negativeIndices[pair]);
                }
                lines.push('= ' + renderExpandedAtoms(signs, variable, struck));
                const remaining = Array(Math.abs(total)).fill(total > 0 ? 1 : -1);
                lines.push('= ' + renderExpandedAtoms(remaining, variable));
            }
            if (Math.abs(total) > 1) {
                lines.push('= ' + (total < 0 ? '(−' + Math.abs(total) + ')' : String(total)) + '×' + variable);
            }
            lines.push('= ' + formatTerm(total, { [variable]: 1 }));
            return lines;
        }

        function buildMultiplyBreakdown(factors, variable) {
            const coefficientProduct = factors.reduce(function (product, factor) { return product * factor.coef; }, 1);
            const totalExponent = factors.reduce(function (sum, factor) { return sum + factor.exp; }, 0);
            const numberText = factors.map(function (factor, index) {
                return index === 0 ? String(factor.coef) : '(' + String(factor.coef) + ')';
            }).join('');
            const variableFactors = Array(totalExponent).fill(variable).join('·');
            const firstLine = '= ' + numberText + (variableFactors ? '·' : '') + variableFactors;
            return [firstLine, '= ' + formatTerm(coefficientProduct, { [variable]: totalExponent })];
        }

        function makeMode1AddSub(variable) {
            while (true) {
                const termCount = getRandomInt(2, 3);
                const coefficients = Array.from({ length: termCount }, function () { return getNonzeroInt(-6, 6); });
                const absoluteTotal = coefficients.reduce(function (sum, coefficient) { return sum + Math.abs(coefficient); }, 0);
                const coefficientTotal = coefficients.reduce(function (sum, coefficient) { return sum + coefficient; }, 0);
                if (absoluteTotal > 12 || coefficientTotal === 0) continue;
                const scenario = coefficients.map(function (coefficient, index) {
                    const term = formatTerm(Math.abs(coefficient), { [variable]: 1 });
                    if (index === 0) return coefficient < 0 ? '-' + term : term;
                    return coefficient < 0 ? ' − ' + term : ' + ' + term;
                }).join('');
                const expression = formatTerm(coefficientTotal, { [variable]: 1 });
                const question = { type: 'addsub', scenario: scenario, expr: expression, vars: [variable], breakdown: buildAddSubBreakdown(coefficients, variable), coefficients: coefficients };
                if (isReferenceScenario(1, question.scenario)) continue;
                if (!checkSimplifiedForm(question.expr).valid) continue;
                return question;
            }
        }

        function makeMode1Multiplication(variable) {
            while (true) {
                const factorCount = getRandomInt(2, 3);
                const maximumCoefficient = factorCount === 2 ? 9 : 5;
                const factors = Array.from({ length: factorCount }, function () {
                    return { coef: getNonzeroInt(-maximumCoefficient, maximumCoefficient), exp: getRandomInt(1, 3) };
                });
                const totalExponent = factors.reduce(function (sum, factor) { return sum + factor.exp; }, 0);
                if (totalExponent > 5) continue;
                const coefficientProduct = factors.reduce(function (product, factor) { return product * factor.coef; }, 1);
                const factorText = factors.map(function (factor, index) {
                    const term = formatTerm(factor.coef, { [variable]: factor.exp });
                    return index === 0 ? term : '(' + term + ')';
                }).join('');
                const expression = formatTerm(coefficientProduct, { [variable]: totalExponent });
                const question = { type: 'mul', scenario: factorText, expr: expression, vars: [variable], breakdown: buildMultiplyBreakdown(factors, variable), factors: factors };
                if (isReferenceScenario(1, question.scenario)) continue;
                if (!checkSimplifiedForm(question.expr).valid) continue;
                return question;
            }
        }

        function generateMode1Question(requiredType) {
            const variable = randomVariable();
            const type = requiredType || (Math.random() < 0.5 ? 'addsub' : 'mul');
            return type === 'mul' ? makeMode1Multiplication(variable) : makeMode1AddSub(variable);
        }

        function buildMode2Question(pattern) {
            while (true) {
                const variable = randomVariable();
                let question;
                if (pattern === 1) {
                    const firstCoefficient = getNonzeroInt(-9, 9);
                    const secondCoefficient = getNonzeroInt(-9, 9);
                    const addendCoefficient = getNonzeroInt(-9, 9);
                    const productCoefficient = firstCoefficient * secondCoefficient;
                    const finalCoefficient = productCoefficient + addendCoefficient;
                    if (finalCoefficient === 0) continue;
                    const first = formatSignedPromptTerm(firstCoefficient, { [variable]: 1 }) + '(' + formatSignedPromptTerm(secondCoefficient, { [variable]: 1 }) + ')';
                    const addend = formatTerm(Math.abs(addendCoefficient), { [variable]: 2 });
                    const scenario = first + (addendCoefficient > 0 ? ' + ' + addend : ' − ' + addend);
                    question = { pattern: 1, scenario: scenario, expr: formatTerm(finalCoefficient, { [variable]: 2 }), vars: [variable] };
                } else if (pattern === 2) {
                    const secondVariable = randomVariable([variable]);
                    const c1 = getNonzeroInt(-9, 9);
                    const c2 = getNonzeroInt(-9, 9);
                    const c3 = getNonzeroInt(-9, 9);
                    const c4 = getNonzeroInt(-9, 9);
                    const operation = Math.random() < 0.5 ? 1 : -1;
                    const firstProduct = c1 * c2;
                    const secondProduct = c3 * c4;
                    const finalCoefficient = firstProduct + operation * secondProduct;
                    if (finalCoefficient === 0) continue;
                    const first = formatTerm(c1, { [variable]: 1 }) + '(' + formatTerm(c2, { [secondVariable]: 1 }) + ')';
                    const second = formatTerm(Math.abs(c3), { [secondVariable]: 1 }) + '(' + formatTerm(Math.abs(c4), { [variable]: 1 }) + ')';
                    const secondTermSign = operation * c3 * c4;
                    question = { pattern: 2, scenario: first + (secondTermSign > 0 ? ' + ' : ' − ') + second, expr: formatTerm(finalCoefficient, { [variable]: 1, [secondVariable]: 1 }), vars: [variable, secondVariable] };
                } else {
                    const secondVariable = randomVariable([variable]);
                    const c1 = getNonzeroInt(-9, 9);
                    const c2 = getNonzeroInt(-9, 9);
                    const c3 = getNonzeroInt(-9, 9);
                    const c4 = getNonzeroInt(-9, 9);
                    const operation = Math.random() < 0.5 ? 1 : -1;
                    const productCoefficient = c1 * c2;
                    const quadraticCoefficient = productCoefficient + operation * c3;
                    if (quadraticCoefficient === 0) continue;
                    const first = formatTerm(c1, { [variable]: 1 }) + '(' + formatTerm(c2, { [variable]: 1 }) + ')';
                    const quadraticTermCoefficient = operation * c3;
                    const quadratic = formatTerm(Math.abs(quadraticTermCoefficient), { [variable]: 2 });
                    const scenario = first + (quadraticTermCoefficient > 0 ? ' + ' : ' − ') + quadratic + (c4 > 0 ? ' + ' : ' − ') + formatTerm(Math.abs(c4), { [secondVariable]: 1 });
                    question = { pattern: 3, scenario: scenario, expr: formatSum([{ coef: quadraticCoefficient, vars: { [variable]: 2 } }, { coef: c4, vars: { [secondVariable]: 1 } }]), vars: [variable, secondVariable] };
                }
                if (isReferenceScenario(2, question.scenario)) continue;
                if (!checkSimplifiedForm(question.expr).valid) continue;
                return question;
            }
        }

        function generateMode2Question(requiredPattern) {
            const pattern = requiredPattern || getRandomInt(1, 3);
            return buildMode2Question(pattern);
        }

        function generateMode3Question(requiredType) {
            while (true) {
                const type = requiredType || getRandomInt(1, 3);
                const firstVariable = randomVariable();
                const firstValue = getNonzeroInt(-5, 5);
                let expression;
                let answer;
                let variables;
                let values;
                if (type === 1) {
                    const coefficient = getNonzeroInt(-9, 9);
                    const constant = getNonzeroInt(-9, 9);
                    expression = formatSum([{ coef: coefficient, vars: { [firstVariable]: 1 } }, { coef: constant, vars: {} }]);
                    answer = coefficient * firstValue + constant;
                    variables = [firstVariable];
                    values = { [firstVariable]: firstValue };
                } else if (type === 2) {
                    const secondVariable = randomVariable([firstVariable]);
                    const secondValue = getNonzeroInt(-5, 5);
                    const firstCoefficient = getNonzeroInt(-9, 9);
                    const secondCoefficient = getNonzeroInt(-9, 9);
                    const constant = getNonzeroInt(-9, 9);
                    expression = formatSum([
                        { coef: firstCoefficient, vars: { [firstVariable]: 1 } },
                        { coef: secondCoefficient, vars: { [secondVariable]: 1 } },
                        { coef: constant, vars: {} }
                    ]);
                    answer = firstCoefficient * firstValue + secondCoefficient * secondValue + constant;
                    variables = [firstVariable, secondVariable];
                    values = { [firstVariable]: firstValue, [secondVariable]: secondValue };
                } else {
                    const linearCoefficient = getNonzeroInt(-9, 9);
                    const constant = getNonzeroInt(-9, 9);
                    expression = formatSum([
                        { coef: 1, vars: { [firstVariable]: 2 } },
                        { coef: linearCoefficient, vars: { [firstVariable]: 1 } },
                        { coef: constant, vars: {} }
                    ]);
                    answer = firstValue * firstValue + linearCoefficient * firstValue + constant;
                    variables = [firstVariable];
                    values = { [firstVariable]: firstValue };
                }
                if (answer === 0 || !Number.isInteger(answer) || !checkSimplifiedForm(expression).valid) continue;
                const assignment = variables.map(function (variable) { return variable + ' = ' + String(values[variable]).replace('-', '−'); }).join('，');
                const scenario = '當 ' + assignment + ' 時，求 ' + expression + ' 的值。';
                if (isReferenceScenario(3, scenario)) continue;
                return {
                    type: type,
                    scenario: scenario,
                    expression: expression,
                    expr: String(answer),
                    answer: answer,
                    vars: variables,
                    values: values
                };
            }
        }

        function buildMode3SubstitutionExpression(question) {
            return buildMode3ExpressionTokens(question).tokens.map(function (token) {
                if (token.type === 'variable') return '(' + question.values[token.value] + ')';
                if (token.type === 'exponent') return '^' + token.value;
                return token.value;
            }).join('');
        }

        function formatMode3SubstitutionDisplay(question) {
            const expression = String(buildMode3SubstitutionExpression(question)).replace(/([0-9)])([+-])/g, '$1 $2 ');
            return formatDisplayMath(expression);
        }

        function buildMode3ExpressionTokens(question) {
            const source = String(question.expression);
            const variables = new Set(question.vars || []);
            const tokens = [];
            const slots = [];
            let cursor = 0;
            while (cursor < source.length) {
                const character = source[cursor];
                if (/\d/.test(character)) {
                    let end = cursor + 1;
                    while (end < source.length && /\d/.test(source[end])) end += 1;
                    tokens.push({ type: 'literal', value: source.slice(cursor, end) });
                    cursor = end;
                } else if (/[a-z]/i.test(character) && variables.has(character)) {
                    const slotIndex = slots.length;
                    tokens.push({ type: 'variable', value: character, slotIndex: slotIndex });
                    slots.push({ variable: character, selected: false, value: '', incorrect: false, correct: false });
                    cursor += 1;
                } else if (character === '^') {
                    const exponent = source.slice(cursor + 1).match(/^\d+/);
                    if (exponent) {
                        tokens.push({ type: 'exponent', value: exponent[0] });
                        cursor += exponent[0].length + 1;
                    } else {
                        tokens.push({ type: 'literal', value: character });
                        cursor += 1;
                    }
                } else if (character === '+' || character === '-') {
                    tokens.push({ type: 'operator', value: character });
                    cursor += 1;
                } else {
                    tokens.push({ type: 'literal', value: character });
                    cursor += 1;
                }
            }
            return { tokens: tokens, slots: slots };
        }

        function copyMode3Formula() {
            if (mode3FormulaCopied || !currentQ[3]) return;
            mode3FormulaCopied = true;
            document.getElementById('m3-copy-formula-btn').disabled = true;
            document.getElementById('m3-copy-formula-btn').innerHTML = '<i class="fa-solid fa-check mr-1"></i>已完成：公式已複製';
            renderMode3Expression();
            updateActionButton();
            setFocusField('m3-line1-input');
        }

        function selectMode3Variable(slotIndex) {
            const slot = mode3SubstitutionSlots[slotIndex];
            if (!mode3FormulaCopied || !slot || slot.selected || mode3LineState[1].done) return;
            slot.selected = true;
            renderMode3Expression();
            const allSelected = updateMode3InputAvailability();
            if (allSelected) {
                const firstSlot = mode3SubstitutionSlots.findIndex(function (item) { return !item.value; });
                setFocusField(firstSlot >= 0 ? 'm3-sub-slot-' + firstSlot : 'm3-line2-input');
            } else {
                setFocusField('m3-line1-input');
            }
            updateActionButton();
        }

        function renderMode3Expression() {
            const container = document.getElementById('m3-expression-tokens');
            if (!container) return;
            container.replaceChildren();
            if (!mode3FormulaCopied) {
                const placeholder = document.createElement('span');
                placeholder.className = 'text-sm font-sans font-medium text-slate-400';
                placeholder.textContent = '先按「複製公式」';
                container.appendChild(placeholder);
                updateMode3InputAvailability();
                return;
            }
            mode3ExpressionTokens.forEach(function (token, tokenIndex) {
                if (token.type === 'variable') {
                    const slot = mode3SubstitutionSlots[token.slotIndex];
                    if (!slot.selected) {
                        const variableButton = document.createElement('button');
                        variableButton.type = 'button';
                        variableButton.className = 'mode3-variable-token font-mono font-bold';
                        variableButton.textContent = token.value;
                        variableButton.setAttribute('aria-label', '第 ' + (token.slotIndex + 1) + ' 個未知數 ' + token.value + '，按 Enter 或點擊改成括號輸入框');
                        variableButton.setAttribute('aria-pressed', 'false');
                        variableButton.onclick = function (event) {
                            event.stopPropagation();
                            selectMode3Variable(token.slotIndex);
                        };
                        container.appendChild(variableButton);
                        return;
                    }

                    const group = document.createElement('span');
                    group.className = 'mode3-substitution-group';
                    group.appendChild(document.createTextNode('('));
                    const valueBox = document.createElement('span');
                    valueBox.id = 'm3-sub-slot-' + token.slotIndex + '-wrapper';
                    valueBox.className = 'mode3-slot-box font-mono font-bold';
                    if (slot.incorrect) valueBox.classList.add('border-rose-500', 'bg-rose-50', 'text-rose-900');
                    else if (slot.correct) valueBox.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-900');
                    valueBox.setAttribute('role', 'textbox');
                    valueBox.setAttribute('aria-readonly', 'true');
                    valueBox.setAttribute('aria-label', '第 ' + (token.slotIndex + 1) + ' 個括號，填入未知數 ' + slot.variable + ' 的值');
                    valueBox.setAttribute('aria-invalid', slot.incorrect ? 'true' : 'false');
                    valueBox.setAttribute('data-correct', slot.correct ? 'true' : 'false');
                    valueBox.setAttribute('data-locked', mode3LineState[1].done ? 'true' : 'false');
                    valueBox.textContent = slot.value ? slot.value.replace(/-/g, '−') : '□';
                    valueBox.onclick = function (event) {
                        event.stopPropagation();
                        setFocusField('m3-sub-slot-' + token.slotIndex);
                    };
                    valueBox.onkeydown = function (event) { handleMode3FieldKeydown(event, 'm3-sub-slot-' + token.slotIndex); };
                    group.appendChild(valueBox);
                    group.appendChild(document.createTextNode(')'));
                    container.appendChild(group);
                } else if (token.type === 'exponent') {
                    const exponent = document.createElement('sup');
                    exponent.textContent = token.value;
                    container.appendChild(exponent);
                } else {
                    const literal = document.createElement('span');
                    literal.textContent = token.type === 'operator'
                        ? tokenIndex === 0 ? (token.value === '-' ? '−' : '+') : ' ' + (token.value === '-' ? '−' : '+') + ' '
                        : token.value;
                    container.appendChild(literal);
                }
            });
            updateMode3InputAvailability();
        }

        function handleMode3FieldKeydown(event, fieldId) {
            if (event.key !== 'Enter' && event.key !== ' ') return;
            event.preventDefault();
            if (fieldId === 'm3-line2-input') focusMode3Answer();
            else setFocusField(fieldId);
        }

        function focusMode3Answer() {
            if (!mode3FormulaCopied || !isMode3AllVariablesSelected()) return;
            setFocusField('m3-line2-input');
        }

        function normalizeMode3Value(value) {
            return normalizeMathStr(value).replace(/[－﹣–—]/g, '-');
        }

        // ================= QUESTION LIFECYCLE AND DISPLAY =================
        function loadNewQuestion(modeNum) {
            questionCounts[modeNum] += 1;
            modeInputs[modeNum] = '';
            modeErrors[modeNum] = 0;
            modeGraded[modeNum] = false;
            currentBreakdownStep[modeNum] = 0;
            const feedback = document.getElementById('m' + modeNum + '-feedback');
            if (feedback) {
                feedback.classList.add('hidden');
                feedback.innerHTML = '';
            }
            if (modeNum === 1) currentQ[1] = generateMode1Question();
            else if (modeNum === 2) currentQ[2] = generateMode2Question();
            else currentQ[3] = generateMode3Question();

            const question = currentQ[modeNum];
            const scenario = document.getElementById('m' + modeNum + '-scenario');
            scenario.innerHTML = formatDisplayMath(question.scenario);
            document.getElementById('m' + modeNum + '-progress').textContent = '第 ' + questionCounts[modeNum] + ' 題';
            if (modeNum === 1) document.getElementById('m1-badge').textContent = question.type === 'mul' ? '代數乘法' : '代數加減';
            if (modeNum === 3) {
                mode3LineState = { 1: { errors: 0, done: false, correct: false }, 2: { errors: 0, done: false, correct: false } };
                mode3FormulaCopied = false;
                const tokenizedExpression = buildMode3ExpressionTokens(question);
                mode3ExpressionTokens = tokenizedExpression.tokens;
                mode3SubstitutionSlots = tokenizedExpression.slots;
                const copyButton = document.getElementById('m3-copy-formula-btn');
                copyButton.disabled = false;
                copyButton.innerHTML = '<i class="fa-solid fa-copy mr-1"></i>複製公式';
                renderMode3Expression();
                renderFieldDisplay('m3-line2-input-val', '', '輸入整數答案...');
                setMode3LineStatus(1, '', '');
                setMode3LineStatus(2, '', '');
                if (currentActiveMode === 3) setFocusField('m3-line1-input');
            } else {
                renderFieldDisplay('m' + modeNum + '-input-val', '', '點擊輸入化簡後代數式...');
            }
            updateKeypadButtons();
            updateActionButton();
        }

        function buildMode3PromptExpression(question) {
            const assignments = question.vars.map(function (variable) {
                return variable + ' = ' + String(question.values[variable]).replace(/-/g, '−');
