<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>載入中…</title>
<meta name="robots" content="noindex">
<!-- V2 (20260609): Firebase Auth + Google provider — 舊 bookmark 入口轉去 auth modal -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/teacher-allowlist.js"></script>
<!-- V2: 載入 auth-state.js 嚟讀 Firebase user state；data-no-auth-widget 隱藏 widget -->
<script src="../js/auth-state.js"></script>
<noscript>
  <meta http-equiv="refresh" content="0; url=/ai-learning/">
</noscript>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Microsoft YaHei", "Noto Sans TC", system-ui, sans-serif;
    background: #f5f7fa;
    color: #1a6fa3;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 16px;
    box-sizing: border-box;
    text-align: center;
  }
  .wrap { max-width: 380px; }
  h1 { font-size: 1.1rem; margin: 12px 0 8px; font-weight: 700; }
  p { font-size: 0.88rem; color: #555; line-height: 1.5; margin: 6px 0; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid #c8dff7;
    border-top-color: #2b9edb;
    border-radius: 50%;
    margin: 0 auto;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  a.fallback { display: inline-block; margin-top: 16px; color: #2b9edb; text-decoration: none; font-size: 0.85rem; }
  a.fallback:hover { text-decoration: underline; }
  .noscript-msg { color: #c0392b; }
</style>
</head>
<body data-no-auth-widget>
<div class="wrap">
  <div class="spinner" aria-hidden="true"></div>
  <h1>正在前往…</h1>
  <p>本站已改用頁內登入，<br>將為您帶到合適頁面並開啟登入。</p>
  <noscript>
    <p class="noscript-msg">⚠️ JavaScript 已停用。<br>請<a href="/ai-learning/" class="fallback">返回首頁</a>並喺右上角按「登入」。</p>
  </noscript>
  <a href="/ai-learning/" class="fallback">← 返回首頁（無需登入亦可使用所有教材）</a>
</div>
<script>
(function () {
  // 沿用 V1 §6.1 規則：returnTo 必須 resolve 到 /ai-learning/ 之下嘅同源 path
  // 拒絕 protocol-relative、cross-origin、非 http(s) scheme
  var PROJECT_BASE = '/ai-learning/';
  var ALLOW_DEFAULT = '/ai-learning/';

  function computeReturnTo() {
    try {
      var raw = new URLSearchParams(window.location.search).get('returnTo');
      if (!raw || typeof raw !== 'string' || raw.length === 0 || raw.length > 200) return null;
      // 拒絕含 protocol / protocol-relative
      if (/^[a-z][a-z0-9+.-]*:/i.test(raw) || raw.indexOf('//') === 0) return null;
      var origin = window.location.origin;
      var u;
      if (raw.charAt(0) === '/') {
        u = new URL(raw, origin);
      } else {
        u = new URL(raw, origin + PROJECT_BASE);
      }
      var resolved = u.pathname + u.search + u.hash;
      if (resolved.indexOf(PROJECT_BASE) !== 0) return null;
      // V2 §8.9: 已登入判斷以 Firebase user 為準（js/auth-state.js）
      // auth-state.js 已同步載入；當 state === 'student'/'teacher' 表示已登入
      var dest = resolved;
      try {
        var isLoggedIn = (typeof AuthState !== 'undefined' && AuthState.get)
          ? (function(){
              var s = AuthState.get();
              return s.state === 'student' || s.state === 'teacher';
            })()
          : false;
        if (!isLoggedIn) {
          // 加 auth=open 提示目標頁開 modal
          if (dest.indexOf('?') === -1) {
            dest += '?auth=open';
          } else {
            dest += '&auth=open';
          }
        }
      } catch (e) { /* AuthState 讀唔到 → 仍帶 auth=open 唔影響 */ }
      return dest;
    } catch (e) { return null; }
  }

  // 選擇 fallback 目的：首頁
  // - 未登入：首頁 + ?auth=open（自動開登入 modal）
  // - 已登入：首頁（直接睇已登入 UI）
  function computeFallback() {
    try {
      var isLoggedIn = (typeof AuthState !== 'undefined' && AuthState.get)
        ? (function(){
            var s = AuthState.get();
            return s.state === 'student' || s.state === 'teacher';
          })()
        : false;
      return isLoggedIn ? ALLOW_DEFAULT : ALLOW_DEFAULT + '?auth=open';
    } catch (e) {
      return ALLOW_DEFAULT + '?auth=open';
    }
  }

  // V2 Codex fix #3: returnTo 要完整保留；fallback 不可一律返首頁
  // 原邏輯：失敗一律 return home + auth=open — 丢弃咗 returnTo
  // 新邏輯：
  //   1. 計算 finalDest = computeReturnTo() || computeFallback()
  //   2. 等 AuthState.whenReady()（200-500ms 一般）
  //   3. whenReady resolve 後重新計算 finalDest（為咗「已登入」後不加 auth=open）
  //   4. fallback timeout 1.5s — 但以 clearTimeout 避免和 whenReady 競爭
  var finalDest = computeReturnTo() || computeFallback();
  var fallbackTimer = null;
  var hasRedirected = false;
  var safeRedirect = function (url) {
    if (hasRedirected) return;
    hasRedirected = true;
    if (fallbackTimer) { clearTimeout(fallbackTimer); fallbackTimer = null; }
    try { window.location.replace(url); } catch (e) { /* noop */ }
  };

  if (typeof AuthState !== 'undefined' && AuthState.whenReady) {
    AuthState.whenReady().then(function () {
      // Firebase 已 resolve，重新計算 dest（可能改 auth=open 邏輯）
      var dest2 = computeReturnTo() || computeFallback();
      safeRedirect(dest2);
    }).catch(function () {
      // whenReady 出錯 → 用原本 finalDest（保留 returnTo）
      safeRedirect(finalDest);
    });
    // 安全 timeout：1.5s 後無 resolve → 用 original finalDest（保留 returnTo）
    fallbackTimer = setTimeout(function () {
      safeRedirect(finalDest);
    }, 1500);
  } else {
    // 冇 auth-state.js → 60ms redirect（保留 V1 行為）
    setTimeout(function () { window.location.replace(finalDest); }, 60);
  }
})();
</script>
</body>
</html>
