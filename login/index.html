<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>學生登入 — AI Learning</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Noto Sans TC',sans-serif;background:linear-gradient(180deg,#eef6ff,#f7fbff);display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
.card{background:#fff;padding:24px;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,0.08);width:360px}
.h{font-size:1.2rem;margin-bottom:8px}
.input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #ddd;margin-bottom:10px}
.btn{background:#2b9edb;color:#fff;padding:10px 12px;border:none;border-radius:8px;width:100%;font-weight:700;cursor:pointer}
.small{font-size:0.9rem;color:#666;margin-top:8px}
</style>
</head>
<body>
<div class="card">
  <div class="h">學生登入</div>
  <select id="classSel" class="input"></select>
  <input id="number" class="input" placeholder="學號 (例: 01)">
  <input id="password" class="input" placeholder="密碼">
  <button class="btn" onclick="login()">登入</button>
  <div class="small">忘記密碼？請聯絡老師或使用修改密碼頁面。</div>
</div>
<script>
const GWS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxOEQayiL85PVPV5XkxqiclQIfhqu-5qs8M1acvaPkPHdZR1kxmNlEitagNhe-b8veRbg/exec';
const CLASSES = ['1A','1B','1C'];
const classSel = document.getElementById('classSel');
CLASSES.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;classSel.appendChild(o)});

async function login(){
  const cls = classSel.value; const number=document.getElementById('number').value.trim(); const pwd=document.getElementById('password').value.trim();
  if(!number||!pwd){alert('請輸入學號與密碼');return}
  const payload={action:'login', class:cls, number:number, password:pwd};
  try{
    const resp = await fetch(GWS_ENDPOINT, {method:'POST', body:JSON.stringify(payload), headers:{'Content-Type':'application/json'}});
    const j = await resp.json();
    if(j.success){
      localStorage.setItem('student_token', j.token);
      localStorage.setItem('student_name', j.name);
      localStorage.setItem('student_class', cls);
      localStorage.setItem('student_number', number);
      window.location.href='/student/dashboard/index.html';
    } else {
      alert('登入失敗：' + (j.error||'')); 
    }
  }catch(e){alert('登入錯誤：'+e.message)}
}
</script>
</body>
</html>
