<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>學生登入 — AI Learning</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Noto Sans TC',sans-serif;background:linear-gradient(180deg,#eef6ff,#f7fbff);display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:16px;box-sizing:border-box}
.card{background:#fff;padding:24px;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,0.08);width:100%;max-width:360px}
.h{font-size:1.2rem;margin-bottom:8px;font-weight:700}
.input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #ddd;margin-bottom:10px;box-sizing:border-box;font-size:1rem;font-family:inherit}
.btn{background:#2b9edb;color:#fff;padding:10px 12px;border:none;border-radius:8px;width:100%;font-weight:700;cursor:pointer;font-size:1rem}
.btn:disabled{background:#aaa;cursor:not-allowed}
.small{font-size:0.85rem;color:#666;margin-top:10px;line-height:1.5}
.note{font-size:0.78rem;color:#999;margin-top:12px;padding:10px;background:#f5f7fa;border-radius:6px;line-height:1.5}
.back-link{display:block;margin-top:12px;font-size:0.85rem;color:#2b9edb;text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="h">🔑 學生登入</div>
  <select id="classSel" class="input" aria-label="班別"></select>
  <input id="number" class="input" placeholder="學號 (例: 01)" aria-label="學號">
  <input id="password" class="input" type="password" placeholder="密碼" aria-label="密碼">
  <button class="btn" id="loginBtn" onclick="login()">登入</button>
  <div class="small">忘記密碼？請聯絡老師或使用修改密碼頁面。</div>
  <div class="note">
    ℹ️ 登入後可使用學習紀錄、Dashboard 等個人功能。<br>
    未登入學生仍可由首頁直接使用所有教材、練習及考試工具。<br>
    <strong>注意：</strong>目前登入系統使用 Google Apps Script 驗證，尚未接入 Firebase 身份系統。
  </div>
  <a href="../index.html" class="back-link">← 返回首頁（無需登入）</a>
</div>
<script src="../js/auth-state.js"></script>
<script>
const GWS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbw-g1j2jvyuXoVbUdCMuR6Ch_UF5nynQKb0W4cNAN9RZeuoCLwpfn78kYyOgPf8CtQJlA/exec';
const CLASSES = ['1A','1B','1C','T'];
const classSel = document.getElementById('classSel');
CLASSES.forEach(function(c){ var o=document.createElement('option'); o.value=c; o.textContent=c; classSel.appendChild(o); });

// 讀取 returnTo 參數（登入後跳轉目標）
// 嚴格驗證：必須 resolve 到 /ai-learning/ 之下嘅同源 path，唔可以 escape
//
// 規則（見 PLANNING/20260608_GLOBAL_LOGIN_FIREBASE_V1.md §6.1）：
//   - Protocol-relative (//evil.com) / absolute URL (https://evil.com) → reject
//   - javascript:/data: 等 non-http scheme → reject
//   - Relative path（如 student/dashboard/index.html）→ 以 /ai-learning/ 為 base resolve
//     （唔係以 window.location.href 為 base，否則會錯誤指去 /login/ 之下）
//   - Absolute path（如 /ai-learning/games-index.html）→ 以 origin 為 base
//   - 任何 path 喺 normalize 之後必須 startsWith('/ai-learning/')，否則 reject
//   - 缺參數 / 空字串 / >200 chars → reject
//
// 例子：
//   ?returnTo=student/dashboard/index.html → /ai-learning/student/dashboard/index.html ✅
//   ?returnTo=games-index.html             → /ai-learning/games-index.html             ✅
//   ?returnTo=//evil.com/foo               → null （reject）
//   ?returnTo=/etc/passwd                  → null （reject，唔喺 /ai-learning/ 之下）
var PROJECT_BASE = '/ai-learning/';
var returnTo = (function(){
  try {
    var p = new URLSearchParams(window.location.search);
    var r = p.get('returnTo');
    if (!r || typeof r !== 'string' || r.length === 0 || r.length > 200) return null;
    // 拒絕 protocol-relative 同帶 scheme 嘅 absolute URL
    if (/^[a-z][a-z0-9+.-]*:/i.test(r) || r.startsWith('//')) return null;
    var origin = window.location.origin;
    var u;
    if (r.charAt(0) === '/') {
      // 絕對 path：以 origin 為 base
      u = new URL(r, origin);
    } else {
      // 相對 path：以 PROJECT_BASE 為 base（唔係 window.location.href）
      u = new URL(r, origin + PROJECT_BASE);
    }
    var resolved = u.pathname + u.search + u.hash;
    if (resolved.indexOf(PROJECT_BASE) !== 0) return null;
    return resolved;
  } catch(e){ return null; }
})();

// 如果已經以 legacy student 登入，直接跳轉
if (typeof AuthState !== 'undefined' && AuthState.isLegacyStudent()) {
  var dest = returnTo || '../student/dashboard/index.html';
  window.location.replace(dest);
}

async function login(){
  var btn = document.getElementById('loginBtn');
  var cls = classSel.value;
  var number = document.getElementById('number').value.trim();
  var pwd = document.getElementById('password').value.trim();
  if(!number||!pwd){alert('請輸入學號與密碼');return;}
  btn.disabled = true;
  btn.textContent = '登入中…';
  var payload = {action:'login', class:cls, number:number, password:pwd};
  try{
    var resp = await fetch(GWS_ENDPOINT, {method:'POST', body:JSON.stringify(payload), headers:{'Content-Type':'application/json'}});
    var j = await resp.json();
    if(j.success){
      localStorage.setItem('student_token', j.token);
      localStorage.setItem('student_name', j.name);
      localStorage.setItem('student_class', cls);
      localStorage.setItem('student_number', number);
      // 登入成功：優先跳轉 returnTo（已驗證同源），否則去 Dashboard
      var dest = returnTo || '../student/dashboard/index.html';
      window.location.href = dest;
    } else {
      alert('登入失敗：' + (j.error||'請確認學號與密碼'));
      btn.disabled = false;
      btn.textContent = '登入';
    }
  } catch(e) {
    alert('登入錯誤：' + e.message);
    btn.disabled = false;
    btn.textContent = '登入';
  }
}

// Enter key 支援
document.getElementById('password').addEventListener('keypress', function(e){ if(e.key==='Enter') login(); });
</script>
</body>
</html>
