<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>載入中…</title>
<meta name="robots" content="noindex">
<noscript>
  <meta http-equiv="refresh" content="0; url=/ai-learning/">
</noscript>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Microsoft YaHei", "Noto Sans TC", system-ui, sans-serif;
    background: #f5f7fa;
    color: #1a6fa3;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 16px;
    box-sizing: border-box;
    text-align: center;
  }
  .wrap { max-width: 380px; }
  h1 { font-size: 1.1rem; margin: 12px 0 8px; font-weight: 700; }
  p { font-size: 0.88rem; color: #555; line-height: 1.5; margin: 6px 0; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid #c8dff7;
    border-top-color: #2b9edb;
    border-radius: 50%;
    margin: 0 auto;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  a.fallback { display: inline-block; margin-top: 16px; color: #2b9edb; text-decoration: none; font-size: 0.85rem; }
  a.fallback:hover { text-decoration: underline; }
  .noscript-msg { color: #c0392b; }
</style>
</head>
<body data-no-auth-widget>
<div class="wrap">
  <div class="spinner" aria-hidden="true"></div>
  <h1>正在前往…</h1>
  <p>本站已改用 Google 登入，<br>將為您帶到合適頁面並開啟右上角登入。</p>
  <noscript>
    <p class="noscript-msg">⚠️ JavaScript 已停用。<br>請<a href="/ai-learning/" class="fallback">返回首頁</a>並喺右上角按「登入」。</p>
  </noscript>
  <a href="/ai-learning/" class="fallback">← 返回首頁（無需登入亦可使用所有教材）</a>
</div>
<script>
/**
 * V3: login/index.html 係純兼容 redirect shim。
 * 唔再寫 legacy keys、唔再 call GAS endpoint、唔再顯示 class/number/password 表單。
 * 已登入（Firebase user）→ 直接 returnTo 或首頁。
 * 未登入 → returnTo（widget 已喺目標頁右上角，用戶可自行按「登入」）。
 */
(function () {
  var PROJECT_BASE = '/ai-learning/';
  var ALLOW_DEFAULT = '/ai-learning/';

  function computeReturnTo() {
    try {
      var raw = new URLSearchParams(window.location.search).get('returnTo');
      if (!raw || typeof raw !== 'string' || raw.length === 0 || raw.length > 200) return null;
      if (/^[a-z][a-z0-9+.-]*:/i.test(raw) || raw.indexOf('//') === 0) return null;
      var origin = window.location.origin;
      var u;
      if (raw.charAt(0) === '/') {
        u = new URL(raw, origin);
      } else {
        u = new URL(raw, origin + PROJECT_BASE);
      }
      var resolved = u.pathname + u.search + u.hash;
      if (resolved.indexOf(PROJECT_BASE) !== 0) return null;
      return resolved;
    } catch (e) { return null; }
  }

  var dest = computeReturnTo() || ALLOW_DEFAULT;
  // 用 replace 避免留下 login 喺 history
  // 等一格 paint 先 redirect 咁 spinner 至少見得到
  setTimeout(function () { window.location.replace(dest); }, 60);
})();
</script>
</body>
</html>
