<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S1 Ch8｜近似值與數值估算｜AI Learning</title>
  <link rel="stylesheet" href="css/site-layout.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .shell { max-width: 1180px; margin: 0 auto; }
    .content { padding: clamp(14px, 2.5vw, 28px); }
    .panel-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
    .panel-heading h2 { margin: 0; color: var(--layout-ink); }
    .practice-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 15px; }
    .practice-card { min-width: 0; display: flex; flex-direction: column; border: 1px solid var(--layout-line); border-top: 4px solid var(--layout-grade-s1); border-radius: 14px; padding: 18px; background: var(--layout-surface); }
    .exercise-kicker { margin-bottom: 7px; color: var(--layout-muted); font-size: .9rem; font-weight: 700; }
    .practice-card h3 { margin: 0 0 6px; color: var(--layout-ink); }
    .practice-card p { flex: 1; margin: 0 0 14px; color: var(--layout-muted); }
    .tool-link { display: inline-flex; align-items: center; justify-content: center; align-self: flex-start; min-height: 44px; border: 1px solid var(--layout-primary); border-radius: 10px; padding: 9px 14px; background: var(--layout-primary); color: #fff; font-weight: 700; text-decoration: none; }
    .tool-link:hover { filter: brightness(.94); }
    footer { margin-top: 22px; color: var(--layout-muted); text-align: center; font-size: .9rem; }
    @media (max-width: 640px) {
      .practice-card { padding: 16px; }
    }
  </style>
</head>
<body class="responsive-layout responsive-layout--course responsive-layout--s1-course responsive-layout--s1-ch8-course">
<main class="shell page-shell">
  <header class="hero">
    <div class="hero-top">
      <a class="back-link pill" href="index.html">← 返回 S1 課程頁</a>
      <span class="chapter-code layout-chapter-badge">S1 · Ch8</span>
      <div class="layout-auth-slot"></div>
    </div>
    <h1>Ch8｜近似值與數值估算</h1>
  </header>
  <div class="content">
    <section id="practice" role="region" aria-labelledby="practice-heading">
      <div class="panel-heading">
        <h2 id="practice-heading">互動練習</h2>
      </div>
      <div class="practice-grid">
        <article class="practice-card">
          <span class="exercise-kicker">S1Ch8Ex1 · 例題 8.1–8.5</span>
          <h3>近似值：上捨入、下捨入及四捨五入</h3>
          <p>捨入至指定位值、小數位或有效數字；可剔選題目類型，混合出題。對應例題 8.1–8.5。</p>
          <a class="tool-link" href="S1Ch8Ex1.html">開始互動練習</a>
        </article>
      </div>
    </section>
    <footer>S1 Ch8 · 近似值與數值估算</footer>
  </div>
</main>
</body>
</html>
