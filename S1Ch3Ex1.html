    <style>

        .print-only { display: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; font-size: 12pt; height: auto !important; overflow: visible !important; }
            .print-only { display: block !important; }
            @page { size: A4 portrait; margin: 10mm; }
            .worksheet-page { width: 190mm !important; height: 265mm !important; box-sizing: border-box !important; page-break-after: always; page-break-inside: avoid; margin: 0 !important; padding: 8mm !important; overflow: hidden !important; }
            .worksheet-page:last-child { page-break-after: auto; }
            .worksheet-page-content { height: 100%; display: flex; flex-direction: column; }
            .worksheet-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8mm; border-bottom: 0.5mm solid #1e293b; padding-bottom: 3mm; }
            .worksheet-title { margin: 0; font-size: 15pt; line-height: 1.2; font-weight: 700; }
            .worksheet-meta { margin: 2mm 0 0; font-size: 9pt; line-height: 1.45; }
            .worksheet-qr { flex: 0 0 24mm; width: 24mm; height: 24mm; }
            .worksheet-qr img, .worksheet-qr canvas { display: block; width: 24mm !important; height: 24mm !important; }
            .worksheet-section-title { margin: 4mm 0 2mm; font-size: 12pt; line-height: 1.2; font-weight: 700; }
            .worksheet-short-section { flex: 1 1 auto; min-height: 0; }
            .worksheet-short-group { margin-bottom: 3mm; }
            .worksheet-short-group-title { margin: 0 0 1mm; font-size: 10pt; font-weight: 700; }
            .worksheet-short-row { display: grid; grid-template-columns: minmax(0, 1fr) 82mm; gap: 3mm; align-items: baseline; min-height: 9mm; padding: 1mm 0; border-bottom: 0.25mm solid #cbd5e1; font-size: 9pt; line-height: 1.35; }
            .worksheet-short-prompt { min-width: 0; }
            .worksheet-short-answer { white-space: nowrap; }
            .worksheet-blank { display: inline-block; min-width: 34mm; border-bottom: 0.25mm solid #334155; height: 1em; vertical-align: baseline; }
            .worksheet-problem-section { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
            .worksheet-problems { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 3mm; }
            .worksheet-problem { flex: 1 1 0; min-height: 0; padding: 2mm 0; font-size: 9pt; line-height: 1.4; }
            .worksheet-problem-title { margin: 0; font-weight: 700; }
            .worksheet-framework { margin: 2mm 0 0 10mm; line-height: 1.8; }
            .worksheet-framework .aligned-equals { padding-left: 0; }
            .worksheet-framework-blank { display: inline-block; min-width: 86mm; border-bottom: 0.25mm solid #334155; height: 1em; vertical-align: baseline; }
            .worksheet-answer-space { flex: 1 1 auto; min-height: 25mm; margin-top: 2mm; border: 0; background: none; }
            .worksheet-answer-strip { margin-top: auto; padding-top: 3mm; border-top: 0.25mm dashed #64748b; font-size: 8pt; line-height: 1.35; }
            .worksheet-fold-label { text-align: center; font-size: 7pt; color: #64748b; margin-bottom: 1mm; }
            .worksheet-answer-strip-content { transform: rotate(180deg); transform-origin: center; }
        }
        @media screen and (max-width: 420px) {
            #keypad-grid button { min-width: 0; }
        }

</head>
<body class="bg-slate-50 text-slate-800 h-[100dvh] flex flex-col overflow-hidden">
    <header class="bg-white shadow-sm border-b border-slate-200 z-40 no-print flex-shrink-0">
        <div class="max-w-4xl mx-auto px-3 py-2 flex flex-wrap justify-between items-center gap-1">
            <div class="flex items-center space-x-2 min-w-0">
                <div class="bg-blue-600 text-white p-1.5 rounded-lg shadow-sm"><i class="fa-solid fa-square-root-variable text-sm"></i></div>
                <div class="min-w-0">
                    <h1 class="text-xs sm:text-sm font-bold text-slate-900 leading-tight truncate">S1 Ch3 Ex1 數學互動練習</h1>

                <div class="grid grid-cols-2 sm:flex gap-1 w-full sm:w-auto">
                    <button onclick="switchMode(1)" id="btn-mode-1" class="mode-tab px-2 py-1 rounded-md transition-all text-xs font-medium text-slate-600 hover:text-blue-600 whitespace-nowrap text-center">① 有向數文字</button>
                    <button onclick="switchMode(2)" id="btn-mode-2" class="mode-tab px-2 py-1 rounded-md transition-all text-xs font-medium text-slate-600 hover:text-blue-600 whitespace-nowrap text-center">② 完整文字題</button>
                    <button onclick="switchMode(3)" id="btn-mode-3" class="mode-tab px-2 py-1 rounded-md transition-all text-xs font-medium text-slate-600 hover:text-blue-600 whitespace-nowrap text-center">③ 和差積商</button>
                    <button onclick="switchMode(4)" id="btn-mode-4" class="mode-tab px-2 py-1 rounded-md transition-all text-xs font-medium text-slate-600 hover:text-blue-600 whitespace-nowrap text-center">④ 文字轉代數式</button>

    <main class="max-w-2xl w-full mx-auto px-3 py-2 flex-grow min-h-0 overflow-y-auto no-scrollbar flex flex-col no-print">

                <div class="bg-slate-50 border border-slate-200 rounded-lg p-3 mb-3 text-center"><p id="m1-ref-text" class="text-xs text-blue-600 font-medium mb-1"></p><h2 id="m1-scenario" class="text-base sm:text-lg font-bold text-slate-800"></h2></div>
                <div class="max-w-sm mx-auto space-y-2.5"><div onclick="setFocusField('m1-input')" id="m1-input-wrapper" class="border-2 border-blue-500 rounded-xl px-3 py-2 bg-white font-mono font-bold text-lg text-slate-800 min-h-[44px] flex items-center cursor-pointer shadow-sm"><span id="m1-prefix-lbl" class="text-slate-500 mr-1.5 font-sans text-sm"></span><span id="m1-input-val" class="text-slate-400">點擊輸入...</span></div><div id="m1-feedback" class="hidden p-2 rounded-lg text-xs font-medium text-center"></div></div>
            </div>
        </div>

        <div id="mode-2-container" class="space-y-3 hidden">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 animate-fade-in">
                <div class="flex justify-between items-center mb-2"><span class="bg-purple-100 text-purple-800 text-[11px] font-bold px-2 py-0.5 rounded-full">模式二：完整文字題分步解題</span><div class="flex items-center gap-1.5"><span id="m2-progress" class="text-xs text-slate-500 font-medium"></span><button onclick="openHintModal()" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-[11px] font-bold px-2 py-1 rounded-lg transition-all flex items-center gap-1 shadow-sm"><i class="fa-solid fa-lightbulb"></i> 題解</button></div></div>
                <div class="bg-slate-50 border border-slate-200 rounded-lg p-3 mb-3"><p class="text-[11px] text-slate-500 uppercase tracking-wider mb-0.5 font-semibold">文字應用題</p><h2 id="m2-scenario" class="text-sm sm:text-base font-bold text-slate-800 leading-snug"></h2></div>
                <div class="space-y-2.5 max-w-xl mx-auto">
                    <div id="m2-step-2-box" class="border border-slate-200 rounded-lg p-3 bg-white transition-all"><div class="flex justify-between items-center mb-1"><h3 class="text-xs font-bold text-slate-700 flex items-center"><span class="w-5 h-5 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center text-[11px]">2</span></h3><span id="m2-s2-status" class="text-[11px] font-semibold text-blue-600">進行中</span></div><div class="max-w-[20rem]"><div onclick="setFocusField('m2-input-s2')" id="m2-input-s2-wrapper" class="border-2 border-blue-500 rounded-lg px-2.5 py-1.5 bg-white font-mono font-bold text-xs min-h-[36px] flex items-center cursor-pointer shadow-sm"><span id="m2-prefix-s2" class="text-slate-600 mr-1 font-sans text-xs"></span><span id="m2-input-s2-val" class="text-slate-400">點擊輸入...</span></div></div><p id="m2-msg-s2" class="text-[11px] hidden mt-1"></p></div>
                    <div id="m2-step-3-box" class="border border-slate-200 rounded-lg p-3 bg-slate-50 opacity-60 pointer-events-none transition-all"><div class="flex justify-between items-center mb-1"><h3 class="text-xs font-bold text-slate-700 flex items-center"><span id="m2-s3-badge" class="w-5 h-5 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center text-[11px]">3</span></h3><span id="m2-s3-status" class="text-[11px] font-semibold text-slate-400">等待解鎖</span></div><div class="max-w-[20rem]"><div onclick="setFocusField('m2-input-s3')" id="m2-input-s3-wrapper" class="border-2 border-slate-300 rounded-lg px-2.5 py-1.5 bg-white font-mono font-bold text-xs min-h-[36px] flex items-center cursor-pointer shadow-sm"><span class="text-slate-600 mr-1 font-sans text-xs">=</span><span id="m2-input-s3-val" class="text-slate-400">點擊輸入...</span></div></div><p id="m2-msg-s3" class="text-[11px] hidden mt-1"></p></div>
                    <div id="m2-step-4-box" class="border border-slate-200 rounded-lg p-3 bg-slate-50 opacity-60 pointer-events-none transition-all"><div class="flex justify-between items-center mb-1"><h3 class="text-xs font-bold text-slate-700 flex items-center"><span id="m2-s4-badge" class="w-5 h-5 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center text-[11px]">4</span></h3><span id="m2-s4-status" class="text-[11px] font-semibold text-slate-400">等待解鎖</span></div><div class="max-w-[20rem]"><div onclick="setFocusField('m2-input-s4')" id="m2-input-s4-wrapper" class="border-2 border-slate-300 rounded-lg px-2.5 py-1.5 bg-white font-mono font-bold text-xs min-h-[36px] flex items-center cursor-pointer shadow-sm"><span class="text-slate-600 mr-1 font-sans text-xs">=</span><span id="m2-input-s4-val" class="text-slate-400">點擊輸入...</span></div></div><p id="m2-msg-s4" class="text-[11px] hidden mt-1"></p></div>
                    <div id="m2-step-5-box" class="border border-slate-200 rounded-lg p-3 bg-slate-50 opacity-60 pointer-events-none transition-all"><div class="flex justify-between items-center mb-1"><h3 class="text-xs font-bold text-slate-700 flex items-center gap-1.5"><span id="m2-s5-badge" class="w-5 h-5 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center text-[11px]">5</span>填寫文字答句</h3><span id="m2-s5-status" class="text-[11px] font-semibold text-slate-400">等待解鎖</span></div><div class="bg-slate-50 border border-slate-200 rounded-lg p-2.5 flex flex-wrap items-center gap-1.5 text-xs"><span id="m2-sentence-prefix"></span><button onclick="toggleSentenceChoice()" id="m2-choice-btn" class="bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded-md border border-blue-200 shadow-sm transition-all hover:bg-blue-200">[上升/下降]</button><div onclick="setFocusField('m2-input-s5')" id="m2-input-s5-wrapper" class="w-28 border-2 border-slate-300 rounded-md px-2 py-1 bg-white font-mono font-bold text-xs min-h-[34px] flex items-center cursor-pointer shadow-sm"><span id="m2-input-s5-val" class="text-slate-400">點擊輸入...</span></div><span>。</span></div><p id="m2-msg-s5" class="text-[11px] hidden mt-1"></p></div>
                </div>
            </div>
        </div>

        <div id="mode-3-container" class="space-y-3 hidden"><div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 animate-fade-in"><div class="flex justify-between items-center mb-2"><span class="bg-emerald-100 text-emerald-800 text-[11px] font-bold px-2 py-0.5 rounded-full">模式三：和差積商代數式</span><span id="m3-progress" class="text-xs text-slate-500 font-medium"></span></div><div class="bg-slate-50 border border-slate-200 rounded-lg p-3 mb-3 text-center"><p class="text-[11px] text-slate-500 uppercase tracking-wider mb-1 font-semibold">請將以下文字敘述寫成代數式</p><h2 id="m3-scenario" class="text-sm sm:text-base font-bold text-slate-800"></h2></div><div class="max-w-sm mx-auto space-y-2.5"><label class="block text-xs font-medium text-slate-700 mb-1">代數式 (無需寫等號左邊)</label><div onclick="setFocusField('m3-input')" id="m3-input-wrapper" class="border-2 border-emerald-500 rounded-xl px-3 py-2 bg-white font-mono font-bold text-lg text-slate-800 min-h-[44px] flex items-center cursor-pointer shadow-sm"><span id="m3-input-val" class="text-slate-400">點擊輸入代數式...</span></div><div id="m3-feedback" class="hidden p-2 rounded-lg text-xs font-medium text-center"></div></div></div></div>

        <div id="mode-4-container" class="space-y-3 hidden"><div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 animate-fade-in"><div class="flex justify-between items-center mb-2"><span class="bg-amber-100 text-amber-800 text-[11px] font-bold px-2 py-0.5 rounded-full">模式四：文字題轉代數式</span><span id="m4-progress" class="text-xs text-slate-500 font-medium"></span></div><div class="bg-slate-50 border border-slate-200 rounded-lg p-3 mb-3 text-center"><p class="text-[11px] text-slate-500 uppercase tracking-wider mb-1 font-semibold">請將以下文字情境改寫成代數式連單位</p><h2 id="m4-scenario" class="text-sm sm:text-base font-bold text-slate-800"></h2></div><div class="max-w-sm mx-auto space-y-2.5"><label class="block text-xs font-medium text-slate-700 mb-1">代數式 (連單位)</label><div onclick="setFocusField('m4-input')" id="m4-input-wrapper" class="border-2 border-amber-500 rounded-xl px-3 py-2 bg-white font-mono font-bold text-lg text-slate-800 min-h-[44px] flex items-center cursor-pointer shadow-sm"><span id="m4-input-val" class="text-slate-400">點擊輸入代數式與單位...</span></div><div id="m4-feedback" class="hidden p-2 rounded-lg text-xs font-medium text-center"></div></div></div></div>
    </main>

    <div id="hint-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden"><div class="bg-white rounded-xl max-w-md w-full p-5 shadow-xl animate-fade-in space-y-3"><div class="flex justify-between items-center border-b border-slate-100 pb-2"><h3 class="font-bold text-slate-800 text-sm flex items-center gap-1.5"><i class="fa-solid fa-lightbulb text-amber-500"></i> 本題當前步驟解題提示</h3><button onclick="closeHintModal()" class="text-slate-400 hover:text-slate-600 font-bold text-base px-2">&times;</button></div><div id="hint-content" class="text-slate-600 text-xs sm:text-sm space-y-1.5 leading-relaxed"></div><div class="flex justify-end pt-1"><button onclick="closeHintModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-3 py-1.5 rounded-lg text-xs transition-all">關閉提示</button></div></div></div>
    <div id="print-worksheet-container" class="print-only"></div>

    <div id="bottom-keypad-container" class="bg-white border-t border-slate-300 shadow-2xl z-40 p-1.5 sm:p-2 no-print flex-shrink-0">
        <div class="max-w-xl mx-auto space-y-1"><div id="keypad-grid" class="space-y-1">
          <div class="keypad-row grid grid-cols-7 gap-1">
            <button onclick="pressKey('7')" class="key bg-slate-100 hover:bg-slate-200 active:bg-slate-300 py-2 rounded-md font-bold text-sm shadow-sm">7</button><button onclick="pressKey('8')" class="key bg-slate-100 hover:bg-slate-200 active:bg-slate-300 py-2 rounded-md font-bold text-sm shadow-sm">8</button><button onclick="pressKey('9')" class="key bg-slate-100 hover:bg-slate-200 active:bg-slate-300 py-2 rounded-md font-bold text-sm shadow-sm">9</button><button onclick="pressKey('+')" class="key bg-blue-50 text-blue-700 hover:bg-blue-100 active:bg-blue-200 py-2 rounded-md font-bold text-sm shadow-sm">+</button><button onclick="pressKey('-')" class="key bg-blue-50 text-blue-700 hover:bg-blue-100 active:bg-blue-200 py-2 rounded-md font-bold text-sm shadow-sm">-</button><button onclick="pressKey('(')" class="key bg-slate-100 hover:bg-slate-200 active:bg-slate-300 py-2 rounded-md font-bold text-sm shadow-sm">(</button><button onclick="pressKey(')')" class="key bg-slate-100 hover:bg-slate-200 active:bg-slate-300 py-2 rounded-md font-bold text-sm shadow-sm">)</button>
          </div>
          <div class="keypad-row grid grid-cols-7 gap-1">
            <button onclick="pressKey('4')" class="key bg-slate-100 hover:bg-slate-200 active:bg-slate-300 py-2 rounded-md font-bold text-sm shadow-sm">4</button><button onclick="pressKey('5')" class="key bg-slate-100 hover:bg-slate-200 active:bg-slate-300 py-2 rounded-md font-bold text-sm shadow-sm">5</button><button onclick="pressKey('6')" class="key bg-slate-100 hover:bg-slate-200 active:bg-slate-300 py-2 rounded-md font-bold text-sm shadow-sm">6</button><button onclick="pressKey('*')" class="key bg-blue-50 text-blue-700 hover:bg-blue-100 active:bg-blue-200 py-2 rounded-md font-bold text-sm shadow-sm">×</button><button onclick="pressKey('/')" class="key bg-blue-50 text-blue-700 hover:bg-blue-100 active:bg-blue-200 py-2 rounded-md font-bold text-sm shadow-sm">÷</button><button onclick="pressBackspace()" class="key bg-rose-50 text-rose-700 hover:bg-rose-100 active:bg-rose-200 py-2 rounded-md font-bold text-sm shadow-sm flex items-center justify-center"><i class="fa-solid fa-delete-left"></i></button>
            <div id="keypad-dynamic-1" aria-hidden="true"></div>
          </div>
          <div id="keypad-final-row" class="keypad-row grid grid-cols-7 gap-1"><button onclick="pressKey('1')" class="key bg-slate-100 hover:bg-slate-200 active:bg-slate-300 py-2 rounded-md font-bold text-sm shadow-sm">1</button><button onclick="pressKey('2')" class="key bg-slate-100 hover:bg-slate-200 active:bg-slate-300 py-2 rounded-md font-bold text-sm shadow-sm">2</button><button onclick="pressKey('3')" class="key bg-slate-100 hover:bg-slate-200 active:bg-slate-300 py-2 rounded-md font-bold text-sm shadow-sm">3</button><button onclick="pressKey('0')" class="key bg-slate-100 hover:bg-slate-200 active:bg-slate-300 py-2 rounded-md font-bold text-sm shadow-sm">0</button><div id="keypad-dynamic-2" aria-hidden="true"></div><button onclick="submitCurrentActive()" id="keypad-action-btn" class="bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white py-2 rounded-md font-bold text-xs shadow-sm col-span-2 flex items-center justify-center gap-1"><span>送出答案</span></button></div>
        </div></div>
    </div>

    <script>
        let currentActiveMode = 2;
        let activeFocusField = 'm2-input-s2';
        const sessionStats = { 1: { earned: 0, total: 0 }, 2: { earned: 0, total: 0 }, 3: { earned: 0, total: 0 }, 4: { earned: 0, total: 0 } };
        const modeFinished = { 1: false, 2: false, 3: false, 4: false };
        let m1InputValues = {}, m2InputValues = {}, m3InputValues = {}, m4InputValues = {};

        const mode1Data = [
            { scenario: '氣溫在 0°C 以下 4°C 記作？', ref: '若 0°C 以上 3°C 記作 +3°C，則：', prefix: '氣溫 =', answer: '-4', unit: '°C' },
            { scenario: '升降機上升 5 層記作？', ref: '若升降機下降 2 層記作 -2 層，則：', prefix: '樓層變化 =', answer: '+5', unit: '層' },

        class AlgebraicParser {
            constructor(str) { this.tokens = this.tokenize(normalizeMathStr(str)); this.pos = 0; this.error = false; try { this.ast = this.parseExpr(); if (this.pos < this.tokens.length) this.error = true; } catch (e) { this.error = true; } }
            tokenize(s) { const out = []; let i = 0; while (i < s.length) { if (/\d/.test(s[i])) { let n = ''; while (i < s.length && /[\d.]/.test(s[i])) n += s[i++]; out.push({ type: 'num', value: Number(n) }); } else if (/[a-zA-Z]/.test(s[i])) out.push({ type: 'var', value: s[i++] }); else if ('+-*/()'.includes(s[i])) out.push({ type: 'op', value: s[i++] }); else throw new Error('字元'); } const expanded = []; for (let j = 0; j < out.length; j += 1) { expanded.push(out[j]); const a = out[j], b = out[j + 1]; if (b && ((a.type === 'num' && (b.type === 'var' || b.value === '(')) || (a.type === 'var' && (b.type === 'num' || b.type === 'var' || b.value === '(')) || (a.value === ')' && (b.type === 'num' || b.type === 'var' || b.value === '(')))) expanded.push({ type: 'op', value: '*' }); } return expanded; }
            peek() { return this.tokens[this.pos]; }
            consume(v) { if (this.peek() && this.peek().value === v) { this.pos += 1; return true; } return false; }
            parseExpr() { let n = this.parseTerm(); while (this.consume('+') || this.consume('-')) { const op = this.tokens[this.pos - 1].value, r = this.parseTerm(), left = n; n = function (env) { return op === '+' ? left(env) + r(env) : left(env) - r(env); }; } return n; }
            parseTerm() { let n = this.parseFactor(); while (this.consume('*') || this.consume('/')) { const op = this.tokens[this.pos - 1].value, r = this.parseFactor(), left = n; n = function (env) { const d = r(env); if (op === '/' && d === 0) throw new Error('零除'); return op === '*' ? left(env) * d : left(env) / d; }; } return n; }
            parseFactor() { if (this.consume('+')) return this.parseFactor(); if (this.consume('-')) { const n = this.parseFactor(); return function (env) { return -n(env); }; } const t = this.peek(); if (!t) throw new Error('結束'); if (t.type === 'num') { this.pos += 1; return function () { return t.value; }; } if (t.type === 'var') { this.pos += 1; return function (env) { if (env[t.value] === undefined) throw new Error('未知量'); return env[t.value]; }; } if (this.consume('(')) { const n = this.parseExpr(); if (!this.consume(')')) throw new Error('括號'); return n; } throw new Error('格式'); }
            evaluate(env) { if (this.error) return null; try { return this.ast(env); } catch (e) { return null; } }
        }
        function checkAlgebraicEquivalence(user, correct, vars) { const u = new AlgebraicParser(user), c = new AlgebraicParser(correct); if (u.error) return { syntaxError: true, msg: '算式格式有誤' }; if (c.error) return { syntaxError: false, equivalent: false }; const points = [{ a: 1, b: 2, k: 3, m: 4, n: 5, p: 6, q: 7, t: 2, x: 3, y: 4 }, { a: 3, b: 5, k: 2, m: 7, n: 2, p: 4, q: 5, t: 3, x: 2, y: 5 }, { a: 4, b: 1, k: 5, m: 3, n: 4, p: 2, q: 1, t: 4, x: 5, y: 2 }, { a: 2, b: 4, k: 7, m: 5, n: 1, p: 5, q: 3, t: 5, x: 1, y: 3 }, { a: 5, b: 3, k: 4, m: 2, n: 3, p: 3, q: 2, t: 1, x: 4, y: 1 }]; return points.every(function (p) { const env = {}; vars.forEach(function (v) { env[v] = p[v] === undefined ? 2 : p[v]; }); const a = u.evaluate(env), b = c.evaluate(env); return a !== null && b !== null && Math.abs(a - b) < 1e-5; }) ? { syntaxError: false, equivalent: true } : { syntaxError: false, equivalent: false }; }
        function checkMode3() { if (m3Graded) { nextMode3Question(); return; } const q = mode3Data[m3Index], raw = m3InputValues[m3Index] || ''; if (!raw) { showFeedback('m3-feedback', '請輸入代數式！', 'amber'); return; } const res = checkAlgebraicEquivalence(raw, q.expr, q.vars), action = document.getElementById('keypad-action-btn'); if (res.syntaxError) { showFeedback('m3-feedback', res.msg + '（不扣作答機會）', 'amber'); return; } if (res.equivalent) { sessionStats[3].total += 1; sessionStats[3].earned += m3Errors === 0 ? 1 : .5; m3Graded = true; showFeedback('m3-feedback', '答對了！（得分：' + (m3Errors === 0 ? '1.0' : '0.5') + '）', 'emerald'); updateScoreDisplay(); action.innerHTML = '<span>下一題</span>'; } else { m3Errors += 1; if (m3Errors >= 2) { sessionStats[3].total += 1; m3Graded = true; showFeedback('m3-feedback', '錯誤次數達上限。正確答案是：<strong>' + q.expr + '</strong>', 'rose'); updateScoreDisplay(); action.innerHTML = '<span>下一題</span>'; } else showFeedback('m3-feedback', '代數式不正確，請再試一次（還有 1 次機會）。', 'rose'); } }
        function nextMode3Question() { m3Index += 1; if (m3Index >= mode3Data.length) { m3Index = 0; showCompletionMessage(3, sessionStats[3].earned, sessionStats[3].total); return; } loadMode3Question(); }

        function initMode4() { m4InputValues = {}; m4Index = 0; loadMode4Question(); }
        function loadMode4Question() { const q = mode4Data[m4Index]; document.getElementById('m4-scenario').textContent = q.scenario; document.getElementById('m4-progress').textContent = '題目 ' + (m4Index + 1) + ' / ' + mode4Data.length; renderFieldDisplay('m4-input-val', '', '點擊輸入代數式與單位...'); document.getElementById('m4-feedback').className = 'hidden p-2 rounded-lg text-xs font-medium text-center'; document.getElementById('keypad-action-btn').innerHTML = '<span>送出答案</span>'; m4Errors = 0; m4Graded = false; updateKeypadButtons(); }
        function checkMode4() { if (m4Graded) { nextMode4Question(); return; } const q = mode4Data[m4Index], raw = m4InputValues[m4Index] || ''; if (!raw) { showFeedback('m4-feedback', '請輸入代數式及單位！', 'amber'); return; } let unit = '', expr = raw; q.unitsList.some(function (u) { if (raw.endsWith(u)) { unit = u; expr = raw.slice(0, -u.length); return true; } return false; }); const res = checkAlgebraicEquivalence(expr, q.expr, q.vars), action = document.getElementById('keypad-action-btn'); if (res.syntaxError) { showFeedback('m4-feedback', res.msg + '（不扣作答機會）', 'amber'); return; } if (res.equivalent && unit === q.unit) { sessionStats[4].total += 1; sessionStats[4].earned += m4Errors === 0 ? 1 : .5; m4Graded = true; showFeedback('m4-feedback', '答對了！代數式與單位均正確（得分：' + (m4Errors === 0 ? '1.0' : '0.5') + '）。', 'emerald'); updateScoreDisplay(); action.innerHTML = '<span>下一題</span>'; } else { m4Errors += 1; const detail = !res.equivalent ? '代數式不正確或簡化有誤' : '單位不正確'; if (m4Errors >= 2) { sessionStats[4].total += 1; m4Graded = true; showFeedback('m4-feedback', '錯誤次數達上限（' + detail + '）。正確答案是：<strong>' + q.expr + q.unit + '</strong>', 'rose'); updateScoreDisplay(); action.innerHTML = '<span>下一題</span>'; } else showFeedback('m4-feedback', detail + '，請再試一次（還有 1 次機會）。', 'rose'); } }
        function nextMode4Question() { m4Index += 1; if (m4Index >= mode4Data.length) { m4Index = 0; showCompletionMessage(4, sessionStats[4].earned, sessionStats[4].total); return; } loadMode4Question(); }

        function showFeedback(id, text, type) { const el = document.getElementById(id); el.innerHTML = text; el.className = 'p-2 rounded-lg text-xs font-medium text-center ' + (type === 'emerald' ? 'bg-emerald-50 text-emerald-700' : type === 'rose' ? 'bg-rose-50 text-rose-700' : 'bg-amber-50 text-amber-700'); }
        function showCompletionMessage(modeNum, earned, total) { const container = document.getElementById('mode-' + modeNum + '-container'); clearCompletionMessage(modeNum); modeFinished[modeNum] = true; const names = { 1: '有向數文字', 2: '完整文字題', 3: '和差積商代數式', 4: '文字轉代數式' }; const box = document.createElement('div'); box.className = 'completion-box bg-emerald-50 border border-emerald-200 rounded-xl p-4 text-center space-y-2 my-4 animate-fade-in'; box.innerHTML = '<h3 class="font-bold text-emerald-800 text-base"><i class="fa-solid fa-circle-check mr-1"></i> 恭喜完成' + names[modeNum] + '所有題目！</h3><p class="text-sm text-emerald-700">本輪總得分：<strong>' + earned.toFixed(1) + ' / ' + total + '</strong></p><button onclick="resetCurrentMode()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg text-xs shadow-sm transition-all">重新開始本模式</button>'; container.prepend(box); updateActionButton(); }

        function shufflePrintItems(items) { const copy = items.slice(); for (let i = copy.length - 1; i > 0; i -= 1) { const j = Math.floor(Math.random() * (i + 1)); const temp = copy[i]; copy[i] = copy[j]; copy[j] = temp; } return copy; }
        function choosePrintMode1() { return shufflePrintItems(mode1Data).slice(0, 4); }
        function choosePrintMode3() { return ['和', '差', '積', '商'].map(function (type) { return shufflePrintItems(mode3Data.filter(function (q) { return q.type === type; }))[0]; }); }
        function printAnswerGroup(number, items, answerFn) { return number + '. ' + items.map(function (q, index) { return '(' + String.fromCharCode(97 + index) + ') ' + answerFn(q); }).join(' '); }
        function printMode2FinalAnswer(q) { return q.fullSentence.replace(/^(全日氣溫|潛水艇現在的位置在|戶口最後|飛機現在在)/, '').replace(/。$/, ''); }
        function renderPrintShortRow(letter, prompt, prefix) { return '<div class="worksheet-short-row"><span class="worksheet-short-prompt">' + prompt + '</span><span class="worksheet-short-answer">(' + letter + '). ' + prefix + ' <span class="worksheet-blank"></span></span></div>'; }
        function renderPrintMode1Group(items) { return '<section class="worksheet-short-group"><p class="worksheet-short-group-title">1. 有向數</p>' + items.map(function (q, index) { return renderPrintShortRow(String.fromCharCode(97 + index), q.ref + ' ' + q.scenario, q.prefix); }).join('') + '</section>'; }
        function renderPrintMode3Group(items) { return '<section class="worksheet-short-group"><p class="worksheet-short-group-title">2. 和差積商</p>' + items.map(function (q, index) { return renderPrintShortRow(String.fromCharCode(97 + index), q.scenario, '代數式：'); }).join('') + '</section>'; }
        function renderPrintMode4Group(items) { return '<section class="worksheet-short-group"><p class="worksheet-short-group-title">3. 文字轉代數式</p>' + items.map(function (q, index) { return renderPrintShortRow(String.fromCharCode(97 + index), q.scenario, '代數式及單位：'); }).join('') + '</section>'; }
        function renderPrintMode2Problem(letter, q, first) { if (first) return '<section class="worksheet-problem"><p class="worksheet-problem-title">4(' + letter + ') ' + q.scenario + '</p><div class="worksheet-framework"><div>全日氣溫變化 = <span class="worksheet-framework-blank"></span></div><div class="aligned-equals">= <span class="worksheet-framework-blank"></span></div><div class="aligned-equals">= <span class="worksheet-framework-blank"></span></div><div>所以，全日氣溫〔上升／下降〕<span class="worksheet-framework-blank"></span>。</div></div></section>'; return '<section class="worksheet-problem"><p class="worksheet-problem-title">4(' + letter + ') ' + q.scenario + '</p><div class="worksheet-answer-space"></div></section>'; }
        function renderPrintAnswerStrip(text) { return '<div class="worksheet-answer-strip"><div class="worksheet-fold-label">沿此線摺</div><div class="worksheet-answer-strip-content">' + text + '</div></div>'; }
        function openPrintPreview() {
            const container = document.getElementById('print-worksheet-container');
            container.innerHTML = '';
            const mode1Items = choosePrintMode1();
            const mode3Items = choosePrintMode3();
            const mode4Items = mode4Data.slice();
            const page1 = document.createElement('div');
            page1.className = 'worksheet-page bg-white text-slate-900';
            page1.innerHTML = '<div class="worksheet-page-content"><header class="worksheet-header"><div><h2 class="worksheet-title">S1 Ch3 Ex1 有向數與代數式 工作紙</h2><p class="worksheet-meta">姓名：＿＿＿＿　班別：＿＿　學號：＿＿</p><p class="worksheet-meta">日期：＿＿＿＿　得分：＿＿ / 12</p></div><div id="worksheet-qr-page-1" class="worksheet-qr" aria-label="本頁網址 QR 碼"></div></header><div class="worksheet-short-section"><h3 class="worksheet-section-title">甲部　短答題</h3>' + renderPrintMode1Group(mode1Items) + renderPrintMode3Group(mode3Items) + renderPrintMode4Group(mode4Items) + '</div>' + renderPrintAnswerStrip(printAnswerGroup(1, mode1Items, function (q) { return q.answer + q.unit; }) + '　' + printAnswerGroup(2, mode3Items, function (q) { return q.expr; }) + '　' + printAnswerGroup(3, mode4Items, function (q) { return q.expr + q.unit; })) + '</div>';
            container.appendChild(page1);
            const page2 = document.createElement('div');
            page2.className = 'worksheet-page bg-white text-slate-900';
            page2.innerHTML = '<div class="worksheet-page-content"><header class="worksheet-header"><div><h2 class="worksheet-title">S1 Ch3 Ex1 工作紙（續）</h2><p class="worksheet-meta">姓名：＿＿＿＿　班別：＿＿　學號：＿＿</p></div><div id="worksheet-qr-page-2" class="worksheet-qr" aria-label="本頁網址 QR 碼"></div></header><div class="worksheet-problem-section"><h3 class="worksheet-section-title">乙部　文字應用題</h3><div class="worksheet-problems">' + mode2Data.map(function (q, index) { return renderPrintMode2Problem(String.fromCharCode(97 + index), q, index === 0); }).join('') + '</div></div>' + renderPrintAnswerStrip('4. ' + mode2Data.map(function (q, index) { return '(' + String.fromCharCode(97 + index) + ') ' + printMode2FinalAnswer(q); }).join(' ')) + '</div>';
            container.appendChild(page2);
            if (window.QRCode) {
                new QRCode(document.getElementById('worksheet-qr-page-1'), { text: window.location.href, width: 90, height: 90, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H });
                new QRCode(document.getElementById('worksheet-qr-page-2'), { text: window.location.href, width: 90, height: 90, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H });
            }
            window.print();
        }
    </script>
