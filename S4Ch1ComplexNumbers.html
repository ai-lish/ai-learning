<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="S4 Ch1 複數加減乘除互動練習工具。">
  <title>S4 Ch1｜複數四則運算</title>
  <style>
    :root {
      --ink: #23324a;
      --muted: #68778c;
      --line: #dce5ef;
      --paper: #fff;
      --purple: #7050b7;
      --purple-soft: #f2eeff;
      --blue: #226fa9;
      --blue-soft: #eaf6ff;
      --teal: #138277;
      --teal-soft: #e9faf6;
      --orange: #b85d13;
      --orange-soft: #fff2e5;
      --good: #237548;
      --bad: #a63d49;
      --shadow: 0 17px 45px rgba(42, 55, 83, .16);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 18px;
      color: var(--ink);
      background: linear-gradient(135deg, #6d3d9f, #2478ae);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;
      line-height: 1.6;
    }
    button { font: inherit; cursor: pointer; }
    button:focus-visible, a:focus-visible { outline: 3px solid #f4b942; outline-offset: 2px; }
    a { color: var(--blue); }
    .shell { width: min(1160px, 100%); margin: 0 auto; overflow: hidden; border-radius: 24px; background: var(--paper); box-shadow: var(--shadow); }
    header { padding: 26px clamp(20px, 5vw, 58px) 30px; color: #fff; background: linear-gradient(120deg, #634093, #1f6a9b); }
    .topbar, .actions, .operation-board { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .topbar { justify-content: space-between; }
    .pill, .back-link {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      border: 1px solid rgba(255,255,255,.44);
      border-radius: 999px;
      padding: 6px 13px;
      color: #fff;
      background: rgba(255,255,255,.12);
      text-decoration: none;
      font-weight: 800;
    }
    .back-link:hover, .pill:hover { background: rgba(255,255,255,.24); }
    h1 { margin: 28px 0 5px; font-size: clamp(1.9rem, 5vw, 3.2rem); line-height: 1.15; }
    header p { max-width: 780px; margin: 0; color: rgba(255,255,255,.9); }
    .actions { margin-top: 19px; }
    main { padding: clamp(18px, 4vw, 42px); }
    .intro { margin: 0 0 19px; color: var(--muted); }
    .layout { display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr); gap: 18px; }
    .card { border: 1px solid var(--line); border-radius: 16px; padding: 20px; background: #fff; }
    .card h2 { margin: 0 0 8px; color: var(--purple); }
    .card > p { margin-top: 0; color: var(--muted); }
    .operation-board { margin: 15px 0 18px; }
    .operation-button {
      min-width: 54px;
      min-height: 45px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      background: #fff;
      font-size: 1.2rem;
      font-weight: 900;
    }
    .operation-button:hover, .operation-button.active { border-color: var(--purple); color: var(--purple); background: var(--purple-soft); }
    .operand-block { margin-top: 18px; }
    .operand-block h3 { margin: 0 0 8px; font-size: 1rem; }
    .operand-board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .operand-button, .choice-button, .next-button {
      min-height: 45px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      color: var(--ink);
      background: #fff;
      font-family: "Times New Roman", "Noto Serif TC", serif;
      font-size: 1.05rem;
      font-weight: 850;
    }
    .operand-button:hover, .operand-button.active { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); }
    .selected-operation {
      border-radius: 14px;
      padding: 17px;
      color: #3b2a72;
      background: var(--purple-soft);
      font-family: "Times New Roman", "Noto Serif TC", serif;
      font-size: clamp(1.45rem, 4vw, 2.3rem);
      font-weight: 900;
      text-align: center;
    }
    .result-area { min-height: 215px; border-radius: 13px; padding: 17px; background: #fbfcfe; }
    .result-line { margin: 0 0 11px; font-family: "Times New Roman", "Noto Serif TC", serif; font-size: 1.16rem; }
    .result-line:last-child { margin-bottom: 0; }
    .result-final { margin-top: 18px; border-radius: 12px; padding: 14px; color: #174c49; background: var(--teal-soft); font-family: "Times New Roman", "Noto Serif TC", serif; font-size: 1.4rem; font-weight: 900; }
    .result-final strong { display: block; margin-bottom: 3px; color: var(--teal); font-family: inherit; font-size: .96rem; }
    .exercise-card { margin-top: 18px; border-top: 5px solid var(--teal); }
    .exercise-card h2 { color: var(--teal); }
    .question-box { margin: 15px 0 12px; border-radius: 13px; padding: 16px; color: #174c49; background: var(--teal-soft); font-family: "Times New Roman", "Noto Serif TC", serif; font-size: 1.28rem; font-weight: 900; text-align: center; }
    .choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
    .choice-button { text-align: center; }
    .choice-button:hover { border-color: var(--teal); color: var(--teal); background: var(--teal-soft); }
    .choice-button.correct { border-color: #91ceb0; color: var(--good); background: #f2fbf5; }
    .choice-button.wrong { border-color: #e4a1a8; color: var(--bad); background: #fff5f6; }
    .feedback { min-height: 2.2em; margin: 12px 0 0; font-weight: 800; }
    .feedback.good { color: var(--good); }
    .feedback.bad { color: var(--bad); }
    .next-button { width: 100%; margin-top: 10px; border: 0; color: #fff; background: var(--orange); font-family: inherit; text-align: center; }
    .next-button:hover { filter: brightness(.94); }
    .note { margin-top: 18px; border-radius: 12px; padding: 13px 15px; color: #3f326d; background: var(--purple-soft); }
    footer { border-top: 1px solid var(--line); padding: 17px clamp(18px, 4vw, 42px) 23px; color: var(--muted); font-size: .9rem; }
    @media (max-width: 820px) {
      body { padding: 0; }
      .shell { border-radius: 0; }
      .layout { grid-template-columns: 1fr; }
      main { padding: 20px 16px 30px; }
    }
    @media (max-width: 560px) {
      .operand-board, .choices { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (orientation: landscape) and (min-width: 821px) { main { min-height: 650px; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="topbar">
        <a class="back-link" href="S4Ch1.html#practice">← 返回 S4 Ch1</a>
        <span class="pill">獨立練習工具 3 / 3</span>
      </div>
      <h1>複數四則運算</h1>
      <p>按鈕選擇兩個複數及運算，查看結果和中間步驟；不用輸入數字。</p>
      <div class="actions"><a class="pill" href="index.html">返回首頁</a></div>
    </header>
    <main>
      <p class="intro">記住 <strong>i² = −1</strong>。除法會自動示範乘以分母的共軛複數。</p>
      <div class="layout">
        <section class="card">
          <h2>選擇運算</h2>
          <div id="operation-board" class="operation-board" aria-label="運算選擇"></div>
          <div class="selected-operation" id="selected-operation" aria-live="polite"></div>
          <div class="operand-block">
            <h3>左邊複數</h3>
            <div id="left-board" class="operand-board"></div>
          </div>
          <div class="operand-block">
            <h3>右邊複數</h3>
            <div id="right-board" class="operand-board"></div>
          </div>
        </section>
        <section class="card">
          <h2>計算步驟</h2>
          <div id="result-area" class="result-area"></div>
          <div id="result-final" class="result-final"></div>
        </section>
      </div>
      <section class="card exercise-card">
        <h2>即時練習</h2>
        <p>選擇正確答案；題目涵蓋加、減、乘、除。</p>
        <div id="question-box" class="question-box"></div>
        <div id="choices" class="choices"></div>
        <p id="feedback" class="feedback" aria-live="polite"></p>
        <button id="next-question" class="next-button" type="button">出新題</button>
      </section>
      <div class="note"><strong>除法提示：</strong>若分母是 c+di，就把分子和分母同乘 c−di；分母會變成 c²+d²。</div>
    </main>
    <footer>少康老師教學網站 · S4 Ch1 複數四則運算</footer>
  </div>

  <script>
    function gcd(a, b) {
      a = Math.abs(a);
      b = Math.abs(b);
      while (b) {
        const next = a % b;
        a = b;
        b = next;
      }
      return a || 1;
    }
    function fraction(n, d) {
      d = d === undefined ? 1 : d;
      if (d < 0) { n *= -1; d *= -1; }
      const divisor = gcd(n, d);
      return { n: n / divisor, d: d / divisor };
    }
    function addFraction(a, b) { return fraction(a.n * b.d + b.n * a.d, a.d * b.d); }
    function subtractFraction(a, b) { return fraction(a.n * b.d - b.n * a.d, a.d * b.d); }
    function multiplyFraction(a, b) { return fraction(a.n * b.n, a.d * b.d); }
    function divideFraction(a, b) { return fraction(a.n * b.d, a.d * b.n); }
    function isZero(a) { return a.n === 0; }
    function fractionText(a) {
      if (a.d === 1) return String(a.n);
      return a.n + "/" + a.d;
    }
    function complex(real, imaginary) {
      return { r: typeof real === "number" ? fraction(real) : real, i: typeof imaginary === "number" ? fraction(imaginary) : imaginary };
    }
    function addComplex(a, b) { return complex(addFraction(a.r, b.r), addFraction(a.i, b.i)); }
    function subtractComplex(a, b) { return complex(subtractFraction(a.r, b.r), subtractFraction(a.i, b.i)); }
    function multiplyComplex(a, b) {
      return complex(
        subtractFraction(multiplyFraction(a.r, b.r), multiplyFraction(a.i, b.i)),
        addFraction(multiplyFraction(a.r, b.i), multiplyFraction(a.i, b.r))
      );
    }
    function divideComplex(a, b) {
      const denominator = addFraction(multiplyFraction(b.r, b.r), multiplyFraction(b.i, b.i));
      return complex(
        divideFraction(addFraction(multiplyFraction(a.r, b.r), multiplyFraction(a.i, b.i)), denominator),
        divideFraction(subtractFraction(multiplyFraction(a.i, b.r), multiplyFraction(a.r, b.i)), denominator)
      );
    }
    function coefficientText(value) {
      if (value.n === 1 && value.d === 1) return "";
      if (value.n === -1 && value.d === 1) return "−";
      return fractionText(value);
    }
    function complexText(value) {
      const realZero = isZero(value.r);
      const imaginaryZero = isZero(value.i);
      if (realZero && imaginaryZero) return "0";
      if (imaginaryZero) return fractionText(value.r);
      const imaginaryMagnitude = fraction(Math.abs(value.i.n), value.i.d);
      const imaginaryTerm = coefficientText(value.i.n < 0 ? fraction(-imaginaryMagnitude.n, imaginaryMagnitude.d) : imaginaryMagnitude) + "i";
      if (realZero) return value.i.n < 0 ? "−" + coefficientText(imaginaryMagnitude) + "i" : imaginaryTerm;
      const sign = value.i.n < 0 ? "−" : "+";
      return fractionText(value.r) + sign + coefficientText(imaginaryMagnitude) + "i";
    }
    function parenthesized(value) { return "(" + complexText(value) + ")"; }

    const operands = [
      { id: "a", label: "3−2i", value: complex(3, -2) },
      { id: "b", label: "−1+i", value: complex(-1, 1) },
      { id: "c", label: "2i", value: complex(0, 2) },
      { id: "d", label: "3+4i", value: complex(3, 4) },
      { id: "e", label: "1+i", value: complex(1, 1) },
      { id: "f", label: "1−i", value: complex(1, -1) },
      { id: "g", label: "5+6i", value: complex(5, 6) },
      { id: "h", label: "3−4i", value: complex(3, -4) }
    ];
    const operations = [
      { id: "add", symbol: "+", label: "加法" },
      { id: "subtract", symbol: "−", label: "減法" },
      { id: "multiply", symbol: "×", label: "乘法" },
      { id: "divide", symbol: "÷", label: "除法" }
    ];
    let selectedOperation = operations[0];
    let leftOperand = operands[0];
    let rightOperand = operands[1];

    const operationBoard = document.getElementById("operation-board");
    const leftBoard = document.getElementById("left-board");
    const rightBoard = document.getElementById("right-board");
    operationBoard.innerHTML = operations.map(function (operation) {
      return '<button class="operation-button ' + (operation.id === selectedOperation.id ? "active" : "") + '" type="button" aria-label="' + operation.label + '" aria-pressed="' + String(operation.id === selectedOperation.id) + '" data-operation="' + operation.id + '">' + operation.symbol + "</button>";
    }).join("");
    function operandButtons(list, selected) {
      return list.map(function (operand) {
        return '<button class="operand-button ' + (operand.id === selected.id ? "active" : "") + '" type="button" aria-pressed="' + String(operand.id === selected.id) + '" data-operand="' + operand.id + '">' + operand.label + "</button>";
      }).join("");
    }
    function renderOperandBoards() {
      leftBoard.innerHTML = operandButtons(operands, leftOperand);
      rightBoard.innerHTML = operandButtons(operands, rightOperand);
    }
    function calculate(a, b, operation) {
      if (operation.id === "add") return addComplex(a, b);
      if (operation.id === "subtract") return subtractComplex(a, b);
      if (operation.id === "multiply") return multiplyComplex(a, b);
      return divideComplex(a, b);
    }
    function renderCalculation() {
      const result = calculate(leftOperand.value, rightOperand.value, selectedOperation);
      const a = leftOperand.value;
      const b = rightOperand.value;
      let lines = [];
      if (selectedOperation.id === "add") {
        lines = [
          parenthesized(a) + " + " + parenthesized(b),
          "= (" + fractionText(a.r) + " + " + fractionText(b.r) + ") + (" + fractionText(a.i) + " + " + fractionText(b.i) + ")i",
          "= " + complexText(result)
        ];
      } else if (selectedOperation.id === "subtract") {
        lines = [
          parenthesized(a) + " − " + parenthesized(b),
          "= (" + fractionText(a.r) + " − " + fractionText(b.r) + ") + (" + fractionText(a.i) + " − " + fractionText(b.i) + ")i",
          "= " + complexText(result)
        ];
      } else if (selectedOperation.id === "multiply") {
        lines = [
          parenthesized(a) + " × " + parenthesized(b),
          "= (ac−bd) + (ad+bc)i",
          "= " + complexText(result) + "（使用 i² = −1）"
        ];
      } else {
        const denominator = addFraction(multiplyFraction(b.r, b.r), multiplyFraction(b.i, b.i));
        lines = [
          parenthesized(a) + " ÷ " + parenthesized(b),
          "= " + parenthesized(a) + " × " + parenthesized(complex(b.r, fraction(-b.i.n, b.i.d))) + " ÷ (" + fractionText(denominator) + ")",
          "= " + complexText(result) + "（乘以共軛複數）"
        ];
      }
      document.getElementById("selected-operation").textContent = leftOperand.label + " " + selectedOperation.symbol + " " + rightOperand.label;
      document.getElementById("result-area").innerHTML = lines.map(function (line) { return '<p class="result-line">' + line + "</p>"; }).join("");
      document.getElementById("result-final").innerHTML = "<strong>答案</strong>" + complexText(result);
    }
    operationBoard.addEventListener("click", function (event) {
      const button = event.target.closest("[data-operation]");
      if (!button) return;
      selectedOperation = operations.find(function (operation) { return operation.id === button.dataset.operation; });
      operationBoard.querySelectorAll("[data-operation]").forEach(function (item) {
        item.classList.toggle("active", item === button);
        item.setAttribute("aria-pressed", String(item === button));
      });
      renderCalculation();
    });
    function handleOperandClick(event, side) {
      const button = event.target.closest("[data-operand]");
      if (!button) return;
      const selected = operands.find(function (operand) { return operand.id === button.dataset.operand; });
      if (side === "left") leftOperand = selected;
      else rightOperand = selected;
      renderOperandBoards();
      renderCalculation();
    }
    leftBoard.addEventListener("click", function (event) { handleOperandClick(event, "left"); });
    rightBoard.addEventListener("click", function (event) { handleOperandClick(event, "right"); });
    renderOperandBoards();
    renderCalculation();

    const exercises = [
      { question: "(3−2i) + (−1+i) = ?", answer: "2−i", choices: ["2−i", "4−3i", "2+i"] },
      { question: "(3−2i) − (−1+i) = ?", answer: "4−3i", choices: ["2−i", "4−3i", "4−i"] },
      { question: "2i × (3+4i) = ?", answer: "−8+6i", choices: ["8+6i", "−8+6i", "−8−6i"] },
      { question: "(1+i) ÷ (1−i) = ?", answer: "i", choices: ["1", "−i", "i"] },
      { question: "(5+6i) ÷ (3−4i) = ?", answer: "−9/25+38/25i", choices: ["9/25+38/25i", "−9/25+38/25i", "−9/25−38/25i"] }
    ];
    let exercise = exercises[0];
    let answered = false;
    function newExercise() {
      exercise = exercises[Math.floor(Math.random() * exercises.length)];
      answered = false;
      document.getElementById("question-box").textContent = exercise.question;
      document.getElementById("choices").innerHTML = exercise.choices.map(function (choice) {
        return '<button class="choice-button" type="button" data-choice="' + choice + '">' + choice + "</button>";
      }).join("");
      document.getElementById("feedback").textContent = "";
      document.getElementById("feedback").className = "feedback";
    }
    document.getElementById("choices").addEventListener("click", function (event) {
      const button = event.target.closest("[data-choice]");
      if (!button || answered) return;
      answered = true;
      const correct = button.dataset.choice === exercise.answer;
      document.querySelectorAll("#choices [data-choice]").forEach(function (choice) {
        choice.disabled = true;
        choice.classList.toggle("correct", choice.dataset.choice === exercise.answer);
      });
      button.classList.toggle("wrong", !correct);
      const feedback = document.getElementById("feedback");
      feedback.className = "feedback " + (correct ? "good" : "bad");
      feedback.textContent = correct ? "✓ 正確！" : "✗ 正確答案是 " + exercise.answer + "。";
    });
    document.getElementById("next-question").addEventListener("click", newExercise);
    newExercise();
  </script>
</body>
</html>
